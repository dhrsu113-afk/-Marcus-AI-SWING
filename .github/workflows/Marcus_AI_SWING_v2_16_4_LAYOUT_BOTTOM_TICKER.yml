              void autoFitText(TextView v,int minSp,int maxSp,int maxLines){
                  if(v==null)return;
                  v.setMaxLines(Math.max(1,maxLines));
                  v.setIncludeFontPadding(false);

                  if(Build.VERSION.SDK_INT>=26){
                      try{
                          v.setAutoSizeTextTypeUniformWithConfiguration(
                              Math.max(6,minSp),
                              Math.max(minSp,maxSp),
                              1,
                              TypedValue.COMPLEX_UNIT_SP
                          );
                      }catch(Exception ignored){}
                  }else{
                      v.setTextSize(Math.max(minSp,Math.min(maxSp,11)));
                  }
              }

