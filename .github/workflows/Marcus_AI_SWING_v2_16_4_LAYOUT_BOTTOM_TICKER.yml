              LinearLayout buildAccountCard(String env){
                  LinearLayout c=card();

                  c.addView(text((isReal(env)?"🔴 ":"🔵 ")+env,20,TEXT,true));
                  c.addView(text("서버: "+baseUrl(env),12,BLUE,false));

                  EditText key=input(env+" App Key");
                  EditText secret=input(env+" App Secret");

                  if(!prefs.getString(keyName(env),"").isEmpty()){
                      key.setHint("저장됨 · 새 값 입력 시 교체");
                  }
                  if(!prefs.getString(secretName(env),"").isEmpty()){
                      secret.setHint("저장됨 · 새 값 입력 시 교체");
                  }

                  c.addView(text("App Key",13,MUTED,true));
                  c.addView(key);
                  c.addView(text("App Secret",13,MUTED,true));
                  c.addView(secret);

                  Button save=button(env+" 키 저장");
                  Button test=button(env+" OAuth 연결 테스트");
                  Button use=button(env+"을 데이터 환경으로 사용");
                  Button delete=button(env+" 저장정보 삭제");

                  ProgressBar pb=new ProgressBar(this);
                  pb.setVisibility(View.GONE);
                  TextView status=text("",14,MUTED,true);

                  c.addView(save);
                  c.addView(test);
                  c.addView(use);
                  c.addView(delete);
                  c.addView(pb);
                  c.addView(status);

                  Runnable refresh=()->{
                      String k=prefs.getString(keyName(env),"");
                      String s=prefs.getString(secretName(env),"");

                      StringBuilder sb=new StringBuilder();

                      if(!k.isEmpty()&&!s.isEmpty()){
                          sb.append("🟢 Key/Secret 저장됨\n");
                          sb.append("App Key: ").append(mask(k)).append("\n");
                          sb.append("Secret: ").append(mask(s)).append("\n");
                      }else{
                          sb.append("⚪ Key/Secret 미설정\n");
                      }

                      if(tokenReady(env)){
                          sb.append("🟢 OAuth 토큰 있음\n");
                          sb.append("만료: ").append(prefs.getString(expiresName(env),"-"));
                          status.setTextColor(GREEN);
                      }else{
                          status.setTextColor(credentialsReady(env)?YELLOW:MUTED);
                      }

                      if(env.equals(activeEnv())){
                          sb.append("\n⭐ 현재 데이터 환경");
                      }

                      status.setText(sb.toString());
                  };

                  save.setOnClickListener(v->{
                      String k=key.getText().toString().trim();
                      String s=secret.getText().toString().trim();

                      SharedPreferences.Editor ed=prefs.edit();

                      if(!k.isEmpty())ed.putString(keyName(env),k);
                      if(!s.isEmpty())ed.putString(secretName(env),s);

                      if(!k.isEmpty()||!s.isEmpty()){
                          ed.remove(tokenName(env));
                          ed.remove(expiresName(env));
                      }

                      ed.apply();

                      key.setText("");
                      secret.setText("");

                      Toast.makeText(this,env+" 키 저장 완료",Toast.LENGTH_SHORT).show();
                      refresh.run();
                  });

                  test.setOnClickListener(v->{
                      String k=prefs.getString(keyName(env),"");
                      String s=prefs.getString(secretName(env),"");

                      if(k.isEmpty()||s.isEmpty()){
                          status.setText("🔴 App Key / Secret을 먼저 저장하세요.");
                          status.setTextColor(RED);
                          return;
                      }

                      pb.setVisibility(View.VISIBLE);
                      test.setEnabled(false);
                      status.setText(env+" OAuth 토큰 요청 중...");
                      status.setTextColor(BLUE);

                      new Thread(()->{
                          try{
                              JSONObject r=requestToken(env,k,s);

                              String token=r.optString("access_token","");
                              String expires=r.optString("access_token_token_expired","");

                              if(!token.isEmpty()){
                                  prefs.edit()
                                      .putString(tokenName(env),token)
                                      .putString(expiresName(env),expires)
                                      .putString(ENV,env)
                                      .apply();

                                  runOnUiThread(()->{
                                      pb.setVisibility(View.GONE);
                                      test.setEnabled(true);
                                      status.setText(
                                          "🟢 "+env+" OAuth 연결 성공\n"+
                                          "접근토큰 발급 완료\n"+
                                          "만료: "+expires+
                                          "\n⭐ 현재 데이터 환경으로 자동 선택됨"
                                      );
                                      status.setTextColor(GREEN);
                                  });

                              }else{
                                  String msg=r.optString(
                                      "error_description",
                                      r.optString("msg1",r.toString())
                                  );

                                  runOnUiThread(()->{
                                      pb.setVisibility(View.GONE);
                                      test.setEnabled(true);
                                      status.setText("🔴 "+env+" 인증 실패\n"+msg);
                                      status.setTextColor(RED);
                                  });
                              }

                          }catch(Exception e){
                              runOnUiThread(()->{
                                  pb.setVisibility(View.GONE);
                                  test.setEnabled(true);
                                  status.setText("🔴 "+env+" 연결 실패\n"+safeError(e));
                                  status.setTextColor(RED);
                              });
                          }
                      }).start();
                  });

                  use.setOnClickListener(v->{
                      if(!tokenReady(env)){
                          Toast.makeText(
                              this,
                              env+" OAuth 연결 테스트를 먼저 성공시켜주세요.",
                              Toast.LENGTH_SHORT
                          ).show();
                          return;
                      }

                      prefs.edit().putString(ENV,env).apply();
                      Toast.makeText(this,env+"을 데이터 환경으로 선택했습니다.",Toast.LENGTH_SHORT).show();
                      refresh.run();
                  });

                  delete.setOnClickListener(v->{
                      prefs.edit()
                          .remove(keyName(env))
                          .remove(secretName(env))
                          .remove(tokenName(env))
                          .remove(expiresName(env))
                          .apply();

                      key.setText("");
                      secret.setText("");

                      Toast.makeText(this,env+" 저장정보 삭제 완료",Toast.LENGTH_SHORT).show();
                      refresh.run();
                  });

                  refresh.run();
                  return c;
              }

              JSONObject requestToken(String env,String appKey,String appSecret)throws Exception{
                  JSONObject body=new JSONObject();
                  body.put("grant_type","client_credentials");
                  body.put("appkey",appKey);
                  body.put("appsecret",appSecret);

                  HttpResult result=postJson(
                      baseUrl(env)+"/oauth2/tokenP",
                      body.toString()
                  );

                  if(result.body==null||result.body.trim().isEmpty()){
                      throw new Exception("토큰 응답이 비어 있습니다. HTTP "+result.code);
                  }

                  return new JSONObject(result.body);
              }

              void initChartWebView(WebView chart){
                  chart.setBackgroundColor(Color.rgb(12,24,48));

                  WebSettings ws=chart.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(false);
                  ws.setBuiltInZoomControls(false);
                  ws.setDisplayZoomControls(false);

                  chartReady.put(chart,false);

                  chart.setWebViewClient(new WebViewClient(){
                      @Override
                      public void onPageFinished(WebView view,String url){
                          super.onPageFinished(view,url);
                          chartReady.put(view,true);

                          String js=pendingChartJs.remove(view);
                          if(js!=null&&!js.isEmpty()){
                              view.evaluateJavascript(js,null);
                          }
                      }
                  });

                  chart.loadUrl("file:///android_asset/chart.html");
              }

              void dispatchChartJs(WebView web,String js){
                  pendingChartJs.put(web,js);

                  if(Boolean.TRUE.equals(chartReady.get(web))){
                      pendingChartJs.remove(web);
                      web.evaluateJavascript(js,null);
                      return;
                  }

                  // Fallback retries for slow Android WebView initialization.
                  web.postDelayed(()->{
                      if(Boolean.TRUE.equals(chartReady.get(web))){
                          String pending=pendingChartJs.remove(web);
                          if(pending!=null)web.evaluateJavascript(pending,null);
                      }
                  },700);

                  web.postDelayed(()->{
                      if(Boolean.TRUE.equals(chartReady.get(web))){
                          String pending=pendingChartJs.remove(web);
                          if(pending!=null)web.evaluateJavascript(pending,null);
                      }
                  },1600);
              }

