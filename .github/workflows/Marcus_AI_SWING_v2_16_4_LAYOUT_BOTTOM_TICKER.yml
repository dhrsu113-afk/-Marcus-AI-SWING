                  final int ASK_BG=Color.rgb(17,48,82);
                  final int BID_TEXT=Color.rgb(255,105,105);
                  final int BID_BG=Color.rgb(79,28,34);
                  final int CUR_BG=Color.rgb(42,72,114);

                  for(String line:lines){
                      if(line==null)line="";
                      String shown=line;

                      if(line.contains("현재가")){
                          shown="────────  현재가 "+money(currentPrice)+"  ────────";
                      }

                      int st=sp.length();
                      sp.append(shown).append("\n");
                      int en=sp.length();

                      if(line.contains("현재가")){
                          sp.setSpan(new ForegroundColorSpan(Color.WHITE),
                              st,en,Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);
                          sp.setSpan(new BackgroundColorSpan(CUR_BG),
                              st,en,Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);
                          sp.setSpan(new StyleSpan(Typeface.BOLD),
                              st,en,Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);
                          bid=true;
                      }else if(!bid){
                          // 매도 ASK = 파랑
                          sp.setSpan(new ForegroundColorSpan(ASK_TEXT),
                              st,en,Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);
                          sp.setSpan(new BackgroundColorSpan(ASK_BG),
                              st,en,Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);
                      }else{
                          // 매수 BID = 빨강
                          sp.setSpan(new ForegroundColorSpan(BID_TEXT),
                              st,en,Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);
                          sp.setSpan(new BackgroundColorSpan(BID_BG),
                              st,en,Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);
                      }
                  }
                  view.setText(sp);
              }

              void flashCurrentPriceRow(TextView orderBook){
                  orderBook.animate().cancel();
                  orderBook.setAlpha(.50f);
                  orderBook.animate().alpha(1f).setDuration(170).start();
              }

              void updateOrderBalance(
                  TextView askView,TextView bidView,String askRaw,String bidRaw
              ){
                  double ask=Math.max(0,num(askRaw));
                  double bid=Math.max(0,num(bidRaw));
                  double total=ask+bid;

                  double askPct=total>0?ask/total*100.0:50.0;
                  double bidPct=100.0-askPct;

                  askView.setText(String.format(Locale.KOREA,"매도 %.1f%%",askPct));
                  bidView.setText(String.format(Locale.KOREA,"매수 %.1f%%",bidPct));

                  float aw=(float)Math.max(0.15,askPct/100.0);
                  float bw=(float)Math.max(0.15,bidPct/100.0);

                  askView.setLayoutParams(
                      new LinearLayout.LayoutParams(0,dp(28),aw)
                  );
                  bidView.setLayoutParams(
                      new LinearLayout.LayoutParams(0,dp(28),bw)
                  );
              }

              String chartStateKey(String code){
                  return "chart_state_"+(code==null?"":code);
              }

              void saveChartState(String code,RealtimeStockChartView chart,String period){
                  if(code==null||code.isEmpty()||chart==null)return;
                  try{
                      JSONObject root=chart.exportChartState();
                      root.put("period",period==null?"DAY":period);
                      prefs.edit().putString(chartStateKey(code),root.toString()).apply();
                  }catch(Exception ignored){}
              }

              String restoreChartState(String code,RealtimeStockChartView chart,String fallbackPeriod){
                  if(code==null||code.isEmpty()||chart==null)return fallbackPeriod;
                  try{
                      String raw=prefs.getString(chartStateKey(code),"");
                      if(raw==null||raw.isEmpty())return fallbackPeriod;
                      JSONObject root=new JSONObject(raw);
                      chart.importChartState(root);
                      return root.optString("period",fallbackPeriod);
                  }catch(Exception ignored){ return fallbackPeriod; }
              }

              void clearSavedChartState(String code){
                  if(code==null||code.isEmpty())return;
                  prefs.edit().remove(chartStateKey(code)).apply();
              }

