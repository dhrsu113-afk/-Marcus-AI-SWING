              void renderAiText(TextView ai,AISignal sig){
                  String verdict=sig.score>=86?"진입":
                      (sig.score>=80?"준비":(sig.score>=66?"뉴스":"대기"));
                  String rebound=sig.ma5>sig.ma20?"상승":"관찰";
                  String reason=sig.explosion?"거래량 증가":
                      (sig.bos?"BOS 확인":(sig.discount?"Discount 구간":"조건 대기"));
                  String quality=sig.score>=80?"강":
                      (sig.score>=66?"보통":"약");
                  String timing=sig.bos?"돌파":
                      (sig.discount?"눌림":"대기");
                  String structure=sig.bos?"BOS":"Weak Low";
                  String trend=sig.ma5>sig.ma20?"상승":"관찰";
                  String volume=sig.explosion?"증가":"보통";

                  ai.setText(
                      "┌ AI 판단 ─────────┬ 차트 상태 ────────┬ 매도 전략 ────────┐\n"+
                      " AI     "+sig.score+"/100 "+verdict+"   │ Discount "+(sig.discount?"진입":"대기")+"       │ 보유       -\n"+
                      " 반등   "+rebound+"          │ "+structure+"              │ 시간       -\n"+
                      " 이유   "+reason+"   │ 구조      "+trend+"          │ 손절       -\n"+
                      " 품질   "+quality+"            │ 추세      "+trend+"          │ 1차 30%    -\n"+
                      " 타이밍 "+timing+"          │ 눌림      "+(sig.discount?"건강":"대기")+"          │ 2차 30%    -\n"+
                      " 판단   "+sig.label+"   │ 거래량    "+volume+"          │ 3차 보호   -\n"+
                      " RSI    "+String.format(Locale.US,"%.1f",sig.rsi)+"          │ BOS       "+(sig.bos?"확인":"대기")+"          │ 최고 수익  -\n"+
                      " MA5    "+fmt(sig.ma5)+"       │ MA20      "+fmt(sig.ma20)+"       │\n"+
                      "└─────────────────┴─────────────────┴─────────────────┘"
                  );
                  ai.setTypeface(Typeface.MONOSPACE);
                  ai.setTextSize(12);
                  ai.setTextColor(sig.score>=80?GREEN:(sig.score>=66?YELLOW:MUTED));
              }

              void loadChartPeriod(
                  WebView chart,
                  TextView chartTitle,
                  TextView ai,
                  String code,
                  String name,
                  String period
              ){
                  String env=activeEnv();
                  prefs.edit().putString(LAST_PERIOD,period).apply();

                  chartTitle.setText(name+" · "+period+" 불러오는 중...");

                  new Thread(()->{
                      try{
                          List<Candle> candles;
                          String label;

                          if("DAY".equals(period)){
                              candles=requestDailyChart(env,code);
                              label="일봉";
                          }else if("WEEK".equals(period)||"MONTH".equals(period)||"YEAR".equals(period)){
                              List<Candle> daily=requestDailyChart(env,code);
                              candles=aggregateHigherTimeframe(daily,period);
                              label=periodLabel(period);
                          }else{
                              List<Candle> one=requestIntraday1m(env,code);
                              int minutes=1;
                              if("3M".equals(period))minutes=3;
                              else if("5M".equals(period))minutes=5;
                              else if("15M".equals(period))minutes=15;
                              else if("30M".equals(period))minutes=30;
                              else if("60M".equals(period))minutes=60;

                              candles=minutes==1?one:aggregateMinutes(one,minutes);
                              label=minutes+"분봉";
                          }

                          AISignal sig=analyze(candles);

                          runOnUiThread(()->{
