              String keyName(String env){ return isReal(env)?REAL_KEY:MOCK_KEY; }
              String secretName(String env){ return isReal(env)?REAL_SECRET:MOCK_SECRET; }
              String tokenName(String env){ return isReal(env)?REAL_TOKEN:MOCK_TOKEN; }
              String expiresName(String env){ return isReal(env)?REAL_EXPIRES:MOCK_EXPIRES; }

              boolean credentialsReady(String env){
                  return !prefs.getString(keyName(env),"").isEmpty()
                      && !prefs.getString(secretName(env),"").isEmpty();
              }

              boolean tokenReady(String env){
                  return !prefs.getString(tokenName(env),"").isEmpty();
              }

              long parseExpiryMillis(String raw){
                  if(raw==null||raw.trim().isEmpty())return 0L;
                  String s=raw.trim();

                  String[] formats={
                      "yyyy-MM-dd HH:mm:ss",
                      "yyyy-MM-dd'T'HH:mm:ss",
                      "yyyyMMddHHmmss"
                  };

                  for(String f:formats){
                      try{
                          SimpleDateFormat sdf=new SimpleDateFormat(f,Locale.KOREA);
                          sdf.setLenient(false);
                          Date d=sdf.parse(s);
                          if(d!=null)return d.getTime();
                      }catch(Exception ignored){}
                  }

                  return 0L;
              }

              boolean tokenExpired(String env){
                  String raw=prefs.getString(expiresName(env),"");
                  long exp=parseExpiryMillis(raw);

                  // If the server did not provide a parseable expiry string,
                  // keep the token until an API response says it is invalid.
                  if(exp<=0L)return false;

                  // Refresh one minute early.
                  return System.currentTimeMillis()>=exp-60000L;
              }

              synchronized void refreshTokenIfNeeded(String env)throws Exception{
                  if(tokenReady(env)&&!tokenExpired(env))return;

                  String k=prefs.getString(keyName(env),"");
                  String s=prefs.getString(secretName(env),"");

                  if(k.isEmpty()||s.isEmpty()){
                      throw new Exception("App Key / Secret이 저장되어 있지 않습니다.");
                  }

                  JSONObject r=requestToken(env,k,s);

                  String token=r.optString("access_token","");
                  String expires=r.optString("access_token_token_expired","");

                  if(token.isEmpty()){
                      String msg=r.optString(
                          "error_description",
                          r.optString("msg1","OAuth 토큰 재발급 실패")
                      );
                      throw new Exception(msg);
                  }

                  prefs.edit()
                      .putString(tokenName(env),token)
                      .putString(expiresName(env),expires)
                      .apply();
              }

