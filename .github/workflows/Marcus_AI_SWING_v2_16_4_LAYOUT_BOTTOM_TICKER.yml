              static class MasterStock{
                  String code,name,market;
                  MasterStock(String c,String n,String m){
                      code=c; name=n; market=m;
                  }
              }

              void loadMasterStocks(){
                  masterStocks.clear();
                  try{
                      BufferedReader br=new BufferedReader(
                          new InputStreamReader(
                              getAssets().open("stocks.csv"),
                              StandardCharsets.UTF_8
                          )
                      );

                      String line;
                      boolean first=true;

                      while((line=br.readLine())!=null){
                          if(first){
                              first=false;
                              continue;
                          }

                          List<String> parts=parseCsv(line);
                          if(parts.size()<3)continue;

                          String code=parts.get(0).trim();
                          String name=parts.get(1).trim();
                          String market=parts.get(2).trim();

                          if(code.matches("\\d{6}")&&!name.isEmpty()){
                              masterStocks.add(new MasterStock(code,name,market));
                          }
                      }
                      br.close();
                  }catch(Exception e){
                      // Search will fall back to direct 6-digit code if master asset fails.
                  }
              }

              List<String> parseCsv(String line){
                  List<String> out=new ArrayList<>();
                  StringBuilder cur=new StringBuilder();
                  boolean quoted=false;

                  for(int i=0;i<line.length();i++){
                      char ch=line.charAt(i);

                      if(ch=='"'){
                          if(quoted && i+1<line.length() && line.charAt(i+1)=='"'){
                              cur.append('"');
                              i++;
                          }else{
                              quoted=!quoted;
                          }
                      }else if(ch==',' && !quoted){
                          out.add(cur.toString());
                          cur.setLength(0);
                      }else{
                          cur.append(ch);
                      }
                  }

                  out.add(cur.toString());
                  return out;
              }

