          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#07101F</item>
                  <item name="android:navigationBarColor">#07101F</item>
                  <item name="android:colorAccent">#7EA7FF</item>
              </style>
          </resources>
          EOF


          mkdir -p app/src/main/res/drawable
          echo '' | base64 -d > app/src/main/res/drawable/ai_swing_icon.png
          echo '' | base64 -d > app/src/main/res/drawable/ai_swing_mascot.png

          cat > app/src/main/java/com/marcus/aiswing/MainActivity.java <<'JAVA'
