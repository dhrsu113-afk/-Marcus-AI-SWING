              // ===== KIS WebSocket realtime engine (v2.9.0) =====
              // Specs applied from the uploaded KIS Excel files:
              // H0UNCNT0 integrated execution, H0UNASP0 integrated orderbook,
              // H0UNPGM0 integrated program trading. KRX/NXT IDs are retained
              // for later explicit market routing.
              class KISRealtime extends WebSocketListener{
                  final OkHttpClient wsClient=new OkHttpClient.Builder()
                      .retryOnConnectionFailure(true)
                      .pingInterval(20,TimeUnit.SECONDS)
                      .build();

                  WebSocket ws;
                  String approvalKey="";
                  String subscribed="";
                  boolean connecting=false;
                  boolean manualStop=false;
                  int retryCount=0;
                  Runnable reconnectTask=null;
                  final String env;
                  final String code;

                  KISRealtime(String env,String code){
                      this.env=env;
                      this.code=code;
                  }

                  void start(){
                      if(code==null||code.isEmpty()||!credentialsReady(env))return;
                      if(connecting || ws!=null)return;

                      manualStop=false;
                      connecting=true;

                      if(reconnectTask!=null){
                          stockLiveHandler.removeCallbacks(reconnectTask);
                          reconnectTask=null;
                      }

                      new Thread(()->{
                          try{
                              if(approvalKey==null || approvalKey.isEmpty()){
                                  approvalKey=requestApprovalKey(env);
                              }

                              String uri=isReal(env)
                                  ? "ws://ops.koreainvestment.com:21000"
                                  : "ws://ops.koreainvestment.com:31000";

                              Request req=new Request.Builder()
                                  .url(uri)
                                  .build();

                              ws=wsClient.newWebSocket(req,this);

                          }catch(Exception e){
                              connecting=false;
                              liveWsStatus="REST 보완";
                              reconnectLater();
                          }
                      }).start();
                  }

                  void stop(){
                      manualStop=true;
                      connecting=false;
                      retryCount=0;

                      if(reconnectTask!=null){
                          stockLiveHandler.removeCallbacks(reconnectTask);
                          reconnectTask=null;
                      }

                      try{
                          if(ws!=null)ws.close(1000,"bye");
                      }catch(Exception ignored){}
                      ws=null;
                      subscribed="";
                  }

                  void subscribe(String tr){
                      if(ws==null||approvalKey.isEmpty())return;

                      try{
                          JSONObject h=new JSONObject();
                          h.put("approval_key",approvalKey);
                          h.put("custtype","P");
                          h.put("tr_type","1");
                          h.put("content-type","utf-8");

                          JSONObject input=new JSONObject();
                          input.put("tr_id",tr);
                          input.put("tr_key",code);

                          JSONObject body=new JSONObject();
                          body.put("input",input);

                          JSONObject root=new JSONObject();
                          root.put("header",h);
                          root.put("body",body);

                          ws.send(root.toString());

                      }catch(Exception ignored){}
                  }

                  @Override public void onOpen(WebSocket webSocket,Response response){
                      super.onOpen(webSocket,response);

                      // Uploaded KIS specs: integrated KRX+NXT streams.
                      subscribe("H0UNCNT0"); // integrated execution
                      subscribe("H0UNASP0"); // integrated orderbook
                      subscribe("H0UNPGM0"); // integrated program trading

                      connecting=false;
                      retryCount=0;
                      subscribed=code;
                      liveWsStatus="연결";
                      runOnUiThread(()->connBottom.setText("● 실시간 연결"));

                      runOnUiThread(()->{
                          if(stockLiveActive){
                              Toast.makeText(
                                  MainActivity.this,
                                  "KIS 실시간 연결 완료",
                                  Toast.LENGTH_SHORT
                              ).show();
                          }
                      });
                  }

                  @Override public void onMessage(WebSocket webSocket,String msg){
                      parse(msg);
                  }

                  @Override public void onClosing(WebSocket webSocket,int code,String reason){
                      try{ webSocket.close(code,reason); }catch(Exception ignored){}
                  }

                  @Override public void onClosed(WebSocket webSocket,int code,String reason){
                      if(ws==webSocket)ws=null;
                      connecting=false;
                      subscribed="";

                      if(manualStop){
                          liveWsStatus="종료";
                          runOnUiThread(()->connBottom.setText("● 연결 종료"));
                          return;
                      }

                      liveWsStatus="REST 보완";
                      runOnUiThread(()->connBottom.setText("● REST 보완"));
                      reconnectLater();
                  }

                  @Override public void onFailure(WebSocket webSocket,Throwable t,Response response){
                      if(ws==webSocket)ws=null;
                      connecting=false;
                      subscribed="";

                      if(manualStop)return;

                      liveWsStatus="REST 보완";
                      reconnectLater();
                  }

                  void reconnectLater(){
                      if(manualStop || reconnectTask!=null)return;

                      retryCount=Math.min(retryCount+1,6);
                      long delay=Math.min(60000L,3000L*(1L<<Math.min(4,retryCount-1)));

                      reconnectTask=()->{
                          reconnectTask=null;
                          if(!manualStop &&
                             stockLiveActive &&
                             code.equals(liveCode) &&
                             ws==null &&
                             !connecting){
                              liveWsStatus="재연결";
                              start();
                          }
                      };

                      stockLiveHandler.postDelayed(reconnectTask,delay);
                  }

                  void parse(String msg){
                      if(msg==null||msg.isEmpty())return;

                      // KIS control frames are JSON. PINGPONG must be echoed back.
                      if(msg.charAt(0)=='{'){
                          try{
                              JSONObject j=new JSONObject(msg);
                              JSONObject h=j.optJSONObject("header");
                              if(h!=null && "PINGPONG".equals(h.optString("tr_id","")) && ws!=null){
                                  ws.send(msg);
                              }
                          }catch(Exception ignored){}
                          return;
                      }

                      // Realtime data: encryption flag | TR ID | count | caret-delimited payload
                      String[] p=msg.split("\\|",4);
                      if(p.length<4)return;

                      String tr=p[1];
                      String[] v=p[3].split("\\^",-1);

                      try{
                          if("H0UNCNT0".equals(tr) && v.length>=45){
                              liveLastPrice=v[2];
                              liveLastChange=v[4];
                              liveLastRate=v[5];
                              liveLastTradeVolume=v[12];
                              liveLastVolume=v[13];
                              liveLastAmount=v[14];
                              liveLastStrength=v[18];
                              liveTradeTime=v[1];
                              liveSeq++;

                          }else if("H0UNASP0".equals(tr) && v.length>=43){
                              StringBuilder b=new StringBuilder();

                              for(int i=9;i>=0;i--){
                                  b.append(String.format(
                                      Locale.KOREA,
                                      "%8s │ %9s │ %8s\n",
                                      qty(v[23+i]),
                                      money(v[3+i]),
                                      ""
                                  ));
                              }

                              b.append("──────── 현재가 ────────\n");

                              for(int i=0;i<10;i++){
                                  b.append(String.format(
                                      Locale.KOREA,
                                      "%8s │ %9s │ %8s\n",
                                      "",
                                      money(v[13+i]),
                                      qty(v[33+i])
                                  ));
                              }

                              liveOrderBook=b.toString();
                              if(v.length>44){
                                  liveAskTotal=v[43];
                                  liveBidTotal=v[44];
                              }
                              liveSeq++;

                          }else if("H0UNPGM0".equals(tr) && v.length>=8){
                              liveProgramNet=v[6];
                              liveSeq++;
                          }

                      }catch(Exception ignored){}
                  }
              }

              String requestApprovalKey(String env)throws Exception{
                  JSONObject body=new JSONObject();
                  body.put("grant_type","client_credentials");
                  body.put("appkey",prefs.getString(keyName(env),""));
                  body.put("secretkey",prefs.getString(secretName(env),""));
                  HttpResult r=postJson(baseUrl(env)+"/oauth2/Approval",body.toString());
                  if(r.body==null||r.body.trim().isEmpty())throw new Exception("웹소켓 접속키 응답 없음");
                  JSONObject j=new JSONObject(r.body);
                  String k=j.optString("approval_key","");
                  if(k.isEmpty())throw new Exception(j.optString("msg1","웹소켓 접속키 발급 실패"));
                  return k;
              }

              static class HttpResult{
                  int code;
                  String body;

                  HttpResult(int c,String b){
                      code=c;
                      body=b;
                  }
              }

              HttpResult postJson(String url,String body)throws Exception{
                  HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();

                  try{
                      c.setRequestMethod("POST");
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(20000);
                      c.setDoOutput(true);
                      c.setRequestProperty(
                          "Content-Type",
                          "application/json; charset=utf-8"
                      );

                      byte[] bytes=body.getBytes(StandardCharsets.UTF_8);

                      try(OutputStream os=c.getOutputStream()){
                          os.write(bytes);
                      }

                      int http=c.getResponseCode();

                      InputStream is=
                          (http>=200&&http<400)
                          ? c.getInputStream()
                          : c.getErrorStream();

                      return new HttpResult(http,readAll(is));

                  }finally{
                      c.disconnect();
                  }
              }

              String readAll(InputStream is)throws Exception{
                  if(is==null)return "";

                  BufferedReader br=
                      new BufferedReader(
                          new InputStreamReader(
                              is,
                              StandardCharsets.UTF_8
                          )
                      );

                  StringBuilder sb=new StringBuilder();
                  String line;

                  while((line=br.readLine())!=null){
                      sb.append(line);
                  }

                  br.close();
                  return sb.toString();
              }

              String safeError(Exception e){
                  String m=e.getMessage();
                  return (m==null||m.isEmpty())
                      ? e.getClass().getSimpleName()
                      : m;
              }

              @Override
              protected void onActivityResult(int requestCode,int resultCode,Intent data){
                  super.onActivityResult(requestCode,resultCode,data);
                  if(requestCode!=REQ_CHART_SCRIPT || resultCode!=RESULT_OK || data==null)return;
                  Uri uri=data.getData();
                  if(uri==null)return;
                  try{
                      StringBuilder sb=new StringBuilder();
                      BufferedReader br=new BufferedReader(new InputStreamReader(
                          getContentResolver().openInputStream(uri),StandardCharsets.UTF_8));
                      String line;
                      while((line=br.readLine())!=null)sb.append(line).append("\n");
                      br.close();

                      String fileName="선택한 파일";
                      Cursor cursor=getContentResolver().query(uri,null,null,null,null);
                      if(cursor!=null){
                          int idx=cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if(idx>=0 && cursor.moveToFirst())fileName=cursor.getString(idx);
                          cursor.close();
                      }
                      prefs.edit()
                          .putString("chart_script",sb.toString())
                          .putString(CHART_SCRIPT_FILE_NAME,fileName)
                          .apply();
                      Toast.makeText(this,"차트 스크립트 파일 적용 완료: "+fileName,Toast.LENGTH_LONG).show();
                      showAI();
                  }catch(Exception e){
                      Toast.makeText(this,"파일 적용 실패: "+safeError(e),Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              public void onBackPressed(){
                  if(!"HOME".equals(screenMode)){
                      handleBackNavigation();
                      return;
                  }
                  super.onBackPressed();
              }

              String mask(String v){
                  if(v==null||v.isEmpty())return "미설정";
                  if(v.length()<=8)return "••••••••";
                  return v.substring(0,4)+"••••••"+v.substring(v.length()-4);
              }
          }
