      - name: Update compatibility
        run: |
          echo "applicationId=com.marcus.aiswing"
          echo "versionCode=60"
          echo "versionName=2.16.4"
          echo "App data persists when installed over an existing app signed with the same certificate."

      - name: Restore permanent signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/marcus-release.jks
          keytool -list -keystore app/marcus-release.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" >/dev/null

      - name: Configure permanent release signing
        run: |
          cat >> app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  permanentRelease {
                      storeFile file("marcus-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.permanentRelease
                  }
              }
          }
          EOF
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build v2.16.4 permanently signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK identity and certificate
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          echo "APK SHA-256:"
          sha256sum "$APK"
          echo "Signing certificate:"
          keytool -printcert -jarfile "$APK" | grep -E 'Owner:|Issuer:|SHA256:' || true
          echo "Expected package: com.marcus.aiswing"
          echo "Expected versionCode: 60"
          echo "Expected versionName: 2.16.4"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marcus-AI-SWING-v2.16.4-LAYOUT-BOTTOM-TICKER
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
