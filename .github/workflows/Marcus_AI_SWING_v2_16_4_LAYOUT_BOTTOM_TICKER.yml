              List<Candle> requestIntraday1m(String env,String code)throws Exception{
                  refreshTokenIfNeeded(env);
                  Map<String,Candle> uniq=new LinkedHashMap<>();

                  // Cached history paints immediately on later visits.
                  for(Candle q:loadMinuteCache(code)){
                      if(q!=null && q.date!=null)uniq.put(q.date,q);
                  }

                  SimpleDateFormat timeFmt=new SimpleDateFormat("HHmmss",Locale.KOREA);
                  SimpleDateFormat dayFmt=new SimpleDateFormat("yyyyMMdd",Locale.KOREA);

                  Calendar base=Calendar.getInstance();

                  for(int page=0;page<4;page++){
                      Calendar cursor=(Calendar)base.clone();
                      cursor.add(Calendar.MINUTE,-30*page);

                      String hour=timeFmt.format(cursor.getTime());

                      String url=
                          baseUrl(env)+
                          "/uapi/domestic-stock/v1/quotations/inquire-time-itemchartprice"+
                          "?FID_COND_MRKT_DIV_CODE=J"+
                          "&FID_INPUT_ISCD="+URLEncoder.encode(code,StandardCharsets.UTF_8.name())+
                          "&FID_INPUT_HOUR_1="+hour+
                          "&FID_PW_DATA_INCU_YN=Y"+
                          "&FID_ETC_CLS_CODE=";

                      waitForApiSlot();

                      HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();

                      try{
                          c.setRequestMethod("GET");
                          c.setConnectTimeout(15000);
                          c.setReadTimeout(20000);
                          c.setRequestProperty("authorization","Bearer "+prefs.getString(tokenName(env),""));
                          c.setRequestProperty("appkey",prefs.getString(keyName(env),""));
                          c.setRequestProperty("appsecret",prefs.getString(secretName(env),""));
                          c.setRequestProperty("tr_id","FHKST03010200");
                          c.setRequestProperty("Content-Type","application/json; charset=utf-8");

                          int http=c.getResponseCode();
                          InputStream is=(http>=200&&http<400)?c.getInputStream():c.getErrorStream();
                          String body=readAll(is);

                          if(body==null||body.trim().isEmpty())continue;

                          JSONObject j=new JSONObject(body);

                          if(!"0".equals(j.optString("rt_cd",""))){
                              throw new Exception(j.optString("msg1","분봉 조회 실패"));
                          }

                          org.json.JSONArray arr=j.optJSONArray("output2");
                          if(arr==null)continue;

                          for(int i=0;i<arr.length();i++){
                              JSONObject o=arr.optJSONObject(i);
                              if(o==null)continue;

                              String d=o.optString("stck_bsop_date","");
                              if(d.length()!=8)d=dayFmt.format(new Date());

                              String tm=o.optString("stck_cntg_hour","");
                              if(tm.length()<6)continue;

                              String key=d+tm.substring(0,6);

                              uniq.put(key,new Candle(
                                  key,
                                  num(o.optString("stck_oprc","0")),
                                  num(o.optString("stck_hgpr","0")),
                                  num(o.optString("stck_lwpr","0")),
                                  num(o.optString("stck_prpr","0")),
                                  num(o.optString("cntg_vol","0"))
                              ));
                          }

                      }finally{
                          c.disconnect();
                      }
                  }

                  // First visit: backfill approximately 1-2 months of calendar history.
                  // Cached visits skip most of this work.
                  String oldest=uniq.isEmpty()?"":Collections.min(uniq.keySet());
                  Calendar hist=Calendar.getInstance();
                  SimpleDateFormat histFmt=new SimpleDateFormat("yyyyMMdd",Locale.KOREA);
                  int fetchedHistoryDays=0;
                  for(int day=1;day<=45;day++){
                      hist.add(Calendar.DAY_OF_MONTH,-1);
                      int dow=hist.get(Calendar.DAY_OF_WEEK);
                      if(dow==Calendar.SATURDAY||dow==Calendar.SUNDAY)continue;
                      String hd=histFmt.format(hist.getTime());
                      if(!oldest.isEmpty() && oldest.startsWith(hd))continue;
                      if(!oldest.isEmpty() && hd.compareTo(oldest.substring(0,8))>=0)continue;

                      appendHistoricalMinuteDay(env,code,hd,uniq);
                      fetchedHistoryDays++;

                      // Progressive cache fill: do not monopolize the network on first open.
                      if(fetchedHistoryDays>=5)break;
                  }

                  List<Candle> out=new ArrayList<>(uniq.values());
                  Collections.sort(out,(a,b)->a.date.compareTo(b.date));
                  saveMinuteCache(code,out);
                  return out;
              }

              List<Candle> aggregateMinutes(List<Candle> one,int minutes){
                  List<Candle> out=new ArrayList<>();
                  if(one==null||one.isEmpty())return out;

                  Candle current=null;
                  String currentBucket=null;

                  for(Candle c:one){
                      try{
                          int hour=Integer.parseInt(c.date.substring(8,10));
                          int minute=Integer.parseInt(c.date.substring(10,12));
                          int bucketMinute=(minute/minutes)*minutes;

                          String bucket=
                              c.date.substring(0,8)+
                              String.format(Locale.US,"%02d%02d00",hour,bucketMinute);

                          if(!bucket.equals(currentBucket)){
                              if(current!=null)out.add(current);

                              current=new Candle(
                                  bucket,
                                  c.open,c.high,c.low,c.close,c.volume
                              );
                              currentBucket=bucket;

                          }else{
                              current.high=Math.max(current.high,c.high);
                              current.low=Math.min(current.low,c.low);
                              current.close=c.close;
                              current.volume+=c.volume;
                          }

                      }catch(Exception ignored){}
                  }

                  if(current!=null)out.add(current);
                  return out;
              }

