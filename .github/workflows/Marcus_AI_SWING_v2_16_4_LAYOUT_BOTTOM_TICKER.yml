                  String m=masterMarket(code);
                  if(m==null)m="";
                  String u=m.toUpperCase(Locale.KOREA);
                  if(u.contains("NXT"))return "NXT";
                  if(u.contains("KOSDAQ"))return "KOSDAQ";
                  if(u.contains("KOSPI"))return "KOSPI";
                  if(u.contains("ETF"))return "ETF";
                  return u.isEmpty()?"KRX":u;
              }

              String masterMarket(String code){
                  for(MasterStock m:masterStocks){
                      if(m.code.equals(code))return m.market;
                  }
                  return "";
              }

