              List<Candle> aggregateHigherTimeframe(List<Candle> daily,String mode){
                  List<Candle> out=new ArrayList<>();
                  if(daily==null||daily.isEmpty())return out;

                  Calendar cal=Calendar.getInstance();
                  String currentKey=null;
                  Candle acc=null;

                  for(Candle q:daily){
                      String raw=q.date==null?"":q.date.replace("-","");
                      if(raw.length()<8)continue;

                      try{
                          int y=Integer.parseInt(raw.substring(0,4));
                          int m=Integer.parseInt(raw.substring(4,6));
                          int d=Integer.parseInt(raw.substring(6,8));
                          cal.clear();
                          cal.setFirstDayOfWeek(Calendar.MONDAY);
                          cal.setMinimalDaysInFirstWeek(4);
                          cal.set(y,m-1,d);

                          String key;
                          if("WEEK".equals(mode)){
                              key=cal.getWeekYear()+"-"+cal.get(Calendar.WEEK_OF_YEAR);
                          }else if("MONTH".equals(mode)){
                              key=y+"-"+String.format(Locale.US,"%02d",m);
                          }else{
                              key=String.valueOf(y);
                          }

                          if(!key.equals(currentKey)){
                              if(acc!=null)out.add(acc);
                              acc=new Candle(
                                  q.date,
                                  q.open,
                                  q.high,
                                  q.low,
                                  q.close,
                                  q.volume
                              );
                              currentKey=key;
                          }else if(acc!=null){
                              acc.high=Math.max(acc.high,q.high);
                              acc.low=Math.min(acc.low,q.low);
                              acc.close=q.close;
                              acc.volume+=q.volume;
                              acc.date=q.date;
                          }
                      }catch(Exception ignored){}
                  }

                  if(acc!=null)out.add(acc);
                  return out;
              }

