                              for(int j=i-4;j<=i;j++)sum+=candles.get(j).close;
                              org.json.JSONObject m=new org.json.JSONObject();
                              m.put("time",timeValue);
                              m.put("value",sum/5.0);
                              ma5.put(m);
                          }

                          if(i>=9){
                              double sum=0;
                              for(int j=i-9;j<=i;j++)sum+=candles.get(j).close;
                              org.json.JSONObject m=new org.json.JSONObject();
                              m.put("time",timeValue); m.put("value",sum/10.0); ma10.put(m);
                          }
                          if(i>=14){
                              double sum=0;
                              for(int j=i-14;j<=i;j++)sum+=candles.get(j).close;
                              org.json.JSONObject m=new org.json.JSONObject();
                              m.put("time",timeValue); m.put("value",sum/15.0); ma15.put(m);
                          }

                          if(i>=19){
                              double sum=0;
                              for(int j=i-19;j<=i;j++)sum+=candles.get(j).close;
                              org.json.JSONObject m=new org.json.JSONObject();
                              m.put("time",timeValue);
                              m.put("value",sum/20.0);
                              ma20.put(m);
                          }
                      }

                      payload.put("candles",arr);
                      payload.put("ma5",ma5);
                      payload.put("ma10",ma10);
                      payload.put("ma15",ma15);
                      payload.put("ma20",ma20);
                      payload.put("volume",volume);

                      // v2.1: 저장된 차트 규칙을 실제 차트 렌더링에 연결
                      String chartRules=prefs.getString("chart_script",
                          "SHOW_MA5=true\nSHOW_MA10=true\nSHOW_MA15=true\nSHOW_MA20=true\nSHOW_VOLUME=true\nSHOW_BOS=true\nSHOW_DISCOUNT=true\nSHOW_EXPLOSION=true\nSHOW_RSI=true");
                      Map<String,String> cc=parseRules(chartRules);
                      org.json.JSONObject cfg=new org.json.JSONObject();
                      cfg.put("showMA5",ruleBool(cc,"SHOW_MA5",true));
                      cfg.put("showMA10",ruleBool(cc,"SHOW_MA10",true));
                      cfg.put("showMA15",ruleBool(cc,"SHOW_MA15",true));
                      cfg.put("showMA20",ruleBool(cc,"SHOW_MA20",true));
                      cfg.put("showVolume",ruleBool(cc,"SHOW_VOLUME",true));
                      cfg.put("showRSI",ruleBool(cc,"SHOW_RSI",true));
                      cfg.put("showBOS",ruleBool(cc,"SHOW_BOS",true));
                      cfg.put("showDiscount",ruleBool(cc,"SHOW_DISCOUNT",true));
                      cfg.put("showExplosion",ruleBool(cc,"SHOW_EXPLOSION",true));
                      payload.put("config",cfg);

                      AISignal chartSig=analyze(candles);
                      org.json.JSONObject signal=new org.json.JSONObject();
                      signal.put("bos",chartSig.bos);
                      signal.put("discount",chartSig.discount);
                      signal.put("explosion",chartSig.explosion);
                      signal.put("score",chartSig.score);
                      signal.put("rsi",chartSig.rsi);
