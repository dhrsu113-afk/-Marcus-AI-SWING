                  @Override public boolean onTouchEvent(MotionEvent e){
                      if(getParent()!=null){
                          boolean lock=e.getActionMasked()!=MotionEvent.ACTION_UP &&
                                       e.getActionMasked()!=MotionEvent.ACTION_CANCEL;
                          getParent().requestDisallowInterceptTouchEvent(lock);
                      }

                      scaler.onTouchEvent(e);

                      switch(e.getActionMasked()){
                          case MotionEvent.ACTION_DOWN:
                              lastX=e.getX();
                              dragging=true;
                              touchDownX=e.getX();
                              touchDownY=e.getY();
                              touchMoved=false;

                              if(toolMode==1){
                                  crossX=e.getX(); crossY=e.getY();
                              }else if(toolMode==2 || toolMode==4){
                                  float r=14f*getResources().getDisplayMetrics().density;
                                  editHandle=0;

                                  if(drawIndex1>=0 && drawIndex2>=0 &&
                                     !Double.isNaN(drawPrice1) && !Double.isNaN(drawPrice2)){
                                      float ax=drawX(drawIndex1), ay=drawY(drawPrice1);
                                      float bx=drawX(drawIndex2), by=drawY(drawPrice2);

                                      if(near(e.getX(),e.getY(),ax,ay,r))editHandle=1;
                                      else if(near(e.getX(),e.getY(),bx,by,r))editHandle=2;
                                      else if(distanceToSegment(e.getX(),e.getY(),ax,ay,bx,by)<r)editHandle=3;
                                  }

                                  int ti=touchIndex(e.getX());
                                  double tp=touchPrice(e.getY());

                                  if(editHandle==0){
                                      drawIndex1=drawIndex2=ti;
                                      drawPrice1=drawPrice2=tp;
                                      editHandle=2;
                                  }

                                  lastEditIndex=ti;
                                  lastEditPrice=tp;
                                  drawingLine=true;
                                  fibDrawing=toolMode==4;
                              }else if(toolMode==3){
                                  hLineY=e.getY();
                              }
                              invalidate();
                              return true;

                          case MotionEvent.ACTION_MOVE:
                              if(Math.abs(e.getX()-touchDownX)>8f*getResources().getDisplayMetrics().density ||
                                 Math.abs(e.getY()-touchDownY)>8f*getResources().getDisplayMetrics().density){
                                  touchMoved=true;
                              }

                              if(toolMode==0){
                                  if(!scaler.isInProgress()){
                                      float dx=e.getX()-lastX;
                                      panX+=dx;
                                      lastX=e.getX();
                                  }
                              }else if(toolMode==1){
                                  crossX=e.getX(); crossY=e.getY();
                              }else if((toolMode==2 || toolMode==4) && drawingLine){
                                  int ti=touchIndex(e.getX());
                                  double tp=touchPrice(e.getY());

                                  if(editHandle==1){
                                      drawIndex1=ti; drawPrice1=tp;
                                  }else if(editHandle==2){
                                      drawIndex2=ti; drawPrice2=tp;
                                  }else if(editHandle==3 && lastEditIndex>=0 && !Double.isNaN(lastEditPrice)){
                                      int di=ti-lastEditIndex;
                                      double dp=tp-lastEditPrice;
                                      drawIndex1+=di; drawIndex2+=di;
                                      drawIndex1=Math.max(0,Math.min(data.size()-1,drawIndex1));
                                      drawIndex2=Math.max(0,Math.min(data.size()-1,drawIndex2));
                                      drawPrice1+=dp; drawPrice2+=dp;
                                  }
                                  lastEditIndex=ti;
                                  lastEditPrice=tp;
                              }else if(toolMode==3){
                                  hLineY=e.getY();
                              }
                              invalidate();
                              return true;

                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              if(e.getActionMasked()==MotionEvent.ACTION_UP &&
                                 toolMode==0 &&
                                 !touchMoved &&
                                 !scaler.isInProgress()){
                                  int hit=candleIndexAt(e.getX());
                                  if(hit>=0){
                                      selectedCandleIndex=hit;
                                  }else{
                                      selectedCandleIndex=-1;
                                  }
                              }

                              if(toolMode==1){
                                  crossX=e.getX(); crossY=e.getY();
                              }else if((toolMode==2 || toolMode==4) && drawingLine){
                                  if(editHandle==1){
                                      drawIndex1=touchIndex(e.getX()); drawPrice1=touchPrice(e.getY());
                                  }else if(editHandle==2){
                                      drawIndex2=touchIndex(e.getX()); drawPrice2=touchPrice(e.getY());
                                  }
                                  drawingLine=false;
                                  editHandle=0;
                              }else if(toolMode==3){
                                  hLineY=e.getY();
                              }
                              dragging=false;
                              if(getParent()!=null)getParent().requestDisallowInterceptTouchEvent(false);
                              invalidate();
                              if(onChartChanged!=null)onChartChanged.run();
                              return true;
                      }
                      return true;
                  }

                  String fmtValue(double v){
                      if(Double.isNaN(v) || Double.isInfinite(v))return "-";
                      return String.format(Locale.KOREA,"%,.2f",v);
                  }

                  String fmtValue0(double v){
                      if(Double.isNaN(v) || Double.isInfinite(v))return "-";
                      return String.format(Locale.KOREA,"%,.0f",v);
                  }

                  String pctFromClose(double value,double close){
                      if(Double.isNaN(value) || Double.isInfinite(value) || close==0)return "";
                      return String.format(Locale.KOREA," (%+.2f%%)",(value-close)/close*100.0);
                  }

                  String compactAmount(double won){
                      double a=Math.abs(won);
                      if(a>=100000000.0)return String.format(Locale.KOREA,"%.1f억",won/100000000.0);
                      if(a>=10000.0)return String.format(Locale.KOREA,"%.0f만",won/10000.0);
                      return String.format(Locale.KOREA,"%,.0f",won);
                  }

                  double sma(int idx,int len){
                      if(idx<len-1)return Double.NaN;
                      double sum=0;
                      for(int j=idx-len+1;j<=idx;j++)sum+=data.get(j).close;
                      return sum/len;
                  }

                  double rsi(int idx,int len){
                      if(idx<len)return 50;
                      double gain=0,loss=0;
                      for(int i=idx-len+1;i<=idx;i++){
                          double d=data.get(i).close-data.get(i-1).close;
                          if(d>=0)gain+=d; else loss-=d;
                      }
                      if(loss==0)return 100;
                      double rs=(gain/len)/(loss/len);
                      return 100-(100/(1+rs));
                  }

                  float yPrice(double v,double min,double max,float top,float bottom){
                      if(max<=min)return (top+bottom)/2f;
                      return (float)(bottom-((v-min)/(max-min))*(bottom-top));
                  }

                  @Override protected void onDraw(Canvas c){
                      super.onDraw(c);
                      if(getWidth()<=0||getHeight()<=0)return;

                      final float den=getResources().getDisplayMetrics().density;
                      float left=8*den, right=getWidth()-62*den;
                      float top=28*den;
                      float priceBottom=getHeight()*0.585f;
                      float volTop=priceBottom+4*den;
                      float volBottom=getHeight()*0.705f;
                      float stochTop=volBottom+5*den;
                      float stochBottom=getHeight()*0.845f;
                      float rsiTop=stochBottom+5*den;
                      float rsiBottom=getHeight()-16*den;

                      p.setStyle(Paint.Style.FILL);
                      p.setColor(Color.rgb(5,17,31));
                      c.drawRect(0,0,getWidth(),getHeight(),p);

                      // Grid
                      for(int i=0;i<=5;i++){
                          float y=top+(priceBottom-top)*i/5f;
                          c.drawLine(left,y,right,y,grid);
                      }
                      for(int i=0;i<=6;i++){
                          float x=left+(right-left)*i/6f;
                          c.drawLine(x,top,x,rsiBottom,grid);
                      }
                      c.drawLine(left,volBottom,right,volBottom,grid);
                      c.drawLine(left,stochBottom,right,stochBottom,grid);

                      textPaint.setTextSize(11*getResources().getDisplayMetrics().scaledDensity);
                      textPaint.setColor(Color.rgb(221,230,247));
                      c.drawText(title+"  ·  "+period,left,16*den,textPaint);

                      if(data.isEmpty()){
                          textPaint.setTextSize(15*getResources().getDisplayMetrics().scaledDensity);
                          textPaint.setColor(Color.rgb(150,170,205));
                          c.drawText("차트 데이터를 불러오는 중...",left,70*den,textPaint);
                          return;
                      }

                      int visible=Math.max(12,(int)((right-left)/candleW));
                      int shift=(int)(panX/candleW);
                      int end=Math.min(data.size()-1,data.size()-1-shift);
                      if(end<0)end=0;
                      int start=Math.max(0,end-visible+1);

                      double min=Double.MAX_VALUE,max=-Double.MAX_VALUE,maxVol=1;
                      for(int i=start;i<=end;i++){
                          Candle q=data.get(i);
                          min=Math.min(min,q.low); max=Math.max(max,q.high);
                          maxVol=Math.max(maxVol,q.volume);
                      }
                      double pad=(max-min)*0.08;
                      if(pad<=0)pad=Math.max(1,max*0.01);
                      min-=pad; max+=pad;

                      currentStart=start; currentEnd=end;
                      currentMin=min; currentMax=max;
                      currentLeft=left; currentRight=right;
                      currentTop=top; currentPriceBottom=priceBottom;

                      // price scale labels
                      textPaint.setTextSize(10*getResources().getDisplayMetrics().scaledDensity);
                      for(int i=0;i<=5;i++){
                          double pv=max-(max-min)*i/5.0;
                          float y=top+(priceBottom-top)*i/5f;
                          textPaint.setColor(Color.rgb(194,207,232));
                          c.drawText(String.format(Locale.KOREA,"%,.0f",pv),right+5*den,y+4*den,textPaint);
                      }

                      float body=Math.max(2*den,candleW*0.58f);
                      Path ma5=new Path(),ma10=new Path(),ma20=new Path(),ma60=new Path(),ma120=new Path();
                      boolean m5=false,m10=false,m20=false,m60=false,m120=false;

                      for(int i=start;i<=end;i++){
                          Candle q=data.get(i);
                          float x=right-(end-i)*candleW-candleW/2f;
                          int col=q.close>=q.open?upColor:downColor;
                          p.setColor(col);
                          p.setStrokeWidth(1.2f*den);

                          float yh=yPrice(q.high,min,max,top,priceBottom);
                          float yl=yPrice(q.low,min,max,top,priceBottom);
                          float yo=yPrice(q.open,min,max,top,priceBottom);
                          float yc=yPrice(q.close,min,max,top,priceBottom);
                          c.drawLine(x,yh,x,yl,p);
                          float bt=Math.min(yo,yc),bb=Math.max(yo,yc);
                          if(bb-bt<1.5f*den)bb=bt+1.5f*den;
                          c.drawRect(x-body/2,bt,x+body/2,bb,p);

                          // volume
                          float vh=(float)((q.volume/maxVol)*(volBottom-volTop));
                          p.setColor(Color.argb(175,Color.red(col),Color.green(col),Color.blue(col)));
                          c.drawRect(x-body/2,volBottom-vh,x+body/2,volBottom,p);

                          double[] mas={sma(i,5),sma(i,10),sma(i,20),sma(i,60),sma(i,120)};
                          Path[] paths={ma5,ma10,ma20,ma60,ma120};
                          boolean[] started={m5,m10,m20,m60,m120};
                          for(int k=0;k<5;k++){
                              if(Double.isNaN(mas[k]))continue;
                              float my=yPrice(mas[k],min,max,top,priceBottom);
                              if(!started[k]){ paths[k].moveTo(x,my); started[k]=true; }
                              else paths[k].lineTo(x,my);
                          }
                          m5=started[0];m10=started[1];m20=started[2];m60=started[3];m120=started[4];
                      }

                      int[] mac={
                          Color.rgb(255,202,65),
                          Color.rgb(74,203,228),
                          Color.rgb(89,218,174),
                          Color.rgb(166,112,226),
                          Color.rgb(205,211,220)
                      };
                      Path[] paths={ma5,ma10,ma20,ma60,ma120};
                      boolean[] showMas={showMA5,showMA10,showMA20,showMA60,showMA120};
                      for(int k=0;k<5;k++){
                          if(!showMas[k])continue;
                          maPaint.setColor(mac[k]);
                          c.drawPath(paths[k],maPaint);
                      }

                      // Bollinger Bands (20,2)
                      if(showBollinger){
                          Path upper=new Path(),lower=new Path();
                          boolean us=false,ls=false;
                          for(int i=start;i<=end;i++){
                              double mid=sma(i,20);
                              if(Double.isNaN(mid))continue;
                              double sd=stddev(i,20,mid);
                              double up=mid+2.0*sd, dn=mid-2.0*sd;
                              float x=right-(end-i)*candleW-candleW/2f;
                              float uy=yPrice(up,min,max,top,priceBottom);
                              float ly=yPrice(dn,min,max,top,priceBottom);
                              if(!us){upper.moveTo(x,uy);us=true;} else upper.lineTo(x,uy);
                              if(!ls){lower.moveTo(x,ly);ls=true;} else lower.lineTo(x,ly);
                          }
                          maPaint.setColor(Color.rgb(255,160,210));
                          c.drawPath(upper,maPaint);
                          c.drawPath(lower,maPaint);
                      }

                      // Envelope (MA20 ±3%)
                      if(showEnvelope){
                          Path epU=new Path(),epL=new Path();
                          boolean eu=false,el=false;
                          for(int i=start;i<=end;i++){
                              double mid=sma(i,20);
                              if(Double.isNaN(mid))continue;
                              float x=right-(end-i)*candleW-candleW/2f;
                              float uy=yPrice(mid*1.03,min,max,top,priceBottom);
                              float ly=yPrice(mid*0.97,min,max,top,priceBottom);
                              if(!eu){epU.moveTo(x,uy);eu=true;} else epU.lineTo(x,uy);
                              if(!el){epL.moveTo(x,ly);el=true;} else epL.lineTo(x,ly);
                          }
                          maPaint.setColor(Color.rgb(120,200,255));
                          c.drawPath(epU,maPaint); c.drawPath(epL,maPaint);
                      }

                      // Price Channel (20)
                      if(showPriceChannel){
                          Path pcU=new Path(),pcL=new Path();
                          boolean pu=false,pl=false;
                          for(int i=start;i<=end;i++){
                              double hi=highest(i,20),lo=lowest(i,20);
                              if(Double.isNaN(hi)||Double.isNaN(lo))continue;
                              float x=right-(end-i)*candleW-candleW/2f;
                              float uy=yPrice(hi,min,max,top,priceBottom);
                              float ly=yPrice(lo,min,max,top,priceBottom);
                              if(!pu){pcU.moveTo(x,uy);pu=true;} else pcU.lineTo(x,uy);
                              if(!pl){pcL.moveTo(x,ly);pl=true;} else pcL.lineTo(x,ly);
                          }
                          maPaint.setColor(Color.rgb(120,255,170));
                          c.drawPath(pcU,maPaint); c.drawPath(pcL,maPaint);
                      }

                      // Approximate PSAR markers
                      if(showPSAR){
                          p.setColor(Color.rgb(255,210,90));
                          for(int i=Math.max(start,2);i<=end;i+=2){
                              Candle q=data.get(i);
                              boolean rising=q.close>=data.get(i-1).close;
                              double yv=rising?q.low:q.high;
                              float x=right-(end-i)*candleW-candleW/2f;
                              float y=yPrice(yv,min,max,top,priceBottom)+(rising?6*den:-6*den);
                              c.drawCircle(x,y,1.7f*den,p);
                          }
                      }

                      // Ichimoku: conversion/base + 26-bar forward cloud + lagging span.
                      if(showIchimoku){
                          Path tenkan=new Path(),kijun=new Path(),lagging=new Path();
                          Path cloud=new Path();
                          boolean ts=false,ks=false,ls=false;
                          ArrayList<Float> ax=new ArrayList<>(), ay=new ArrayList<>();
                          ArrayList<Float> bx=new ArrayList<>(), by=new ArrayList<>();

                          float shift26=26f*candleW;

                          int ichimokuCalcStart=Math.max(0,start-52);
                          for(int i=ichimokuCalcStart;i<=end;i++){
                              double h9=highest(i,9),l9=lowest(i,9);
                              double h26=highest(i,26),l26=lowest(i,26);
                              double h52=highest(i,52),l52=lowest(i,52);
                              if(Double.isNaN(h9)||Double.isNaN(l9))continue;

                              float x=right-(end-i)*candleW-candleW/2f;
                              double conv=(h9+l9)/2.0;
                              float ty=yPrice(conv,min,max,top,priceBottom);
                              if(x>=left && x<=right){
                                  if(!ts){tenkan.moveTo(x,ty);ts=true;}else tenkan.lineTo(x,ty);
                              }

                              if(!Double.isNaN(h26)&&!Double.isNaN(l26)){
                                  double base=(h26+l26)/2.0;
                                  float ky=yPrice(base,min,max,top,priceBottom);
                                  if(x>=left && x<=right){
                                      if(!ks){kijun.moveTo(x,ky);ks=true;}else kijun.lineTo(x,ky);
                                  }

                                  double spanA=(conv+base)/2.0;
                                  double spanB=(!Double.isNaN(h52)&&!Double.isNaN(l52))
                                      ? (h52+l52)/2.0 : base;

                                  float fx=x+shift26;
                                  if(fx<=right+shift26){
                                      ax.add(fx); ay.add(yPrice(spanA,min,max,top,priceBottom));
                                      bx.add(fx); by.add(yPrice(spanB,min,max,top,priceBottom));
                                  }
                              }

                              float lx=x-shift26;
                              if(lx>=left){
                                  float ly=yPrice(data.get(i).close,min,max,top,priceBottom);
                                  if(!ls){lagging.moveTo(lx,ly);ls=true;}else lagging.lineTo(lx,ly);
                              }
                          }

                          if(ax.size()>1){
                              int cloudSave=c.save();
                              c.clipRect(left,top,right,priceBottom);

                              p.setStyle(Paint.Style.FILL);
                              for(int ci=1;ci<ax.size();ci++){
                                  Path cell=new Path();
                                  cell.moveTo(ax.get(ci-1),ay.get(ci-1));
                                  cell.lineTo(ax.get(ci),ay.get(ci));
                                  cell.lineTo(bx.get(ci),by.get(ci));
                                  cell.lineTo(bx.get(ci-1),by.get(ci-1));
                                  cell.close();

                                  boolean bullish=((ay.get(ci-1)+ay.get(ci))*0.5f) <
                                                  ((by.get(ci-1)+by.get(ci))*0.5f);
                                  p.setColor(
                                      bullish
                                          ? Color.argb(82,225,68,78)
                                          : Color.argb(92,42,112,220)
                                  );
                                  c.drawPath(cell,p);
                              }
                              c.restoreToCount(cloudSave);
                              p.setStyle(Paint.Style.STROKE);
                          }

                          maPaint.setStrokeWidth(1.25f*den);
                          maPaint.setColor(Color.rgb(239,83,122)); c.drawPath(tenkan,maPaint);
                          maPaint.setColor(Color.rgb(110,185,238)); c.drawPath(kijun,maPaint);
                          maPaint.setColor(Color.rgb(190,92,211)); c.drawPath(lagging,maPaint);
                          maPaint.setStrokeWidth(1.45f*den);
                      }

                      // Price-by-volume profile: wide translucent amber bars + volume/ratio labels.
                      if(showVolumeProfile && max>min){
                          int bins=10;
                          double[] vp=new double[bins];
                          double maxBin=1,totalVp=0;

                          for(int i=start;i<=end;i++){
                              Candle q=data.get(i);
                              int lowBin=(int)Math.floor((q.low-min)/(max-min)*bins);
                              int highBin=(int)Math.floor((q.high-min)/(max-min)*bins);
                              lowBin=Math.max(0,Math.min(bins-1,lowBin));
                              highBin=Math.max(0,Math.min(bins-1,highBin));
                              if(highBin<lowBin){
                                  int tmp=lowBin; lowBin=highBin; highBin=tmp;
                              }

                              int touched=Math.max(1,highBin-lowBin+1);
                              double share=Math.max(1,q.volume)/(double)touched;

                              for(int b=lowBin;b<=highBin;b++){
                                  vp[b]+=share;
                              }
                              totalVp+=Math.max(1,q.volume);
                          }

                          for(int b=0;b<bins;b++){
                              maxBin=Math.max(maxBin,vp[b]);
                          }

                          for(int b=0;b<bins;b++){
                              if(vp[b]<=0)continue;
                              double pv=min+(max-min)*(b+0.5)/bins;
                              float y=yPrice(pv,min,max,top,priceBottom);
                              float w=(float)(vp[b]/maxBin)*(right-left)*0.82f;

                              p.setStyle(Paint.Style.FILL);
                              p.setColor(Color.argb(72,183,145,61));
                              c.drawRect(left,y-8*den,left+w,y+8*den,p);

                              p.setStyle(Paint.Style.STROKE);
                              p.setStrokeWidth(1f*den);
                              p.setColor(Color.argb(125,210,172,84));
                              c.drawRect(left,y-8*den,left+w,y+8*den,p);

                              if(w>95*den && totalVp>0){
                                  double pct=vp[b]/totalVp*100.0;
                                  textPaint.setTextSize(8.5f*getResources().getDisplayMetrics().scaledDensity);
                                  textPaint.setColor(Color.rgb(225,202,150));
                                  String lab=String.format(Locale.KOREA,"%,.0f(%.2f%%)",vp[b],pct);
                                  c.drawText(lab,left+w*0.50f,y+3*den,textPaint);
                              }
                          }
                          p.setStyle(Paint.Style.FILL);
                      }

                      // separators + labels
                      p.setColor(Color.rgb(50,72,108)); p.setStrokeWidth(1f);
                      c.drawLine(left,priceBottom,right,priceBottom,p);
                      c.drawLine(left,volBottom,right,volBottom,p);
                      c.drawLine(left,stochBottom,right,stochBottom,p);

                      textPaint.setTextSize(10*getResources().getDisplayMetrics().scaledDensity);
                      float lx=left;
                      textPaint.setColor(Color.rgb(74,219,229));
                      c.drawText("거래량 ",lx,volTop+10*den,textPaint);
                      lx+=textPaint.measureText("거래량 ");
                      textPaint.setColor(Color.rgb(255,105,127));
                      c.drawText("단순 ",lx,volTop+10*den,textPaint);
                      lx+=textPaint.measureText("단순 ");
                      int[] vc={Color.rgb(255,202,65),Color.rgb(89,218,174),Color.rgb(166,112,226),Color.rgb(205,211,220)};
                      String[] vt={"5 ","20 ","60 ","120"};
                      for(int vi=0;vi<vt.length;vi++){
                          textPaint.setColor(vc[vi]);
                          c.drawText(vt[vi],lx,volTop+10*den,textPaint);
                          lx+=textPaint.measureText(vt[vi]);
                      }

                      // Slow Stochastic panel
                      float sx=left;
                      textPaint.setColor(Color.rgb(244,135,46));
                      c.drawText("Slow %K 12,5",sx,stochTop+10*den,textPaint);
                      sx+=textPaint.measureText("Slow %K 12,5   ");
                      textPaint.setColor(Color.rgb(187,93,219));
                      c.drawText("Slow %D 5",sx,stochTop+10*den,textPaint);
                      Path sk=new Path(),sd=new Path();
                      boolean sks=false,sds=false;
                      double[] kvals=new double[Math.max(1,end-start+1)];
                      int kz=0;
                      for(int i=start;i<=end;i++)kvals[kz++]=stochasticK(i,12);
                      kz=0;
                      for(int i=start;i<=end;i++){
                          float x=right-(end-i)*candleW-candleW/2f;
                          double kv=kvals[kz];
                          double dsum=0; int dn=0;
                          for(int q=Math.max(0,kz-4);q<=kz;q++){dsum+=kvals[q];dn++;}
                          double dv=dn==0?kv:dsum/dn;
                          float ky=(float)(stochBottom-(kv/100.0)*(stochBottom-stochTop));
                          float dy=(float)(stochBottom-(dv/100.0)*(stochBottom-stochTop));
                          if(!sks){sk.moveTo(x,ky);sks=true;}else sk.lineTo(x,ky);
                          if(!sds){sd.moveTo(x,dy);sds=true;}else sd.lineTo(x,dy);
                          kz++;
                      }
                      maPaint.setStrokeWidth(1.35f*den);
                      maPaint.setColor(Color.rgb(244,135,46)); c.drawPath(sk,maPaint);
                      maPaint.setColor(Color.rgb(187,93,219)); c.drawPath(sd,maPaint);
                      p.setColor(Color.rgb(67,88,122)); p.setStrokeWidth(1f);
                      float s80=(float)(stochBottom-.80*(stochBottom-stochTop));
                      float s20=(float)(stochBottom-.20*(stochBottom-stochTop));
                      c.drawLine(left,s80,right,s80,p); c.drawLine(left,s20,right,s20,p);

                      // compact crossover arrows, similar to target MTS.
                      for(int z=2;z<kvals.length;z++){
                          double prevK=kvals[z-1], curK=kvals[z];
                          double prevD=0,curD=0; int pn=0,cn=0;
                          for(int q=Math.max(0,z-5);q<=z-1;q++){prevD+=kvals[q];pn++;}
                          for(int q=Math.max(0,z-4);q<=z;q++){curD+=kvals[q];cn++;}
                          if(pn>0)prevD/=pn; if(cn>0)curD/=cn;
                          int dataIdx=start+z;
                          float x=right-(end-dataIdx)*candleW-candleW/2f;
                          if(prevK<=prevD && curK>curD){
                              textPaint.setColor(Color.rgb(230,76,76));
                              textPaint.setTextSize(8*getResources().getDisplayMetrics().scaledDensity);
                              c.drawText("↑",x-3*den,stochBottom-4*den,textPaint);
                          }else if(prevK>=prevD && curK<curD){
                              textPaint.setColor(Color.rgb(55,132,235));
                              textPaint.setTextSize(8*getResources().getDisplayMetrics().scaledDensity);
                              c.drawText("↓",x-3*den,stochTop+15*den,textPaint);
                          }
                      }

                      // RSI panel
                      float rx=left;
                      textPaint.setColor(Color.rgb(244,135,46));
                      c.drawText("RSI 14",rx,rsiTop+10*den,textPaint);
                      rx+=textPaint.measureText("RSI 14   ");
                      textPaint.setColor(Color.rgb(187,93,219));
                      c.drawText("시그널 9",rx,rsiTop+10*den,textPaint);
                      Path rp=new Path(),sig=new Path(); boolean rs=false,ss=false;
                      double[] rvals=new double[Math.max(1,end-start+1)];
                      int rz=0;
                      for(int i=start;i<=end;i++)rvals[rz++]=rsi(i,14);
                      rz=0;
                      for(int i=start;i<=end;i++){
                          float x=right-(end-i)*candleW-candleW/2f;
                          double rv=rvals[rz];
                          double rsum=0; int rn=0;
                          for(int q=Math.max(0,rz-8);q<=rz;q++){rsum+=rvals[q];rn++;}
                          double sv=rn==0?rv:rsum/rn;
                          float ry=(float)(rsiBottom-(rv/100.0)*(rsiBottom-rsiTop));
                          float sy=(float)(rsiBottom-(sv/100.0)*(rsiBottom-rsiTop));
                          if(!rs){rp.moveTo(x,ry);rs=true;}else rp.lineTo(x,ry);
                          if(!ss){sig.moveTo(x,sy);ss=true;}else sig.lineTo(x,sy);
                          rz++;
                      }
                      maPaint.setColor(Color.rgb(244,135,46)); c.drawPath(rp,maPaint);
                      maPaint.setColor(Color.rgb(187,93,219)); c.drawPath(sig,maPaint);
                      float y70=(float)(rsiBottom-.70*(rsiBottom-rsiTop));
                      float y30=(float)(rsiBottom-.30*(rsiBottom-rsiTop));
                      p.setColor(Color.rgb(67,88,122));
                      c.drawLine(left,y70,right,y70,p); c.drawLine(left,y30,right,y30,p);

                      for(int z=2;z<rvals.length;z++){
                          double prevR=rvals[z-1],curR=rvals[z];
                          double prevS=0,curS=0; int pn=0,cn=0;
                          for(int q=Math.max(0,z-9);q<=z-1;q++){prevS+=rvals[q];pn++;}
                          for(int q=Math.max(0,z-8);q<=z;q++){curS+=rvals[q];cn++;}
                          if(pn>0)prevS/=pn; if(cn>0)curS/=cn;
                          int dataIdx=start+z;
                          float x=right-(end-dataIdx)*candleW-candleW/2f;
                          if(prevR<=prevS && curR>curS){
                              textPaint.setColor(Color.rgb(230,76,76));
                              textPaint.setTextSize(8*getResources().getDisplayMetrics().scaledDensity);
                              c.drawText("↑",x-3*den,rsiBottom-3*den,textPaint);
                          }else if(prevR>=prevS && curR<curS){
                              textPaint.setColor(Color.rgb(55,132,235));
                              textPaint.setTextSize(8*getResources().getDisplayMetrics().scaledDensity);
                              c.drawText("↓",x-3*den,rsiTop+15*den,textPaint);
                          }
                      }

                      // interactive chart tools
                      p.setStrokeWidth(1.2f*den);
                      if(toolMode==1 && crossX>=0 && crossY>=0){
                          p.setColor(Color.argb(190,190,205,230));
                          c.drawLine(crossX,top,crossX,rsiBottom,p);
                          c.drawLine(left,crossY,right,crossY,p);
                      }
                      if(hLineY>=0){
                          p.setColor(Color.rgb(80,200,255));
                          p.setStrokeWidth(1.5f*den);
                          c.drawLine(left,hLineY,right,hLineY,p);
                      }

                      if(drawIndex1>=0 && drawIndex2>=0 &&
                         !Double.isNaN(drawPrice1) && !Double.isNaN(drawPrice2)){
                          float dx1=drawX(drawIndex1),dy1=drawY(drawPrice1);
                          float dx2=drawX(drawIndex2),dy2=drawY(drawPrice2);

                          p.setColor(Color.rgb(255,193,7));
                          p.setStrokeWidth(2f*den);

                          if(toolMode==4 || fibDrawing){
                              float[] levels={0f,0.236f,0.382f,0.5f,0.618f,0.786f,1f};
                              for(float lv:levels){
                                  double pv=drawPrice1+(drawPrice2-drawPrice1)*lv;
                                  float fy=drawY(pv);
                                  c.drawLine(left,fy,right,fy,p);
                                  textPaint.setColor(Color.rgb(255,210,100));
                                  textPaint.setTextSize(9*getResources().getDisplayMetrics().scaledDensity);
                                  c.drawText(String.format(Locale.US,"%.3f  %,.0f",lv,pv),left+4*den,fy-2*den,textPaint);
                              }
                              p.setStyle(Paint.Style.STROKE);
                              p.setColor(Color.argb(170,255,193,7));
                              c.drawLine(dx1,dy1,dx2,dy2,p);
                          }else{
                              c.drawLine(dx1,dy1,dx2,dy2,p);
                          }

                          // Editable handles stay visible in drawing modes.
                          if(toolMode==2 || toolMode==4){
                              p.setStyle(Paint.Style.FILL);
                              p.setColor(Color.WHITE);
                              c.drawCircle(dx1,dy1,5f*den,p);
                              c.drawCircle(dx2,dy2,5f*den,p);
                              p.setColor(Color.rgb(255,193,7));
                              c.drawCircle(dx1,dy1,3f*den,p);
                              c.drawCircle(dx2,dy2,3f*den,p);
                          }
                      }

                      // x-axis date labels under the main price panel.
                      textPaint.setTextSize(8.5f*getResources().getDisplayMetrics().scaledDensity);
                      textPaint.setColor(Color.rgb(188,200,219));
                      int labelCount=4;
                      for(int n=0;n<labelCount;n++){
                          int idx=start+(int)Math.round((end-start)*(n/(double)(labelCount-1)));
                          idx=Math.max(start,Math.min(end,idx));
                          String ds=data.get(idx).date==null?"":data.get(idx).date;
                          if(ds.length()>=8)ds=ds.substring(4,6)+"/"+ds.substring(6,8);
                          float x=right-(end-idx)*candleW-candleW/2f;
                          c.drawText(ds,x-14*den,priceBottom+14*den,textPaint);
                      }

                      // Selected candle: reference MTS-style detailed information panel.
                      if(selectedCandleIndex>=start && selectedCandleIndex<=end){
                          Candle sel=data.get(selectedCandleIndex);
                          float selectedX=right-(end-selectedCandleIndex)*candleW-candleW/2f;

                          // Crosshair guide through every panel.
                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(1f*den);
                          p.setColor(Color.argb(215,125,142,169));
                          c.drawLine(selectedX,top,selectedX,rsiBottom,p);

                          float sy=yPrice(sel.close,min,max,top,priceBottom);
                          c.drawLine(left,sy,right,sy,p);

                          // Marker at selected close.
                          p.setStyle(Paint.Style.FILL);
                          p.setColor(Color.WHITE);
                          c.drawCircle(selectedX,sy,3.0f*den,p);
                          p.setColor(Color.rgb(46,95,165));
                          c.drawCircle(selectedX,sy,1.6f*den,p);

                          double prevClose=
                              selectedCandleIndex>0
                                  ? data.get(selectedCandleIndex-1).close
                                  : sel.open;

                          double openPct=prevClose==0?0:(sel.open-prevClose)/prevClose*100.0;
                          double highPct=prevClose==0?0:(sel.high-prevClose)/prevClose*100.0;
                          double lowPct=prevClose==0?0:(sel.low-prevClose)/prevClose*100.0;
                          double closePct=prevClose==0?0:(sel.close-prevClose)/prevClose*100.0;

                          double ma5v=sma(selectedCandleIndex,5);
                          double ma10v=sma(selectedCandleIndex,10);
                          double ma20v=sma(selectedCandleIndex,20);
                          double ma60v=sma(selectedCandleIndex,60);
                          double ma120v=sma(selectedCandleIndex,120);

                          double h9=highest(selectedCandleIndex,9);
                          double l9=lowest(selectedCandleIndex,9);
                          double h26=highest(selectedCandleIndex,26);
                          double l26=lowest(selectedCandleIndex,26);
                          double conv=
                              (Double.isNaN(h9)||Double.isNaN(l9))
                                  ? Double.NaN:(h9+l9)/2.0;
                          double base=
                              (Double.isNaN(h26)||Double.isNaN(l26))
                                  ? Double.NaN:(h26+l26)/2.0;

                          // Chikou value at selected date requires a future close (+26).
                          double lagging=
                              selectedCandleIndex+26<data.size()
                                  ? data.get(selectedCandleIndex+26).close
                                  : Double.NaN;

                          // Senkou spans actually displayed at selected date were calculated 26 bars earlier.
                          int cloudSrc=selectedCandleIndex-26;
                          double span1=Double.NaN,span2=Double.NaN;
                          if(cloudSrc>=0){
                              double ch9=highest(cloudSrc,9),cl9=lowest(cloudSrc,9);
                              double ch26=highest(cloudSrc,26),cl26=lowest(cloudSrc,26);
                              double ch52=highest(cloudSrc,52),cl52=lowest(cloudSrc,52);
                              if(!Double.isNaN(ch9)&&!Double.isNaN(cl9)&&
                                 !Double.isNaN(ch26)&&!Double.isNaN(cl26)){
                                  double cc=(ch9+cl9)/2.0;
                                  double cb=(ch26+cl26)/2.0;
                                  span1=(cc+cb)/2.0;
                              }
                              if(!Double.isNaN(ch52)&&!Double.isNaN(cl52)){
                                  span2=(ch52+cl52)/2.0;
                              }
                          }

                          // Candle has no native turnover field in the current model,
                          // so this is a close*volume approximation.
                          double approxAmount=sel.close*Math.max(0,sel.volume);

                          // Panel positioning: keep it beside the selected candle when possible.
                          float panelW=Math.min(315*den,(right-left)*0.47f);
                          float panelH=Math.min(318*den,getHeight()*0.69f);
                          float panelLeft=
                              selectedX+panelW+18*den<right
                                  ? selectedX+10*den
                                  : Math.max(left+5*den,selectedX-panelW-10*den);
                          float panelTop=top+5*den;
                          float panelRight=panelLeft+panelW;
                          float panelBottom=panelTop+panelH;

                          // White/very-light popup like the supplied reference screenshot.
                          p.setStyle(Paint.Style.FILL);
                          p.setColor(Color.argb(247,248,249,250));
                          c.drawRoundRect(panelLeft,panelTop,panelRight,panelBottom,4*den,4*den,p);

                          p.setStyle(Paint.Style.STROKE);
                          p.setStrokeWidth(1f*den);
                          p.setColor(Color.rgb(180,187,199));
                          c.drawRoundRect(panelLeft,panelTop,panelRight,panelBottom,4*den,4*den,p);
                          p.setStyle(Paint.Style.FILL);

                          float x1=panelLeft+8*den;
                          float x2=panelLeft+78*den;
                          float y=panelTop+16*den;
                          float lineH=18*den;

                          textPaint.setTypeface(Typeface.DEFAULT_BOLD);
                          textPaint.setTextSize(9.8f*getResources().getDisplayMetrics().scaledDensity);
                          textPaint.setColor(Color.rgb(28,31,38));
                          c.drawText(candleDateLabel(sel.date),x1,y,textPaint);

                          textPaint.setTextSize(8.8f*getResources().getDisplayMetrics().scaledDensity);

                          // row helper is expanded manually because Android Canvas has no table widget.
                          y+=lineH;
                          textPaint.setColor(Color.rgb(34,37,44)); c.drawText("시가",x1,y,textPaint);
                          textPaint.setColor(openPct>=0?Color.rgb(218,55,62):Color.rgb(38,100,205));
                          c.drawText(fmtValue0(sel.open)+String.format(Locale.KOREA," (%+.2f%%)",openPct),x2,y,textPaint);

                          y+=lineH;
                          textPaint.setColor(Color.rgb(34,37,44)); c.drawText("고가",x1,y,textPaint);
                          textPaint.setColor(Color.rgb(218,55,62));
                          c.drawText(fmtValue0(sel.high)+String.format(Locale.KOREA," (%+.2f%%)",highPct),x2,y,textPaint);

                          y+=lineH;
                          textPaint.setColor(Color.rgb(34,37,44)); c.drawText("저가",x1,y,textPaint);
                          textPaint.setColor(Color.rgb(38,100,205));
                          c.drawText(fmtValue0(sel.low)+String.format(Locale.KOREA," (%+.2f%%)",lowPct),x2,y,textPaint);

                          y+=lineH;
                          textPaint.setColor(Color.rgb(34,37,44)); c.drawText("종가",x1,y,textPaint);
                          textPaint.setColor(closePct>=0?Color.rgb(218,55,62):Color.rgb(38,100,205));
                          c.drawText(fmtValue0(sel.close)+String.format(Locale.KOREA," (%+.2f%%)",closePct),x2,y,textPaint);

                          y+=lineH;
                          textPaint.setColor(Color.rgb(34,37,44)); c.drawText("거래량",x1,y,textPaint);
                          textPaint.setColor(Color.rgb(50,55,65));
                          c.drawText(String.format(Locale.KOREA,"%,.0f",sel.volume),x2,y,textPaint);

                          y+=lineH;
                          textPaint.setColor(Color.rgb(34,37,44)); c.drawText("거래대금",x1,y,textPaint);
                          textPaint.setColor(Color.rgb(50,55,65));
                          c.drawText(compactAmount(approxAmount)+" (추정)",x2,y,textPaint);

                          y+=lineH;
                          textPaint.setColor(Color.rgb(34,37,44)); c.drawText("가격 이동평균",x1,y,textPaint);

                          textPaint.setTypeface(Typeface.DEFAULT);
                          y+=lineH;
                          textPaint.setColor(Color.rgb(255,178,34)); c.drawText("5",x1+8*den,y,textPaint);
                          textPaint.setColor(Color.rgb(50,55,65)); c.drawText(fmtValue(ma5v)+pctFromClose(ma5v,sel.close),x2,y,textPaint);

                          y+=lineH;
                          textPaint.setColor(Color.rgb(31,184,214)); c.drawText("10",x1+8*den,y,textPaint);
                          textPaint.setColor(Color.rgb(50,55,65)); c.drawText(fmtValue(ma10v)+pctFromClose(ma10v,sel.close),x2,y,textPaint);

                          y+=lineH;
                          textPaint.setColor(Color.rgb(45,178,104)); c.drawText("20",x1+8*den,y,textPaint);
                          textPaint.setColor(Color.rgb(50,55,65)); c.drawText(fmtValue(ma20v)+pctFromClose(ma20v,sel.close),x2,y,textPaint);

                          y+=lineH;
                          textPaint.setColor(Color.rgb(139,89,210)); c.drawText("60",x1+8*den,y,textPaint);
                          textPaint.setColor(Color.rgb(50,55,65)); c.drawText(fmtValue(ma60v)+pctFromClose(ma60v,sel.close),x2,y,textPaint);

                          y+=lineH;
                          textPaint.setColor(Color.rgb(110,118,133)); c.drawText("120",x1+8*den,y,textPaint);
                          textPaint.setColor(Color.rgb(50,55,65)); c.drawText(fmtValue(ma120v)+pctFromClose(ma120v,sel.close),x2,y,textPaint);

                          y+=lineH;
                          textPaint.setTypeface(Typeface.DEFAULT_BOLD);
                          textPaint.setColor(Color.rgb(34,37,44)); c.drawText("일목균형표",x1,y,textPaint);
                          textPaint.setTypeface(Typeface.DEFAULT);

                          y+=lineH;
                          textPaint.setColor(Color.rgb(226,55,92)); c.drawText("전환선",x1+8*den,y,textPaint);
                          textPaint.setColor(Color.rgb(50,55,65)); c.drawText(fmtValue(conv)+pctFromClose(conv,sel.close),x2,y,textPaint);

                          y+=lineH;
                          textPaint.setColor(Color.rgb(38,137,207)); c.drawText("기준선",x1+8*den,y,textPaint);
                          textPaint.setColor(Color.rgb(50,55,65)); c.drawText(fmtValue(base)+pctFromClose(base,sel.close),x2,y,textPaint);

                          y+=lineH;
                          textPaint.setColor(Color.rgb(170,68,191)); c.drawText("후행스팬",x1+8*den,y,textPaint);
                          textPaint.setColor(Color.rgb(50,55,65)); c.drawText(fmtValue(lagging)+pctFromClose(lagging,sel.close),x2,y,textPaint);

                          y+=lineH;
                          textPaint.setColor(Color.rgb(218,125,35)); c.drawText("선행스팬1",x1+8*den,y,textPaint);
                          textPaint.setColor(Color.rgb(50,55,65)); c.drawText(fmtValue(span1)+pctFromClose(span1,sel.close),x2,y,textPaint);

                          y+=lineH;
                          textPaint.setColor(Color.rgb(46,110,205)); c.drawText("선행스팬2",x1+8*den,y,textPaint);
                          textPaint.setColor(Color.rgb(50,55,65)); c.drawText(fmtValue(span2)+pctFromClose(span2,sel.close),x2,y,textPaint);

                          textPaint.setTypeface(Typeface.DEFAULT);
                      }

                      // last price tag, flash effect
                      Candle last=data.get(end);
                      float lastY=yPrice(last.close,min,max,top,priceBottom);
                      int lastCol=last.close>=last.open?upColor:downColor;
                      p.setColor(lastCol);
                      if(flashFrames>0){
                          p.setAlpha((flashFrames%2==0)?120:255);
                          flashFrames--;
                          postInvalidateDelayed(90);
                      }
                      c.drawRect(right,lastY-15*den,getWidth(),lastY+15*den,p);
                      p.setAlpha(255);
                      textPaint.setColor(Color.WHITE);
                      textPaint.setTypeface(Typeface.DEFAULT_BOLD);
                      textPaint.setTextSize(10.5f*getResources().getDisplayMetrics().scaledDensity);
                      c.drawText(String.format(Locale.KOREA,"%,.0f",last.close),right+5*den,lastY-1*den,textPaint);

                      double prevClose=(end>0)?data.get(end-1).close:last.close;
                      double pct=prevClose==0?0:(last.close-prevClose)/prevClose*100.0;
                      textPaint.setTextSize(8.2f*getResources().getDisplayMetrics().scaledDensity);
                      c.drawText(String.format(Locale.KOREA,"%+.2f%%",pct),right+5*den,lastY+11*den,textPaint);
                      textPaint.setTypeface(Typeface.DEFAULT);
                  }
