                  int candleIndexAt(float x){
                      if(data.isEmpty() || getWidth()<=0)return -1;
                      final float den=getResources().getDisplayMetrics().density;
                      float left=8*den;
                      float right=getWidth()-62*den;
                      if(x<left || x>right)return -1;

                      int visible=Math.max(12,(int)((right-left)/candleW));
                      int shift=(int)(panX/candleW);
                      int end=Math.min(data.size()-1,data.size()-1-shift);
                      if(end<0)return -1;
                      int start=Math.max(0,end-visible+1);

                      int idx=end-Math.round((right-x-candleW/2f)/candleW);
                      return Math.max(start,Math.min(end,idx));
                  }

                  String candleDateLabel(String raw){
                      if(raw==null)return "";
                      String d=raw.trim();

                      if(d.length()==8 && d.matches("\\d{8}")){
                          return d.substring(0,4)+"."+d.substring(4,6)+"."+d.substring(6,8);
                      }
                      if(d.length()>=12 && d.substring(0,8).matches("\\d{8}")){
                          String base=d.substring(0,4)+"."+d.substring(4,6)+"."+d.substring(6,8);
                          String hm=d.substring(8);
                          if(hm.length()>=4)base+=" "+hm.substring(0,2)+":"+hm.substring(2,4);
                          return base;
                      }
                      return d;
                  }

