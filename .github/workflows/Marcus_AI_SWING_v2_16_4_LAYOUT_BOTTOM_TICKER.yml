                  void updateRealtimeTick(double price,double cumulativeVolume){
                      if(price<=0)return;

                      String minute=new SimpleDateFormat("HHmm",Locale.US).format(new Date());
                      double delta=0;
                      if(cumulativeVolume>=0 && lastCumVolume>=0){
                          delta=Math.max(0,cumulativeVolume-lastCumVolume);
                      }
                      if(cumulativeVolume>=0)lastCumVolume=cumulativeVolume;

                      if(data.isEmpty()){
                          data.add(new Candle(minute,price,price,price,price,delta));
                          lastLiveMinute=minute;
                      }else{
                          Candle q=data.get(data.size()-1);

                          boolean minuteSeries=
                              period!=null && (period.contains("분") || period.contains("1분"));

                          if(minuteSeries && !minute.equals(lastLiveMinute) && !lastLiveMinute.isEmpty()){
                              data.add(new Candle(minute,price,price,price,price,delta));
                          }else{
                              q.close=price;
                              q.high=Math.max(q.high,price);
                              q.low=Math.min(q.low,price);
                              if(delta>0)q.volume+=delta;
                          }
                          lastLiveMinute=minute;
                      }

                      flashFrames=5;
                      invalidate();
                  }

                  double stddev(int idx,int len,double mean){
                      if(idx<len-1)return Double.NaN;
                      double sum=0;
                      for(int i=idx-len+1;i<=idx;i++){
                          double d=data.get(i).close-mean;
                          sum+=d*d;
                      }
                      return Math.sqrt(sum/len);
                  }

                  double highest(int idx,int len){
                      if(idx<len-1)return Double.NaN;
                      double hi=-Double.MAX_VALUE;
                      for(int i=idx-len+1;i<=idx;i++)hi=Math.max(hi,data.get(i).high);
                      return hi;
                  }

                  double lowest(int idx,int len){
                      if(idx<len-1)return Double.NaN;
                      double lo=Double.MAX_VALUE;
                      for(int i=idx-len+1;i<=idx;i++)lo=Math.min(lo,data.get(i).low);
                      return lo;
                  }

                  double momentum(int idx,int len){
                      if(idx<len)return 0;
                      return data.get(idx).close-data.get(idx-len).close;
                  }

                  double moneyFlowIndex(int idx,int len){
                      if(idx<len)return 50;
                      double pos=0,neg=0;
                      for(int i=idx-len+1;i<=idx;i++){
                          double tp=(data.get(i).high+data.get(i).low+data.get(i).close)/3.0;
                          double prev=(data.get(i-1).high+data.get(i-1).low+data.get(i-1).close)/3.0;
                          double mf=tp*Math.max(1,data.get(i).volume);
                          if(tp>=prev)pos+=mf; else neg+=mf;
                      }
                      if(neg<=0)return 100;
                      double r=pos/neg;
                      return 100.0-(100.0/(1.0+r));
                  }

                  double adxApprox(int idx,int len){
                      if(idx<len+1)return 20;
                      double trend=Math.abs(data.get(idx).close-data.get(idx-len).close);
                      double range=0;
                      for(int i=idx-len+1;i<=idx;i++)range+=Math.max(0.0001,data.get(i).high-data.get(i).low);
                      return Math.max(0,Math.min(100,trend/range*100.0*len));
                  }

                  double stochasticK(int idx,int len){
                      if(idx<len-1)return 50;
                      double hi=-Double.MAX_VALUE,lo=Double.MAX_VALUE;
                      for(int i=idx-len+1;i<=idx;i++){
                          hi=Math.max(hi,data.get(i).high);
                          lo=Math.min(lo,data.get(i).low);
                      }
                      if(hi<=lo)return 50;
                      return (data.get(idx).close-lo)/(hi-lo)*100.0;
                  }

                  double emaAt(int idx,int len){
                      if(idx<0||data.isEmpty())return 0;
                      double a=2.0/(len+1.0);
                      double e=data.get(0).close;
                      for(int i=1;i<=idx;i++) e=a*data.get(i).close+(1-a)*e;
                      return e;
                  }

                  int touchIndex(float x){
                      if(data.isEmpty() || currentRight<=currentLeft)return -1;
                      int idx=currentEnd-Math.round((currentRight-x-candleW/2f)/candleW);
                      return Math.max(currentStart,Math.min(currentEnd,idx));
                  }

                  double touchPrice(float y){
                      if(currentPriceBottom<=currentTop || currentMax<=currentMin)return Double.NaN;
                      double ratio=(currentPriceBottom-y)/(double)(currentPriceBottom-currentTop);
                      ratio=Math.max(0,Math.min(1,ratio));
                      return currentMin+(currentMax-currentMin)*ratio;
                  }

                  float drawX(int idx){
                      return currentRight-(currentEnd-idx)*candleW-candleW/2f;
                  }

                  float drawY(double price){
                      return yPrice(price,currentMin,currentMax,currentTop,currentPriceBottom);
                  }

                  boolean near(float x,float y,float tx,float ty,float radius){
                      float dx=x-tx,dy=y-ty;
                      return dx*dx+dy*dy<=radius*radius;
                  }

                  float distanceToSegment(float px,float py,float x1,float y1,float x2,float y2){
                      float dx=x2-x1,dy=y2-y1;
                      if(dx==0 && dy==0)return (float)Math.hypot(px-x1,py-y1);
                      float t=((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy);
                      t=Math.max(0,Math.min(1,t));
                      float qx=x1+t*dx,qy=y1+t*dy;
                      return (float)Math.hypot(px-qx,py-qy);
                  }

