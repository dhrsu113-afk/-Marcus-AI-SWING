                              );
                          });
                      }
                  }).start();
              }

              boolean isChoseongChar(char c){
                  return (c>='\u3131' && c<='\u314E');
              }

              boolean isChoseongQuery(String raw){
                  if(raw==null)return false;
                  String q=raw.replaceAll("\\s+","");
                  if(q.isEmpty())return false;
                  for(int i=0;i<q.length();i++){
                      if(!isChoseongChar(q.charAt(i)))return false;
                  }
                  return true;
              }

              String hangulChoseong(String text){
                  final char[] CHO={
                      'ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ',
                      'ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'
                  };
                  StringBuilder sb=new StringBuilder();
                  if(text==null)return "";
                  for(int i=0;i<text.length();i++){
                      char c=text.charAt(i);
                      if(c>='\uAC00' && c<='\uD7A3'){
                          int idx=(c-'가')/(21*28);
                          if(idx>=0 && idx<CHO.length)sb.append(CHO[idx]);
                      }else if(isChoseongChar(c)){
                          sb.append(c);
                      }else if(Character.isLetterOrDigit(c)){
                          sb.append(Character.toLowerCase(c));
                      }
                  }
                  return sb.toString();
              }

              boolean looksLikeEtfName(String name){
                  if(name==null)return false;
                  String n=name.trim().toUpperCase(Locale.KOREA);
                  String[] brands={
                      "KODEX","TIGER","RISE","ACE","SOL ","PLUS ","HANARO",
                      "KOSEF","ARIRANG","TIMEFOLIO","WOORI","1Q ","FOCUS"
                  };
                  for(String b:brands)if(n.startsWith(b))return true;
                  return false;
              }

              String displayMarketLabel(MasterStock m){
                  if(m==null)return "";
                  String market=m.market==null?"":m.market.trim();
                  if(looksLikeEtfName(m.name))return "ETF · "+market;
                  return market;
              }

              boolean stockMatches(MasterStock m,String raw){
                  if(m==null||raw==null)return false;
                  String q=raw.trim();
                  if(q.isEmpty())return false;

                  String qCompact=q.replaceAll("\\s+","");
                  String nameCompact=m.name.replaceAll("\\s+","");

                  if(m.code.contains(qCompact))return true;
                  if(nameCompact.toLowerCase(Locale.KOREA)
                      .contains(qCompact.toLowerCase(Locale.KOREA)))return true;

                  if(isChoseongQuery(qCompact)){
                      String cho=hangulChoseong(nameCompact);
                      return cho.startsWith(qCompact) || cho.contains(qCompact);
                  }

                  // Mixed Hangul / abbreviation tolerance.
                  String normalizedName=nameCompact.toLowerCase(Locale.KOREA);
                  String normalizedQ=qCompact.toLowerCase(Locale.KOREA);
                  int pos=0;
                  for(int i=0;i<normalizedName.length() && pos<normalizedQ.length();i++){
                      if(normalizedName.charAt(i)==normalizedQ.charAt(pos))pos++;
                  }
                  return pos==normalizedQ.length();
              }

              String resolveStockCode(String raw){
                  String q=raw==null?"":raw.trim();
                  if(q.matches("\\d{6}"))return q;
                  if(q.isEmpty())return null;

                  MasterStock exact=null;
                  MasterStock best=null;
                  int bestScore=Integer.MIN_VALUE;

                  String qc=q.replaceAll("\s+","");
                  boolean choQ=isChoseongQuery(qc);

                  for(MasterStock m:masterStocks){
                      String nc=m.name.replaceAll("\s+","");
                      if(nc.equalsIgnoreCase(qc)){
                          exact=m;
                          break;
                      }
                      if(!stockMatches(m,qc))continue;

                      int score=0;
                      if(m.code.startsWith(qc))score+=1000;
                      if(nc.toLowerCase(Locale.KOREA).startsWith(qc.toLowerCase(Locale.KOREA)))score+=900;
                      if(nc.toLowerCase(Locale.KOREA).contains(qc.toLowerCase(Locale.KOREA)))score+=700;

                      if(choQ){
                          String cho=hangulChoseong(nc);
                          if(cho.equals(qc))score+=1200;
                          else if(cho.startsWith(qc))score+=1050;
                          else if(cho.contains(qc))score+=800;
                      }

                      score-=Math.max(0,nc.length()-qc.length());

                      if(best==null || score>bestScore){
                          best=m;
                          bestScore=score;
                      }
                  }

                  if(exact!=null)return exact.code;
                  return best==null?null:best.code;
              }

              String displayName(String raw,String code){
                  for(MasterStock m:masterStocks){
                      if(m.code.equals(code))return m.name;
                  }
                  return raw.matches("\\d{6}")?code:raw;
              }

              List<MasterStock> findMasterMatches(String raw,int limit){
                  List<MasterStock> matches=new ArrayList<>();
                  String q=raw==null?"":raw.trim();
                  if(q.isEmpty())return matches;

                  final String qc=q.replaceAll("\s+","");
                  final boolean choQ=isChoseongQuery(qc);

                  for(MasterStock m:masterStocks){
                      if(stockMatches(m,qc))matches.add(m);
                  }

                  Collections.sort(matches,(a,b)->{
                      String an=a.name.replaceAll("\s+","");
                      String bn=b.name.replaceAll("\s+","");

                      int as=0,bs=0;
                      if(an.equalsIgnoreCase(qc))as+=2000;
                      if(bn.equalsIgnoreCase(qc))bs+=2000;
                      if(an.toLowerCase(Locale.KOREA).startsWith(qc.toLowerCase(Locale.KOREA)))as+=900;
                      if(bn.toLowerCase(Locale.KOREA).startsWith(qc.toLowerCase(Locale.KOREA)))bs+=900;

                      if(choQ){
                          String ac=hangulChoseong(an),bc=hangulChoseong(bn);
                          if(ac.equals(qc))as+=1500;
                          if(bc.equals(qc))bs+=1500;
                          if(ac.startsWith(qc))as+=1100;
                          if(bc.startsWith(qc))bs+=1100;
                      }

                      as-=an.length();
                      bs-=bn.length();
                      if(as!=bs)return Integer.compare(bs,as);
                      return an.compareTo(bn);
                  });

                  if(matches.size()>limit){
                      return new ArrayList<>(matches.subList(0,limit));
                  }
                  return matches;
              }

              void sendChartData(
                  WebView web,
                  List<Candle> candles,
                  String name,
                  String code,
                  String period
              ){
                  try{
                      org.json.JSONObject payload=new org.json.JSONObject();
                      payload.put("name",name);
                      payload.put("code",code);
                      payload.put("period",period);

                      org.json.JSONArray arr=new org.json.JSONArray();
                      org.json.JSONArray ma5=new org.json.JSONArray();
                      org.json.JSONArray ma10=new org.json.JSONArray();
                      org.json.JSONArray ma15=new org.json.JSONArray();
                      org.json.JSONArray ma20=new org.json.JSONArray();
                      org.json.JSONArray volume=new org.json.JSONArray();

                      SimpleDateFormat intradayParser=
                          new SimpleDateFormat("yyyyMMddHHmmss",Locale.KOREA);

                      for(int i=0;i<candles.size();i++){
                          Candle c=candles.get(i);
                          Object timeValue;
                          String label;

                          if(c.date.length()==8){
                              timeValue=
                                  c.date.substring(0,4)+"-"+
                                  c.date.substring(4,6)+"-"+
                                  c.date.substring(6,8);
                              label=(String)timeValue;
                          }else{
                              Date d=intradayParser.parse(c.date);
                              timeValue=d.getTime()/1000L;
                              label=
                                  c.date.substring(4,6)+"/"+
                                  c.date.substring(6,8)+" "+
                                  c.date.substring(8,10)+":"+
                                  c.date.substring(10,12);
                          }

                          org.json.JSONObject o=new org.json.JSONObject();
                          o.put("time",timeValue);
                          o.put("label",label);
                          o.put("open",c.open);
                          o.put("high",c.high);
                          o.put("low",c.low);
                          o.put("close",c.close);
                          o.put("volume",c.volume);
                          arr.put(o);

                          org.json.JSONObject vo=new org.json.JSONObject();
                          vo.put("time",timeValue);
                          vo.put("value",c.volume);
                          vo.put(
                              "color",
                              c.close>=c.open
                                  ? "rgba(255,105,127,0.48)"
