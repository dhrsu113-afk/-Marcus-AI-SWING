              List<String> getFavoriteCodes(){
                  List<String> out=new ArrayList<>();
                  String raw=prefs.getString(FAVORITES,"");
                  if(raw.trim().isEmpty())return out;
                  for(String s:raw.split(",")){
                      String c=s.trim();
                      if(c.matches("\\d{6}")&&!out.contains(c))out.add(c);
                  }
                  return out;
              }

              void saveFavoriteCodes(List<String> codes){
                  StringBuilder sb=new StringBuilder();
                  for(String c:codes){
                      if(sb.length()>0)sb.append(",");
                      sb.append(c);
                  }
                  prefs.edit().putString(FAVORITES,sb.toString()).apply();
              }

              void addFavoriteCode(String code){
                  List<String> codes=getFavoriteCodes();
                  if(!codes.contains(code)){
                      codes.add(code);
                      saveFavoriteCodes(codes);
                  }
              }

              void addLiveCode(String code){
                  List<String> codes=getLiveCodes();

                  if(codes.contains(code))return;

                  codes.add(code);
                  saveLiveCodes(codes);
              }

              List<String> getLiveCodes(){
                  List<String> out=new ArrayList<>();
                  String raw=prefs.getString(LIVE_CODES,"");

                  if(raw.trim().isEmpty())return out;

                  for(String s:raw.split(",")){
                      String c=s.trim();
                      if(c.matches("\\d{6}"))out.add(c);
                  }

                  return out;
              }

              void saveLiveCodes(List<String> codes){
                  StringBuilder sb=new StringBuilder();

                  for(String c:codes){
                      if(sb.length()>0)sb.append(",");
                      sb.append(c);
                  }

                  prefs.edit().putString(LIVE_CODES,sb.toString()).apply();
              }

