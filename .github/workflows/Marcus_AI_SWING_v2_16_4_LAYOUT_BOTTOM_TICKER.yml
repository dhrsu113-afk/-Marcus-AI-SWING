name: Marcus AI SWING v2.16.4 Layout Bottom Ticker
# IMPORTANT:
# Android preserves Key/Secret and other app data across updates only when
# applicationId AND APK signing certificate remain the same.
# GitHub-hosted runners may create a fresh debug.keystore, so permanent
# update installs require a stable signing key in the next signing setup step.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/marcus/aiswing
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js -o app/src/main/assets/lightweight-charts.js

          python3 - <<'PY'
          import csv, io, os, urllib.request, zipfile

          sources = [
              ("KOSPI", "https://new.real.download.dws.co.kr/common/master/kospi_code.mst.zip", "kospi_code.mst", 228),
              ("KOSDAQ", "https://new.real.download.dws.co.kr/common/master/kosdaq_code.mst.zip", "kosdaq_code.mst", 222),
          ]

          rows = []
          seen = set()

          for market, url, mst_name, tail_len in sources:
              print("download", market, url)
              data = urllib.request.urlopen(url, timeout=30).read()

              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  raw = z.read(mst_name)

              text = raw.decode("cp949", errors="ignore")

              for line in text.splitlines():
                  if len(line) <= tail_len:
                      continue

                  head = line[:-tail_len]
                  short_code = head[0:9].strip()
                  std_code = head[9:21].strip()
                  name = head[21:].strip()

                  # KIS master short code is normally 6 digits; normalize safely.
                  digits = "".join(ch for ch in short_code if ch.isdigit())
                  code = digits[-6:] if len(digits) >= 6 else short_code[-6:]

                  if len(code) != 6 or not code.isdigit() or not name:
                      continue

                  key = (code, market)
                  if key in seen:
                      continue
                  seen.add(key)
                  rows.append((code, name, market, std_code))

          rows.sort(key=lambda x: (x[1], x[0]))

          out = "app/src/main/assets/stocks.csv"
          with open(out, "w", encoding="utf-8", newline="") as f:
              w = csv.writer(f)
              w.writerow(["code","name","market","std_code"])
              w.writerows(rows)

          print("master rows:", len(rows))
          PY

          cat > app/src/main/assets/chart.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
            <style>
              html,body{margin:0;padding:0;background:#0c1830;color:#f4f7ff;font-family:Arial,sans-serif;height:100%;overflow:hidden}
              #wrap{height:100%;display:flex;flex-direction:column}
              #toolbar{display:flex;gap:5px;padding:6px;align-items:center;font-size:11px;color:#9aabc7;flex-wrap:wrap}
              #toolbar button{background:#20385f;color:#f5f7ff;border:1px solid #46679e;border-radius:7px;padding:5px 8px}
              #toolbar button.active{background:linear-gradient(90deg,#426ff4,#8b5cf6)}
              #status{margin-left:auto}
              #chart{flex:1;min-height:280px}
              #tip{position:absolute;left:8px;top:72px;z-index:10;background:rgba(8,16,30,.90);padding:7px 9px;border-radius:8px;font-size:11px;pointer-events:none;max-width:92%}
            </style>
          </head>
          <body>
          <div id="wrap">
            <div id="toolbar">
              <button id="trend">추세선</button>
              <button id="horizontal">수평선</button>
              <button id="lineColor">선색상</button>
              <button id="clear">그리기 삭제</button>
              <span>핀치확대 · 좌우이동 · 십자선</span>
              <span id="status">차트 준비중...</span>
            </div>
            <div id="chart" style="position:relative">
              <svg id="drawOverlay" style="position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none"></svg>
            </div>
          </div>
          <div id="tip">봉을 터치하면 시가/고가/저가/종가/거래량을 확인할 수 있습니다.</div>
          <script src="lightweight-charts.js"></script>
          <script>
            window.addEventListener('error',e=>{
              const s=document.getElementById('status');
              if(s)s.textContent='차트 오류: '+(e.message||'unknown');
            });
            const container=document.getElementById('chart');
            const tip=document.getElementById('tip');
            const status=document.getElementById('status');

            const chart=LightweightCharts.createChart(container,{
              layout:{background:{type:'solid',color:'#0c1830'},textColor:'#dce6fa'},
              grid:{vertLines:{color:'#1e3154'},horzLines:{color:'#1e3154'}},
              rightPriceScale:{borderColor:'#2a3956'},
              timeScale:{borderColor:'#2a3956',timeVisible:true,secondsVisible:false},
              crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
              handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false},
              handleScale:{axisPressedMouseMove:true,mouseWheel:true,pinch:true}
            });

            const candleSeries=chart.addSeries(LightweightCharts.CandlestickSeries,{
              upColor:'#ef5350',downColor:'#3b82f6',
              borderUpColor:'#ef5350',borderDownColor:'#3b82f6',
              wickUpColor:'#ef5350',wickDownColor:'#3b82f6'
            });
            const ma5=chart.addSeries(LightweightCharts.LineSeries,{lineWidth:2,color:'#ffd54f'});
            const ma10=chart.addSeries(LightweightCharts.LineSeries,{lineWidth:2,color:'#4dd0e1'});
            const ma15=chart.addSeries(LightweightCharts.LineSeries,{lineWidth:2,color:'#b388ff'});
            const ma20=chart.addSeries(LightweightCharts.LineSeries,{lineWidth:2,color:'#69f0ae'});
            const volumeSeries=chart.addSeries(LightweightCharts.HistogramSeries,{
              priceScaleId:'',
              priceFormat:{type:'volume'}
            });
            volumeSeries.priceScale().applyOptions({
              scaleMargins:{top:0.78,bottom:0}
            });
            candleSeries.priceScale().applyOptions({
              scaleMargins:{top:0.05,bottom:0.23}
            });
            const markerApi=(typeof LightweightCharts.createSeriesMarkers==='function')
              ? LightweightCharts.createSeriesMarkers(candleSeries,[])
              : null;

            let byTime={};
            let drawMode=null;
            let firstPoint=null;
            let lineDrawings=[];
            let priceDrawings=[];
            const drawColors=['#ffd54f','#4dd0e1','#b388ff','#ff718f','#69f0ae','#ffffff'];
            let drawColorIndex=0;
            let drawColor=drawColors[0];

            const trendBtn=document.getElementById('trend');
            const horizontalBtn=document.getElementById('horizontal');

            function setMode(mode){
              drawMode=mode;
              firstPoint=null;
              trendBtn.classList.toggle('active',mode==='trend');
              horizontalBtn.classList.toggle('active',mode==='horizontal');
              tip.textContent=mode==='trend'
                ? '추세선: 시작점과 끝점을 차례로 터치하세요.'
                : mode==='horizontal'
                ? '수평선: 원하는 가격 위치를 터치하세요.'
                : '봉을 터치하면 시가/고가/저가/종가/거래량을 확인할 수 있습니다.';
            }

            trendBtn.addEventListener('click',()=>setMode(drawMode==='trend'?null:'trend'));
            document.getElementById('lineColor').addEventListener('click',()=>{
              drawColorIndex=(drawColorIndex+1)%drawColors.length;
              drawColor=drawColors[drawColorIndex];
              document.getElementById('lineColor').style.borderColor=drawColor;
              tip.textContent='그리기 색상 변경됨';
            });
            horizontalBtn.addEventListener('click',()=>setMode(drawMode==='horizontal'?null:'horizontal'));
            document.getElementById('clear').addEventListener('click',()=>{
              lineDrawings=[];
              document.getElementById('drawOverlay').innerHTML='';
              priceDrawings.forEach(p=>candleSeries.removePriceLine(p));
              priceDrawings=[];
              setMode(null);
            });

            window.setStockData=function(payload){
              const d=payload.candles||[];
              byTime={};
              d.forEach(x=>byTime[String(x.time)]=x);
              candleSeries.setData(d);
              ma5.setData(payload.ma5||[]);
              ma10.setData(payload.ma10||[]);
              ma15.setData(payload.ma15||[]);
              ma20.setData(payload.ma20||[]);
              volumeSeries.setData(payload.volume||[]);
              const cfg=payload.config||{};
              ma5.applyOptions({visible:cfg.showMA5!==false});
              ma10.applyOptions({visible:cfg.showMA10!==false});
              ma15.applyOptions({visible:cfg.showMA15!==false});
              ma20.applyOptions({visible:cfg.showMA20!==false});
              volumeSeries.applyOptions({visible:cfg.showVolume!==false});

              const markers=[];
              const last=d.length?d[d.length-1]:null;
              if(last && payload.signal){
                if(cfg.showBOS && payload.signal.bos){
                  markers.push({time:last.time,position:'belowBar',shape:'arrowUp',color:'#52e0aa',text:'BOS'});
                }
                if(cfg.showDiscount && payload.signal.discount){
                  markers.push({time:last.time,position:'belowBar',shape:'circle',color:'#ffd45c',text:'Discount'});
                }
                if(cfg.showExplosion && payload.signal.explosion){
                  markers.push({time:last.time,position:'aboveBar',shape:'arrowDown',color:'#ff718f',text:'Explosion'});
                }
              }
              if(markerApi){ markerApi.setMarkers(markers); }

              chart.timeScale().fitContent();
              let tags=[];
              if(cfg.showBOS && payload.signal && payload.signal.bos) tags.push('BOS');
              if(cfg.showDiscount && payload.signal && payload.signal.discount) tags.push('Discount');
              if(cfg.showExplosion && payload.signal && payload.signal.explosion) tags.push('Explosion');
              if(cfg.showRSI && payload.signal && payload.signal.rsi!==undefined) tags.push('RSI '+Number(payload.signal.rsi).toFixed(1));
              status.textContent=(payload.period||'')+' '+(payload.name||'')+' '+(payload.code||'')+(tags.length?' · '+tags.join(' · '):'');
            };

            chart.subscribeCrosshairMove(param=>{
              if(!param || param.time===undefined || param.time===null)return;
              const d=byTime[String(param.time)];
              if(!d)return;
              tip.textContent=
                (d.label||d.time)+'  시 '+Number(d.open).toLocaleString()+'원  고 '+Number(d.high).toLocaleString()+
                '원  저 '+Number(d.low).toLocaleString()+'원  종 '+Number(d.close).toLocaleString()+
                '원  거래량 '+Number(d.volume||0).toLocaleString()+'주';
            });

            chart.subscribeClick(param=>{
              if(!drawMode || !param || !param.point || param.time===undefined || param.time===null)return;
              const price=candleSeries.coordinateToPrice(param.point.y);
              if(price===null || price===undefined)return;

              if(drawMode==='horizontal'){
                const pl=candleSeries.createPriceLine({
                  price:price,lineWidth:2,lineStyle:0,color:drawColor,axisLabelVisible:true,title:'수평'
                });
                priceDrawings.push(pl);
                setMode(null);
                return;
              }

              const pt={time:param.time,value:price};
              if(!firstPoint){
                firstPoint=pt;
                tip.textContent='추세선: 끝점을 터치하세요.';
                return;
              }

              const points=[firstPoint,pt].sort((a,b)=>{
                if(typeof a.time==='number' && typeof b.time==='number')return a.time-b.time;
                return String(a.time).localeCompare(String(b.time));
              });

              lineDrawings.push({a:points[0],b:points[1],color:drawColor});
              renderDrawings();
              setMode(null);
            });


            const overlay=document.getElementById('drawOverlay');
            let dragState=null;

            function timeX(tm){ return chart.timeScale().timeToCoordinate(tm); }
            function priceY(v){ return candleSeries.priceToCoordinate(v); }

            function renderDrawings(){
              overlay.innerHTML='';
              lineDrawings.forEach((d,idx)=>{
                const x1=timeX(d.a.time), y1=priceY(d.a.value);
                const x2=timeX(d.b.time), y2=priceY(d.b.value);
                if(x1==null||x2==null||y1==null||y2==null)return;

                const line=document.createElementNS('http://www.w3.org/2000/svg','line');
                line.setAttribute('x1',x1); line.setAttribute('y1',y1);
                line.setAttribute('x2',x2); line.setAttribute('y2',y2);
                line.setAttribute('stroke',d.color); line.setAttribute('stroke-width','3');
                line.style.pointerEvents='stroke';
                line.style.cursor='move';
                line.addEventListener('pointerdown',e=>{
                  e.preventDefault(); dragState={idx:idx,part:'line',sx:e.clientX,sy:e.clientY,
                    a:{...d.a},b:{...d.b}};
                  overlay.setPointerCapture?.(e.pointerId);
                });
                overlay.appendChild(line);

                [['a',x1,y1],['b',x2,y2]].forEach(h=>{
                  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
                  c.setAttribute('cx',h[1]); c.setAttribute('cy',h[2]); c.setAttribute('r','7');
                  c.setAttribute('fill',d.color); c.setAttribute('stroke','#ffffff'); c.setAttribute('stroke-width','2');
                  c.style.pointerEvents='all'; c.style.cursor='grab';
                  c.addEventListener('pointerdown',e=>{
                    e.preventDefault(); e.stopPropagation();
                    dragState={idx:idx,part:h[0]};
                    overlay.setPointerCapture?.(e.pointerId);
                  });
                  overlay.appendChild(c);
                });
              });
            }

            function pointerToPoint(e){
              const r=container.getBoundingClientRect();
              const x=e.clientX-r.left, y=e.clientY-r.top;
              const tm=chart.timeScale().coordinateToTime(x);
              const pr=candleSeries.coordinateToPrice(y);
              if(tm==null||pr==null)return null;
              return {time:tm,value:pr};
            }

            overlay.style.pointerEvents='auto';
            overlay.addEventListener('pointermove',e=>{
              if(!dragState)return;
              const d=lineDrawings[dragState.idx];
              if(!d)return;

              if(dragState.part==='a'||dragState.part==='b'){
                const p=pointerToPoint(e);
                if(p)d[dragState.part]=p;
              }else{
                const r=container.getBoundingClientRect();
                const dx=e.clientX-dragState.sx, dy=e.clientY-dragState.sy;
                const ax=timeX(dragState.a.time), ay=priceY(dragState.a.value);
                const bx=timeX(dragState.b.time), by=priceY(dragState.b.value);
                const naT=chart.timeScale().coordinateToTime(ax+dx);
                const nbT=chart.timeScale().coordinateToTime(bx+dx);
                const naP=candleSeries.coordinateToPrice(ay+dy);
                const nbP=candleSeries.coordinateToPrice(by+dy);
                if(naT!=null&&nbT!=null&&naP!=null&&nbP!=null){
                  d.a={time:naT,value:naP}; d.b={time:nbT,value:nbP};
                }
              }
              renderDrawings();
            });
            overlay.addEventListener('pointerup',e=>{ dragState=null; });
            overlay.addEventListener('pointercancel',e=>{ dragState=null; });
            chart.timeScale().subscribeVisibleTimeRangeChange(()=>renderDrawings());

            new ResizeObserver(()=>{
              chart.applyOptions({width:container.clientWidth,height:container.clientHeight});
            }).observe(container);
          </script>
          </body>
          </html>
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MarcusAISwing"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
