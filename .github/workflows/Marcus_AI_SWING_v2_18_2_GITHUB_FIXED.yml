Actions.addView(fileOpen,new LinearLayout.LayoutParams(0,-2,1));\n            fileActions.addView(fileSave,new LinearLayout.LayoutParams(0,-2,1));\n            custom.addView(fileActions);\n\n            LinearLayout actions=new LinearLayout(this);\n            actions.setOrientation(LinearLayout.HORIZONTAL);\n            Button save=button(\"앱 저장\"); Button run=button(\"검사\");\n            actions.addView(save,new LinearLayout.LayoutParams(0,-2,1));\n            actions.addView(run,new LinearLayout.LayoutParams(0,-2,1));\n            custom.addView(actions);\n\n            save.setOnClickListener(v->{\n                String t=title.getText().toString().trim();\n                if(t.isEmpty())t=\"사용자 커스텀 \"+n;\n                prefs.edit().putString(titleKey,t).putString(scriptKey,script.getText().toString()).apply();\n                Toast.makeText(this,t+\" 저장 완료\",Toast.LENGTH_SHORT).show();\n            });\n\n            run.setOnClickListener(v->{\n                String t=title.getText().toString().trim();\n                if(t.isEmpty())t=\"사용자 커스텀 \"+n;\n                String rules=script.getText().toString();\n                prefs.edit().putString(titleKey,t).putString(scriptKey,rules).apply();\n                showScannerRun(\"\U0001F9E9 \"+t,rules);\n            });\n\n            fileOpen.setOnClickListener(v->{\n                Intent intent=new Intent(Intent.ACTION_OPEN_DOCUMENT);\n                intent.addCategory(Intent.CATEGORY_OPENABLE); intent.setType(\"text/*\");\n                startActivityForResult(intent,REQ_CUSTOM_IMPORT_BASE+n);\n            });\n\n            fileSave.setOnClickListener(v->{\n                String t=title.getText().toString().trim();\n                if(t.isEmpty())t=\"사용자 커스텀 \"+n;\n                pendingCustomSlot=n; pendingCustomTitle=t; pendingCustomScript=script.getText().toString();\n                Intent intent=new Intent(Intent.ACTION_CREATE_DOCUMENT);\n                intent.addCategory(Intent.CATEGORY_OPENABLE); intent.setType(\"text/plain\");\n                intent.putExtra(Intent.EXTRA_TITLE,safeFileName(t)+\"_scanner.txt\");\n                startActivityForResult(intent,REQ_CUSTOM_EXPORT_BASE+n);\n            });\n\n            content.addView(custom);\n        }\n\n        LinearLayout normalScriptCard=card();\n        normalScriptCard.addView(text(\"\U0001F4CA 일반 차트 스크립트 · 종목검색\",19,TEXT,true));\n        normalScriptCard.addView(text(\n            \"종목검색의 일반 차트 전용입니다. 정밀 분석창과 별도로 저장·불러오기 됩니다.\",\n            13,MUTED,false\n        ));\n\n        EditText normalScript=new EditText(this);\n        normalScript.setText(normalChartScript());\n        normalScript.setMinLines(8);\n        normalScript.setTextColor(TEXT);\n        normalScript.setHintTextColor(MUTED);\n        normalScript.setTextSize(13);\n        normalScript.setBackground(bg(PANEL2,12));\n        normalScript.setPadding(dp(14),dp(11),dp(14),dp(11));\n        normalScript.setVisibility(View.GONE);\n\n        Button toggleNormal=button(\"▶ 일반 차트 스크립트 펼치기\");\n        toggleNormal.setOnClickListener(v->{\n            boolean hidden=normalScript.getVisibility()!=View.VISIBLE;\n            normalScript.setVisibility(hidden?View.VISIBLE:View.GONE);\n            toggleNormal.setText(hidden?\"▼ 일반 차트 스크립트 접기\":\"▶ 일반 차트 스크립트 펼치기\");\n        });\n        normalScriptCard.addView(toggleNormal);\n        normalScriptCard.addView(normalScript);\n        normalScriptCard.addView(text(\n            \"현재 파일: \"+prefs.getString(NORMAL_CHART_SCRIPT_FILE_NAME,\"직접 입력\"),\n            12,CYAN,true\n        ));\n\n        LinearLayout normalFiles=new LinearLayout(this);\n        normalFiles.setOrientation(LinearLayout.HORIZONTAL);\n        Button importNormal=button(\"\U0001F4C1 파일 불러오기\");\n        Button exportNormal=button(\"\U0001F4BE 파일 저장\");\n        normalFiles.addView(importNormal,new LinearLayout.LayoutParams(0,-2,1));\n        normalFiles.addView(exportNormal,new LinearLayout.LayoutParams(0,-2,1));\n        normalScriptCard.addView(normalFiles);\n\n        Button saveNormal=button(\"일반 차트 스크립트 앱 저장\");\n        normalScriptCard.addView(saveNormal);\n\n        importNormal.setOnClickListener(v->{\n            Intent intent=new Intent(Intent.ACTION_OPEN_DOCUMENT);\n            intent.addCategory(Intent.CATEGORY_OPENABLE);\n            intent.setType(\"text/*\");\n            startActivityForResult(intent,REQ_NORMAL_CHART_SCRIPT);\n        });\n        exportNormal.setOnClickListener(v->{\n            pendingChartExport=normalScript.getText().toString();\n            pendingChartExportMode=\"normal\";\n            Intent intent=new Intent(Intent.ACTION_CREATE_DOCUMENT);\n            intent.addCategory(Intent.CATEGORY_OPENABLE);\n            intent.setType(\"text/plain\");\n            intent.putExtra(Intent.EXTRA_TITLE,\"Marcus_normal_chart_script.txt\");\n            startActivityForResult(intent,REQ_NORMAL_CHART_EXPORT);\n        });\n        saveNormal.setOnClickListener(v->{\n            prefs.edit()\n                .putString(NORMAL_CHART_SCRIPT_KEY,normalScript.getText().toString())\n                .apply();\n            Toast.makeText(\n                this,\"일반 차트 저장 완료 · 종목검색에 적용\",\n                Toast.LENGTH_LONG\n            ).show();\n        });\n        content.addView(normalScriptCard);\n\n        LinearLayout precisionScriptCard=card();\n        precisionScriptCard.addView(text(\"\U0001F3AF 정밀 차트 스크립트 · 분석창\",19,TEXT,true));\n        precisionScriptCard.addView(text(\n            \"분석창의 정밀 차트 전용입니다. 일반 종목검색 차트와 별도로 저장·불러오기 됩니다.\",\n            13,MUTED,false\n        ));\n\n        EditText precisionScript=new EditText(this);\n        precisionScript.setText(precisionChartScript());\n        precisionScript.setMinLines(8);\n        precisionScript.setTextColor(TEXT);\n        precisionScript.setHintTextColor(MUTED);\n        precisionScript.setTextSize(13);\n        precisionScript.setBackground(bg(PANEL2,12));\n        precisionScript.setPadding(dp(14),dp(11),dp(14),dp(11));\n        precisionScript.setVisibility(View.GONE);\n\n        Button togglePrecision=button(\"▶ 정밀 차트 스크립트 펼치기\");\n        togglePrecision.setOnClickListener(v->{\n            boolean hidden=precisionScript.getVisibility()!=View.VISIBLE;\n            precisionScript.setVisibility(hidden?View.VISIBLE:View.GONE);\n            togglePrecision.setText(hidden?\"▼ 정밀 차트 스크립트 접기\":\"▶ 정밀 차트 스크립트 펼치기\");\n        });\n        precisionScriptCard.addView(togglePrecision);\n        precisionScriptCard.addView(precisionScript);\n        precisionScriptCard.addView(text(\n            \"현재 파일: \"+prefs.getString(PRECISION_CHART_SCRIPT_FILE_NAME,\"직접 입력\"),\n            12,CYAN,true\n        ));\n\n        LinearLayout precisionFiles=new LinearLayout(this);\n        precisionFiles.setOrientation(LinearLayout.HORIZONTAL);\n        Button importPrecision=button(\"\U0001F4C1 파일 불러오기\");\n        Button exportPrecision=button(\"\U0001F4BE 파일 저장\");\n        precisionFiles.addView(importPrecision,new LinearLayout.LayoutParams(0,-2,1));\n        precisionFiles.addView(exportPrecision,new LinearLayout.LayoutParams(0,-2,1));\n        precisionScriptCard.addView(precisionFiles);\n\n        Button savePrecision=button(\"정밀 차트 스크립트 앱 저장\");\n        precisionScriptCard.addView(savePrecision);\n\n        importPrecision.setOnClickListener(v->{\n            Intent intent=new Intent(Intent.ACTION_OPEN_DOCUMENT);\n            intent.addCategory(Intent.CATEGORY_OPENABLE);\n            intent.setType(\"text/*\");\n            startActivityForResult(intent,REQ_PRECISION_CHART_SCRIPT);\n        });\n        exportPrecision.setOnClickListener(v->{\n            pendingChartExport=precisionScript.getText().toString();\n            pendingChartExportMode=\"precision\";\n            Intent intent=new Intent(Intent.ACTION_CREATE_DOCUMENT);\n            intent.addCategory(Intent.CATEGORY_OPENABLE);\n            intent.setType(\"text/plain\");\n            intent.putExtra(Intent.EXTRA_TITLE,\"Marcus_precision_chart_script.txt\");\n            startActivityForResult(intent,REQ_PRECISION_CHART_EXPORT);\n        });\n        savePrecision.setOnClickListener(v->{\n            prefs.edit()\n                .putString(PRECISION_CHART_SCRIPT_KEY,precisionScript.getText().toString())\n                .apply();\n            Toast.makeText(\n                this,\"정밀 차트 저장 완료 · 분석창에 적용\",\n                Toast.LENGTH_LONG\n            ).show();\n        });\n        content.addView(precisionScriptCard);\n    }\n\n    boolean scannerStockOnly(MasterStock m){\n        if(m==null)return false;\n        String n=m.name==null?\"\":m.name.trim().toUpperCase(Locale.KOREA);\n        String mk=m.market==null?\"\":m.market.trim().toUpperCase(Locale.KOREA);\n\n        if(looksLikeEtfName(n))return false;\n        if(mk.contains(\"ETF\") || mk.contains(\"ETN\"))return false;\n\n        String[] blocked={\n            \" ETN\",\"ETN \",\"레버리지\",\"인버스\",\"2X\",\"선물\",\n            \"국채\",\"채권\",\"금선물\",\"원유선물\"\n        };\n        for(String x:blocked){\n            if(n.contains(x))return false;\n        }\n        return true;\n    }\n\n    List<MasterStock> scannerStockUniverse(){\n        List<MasterStock> out=new ArrayList<>();\n        for(MasterStock m:masterStocks){\n            if(scannerStockOnly(m))out.add(m);\n        }\n        return out;\n    }\n\n    String scannerResultKey(String scanner){\n        String raw=scanner==null?\"scanner\":scanner;\n        return \"scanner_saved_results_\"+Integer.toHexString(raw.hashCode());\n    }\n\n    JSONArray loadScannerSavedResults(String scanner){\n        try{\n            String raw=prefs.getString(scannerResultKey(scanner),\"[]\");\n            return new JSONArray(raw==null||raw.trim().isEmpty()?\"[]\":raw);\n        }catch(Exception e){\n            return new JSONArray();\n        }\n    }\n\n    void saveScannerResult(String scanner,String code,String label){\n        if(code==null || code.trim().isEmpty())return;\n        try{\n            JSONArray arr=loadScannerSavedResults(scanner);\n            for(int i=0;i<arr.length();i++){\n                JSONObject o=arr.optJSONObject(i);\n                if(o!=null && code.equals(o.optString(\"code\")))return;\n            }\n            JSONObject o=new JSONObject();\n            o.put(\"code\",code);\n            o.put(\"label\",label==null?code:label);\n            arr.put(o);\n            prefs.edit().putString(scannerResultKey(scanner),arr.toString()).apply();\n        }catch(Exception ignored){}\n    }\n\n    void clearScannerResults(String scanner){\n        prefs.edit().remove(scannerResultKey(scanner)).apply();\n    }\n\n    void renderScannerSavedResults(String scanner,LinearLayout results){\n        if(results==null)return;\n        results.removeAllViews();\n        JSONArray arr=loadScannerSavedResults(scanner);\n        for(int i=0;i<arr.length();i++){\n            JSONObject o=arr.optJSONObject(i);\n            if(o==null)continue;\n            final String code=o.optString(\"code\",\"\");\n            String label=o.optString(\"label\",code);\n            if(code.isEmpty())continue;\n            Button b=button(label);\n            b.setOnClickListener(v->openStockFromScanner(code));\n            results.addView(b);\n        }\n    }\n\n    String scannerArchiveKey(String scanner){\n        String raw=scanner==null?\"scanner\":scanner;\n        return \"scanner_archive_\"+Integer.toHexString(raw.hashCode());\n    }\n\n    JSONArray loadScannerArchive(String scanner){\n        try{\n            String raw=prefs.getString(scannerArchiveKey(scanner),\"[]\");\n            return new JSONArray(raw==null||raw.trim().isEmpty()?\"[]\":raw);\n        }catch(Exception e){ return new JSONArray(); }\n    }\n\n    void archiveCurrentScannerResults(String scanner){\n        try{\n            JSONArray current=loadScannerSavedResults(scanner);\n            if(current.length()==0)return;\n            JSONArray archive=loadScannerArchive(scanner);\n            long now=System.currentTimeMillis();\n            for(int i=0;i<current.length();i++){\n                JSONObject src=current.optJSONObject(i);\n                if(src==null)continue;\n                JSONObject cp=new JSONObject(src.toString());\n                cp.put(\"capturedAt\",now);\n                archive.put(cp);\n            }\n            // keep latest 100 past captures\n            JSONArray trimmed=new JSONArray();\n            int from=Math.max(0,archive.length()-100);\n            for(int i=from;i<archive.length();i++)trimmed.put(archive.opt(i));\n            prefs.edit().putString(scannerArchiveKey(scanner),trimmed.toString()).apply();\n        }catch(Exception ignored){}\n    }\n\n    int scoreFromLabel(String label){\n        if(label==null)return 0;\n        try{\n            java.util.regex.Matcher m=java.util.regex.Pattern.compile(\"(\\\\d+)점\").matcher(label);\n            if(m.find())return Integer.parseInt(m.group(1));\n        }catch(Exception ignored){}\n        return 0;\n    }\n\n    void saveScannerTop10(String scanner,String code,String label,int score){\n        if(score<65 || code==null || code.isEmpty())return;\n        try{\n            JSONArray arr=loadScannerSavedResults(scanner);\n            ArrayList<JSONObject> list=new ArrayList<>();\n            boolean replaced=false;\n            for(int i=0;i<arr.length();i++){\n                JSONObject o=arr.optJSONObject(i);\n                if(o==null)continue;\n                if(code.equals(o.optString(\"code\"))){\n                    o.put(\"label\",label); o.put(\"score\",score);\n                    replaced=true;\n                }\n                list.add(o);\n            }\n            if(!replaced){\n                JSONObject o=new JSONObject();\n                o.put(\"code\",code); o.put(\"label\",label); o.put(\"score\",score);\n                list.add(o);\n            }\n            Collections.sort(list,(a,b)->Integer.compare(\n                b.optInt(\"score\",scoreFromLabel(b.optString(\"label\"))),\n                a.optInt(\"score\",scoreFromLabel(a.optString(\"label\")))\n            ));\n            JSONArray top=new JSONArray();\n            for(int i=0;i<Math.min(10,list.size());i++)top.put(list.get(i));\n            prefs.edit().putString(scannerResultKey(scanner),top.toString()).apply();\n        }catch(Exception ignored){}\n    }\n\n    void renderScannerArchive(String scanner,LinearLayout box){\n        if(box==null)return;\n        box.removeAllViews();\n        JSONArray arr=loadScannerArchive(scanner);\n        int start=Math.max(0,arr.length()-30);\n        for(int i=arr.length()-1;i>=start;i--){\n            JSONObject o=arr.optJSONObject(i);\n            if(o==null)continue;\n            String code=o.optString(\"code\",\"\");\n            String label=o.optString(\"label\",code);\n            Button b=button(\"\U0001F4DA \"+label);\n            final String c=code;\n            b.setOnClickListener(v->openStockFromScanner(c));\n            box.addView(b);\n        }\n        if(arr.length()==0)box.addView(text(\"이전 포착 기록 없음\",12,MUTED,false));\n    }\n\n    void showScannerRun(String scanner,String rules){\n        screenMode=\"SCANNER\";\n        clear(scanner,\"실제 Scanner Queue · 20종목 단위 검사\");\n\n        String env=activeEnv();\n        final List<MasterStock> scanStocks=scannerStockUniverse();\n\n        LinearLayout c=card();\n        c.addView(text(\"현재 검사 규칙\",17,TEXT,true));\n        c.addView(text(rules,13,BLUE,false));\n        int savedIndex=prefs.getInt(SCAN_INDEX,0);\n        int savedHits=prefs.getInt(SCAN_HITS,0);\n        double pct=scanStocks.isEmpty()?0.0:(savedIndex*100.0/scanStocks.size());\n\n        c.addView(text(\n            \"개별주 전용 · ETF/ETN/레버리지/인버스 제외\\n\"+\n            \"현재 환경: \"+env+\n            \"\\n전체 진행: \"+savedIndex+\" / \"+scanStocks.size()+\n            \" (\"+String.format(Locale.US,\"%.1f\",pct)+\"%)\"+\n            \"\\n오늘 TOP10 저장: \"+savedHits+\"종목\"+\n            \"\\n마지막 검사: \"+\n            prefs.getString(SCAN_LAST_NAME,\"-\")+\" \"+\n            prefs.getString(SCAN_LAST_CODE,\"\"),\n            13,MUTED,false\n        ));\n\n        ProgressBar progress=new ProgressBar(\n            this,null,android.R.attr.progressBarStyleHorizontal\n        );\n        progress.setMax(Math.max(1,scanStocks.size()));\n        progress.setProgress(prefs.getInt(SCAN_INDEX,0));\n        c.addView(progress);\n\n        TextView state=text(\n            prefs.getInt(SCAN_INDEX,0)>0\n            ? \"✅ 이전 검사 기록 있음 · 다음 위치부터 계속 가능\"\n            : \"검사 대기\",\n            14,MUTED,true\n        );\n        LinearLayout results=new LinearLayout(this);\n        results.setOrientation(LinearLayout.VERTICAL);\n\n        Button run=button(\"검사 시작\");\n        Button cancel=button(\"⏹ 검사 취소\");\n        cancel.setEnabled(false);\n        Button reset=button(\"처음부터 다시 검사\");\n        TextView liveProgress=text(\"\",13,BLUE,true);\n\n        c.addView(run);\n        c.addView(cancel);\n        c.addView(reset);\n        c.addView(liveProgress);\n        c.addView(state);\n        content.addView(c);\n\n        LinearLayout rc=card();\n        rc.addView(text(\"\U0001F525 오늘의 포착 TOP10 · 65점 이상\",18,TEXT,true));\n        rc.addView(text(\"현재 검색 결과만 표시 · 과거 누적 종목과 섞지 않음\",12,MUTED,false));\n        rc.addView(results);\n        content.addView(rc);\n        renderScannerSavedResults(scanner,results);\n\n        LinearLayout archiveResults=new LinearLayout(this);\n        archiveResults.setOrientation(LinearLayout.VERTICAL);\n        LinearLayout archiveCard=card();\n        archiveCard.addView(text(\"\U0001F4DA 이전 포착 종목 관리\",18,TEXT,true));\n        archiveCard.addView(archiveResults);\n        content.addView(archiveCard);\n        renderScannerArchive(scanner,archiveResults);\n\n        reset.setOnClickListener(v->{\n            archiveCurrentScannerResults(scanner);\n            prefs.edit()\n                .putInt(SCAN_INDEX,0)\n                .putInt(SCAN_HITS,0)\n                .remove(SCAN_LAST_NAME)\n                .remove(SCAN_LAST_CODE)\n                .apply();\n            clearScannerResults(scanner);\n            renderScannerSavedResults(scanner,results);\n            renderScannerArchive(scanner,archiveResults);\n            progress.setProgress(0);\n            liveProgress.setText(\"0 / \"+scanStocks.size()+\" (0.0%)\");\n            state.setText(\"검사 위치와 저장된 포착 종목을 초기화했습니다.\");\n        });\n\n        cancel.setOnClickListener(v->{\n            scanCancelRequested=true;\n            cancel.setEnabled(false);\n            state.setText(\"⏹ 검사 취소 요청됨 · 현재 종목 처리 후 중단합니다.\");\n            state.setTextColor(YELLOW);\n        });\n\n        run.setOnClickListener(v->{\n            scanCancelRequested=false;\n            if(!tokenReady(env)){\n                state.setText(\"\U0001F534 설정에서 OAuth 연결부터 확인해주세요.\");\n                state.setTextColor(RED);\n                return;\n            }\n\n            int start=prefs.getInt(SCAN_INDEX,0);\n\n            if(start>=scanStocks.size()){\n                state.setText(\"✅ 전종목 1회 검사가 완료되었습니다. 처음부터 다시 검사를 누르세요.\");\n                state.setTextColor(GREEN);\n                return;\n            }\n\n            int end=Math.min(start+20,scanStocks.size());\n\n            run.setEnabled(false);\n            cancel.setEnabled(true);\n            renderScannerSavedResults(scanner,results);\n            progress.setProgress(start);\n            state.setText(\n                \"검사 중... \"+start+\" ~ \"+(end-1)+\n                \" / \"+scanStocks.size()\n            );\n            state.setTextColor(BLUE);\n\n            new Thread(()->{\n                int passed=0;\n                int success=0;\n                int errors=0;\n                String lastError=\"\";\n\n                int actualEnd=start;\n                boolean cancelled=false;\n                for(int i=start;i<end;i++){\n                    if(scanCancelRequested){\n                        cancelled=true;\n                        break;\n                    }\n                    MasterStock m=scanStocks.get(i);\n                    actualEnd=i+1;\n\n                    try{\n                        List<Candle> candles=requestDailyChart(env,m.code);\n                        success++;\n                        AISignal sig=analyze(candles);\n\n                        boolean ok=matchesScript(rules,candles,sig) && sig.score>=65;\n\n                        if(ok){\n                            passed++;\n                            final String label=\n                                m.name+\" (\"+m.code+\") · \"+\n                                sig.score+\"점 · \"+sig.label;\n                            saveScannerTop10(scanner,m.code,label,sig.score);\n\n                            runOnUiThread(()->{\n                                renderScannerSavedResults(scanner,results);\n                            });\n                        }\n\n                    }catch(Exception ex){\n                        errors++;\n                        lastError=safeError(ex);\n                    }\n\n                    final int done=i-start+1;\n                    final int absoluteDone=i+1;\n                    final String currentName=m.name;\n                    final String currentCode=m.code;\n\n                    prefs.edit()\n                        .putString(SCAN_LAST_NAME,currentName)\n                        .putString(SCAN_LAST_CODE,currentCode)\n                        .apply();\n\n                    runOnUiThread(()->{\n                        progress.setProgress(absoluteDone);\n                        double p=masterStocks.isEmpty()\n                            ? 0.0\n                            : absoluteDone*100.0/scanStocks.size();\n\n                        liveProgress.setText(\n                            \"검사중: \"+currentName+\" (\"+currentCode+\")\\n\"+\n                            absoluteDone+\" / \"+scanStocks.size()+\n                            \" · \"+String.format(Locale.US,\"%.1f\",p)+\"%\"\n                        );\n                    });\n\n                    try{\n                        Thread.sleep(200);\n                    }catch(Exception ignored){}\n                }\n\n                final int next=actualEnd;\n                final boolean wasCancelled=cancelled;\n                final int hit=passed;\n                final int okCount=success;\n                final int errorCount=errors;\n                final String finalLastError=lastError;\n                final int totalHits=loadScannerSavedResults(scanner).length();\n\n                prefs.edit()\n                    .putInt(SCAN_INDEX,next)\n                    .putInt(SCAN_HITS,totalHits)\n                    .apply();\n\n                runOnUiThread(()->{\n                    run.setEnabled(true);\n                    cancel.setEnabled(false);\n                    state.setText(\n                        (wasCancelled?\"⏹ 검사 중단\":\"✅ 검사 완료\")+\" · 처리 \"+(next-start)+\"종목\"+\n                        \"\\nAPI 성공: \"+okCount+\" / 오류: \"+errorCount+\n                        \"\\n이번 포착: \"+hit+\"종목\"+\n                        (errorCount>0?\"\\n마지막 오류: \"+finalLastError:\"\")+\n                        \"\\n오늘 TOP10: \"+totalHits+\"종목\\n\"+\n                        \"전체 진행: \"+next+\" / \"+scanStocks.size()+\n                        \" (\"+String.format(Locale.US,\"%.1f\",(next*100.0/Math.max(1,scanStocks.size())))+\"%)\\n\"+\n                        \"다음 시작 위치: \"+next\n                    );\n                    state.setTextColor(GREEN);\n                });\n            }).start();\n        });\n    }\n\n    Map<String,String> parseRules(String rules){\n        Map<String,String> cfg=new HashMap<>();\n        if(rules==null)return cfg;\n        for(String line:rules.split(\"\\\\n\")){\n            String s=line.trim();\n            if(s.isEmpty()||s.startsWith(\"#\")||!s.contains(\"=\"))continue;\n            String[] p=s.split(\"=\",2);\n            cfg.put(p[0].trim().toUpperCase(Locale.US),p[1].trim().toLowerCase(Locale.US));\n        }\n        return cfg;\n    }\n\n    boolean ruleBool(Map<String,String> cfg,String key,boolean def){\n        if(!cfg.containsKey(key))return def;\n        String v=cfg.get(key);\n        return \"true\".equals(v)||\"1\".equals(v)||\"yes\".equals(v)||\"on\".equals(v);\n    }\n\n    boolean matchesScript(String rules,List<Candle> candles,AISignal sig){\n        Map<String,String> cfg=parseRules(rules);\n\n        Candle last=candles.get(candles.size()-1);\n\n        if(cfg.containsKey(\"SCORE_MIN\") &&\n            sig.score<num(cfg.get(\"SCORE_MIN\")))return false;\n\n        if(boolRequired(cfg,\"BOS\") && !sig.bos)return false;\n        if(boolRequired(cfg,\"DISCOUNT\") && !sig.discount)return false;\n        if(boolRequired(cfg,\"EXPLOSION\") && !sig.explosion)return false;\n\n        if(boolRequired(cfg,\"MA5_GT_MA20\") && !(sig.ma5>sig.ma20))return false;\n        if(boolRequired(cfg,\"PRICE_ABOVE_MA5\") && !(last.close>sig.ma5))return false;\n\n        if(cfg.containsKey(\"RSI_MIN\") &&\n            sig.rsi<num(cfg.get(\"RSI_MIN\")))return false;\n\n        if(cfg.containsKey(\"RSI_MAX\") &&\n            sig.rsi>num(cfg.get(\"RSI_MAX\")))return false;\n\n        return true;\n    }\n\n    boolean boolRequired(Map<String,String> cfg,String key){\n        return cfg.containsKey(key) &&\n            (\"true\".equals(cfg.get(key)) ||\n             \"1\".equals(cfg.get(key)) ||\n             \"yes\".equals(cfg.get(key)));\n    }\n\n    void openStockFromScanner(String code){\n        String name=masterName(code);\n        prefs.edit()\n            .putString(LAST_STOCK_CODE,code)\n            .putString(LAST_STOCK_NAME,name)\n            .apply();\n        showStocks();\n        Toast.makeText(\n            this,\n            name+\" 선택 완료 · 차트 데이터를 불러옵니다.\",\n            Toast.LENGTH_SHORT\n        ).show();\n    }\n\n    List<String> getFavoriteCodes(){\n        List<String> out=new ArrayList<>();\n        String raw=prefs.getString(FAVORITES,\"\");\n        if(raw.trim().isEmpty())return out;\n        for(String s:raw.split(\",\")){\n            String c=s.trim();\n            if(c.matches(\"\\\\d{6}\")&&!out.contains(c))out.add(c);\n        }\n        return out;\n    }\n\n    void saveFavoriteCodes(List<String> codes){\n        StringBuilder sb=new StringBuilder();\n        for(String c:codes){\n            if(sb.length()>0)sb.append(\",\");\n            sb.append(c);\n        }\n        prefs.edit().putString(FAVORITES,sb.toString()).apply();\n    }\n\n    void addFavoriteCode(String code){\n        List<String> codes=getFavoriteCodes();\n        if(!codes.contains(code)){\n            codes.add(code);\n            saveFavoriteCodes(codes);\n        }\n    }\n\n    void addLiveCode(String code){\n        List<String> codes=getLiveCodes();\n\n        if(codes.contains(code))return;\n\n        codes.add(code);\n        saveLiveCodes(codes);\n    }\n\n    List<String> getLiveCodes(){\n        List<String> out=new ArrayList<>();\n        String raw=prefs.getString(LIVE_CODES,\"\");\n\n        if(raw.trim().isEmpty())return out;\n\n        for(String s:raw.split(\",\")){\n            String c=s.trim();\n            if(c.matches(\"\\\\d{6}\"))out.add(c);\n        }\n\n        return out;\n    }\n\n    void saveLiveCodes(List<String> codes){\n        StringBuilder sb=new StringBuilder();\n\n        for(String c:codes){\n            if(sb.length()>0)sb.append(\",\");\n            sb.append(c);\n        }\n\n        prefs.edit().putString(LIVE_CODES,sb.toString()).apply();\n    }\n\n    String masterName(String code){\n        for(MasterStock m:masterStocks){\n            if(m.code.equals(code))return m.name;\n        }\n        return code;\n    }\n\n    String marketBadgeText(String code){\n        String m=masterMarket(code);\n        if(m==null)m=\"\";\n        String u=m.toUpperCase(Locale.KOREA);\n        if(u.contains(\"NXT\"))return \"NXT\";\n        if(u.contains(\"KOSDAQ\"))return \"KOSDAQ\";\n        if(u.contains(\"KOSPI\"))return \"KOSPI\";\n        if(u.contains(\"ETF\"))return \"ETF\";\n        return u.isEmpty()?\"KRX\":u;\n    }\n\n    String masterMarket(String code){\n        for(MasterStock m:masterStocks){\n            if(m.code.equals(code))return m.market;\n        }\n        return \"\";\n    }\n\n    void showRealtime(){\n        screenMode=\"REALTIME\";\n        clear(\"⚡ 실시간 통합창\",\"종목목록 + 차트 + 호가를 한 화면에서 확인\");\n\n        List<String> codes=getLiveCodes();\n\n        LinearLayout info=card();\n        info.addView(text(\"등록 종목 \"+codes.size()+\"개 · 제한 없음\",18,TEXT,true));\n        Button clearBtn=button(\"실시간 종목 전체 삭제\");\n        clearBtn.setOnClickListener(v->{ saveLiveCodes(new ArrayList<>()); showRealtime(); });\n        info.addView(clearBtn);\n        content.addView(info);\n\n        if(codes.isEmpty()){\n            LinearLayout empty=card();\n            empty.addView(text(\"종목 또는 관심종목 화면에서 ⚡ 실시간 추가를 눌러주세요.\",14,YELLOW,false));\n            content.addView(empty);\n            return;\n        }\n\n        LinearLayout workspace=new LinearLayout(this);\n        workspace.setOrientation(LinearLayout.HORIZONTAL);\n        workspace.setPadding(dp(8),dp(8),dp(8),dp(8));\n        workspace.setBackground(bg(PANEL,16));\n\n        LinearLayout listPane=new LinearLayout(this);\n        listPane.setOrientation(LinearLayout.VERTICAL);\n        listPane.addView(text(\"종목\",15,TEXT,true));\n\n        LinearLayout chartPane=new LinearLayout(this);\n        chartPane.setOrientation(LinearLayout.VERTICAL);\n        TextView chartTitle=text(\"차트\",17,TEXT,true);\n        WebView chart=new WebView(this);\n        initChartWebView(chart);\n        chartPane.addView(chartTitle);\n        chartPane.addView(chart,new LinearLayout.LayoutParams(-1,dp(520)));\n\n        LinearLayout bookPane=new LinearLayout(this);\n        bookPane.setOrientation(LinearLayout.VERTICAL);\n        bookPane.addView(text(\"키움형 10단 호가\",17,TEXT,true));\n        TextView bookHeader=text(\"매도잔량        가격\",12,MUTED,true);\n        TextView askText=text(\"종목을 선택하세요.\",13,Color.rgb(255,125,165),false);\n        TextView centerPrice=text(\"\",18,TEXT,true);\n        TextView bidText=text(\"\",13,Color.rgb(110,165,255),false);\n        TextView bookSummary=text(\"체결/잔량 정보 준비중\",12,MUTED,false);\n        askText.setTypeface(Typeface.MONOSPACE);\n        bidText.setTypeface(Typeface.MONOSPACE);\n        centerPrice.setGravity(Gravity.CENTER);\n        bookPane.addView(bookHeader);\n        bookPane.addView(askText);\n        bookPane.addView(centerPrice);\n        bookPane.addView(text(\"가격            매수잔량\",12,MUTED,true));\n        bookPane.addView(bidText);\n        bookPane.addView(bookSummary);\n\n        workspace.addView(listPane,new LinearLayout.LayoutParams(0,dp(590),0.22f));\n        workspace.addView(chartPane,new LinearLayout.LayoutParams(0,dp(590),0.50f));\n        workspace.addView(bookPane,new LinearLayout.LayoutParams(0,dp(590),0.28f));\n        content.addView(workspace);\n\n        final String[] selected={codes.get(0)};\n\n        Runnable loadSelected=()->{\n            String code=selected[0];\n            String name=masterName(code);\n            chartTitle.setText(name+\" (\"+code+\") · 로딩...\");\n            askText.setText(\"호가 로딩...\");\n            bidText.setText(\"\");\n            centerPrice.setText(\"\");\n            bookSummary.setText(\"체결/잔량 정보 준비중\");\n\n            new Thread(()->{\n                try{\n                    List<Candle> candles=requestDailyChart(activeEnv(),code);\n                    JSONObject bj=requestOrderBook(activeEnv(),code);\n                    JSONObject o=bj.optJSONObject(\"output1\");\n\n                    StringBuilder asks=new StringBuilder();\n                    StringBuilder bids=new StringBuilder();\n                    String current=\"-\";\n                    String summary=\"잔량 정보 없음\";\n                    if(o!=null){\n                        for(int i=10;i>=1;i--){\n                            asks.append(String.format(Locale.KOREA,\"%10s  %10s\\n\",\n                                qty(o.optString(\"askp_rsqn\"+i,\"0\")),\n                                money(o.optString(\"askp\"+i,\"0\"))));\n                        }\n                        current=money(o.optString(\"askp1\",\"0\"));\n                        for(int i=1;i<=10;i++){\n                            bids.append(String.format(Locale.KOREA,\"%10s  %-10s\\n\",\n                                money(o.optString(\"bidp\"+i,\"0\")),\n                                qty(o.optString(\"bidp_rsqn\"+i,\"0\"))));\n                        }\n                        summary=\n                            \"총 매도 \"+qty(o.optString(\"total_askp_rsqn\",\"0\"))+\n                            \"  |  총 매수 \"+qty(o.optString(\"total_bidp_rsqn\",\"0\"));\n                    }\n\n                    String askValue=asks.toString();\n                    String bidValue=bids.toString();\n                    String centerValue=current;\n                    String summaryValue=summary;\n                    runOnUiThread(()->{\n                        chartTitle.setText(name+\" (\"+code+\") · 일봉\");\n                        sendChartData(chart,candles,name,code,\"일봉\");\n                        askText.setText(askValue);\n                        bidText.setText(bidValue);\n                        centerPrice.setText(centerValue);\n                        bookSummary.setText(summaryValue);\n                    });\n                }catch(Exception ex){\n                    runOnUiThread(()->{\n                        chartTitle.setText(name+\" · 조회 실패\");\n                        askText.setText(\"조회 실패 · \"+safeError(ex));\n                        askText.setTextColor(RED);\n                        bidText.setText(\"\");\n                        centerPrice.setText(\"\");\n                        bookSummary.setText(\"\");\n                    });\n                }\n            }).start();\n        };\n\n        for(String code:codes){\n            String name=masterName(code);\n            Button b=button(name+\"\\n\"+code);\n            b.setOnClickListener(v->{ selected[0]=code; loadSelected.run(); });\n            listPane.addView(b);\n        }\n\n        Button removeSelected=button(\"선택 종목 삭제\");\n        removeSelected.setOnClickListener(v->{\n            List<String> now=getLiveCodes();\n            now.remove(selected[0]);\n            saveLiveCodes(now);\n            showRealtime();\n        });\n        listPane.addView(removeSelected);\n\n        chart.postDelayed(loadSelected,400);\n    }\n\n    void pollLiveNext(List<String> codes,List<TextView> views){\n        if(!liveActive||codes.isEmpty())return;\n\n        int idx=liveCursor%codes.size();\n        String code=codes.get(idx);\n        String env=activeEnv();\n\n        new Thread(()->{\n            try{\n                JSONObject j=requestQuote(env,code);\n\n                if(\"0\".equals(j.optString(\"rt_cd\",\"\"))){\n                    JSONObject o=j.optJSONObject(\"output\");\n\n                    if(o!=null){\n                        String price=o.optString(\"stck_prpr\",\"-\");\n                        String rate=o.optString(\"prdy_ctrt\",\"-\");\n                        String vol=o.optString(\"acml_vol\",\"-\");\n                        String high=o.optString(\"stck_hgpr\",\"-\");\n                        String low=o.optString(\"stck_lwpr\",\"-\");\n\n                        runOnUiThread(()->{\n                            if(liveActive && idx<views.size()){\n                                views.get(idx).setText(\n                                    \"현재가 \"+money(price)+\" · \"+\n                                    rate+\"%\\n\"+\n                                    \"거래량 \"+qty(vol)+\n                                    \" · 고가 \"+money(high)+\n                                    \" · 저가 \"+money(low)+\n                                    \"\\n갱신: \"+new SimpleDateFormat(\n                                        \"HH:mm:ss\",Locale.KOREA\n                                    ).format(new Date())\n                                );\n                                views.get(idx).setTextColor(GREEN);\n                            }\n                        });\n                    }\n                }\n            }catch(Exception e){\n                runOnUiThread(()->{\n                    if(liveActive && idx<views.size()){\n                        views.get(idx).setText(\n                            \"조회 오류 · \"+safeError(e)\n                        );\n                        views.get(idx).setTextColor(RED);\n                    }\n                });\n            }\n\n            runOnUiThread(()->{\n                if(!liveActive)return;\n                liveCursor=(idx+1)%codes.size();\n                liveHandler.postDelayed(\n                    ()->pollLiveNext(codes,views),\n                    2000\n                );\n            });\n        }).start();\n    }\n\n    void showRealtimeChart(String code){\n        String name=masterName(code);\n        prefs.edit()\n            .putString(LAST_STOCK_CODE,code)\n            .putString(LAST_STOCK_NAME,name)\n            .apply();\n        screenMode=\"REALTIME_CHART\";\n        clear(name+\" 차트\",\"실시간 종목 → 상세차트\");\n\n        LinearLayout c=card();\n        TextView title=text(name+\" (\"+code+\")\",20,TEXT,true);\n        c.addView(title);\n\n        LinearLayout periods=new LinearLayout(this);\n        periods.setOrientation(LinearLayout.HORIZONTAL);\n        Button m3=button(\"3분\");\n        Button m5=button(\"5분\");\n        Button day=button(\"일봉\");\n        Button book=button(\"호가\");\n        periods.addView(m3,new LinearLayout.LayoutParams(0,-2,1));\n        periods.addView(m5,new LinearLayout.LayoutParams(0,-2,1));\n        periods.addView(day,new LinearLayout.LayoutParams(0,-2,1));\n        periods.addView(book,new LinearLayout.LayoutParams(0,-2,1));\n        c.addView(periods);\n\n        WebView chart=new WebView(this);\n        initChartWebView(chart);\n        c.addView(chart,new LinearLayout.LayoutParams(-1,dp(470)));\n\n        TextView ai=text(\"\",14,MUTED,false);\n        c.addView(ai);\n        content.addView(c);\n\n        m3.setOnClickListener(v->loadChartPeriod(chart,title,ai,code,name,\"3M\"));\n        m5.setOnClickListener(v->loadChartPeriod(chart,title,ai,code,name,\"5M\"));\n        day.setOnClickListener(v->loadChartPeriod(chart,title,ai,code,name,\"DAY\"));\n        book.setOnClickListener(v->showOrderBook(code,name));\n\n        loadChartPeriod(chart,title,ai,code,name,\"DAY\");\n    }\n\n    void showNews(){\n        screenMode=\"NEWS\";\n        clear(\"\U0001F4F0 실시간 뉴스 / 공시\",\"실제 금융 뉴스 제목과 공시를 앱에서 확인\");\n\n        LinearLayout feed=card();\n        feed.addView(text(\"\U0001F514 실시간 시장 뉴스\",18,TEXT,true));\n        feed.addView(text(\"샘플 문구 대신 실제 금융 뉴스 페이지를 표시합니다.\",13,MUTED,false));\n\n        WebView newsWeb=new WebView(this);\n        newsWeb.setBackgroundColor(Color.rgb(12,24,48));\n        newsWeb.getSettings().setJavaScriptEnabled(true);\n        newsWeb.getSettings().setDomStorageEnabled(true);\n        newsWeb.setWebViewClient(new WebViewClient());\n        newsWeb.loadUrl(\"https://finance.naver.com/news/\");\n        feed.addView(newsWeb,new LinearLayout.LayoutParams(-1,dp(420)));\n        content.addView(feed);\n\n        LinearLayout stock=card();\n        stock.addView(text(\"\U0001F50E 종목 뉴스\",18,TEXT,true));\n        EditText q=new EditText(this);\n        q.setHint(\"예: 삼성전자 / 피엔티 / 팬오션\");\n        q.setSingleLine(true);\n        q.setTextColor(TEXT);\n        q.setHintTextColor(MUTED);\n        q.setBackground(bg(PANEL2,12));\n        q.setPadding(dp(14),dp(11),dp(14),dp(11));\n        stock.addView(q);\n\n        Button search=button(\"종목 뉴스 검색\");\n        search.setOnClickListener(v->{\n            String ss=q.getText().toString().trim();\n            if(ss.isEmpty())return;\n            try{\n                String encoded=URLEncoder.encode(ss+\" 주식\",StandardCharsets.UTF_8.name());\n                openBrowser(\"https://m.search.naver.com/search.naver?where=m_news&query=\"+encoded);\n            }catch(Exception ex){}\n        });\n        stock.addView(search);\n        content.addView(stock);\n\n        LinearLayout disclosure=card();\n        disclosure.addView(text(\"\U0001F4E2 DART 공시\",18,TEXT,true));\n        Button dart=button(\"DART 공시 열기\");\n        dart.setOnClickListener(v->openBrowser(\"https://dart.fss.or.kr/\"));\n        disclosure.addView(dart);\n        content.addView(disclosure);\n    }\n\n    void openBrowser(String url){\n        try{\n            Intent i=new Intent(Intent.ACTION_VIEW,Uri.parse(url));\n            startActivity(i);\n        }catch(Exception e){\n            Toast.makeText(this,\"브라우저를 열 수 없습니다.\",Toast.LENGTH_SHORT).show();\n        }\n    }\n\n    void showFavorites(){\n        screenMode=\"FAVORITES\";\n        clear(\"⭐ 관심 / 보유 관리\",\"현재가 · 등락 · 거래량 · 개인/외국인/기관 순매수\");\n\n        List<String> codes=getFavoriteCodes();\n        LinearLayout head=card();\n        head.addView(text(\"⭐ 관심종목 \"+codes.size()+\"개\",19,TEXT,true));\n        head.addView(text(\"투자자 수치는 한국투자 '주식현재가 투자자' API의 순매수 수량 기준입니다.\",12,MUTED,false));\n        content.addView(head);\n\n        if(codes.isEmpty()){\n            LinearLayout empty=card();\n            empty.addView(text(\"종목 화면에서 ⭐ 관심종목 추가를 눌러주세요.\",14,YELLOW,false));\n            content.addView(empty);\n            return;\n        }\n\n        for(String code:new ArrayList<>(codes)){\n            String name=masterName(code);\n            LinearLayout c=card();\n            TextView title=text(name+\" (\"+code+\")\",18,TEXT,true);\n            TextView market=text(\"현재가 / 등락(대비) / 거래량 / 거래대금 불러오는 중...\",14,BLUE,true);\n            TextView investor=text(\"개인/외국인/기관 불러오는 중...\",13,MUTED,false);\n            c.addView(title);\n            c.addView(market);\n            c.addView(investor);\n\n            LinearLayout row=new LinearLayout(this);\n            row.setOrientation(LinearLayout.HORIZONTAL);\n            Button chart=button(\"\U0001F4CA 차트\");\n            Button live=button(\"⚡ 실시간\");\n            Button remove=button(\"삭제\");\n            chart.setOnClickListener(v->{\n                prefs.edit().putString(LAST_STOCK_CODE,code).putString(LAST_STOCK_NAME,name).apply();\n                showStocks();\n            });\n            live.setOnClickListener(v->{\n                addLiveCode(code);\n                Toast.makeText(this,name+\" 실시간 등록 완료\",Toast.LENGTH_SHORT).show();\n            });\n            remove.setOnClickListener(v->{\n                List<String> now=getFavoriteCodes();\n                now.remove(code);\n                saveFavoriteCodes(now);\n                showFavorites();\n            });\n            row.addView(chart,new LinearLayout.LayoutParams(0,-2,1));\n            row.addView(live,new LinearLayout.LayoutParams(0,-2,1));\n            row.addView(remove,new LinearLayout.LayoutParams(0,-2,1));\n            c.addView(row);\n            content.addView(c);\n\n            new Thread(()->{\n                try{\n                    JSONObject qj=requestQuote(activeEnv(),code);\n                    JSONObject q=qj.optJSONObject(\"output\");\n                    if(q!=null){\n                        String tx=\"현재가 \"+money(q.optString(\"stck_prpr\",\"0\"))+\n                            \"   등락 \"+q.optString(\"prdy_ctrt\",\"-\")+\"%\"+\n                            \"   대비 \"+moneySigned(q.optString(\"prdy_vrss\",\"0\"))+\n                            \"\\n거래량 \"+qty(q.optString(\"acml_vol\",\"0\"))+\n                            \"   거래대금 \"+amountWon(q.optString(\"acml_tr_pbmn\",\"0\"));\n                        runOnUiThread(()->{ market.setText(tx); market.setTextColor(GREEN); });\n                    }\n\n                    JSONObject ij=requestInvestor(activeEnv(),code);\n                    JSONObject ir=latestInvestorRow(ij);\n                    if(ir!=null){\n                        String personal=investorVal(ir,\"prsn_ntby_qty\",\"prsn_ntby_tr_pbmn\",\"prsn_ntby_qty_icdc\");\n                        String foreign=investorVal(ir,\"frgn_ntby_qty\",\"frgn_ntby_tr_pbmn\",\"frgn_ntby_qty_icdc\");\n                        String institution=investorVal(ir,\"orgn_ntby_qty\",\"orgn_ntby_tr_pbmn\",\"orgn_ntby_qty_icdc\");\n                        String inv=\n                            \"수급(순매수)   개인 \"+(personal.equals(\"-\")?\"-\":qty(personal))+\n                            \"   │   외국인 \"+(foreign.equals(\"-\")?\"-\":qty(foreign))+\n                            \"   │   기관 \"+(institution.equals(\"-\")?\"-\":qty(institution));\n                        runOnUiThread(()->{\n                            investor.setText(inv);\n                            investor.setTextSize(14);\n                            investor.setTextColor(TEXT);\n                        });\n                    }\n                }catch(Exception ex){\n                    runOnUiThread(()->investor.setText(\"투자자/시세 일부 조회 실패 · \"+safeError(ex)));\n                }\n            }).start();\n        }\n    }\n\n    // ===== KIS WebSocket realtime engine (v2.9.0) =====\n    // Specs applied from the uploaded KIS Excel files:\n    // H0UNCNT0 integrated execution, H0UNASP0 integrated orderbook,\n    // H0UNPGM0 integrated program trading. KRX/NXT IDs are retained\n    // for later explicit market routing.\n    class KISRealtime extends WebSocketListener{\n        final OkHttpClient wsClient=new OkHttpClient.Builder()\n            .retryOnConnectionFailure(true)\n            .pingInterval(20,TimeUnit.SECONDS)\n            .build();\n\n        WebSocket ws;\n        String approvalKey=\"\";\n        String subscribed=\"\";\n        boolean connecting=false;\n        boolean manualStop=false;\n        int retryCount=0;\n        Runnable reconnectTask=null;\n        final String env;\n        final String code;\n\n        KISRealtime(String env,String code){\n            this.env=env;\n            this.code=code;\n        }\n\n        void start(){\n            if(code==null||code.isEmpty()||!credentialsReady(env))return;\n            if(connecting || ws!=null)return;\n\n            manualStop=false;\n            connecting=true;\n\n            if(reconnectTask!=null){\n                stockLiveHandler.removeCallbacks(reconnectTask);\n                reconnectTask=null;\n            }\n\n            new Thread(()->{\n                try{\n                    if(approvalKey==null || approvalKey.isEmpty()){\n                        approvalKey=requestApprovalKey(env);\n                    }\n\n                    String uri=isReal(env)\n                        ? \"ws://ops.koreainvestment.com:21000\"\n                        : \"ws://ops.koreainvestment.com:31000\";\n\n                    Request req=new Request.Builder()\n                        .url(uri)\n                        .build();\n\n                    ws=wsClient.newWebSocket(req,this);\n\n                }catch(Exception e){\n                    connecting=false;\n                    liveWsStatus=\"REST 보완\";\n                    reconnectLater();\n                }\n            }).start();\n        }\n\n        void stop(){\n            manualStop=true;\n            connecting=false;\n            retryCount=0;\n\n            if(reconnectTask!=null){\n                stockLiveHandler.removeCallbacks(reconnectTask);\n                reconnectTask=null;\n            }\n\n            try{\n                if(ws!=null)ws.close(1000,\"bye\");\n            }catch(Exception ignored){}\n            ws=null;\n            subscribed=\"\";\n        }\n\n        void subscribe(String tr){\n            if(ws==null||approvalKey.isEmpty())return;\n\n            try{\n                JSONObject h=new JSONObject();\n                h.put(\"approval_key\",approvalKey);\n                h.put(\"custtype\",\"P\");\n                h.put(\"tr_type\",\"1\");\n                h.put(\"content-type\",\"utf-8\");\n\n                JSONObject input=new JSONObject();\n                input.put(\"tr_id\",tr);\n                input.put(\"tr_key\",code);\n\n                JSONObject body=new JSONObject();\n                body.put(\"input\",input);\n\n                JSONObject root=new JSONObject();\n                root.put(\"header\",h);\n                root.put(\"body\",body);\n\n                ws.send(root.toString());\n\n            }catch(Exception ignored){}\n        }\n\n        @Override public void onOpen(WebSocket webSocket,Response response){\n            super.onOpen(webSocket,response);\n\n            // Uploaded KIS specs: integrated KRX+NXT streams.\n            subscribe(\"H0UNCNT0\"); // integrated execution\n            subscribe(\"H0UNASP0\"); // integrated orderbook\n            subscribe(\"H0UNANC0\"); // integrated expected execution\n            subscribe(\"H0UNPGM0\"); // integrated program trading\n\n            connecting=false;\n            retryCount=0;\n            subscribed=code;\n            liveWsStatus=\"연결\";\n            runOnUiThread(()->{ if(bottomConnView!=null)bottomConnView.setText(\"● 실시간 연결\"); });\n\n            runOnUiThread(()->{\n                if(stockLiveActive){\n                    Toast.makeText(\n                        MainActivity.this,\n                        \"KIS 실시간 연결 완료\",\n                        Toast.LENGTH_SHORT\n                    ).show();\n                }\n            });\n        }\n\n        @Override public void onMessage(WebSocket webSocket,String msg){\n            parse(msg);\n        }\n\n        @Override public void onClosing(WebSocket webSocket,int code,String reason){\n            try{ webSocket.close(code,reason); }catch(Exception ignored){}\n        }\n\n        @Override public void onClosed(WebSocket webSocket,int code,String reason){\n            if(ws==webSocket)ws=null;\n            connecting=false;\n            subscribed=\"\";\n\n            if(manualStop){\n                liveWsStatus=\"종료\";\n                runOnUiThread(()->{ if(bottomConnView!=null)bottomConnView.setText(\"● 연결 종료\"); });\n                return;\n            }\n\n            liveWsStatus=\"REST 보완\";\n            runOnUiThread(()->{ if(bottomConnView!=null)bottomConnView.setText(\"● REST 보완\"); });\n            reconnectLater();\n        }\n\n        @Override public void onFailure(WebSocket webSocket,Throwable t,Response response){\n            if(ws==webSocket)ws=null;\n            connecting=false;\n            subscribed=\"\";\n\n            if(manualStop)return;\n\n            liveWsStatus=\"REST 보완\";\n            reconnectLater();\n        }\n\n        void reconnectLater(){\n            if(manualStop || reconnectTask!=null)return;\n\n            retryCount=Math.min(retryCount+1,6);\n            long delay=Math.min(60000L,3000L*(1L<<Math.min(4,retryCount-1)));\n\n            reconnectTask=()->{\n                reconnectTask=null;\n                if(!manualStop &&\n                   stockLiveActive &&\n                   code.equals(liveCode) &&\n                   ws==null &&\n                   !connecting){\n                    liveWsStatus=\"재연결\";\n                    start();\n                }\n            };\n\n            stockLiveHandler.postDelayed(reconnectTask,delay);\n        }\n\n        void parse(String msg){\n            if(msg==null||msg.isEmpty())return;\n\n            // KIS control frames are JSON. PINGPONG must be echoed back.\n            if(msg.charAt(0)=='{'){\n                try{\n                    JSONObject j=new JSONObject(msg);\n                    JSONObject h=j.optJSONObject(\"header\");\n                    if(h!=null && \"PINGPONG\".equals(h.optString(\"tr_id\",\"\")) && ws!=null){\n                        ws.send(msg);\n                    }\n                }catch(Exception ignored){}\n                return;\n            }\n\n            // Realtime data: encryption flag | TR ID | count | caret-delimited payload\n            String[] p=msg.split(\"\\\\|\",4);\n            if(p.length<4)return;\n\n            String tr=p[1];\n            String[] v=p[3].split(\"\\\\^\",-1);\n\n            try{\n                if(\"H0UNCNT0\".equals(tr) && v.length>=45){\n                    liveLastPrice=v[2];\n                    liveLastChange=v[4];\n                    liveLastRate=v[5];\n                    liveLastTradeVolume=v[12];\n                    liveLastVolume=v[13];\n                    liveLastAmount=v[14];\n                    liveLastStrength=v[18];\n                    liveTradeTime=v[1];\n                    liveOpen=v[7];\n                    liveHigh=v[8];\n                    liveLow=v[9];\n                    liveBidRate=v.length>22?v[22]:\"\";\n                    livePrevSameTimeRate=v.length>42?v[42]:\"\";\n                    liveSeq++;\n\n                }else if(\"H0UNASP0\".equals(tr) && v.length>=45){\n                    StringBuilder b=new StringBuilder();\n                    liveBestAsk=v[3];\n                    liveBestBid=v[13];\n                    if(v.length>=65){\n                        liveNxtAvailable=\n                            num(v[62])>0 || num(v[63])>0 ||\n                            (v[64]!=null && !v[64].trim().isEmpty() && !\"0\".equals(v[64].trim()));\n                        liveExpectPrice=v[47];\n                        liveExpectQty=v[48];\n                        liveExpectRate=v[52];\n                    }\n\n                    for(int i=9;i>=0;i--){\n                        b.append(String.format(\n                            Locale.KOREA,\n                            \"%8s │ %9s │ %8s\\n\",\n                            qty(v[23+i]),\n                            money(v[3+i]),\n                            \"\"\n                        ));\n                    }\n\n                    b.append(\"──────── 현재가 ────────\\n\");\n\n                    for(int i=0;i<10;i++){\n                        b.append(String.format(\n                            Locale.KOREA,\n                            \"%8s │ %9s │ %8s\\n\",\n                            \"\",\n                            money(v[13+i]),\n                            qty(v[33+i])\n                        ));\n                    }\n\n                    liveOrderBook=b.toString();\n                    if(v.length>44){\n                        liveAskTotal=v[43];\n                        liveBidTotal=v[44];\n                    }\n                    liveSeq++;\n\n                }else if(\"H0UNANC0\".equals(tr) && v.length>=46){\n                    liveExpectPrice=v[2];\n                    liveExpectQty=v.length>12?v[12]:\"\";\n                    liveExpectRate=v.length>5?v[5]:\"\";\n                    liveSeq++;\n\n                }else if(\"H0UNPGM0\".equals(tr) && v.length>=8){\n                    liveProgramNet=v[6];\n                    liveSeq++;\n                }\n\n            }catch(Exception ignored){}\n        }\n    }\n\n    boolean realtimeOrderBookSane(){\n        double p=num(liveLastPrice);\n        double a=num(liveBestAsk);\n        double b=num(liveBestBid);\n        if(p<=0)return true;\n        double ref=a>0?a:(b>0?b:p);\n        if(ref<=0)return true;\n        return Math.abs(ref-p)/p <= 0.035;\n    }\n\n    String requestApprovalKey(String env)throws Exception{\n        JSONObject body=new JSONObject();\n        body.put(\"grant_type\",\"client_credentials\");\n        body.put(\"appkey\",prefs.getString(keyName(env),\"\"));\n        body.put(\"secretkey\",prefs.getString(secretName(env),\"\"));\n        HttpResult r=postJson(baseUrl(env)+\"/oauth2/Approval\",body.toString());\n        if(r.body==null||r.body.trim().isEmpty())throw new Exception(\"웹소켓 접속키 응답 없음\");\n        JSONObject j=new JSONObject(r.body);\n        String k=j.optString(\"approval_key\",\"\");\n        if(k.isEmpty())throw new Exception(j.optString(\"msg1\",\"웹소켓 접속키 발급 실패\"));\n        return k;\n    }\n\n    static class HttpResult{\n        int code;\n        String body;\n\n        HttpResult(int c,String b){\n            code=c;\n            body=b;\n        }\n    }\n\n    HttpResult postJson(String url,String body)throws Exception{\n        HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();\n\n        try{\n            c.setRequestMethod(\"POST\");\n            c.setConnectTimeout(15000);\n            c.setReadTimeout(20000);\n            c.setDoOutput(true);\n            c.setRequestProperty(\n                \"Content-Type\",\n                \"application/json; charset=utf-8\"\n            );\n\n            byte[] bytes=body.getBytes(StandardCharsets.UTF_8);\n\n            try(OutputStream os=c.getOutputStream()){\n                os.write(bytes);\n            }\n\n            int http=c.getResponseCode();\n\n            InputStream is=\n                (http>=200&&http<400)\n                ? c.getInputStream()\n                : c.getErrorStream();\n\n            return new HttpResult(http,readAll(is));\n\n        }finally{\n            c.disconnect();\n        }\n    }\n\n    String readAll(InputStream is)throws Exception{\n        if(is==null)return \"\";\n\n        BufferedReader br=\n            new BufferedReader(\n                new InputStreamReader(\n                    is,\n                    StandardCharsets.UTF_8\n                )\n            );\n\n        StringBuilder sb=new StringBuilder();\n        String line;\n\n        while((line=br.readLine())!=null){\n            sb.append(line);\n        }\n\n        br.close();\n        return sb.toString();\n    }\n\n    String defaultChartScript(){\n        return \"SHOW_MA5=true\\n\"+\n               \"SHOW_MA10=true\\n\"+\n               \"SHOW_MA20=true\\n\"+\n               \"SHOW_MA60=true\\n\"+\n               \"SHOW_MA120=true\\n\"+\n               \"SHOW_BOLLINGER=true\\n\"+\n               \"SHOW_ENVELOPE=true\\n\"+\n               \"SHOW_PSAR=true\\n\"+\n               \"SHOW_PRICE_CHANNEL=true\\n\"+\n               \"SHOW_ICHIMOKU=true\\n\"+\n               \"SHOW_VOLUME_PROFILE=true\\n\"+\n               \"LOWER_INDICATOR=RSI\\n\"+\n               \"SHOW_VOLUME=true\\n\"+\n               \"SHOW_BOS=true\\n\"+\n               \"SHOW_DISCOUNT=true\\n\"+\n               \"SHOW_EXPLOSION=true\";\n    }\n\n    String normalChartScript(){\n        String raw=prefs.getString(NORMAL_CHART_SCRIPT_KEY,\"\");\n        if(raw==null || raw.trim().isEmpty()){\n            raw=prefs.getString(\"chart_script\",defaultChartScript());\n            prefs.edit().putString(NORMAL_CHART_SCRIPT_KEY,raw).apply();\n        }\n        return raw;\n    }\n\n    String precisionChartScript(){\n        String raw=prefs.getString(PRECISION_CHART_SCRIPT_KEY,\"\");\n        if(raw==null || raw.trim().isEmpty()){\n            raw=prefs.getString(\"chart_script\",defaultChartScript());\n            prefs.edit().putString(PRECISION_CHART_SCRIPT_KEY,raw).apply();\n        }\n        return raw;\n    }\n\n    void applyNormalChartScript(RealtimeStockChartView chart){\n        if(chart==null)return;\n        Map<String,String> cfg=parseRules(normalChartScript());\n\n        boolean ma5=ruleBool(cfg,\"SHOW_MA5\",true);\n        boolean ma10=ruleBool(cfg,\"SHOW_MA10\",true);\n        boolean ma20=ruleBool(cfg,\"SHOW_MA20\",true);\n        boolean ma60=ruleBool(cfg,\"SHOW_MA60\",true);\n        boolean ma120=ruleBool(cfg,\"SHOW_MA120\",true);\n\n        chart.showMA5=ma5;\n        chart.showMA10=ma10;\n        chart.showMA20=ma20;\n        chart.showMA60=ma60;\n        chart.showMA120=ma120;\n        chart.showBollinger=ruleBool(cfg,\"SHOW_BOLLINGER\",true);\n        chart.showEnvelope=ruleBool(cfg,\"SHOW_ENVELOPE\",false);\n        chart.showPSAR=ruleBool(cfg,\"SHOW_PSAR\",false);\n        chart.showPriceChannel=ruleBool(cfg,\"SHOW_PRICE_CHANNEL\",false);\n        chart.showIchimoku=ruleBool(cfg,\"SHOW_ICHIMOKU\",true);\n        chart.showVolumeProfile=ruleBool(cfg,\"SHOW_VOLUME_PROFILE\",true);\n\n        String lower=cfg.get(\"LOWER_INDICATOR\");\n        if(lower==null)lower=\"RSI\";\n        lower=lower.trim().toUpperCase(Locale.US);\n        chart.lowerIndicator=\n            \"STOCH\".equals(lower)||\"STOCHASTIC\".equals(lower)?1:\n            \"MACD\".equals(lower)?2:\n            \"MFI\".equals(lower)?3:\n            \"MOMENTUM\".equals(lower)?4:\n            \"ADX\".equals(lower)?5:0;\n\n        chart.invalidate();\n    }\n\n    String safeFileName(String raw){\n        String x=raw==null?\"script\":raw.trim();\n        if(x.isEmpty())x=\"script\";\n        return x.replaceAll(\"[\\\\\\\\/:*?\\\"<>|]\",\"_\");\n    }\n\n    String readTextUri(Uri uri)throws Exception{\n        StringBuilder sb=new StringBuilder();\n        BufferedReader br=new BufferedReader(new InputStreamReader(\n            getContentResolver().openInputStream(uri),StandardCharsets.UTF_8));\n        String line;\n        while((line=br.readLine())!=null)sb.append(line).append(\"\\n\");\n        br.close();\n        return sb.toString();\n    }\n\n    void writeTextUri(Uri uri,String raw)throws Exception{\n        OutputStream os=getContentResolver().openOutputStream(uri,\"wt\");\n        if(os==null)throw new Exception(\"파일 출력 스트림을 열 수 없습니다.\");\n        BufferedWriter bw=new BufferedWriter(new OutputStreamWriter(os,StandardCharsets.UTF_8));\n        bw.write(raw==null?\"\":raw); bw.flush(); bw.close();\n    }\n\n    String uriDisplayName(Uri uri){\n        String fileName=\"선택한 파일\";\n        Cursor cursor=getContentResolver().query(uri,null,null,null,null);\n        if(cursor!=null){\n            try{\n                int idx=cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME);\n                if(idx>=0 && cursor.moveToFirst())fileName=cursor.getString(idx);\n            }finally{cursor.close();}\n        }\n        return fileName;\n    }\n\n    String safeError(Exception e){\n        String m=e.getMessage();\n        return (m==null||m.isEmpty())\n            ? e.getClass().getSimpleName()\n            : m;\n    }\n\n    @Override\n    protected void onActivityResult(int requestCode,int resultCode,Intent data){\n        super.onActivityResult(requestCode,resultCode,data);\n        if(resultCode!=RESULT_OK || data==null)return;\n        Uri uri=data.getData();\n        if(uri==null)return;\n\n        try{\n            if(requestCode==REQ_NORMAL_CHART_SCRIPT){\n                String raw=readTextUri(uri);\n                String fileName=uriDisplayName(uri);\n                prefs.edit()\n                    .putString(NORMAL_CHART_SCRIPT_KEY,raw)\n                    .putString(NORMAL_CHART_SCRIPT_FILE_NAME,fileName)\n                    .apply();\n                Toast.makeText(this,\"일반 차트 스크립트 적용: \"+fileName,Toast.LENGTH_LONG).show();\n                showAI(); return;\n            }\n            if(requestCode==REQ_PRECISION_CHART_SCRIPT){\n                String raw=readTextUri(uri);\n                String fileName=uriDisplayName(uri);\n                prefs.edit()\n                    .putString(PRECISION_CHART_SCRIPT_KEY,raw)\n                    .putString(PRECISION_CHART_SCRIPT_FILE_NAME,fileName)\n                    .apply();\n                Toast.makeText(this,\"정밀 차트 스크립트 적용: \"+fileName,Toast.LENGTH_LONG).show();\n                showAI(); return;\n            }\n            if(requestCode==REQ_NORMAL_CHART_EXPORT ||\n               requestCode==REQ_PRECISION_CHART_EXPORT){\n                writeTextUri(uri,pendingChartExport);\n                Toast.makeText(\n                    this,\n                    \"precision\".equals(pendingChartExportMode)\n                        ?\"정밀 차트 스크립트 파일 저장 완료\"\n                        :\"일반 차트 스크립트 파일 저장 완료\",\n                    Toast.LENGTH_LONG\n                ).show();\n                return;\n            }\n            if(requestCode>REQ_CUSTOM_IMPORT_BASE && requestCode<=REQ_CUSTOM_IMPORT_BASE+5){\n                int slot=requestCode-REQ_CUSTOM_IMPORT_BASE;\n                String raw=readTextUri(uri);\n                String title=\"사용자 커스텀 \"+slot;\n                StringBuilder rules=new StringBuilder();\n                for(String line:raw.split(\"\\\\n\")){\n                    if(line.startsWith(\"#MARCUS_SCANNER_TITLE=\")){\n                        title=line.substring(\"#MARCUS_SCANNER_TITLE=\".length()).trim();\n                    }else if(!line.startsWith(\"#MARCUS_SCANNER_FILE\")){\n                        rules.append(line).append(\"\\n\");\n                    }\n                }\n                prefs.edit()\n                    .putString(\"custom_scanner_title_\"+slot,title)\n                    .putString(\"custom_scanner_script_\"+slot,rules.toString().trim()).apply();\n                Toast.makeText(this,\"사용자 커스텀 \"+slot+\" 파일 적용 완료\",Toast.LENGTH_LONG).show();\n                showAI(); return;\n            }\n            if(requestCode>REQ_CUSTOM_EXPORT_BASE && requestCode<=REQ_CUSTOM_EXPORT_BASE+5){\n                int slot=requestCode-REQ_CUSTOM_EXPORT_BASE;\n                String body=\"#MARCUS_SCANNER_FILE=1\\n#MARCUS_SCANNER_TITLE=\"+pendingCustomTitle+\"\\n\"+pendingCustomScript;\n                writeTextUri(uri,body);\n                Toast.makeText(this,\"사용자 커스텀 \"+slot+\" 파일 저장 완료\",Toast.LENGTH_LONG).show();\n                return;\n            }\n        }catch(Exception e){\n            Toast.makeText(this,\"파일 처리 실패: \"+safeError(e),Toast.LENGTH_LONG).show();\n        }\n    }\n\n    @Override\n    public void onBackPressed(){\n        if(!\"HOME\".equals(screenMode)){\n            handleBackNavigation();\n            return;\n        }\n        super.onBackPressed();\n    }\n\n    String mask(String\
        \ v){\n        if(v==null||v.isEmpty())return \"미설정\";\n        if(v.length()<=8)return \"••••••••\";\n        return v.substring(0,4)+\"••••••\"+v.substring(v.length()-4);\n    }\n}\nJAVA\n"
    - name: Update compatibility
      run: 'echo "applicationId=com.marcus.aiswing"

        echo "versionCode=75"

        echo "versionName=2.18"

        echo "App data persists when installed over an existing app signed with the same certificate."

        '
    - name: Restore permanent signing keystore
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: 'test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }

        printf ''%s'' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/marcus-release.jks

        keytool -list -keystore app/marcus-release.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" >/dev/null

        '
    - name: Configure permanent release signing
      run: "cat >> app/build.gradle <<'EOF'\n\nandroid {\n    signingConfigs {\n        permanentRelease {\n            storeFile file(\"marcus-release.jks\")\n            storePassword System.getenv(\"ANDROID_KEYSTORE_PASSWORD\")\n            keyAlias System.getenv(\"ANDROID_KEY_ALIAS\")\n            keyPassword System.getenv(\"ANDROID_KEY_PASSWORD\")\n        }\n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n            signingConfig signingConfigs.permanentRelease\n        }\n    }\n}\nEOF\n"
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    - name: Build v2.18.2 permanently signed APK
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: gradle :app:assembleRelease --no-daemon
    - name: Verify APK identity and certificate
      run: 'APK=app/build/outputs/apk/release/app-release.apk

        test -f "$APK"

        echo "APK SHA-256:"

        sha256sum "$APK"

        echo "Signing certificate:"

        keytool -printcert -jarfile "$APK" | grep -E ''Owner:|Issuer:|SHA256:'' || true

        echo "Expected package: com.marcus.aiswing"

        echo "Expected versionCode: 80"

        echo "Expected versionName: 2.18.2"

        '
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Marcus-AI-SWING-v2.18.2-STABLE-PATCH
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 30
