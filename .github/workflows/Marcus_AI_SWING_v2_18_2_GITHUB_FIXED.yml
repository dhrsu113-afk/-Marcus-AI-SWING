name: Marcus AI SWING v2.18.2 Stable Patch
# Stable v2.18 workflow structure; feature code patched for v2.18.2.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2'
    - name: Create Android project
      run: "mkdir -p app/src/main/java/com/marcus/aiswing\nmkdir -p app/src/main/res/values\nmkdir -p app/src/main/assets\ncurl -L --fail --retry 3 https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js -o app/src/main/assets/lightweight-charts.js\n\npython3 - <<'PY'\nimport csv, io, os, urllib.request, zipfile\n\nsources = [\n    (\"KOSPI\", \"https://new.real.download.dws.co.kr/common/master/kospi_code.mst.zip\", \"kospi_code.mst\", 228),\n    (\"KOSDAQ\", \"https://new.real.download.dws.co.kr/common/master/kosdaq_code.mst.zip\", \"kosdaq_code.mst\", 222),\n]\n\nrows = []\nseen = set()\n\nfor market, url, mst_name, tail_len in sources:\n    print(\"download\", market, url)\n    data = urllib.request.urlopen(url, timeout=30).read()\n\n    with zipfile.ZipFile(io.BytesIO(data)) as z:\n        raw = z.read(mst_name)\n\n    text = raw.decode(\"cp949\", errors=\"ignore\")\n\n    for line in text.splitlines():\n        if len(line) <= tail_len:\n            continue\n\n        head = line[:-tail_len]\n        short_code = head[0:9].strip()\n        std_code = head[9:21].strip()\n        name = head[21:].strip()\n\n        # KIS master short code is normally 6 digits; normalize safely.\n        digits = \"\".join(ch for ch in short_code if ch.isdigit())\n        code = digits[-6:] if len(digits) >= 6 else short_code[-6:]\n\n        if len(code) != 6 or not code.isdigit() or not name:\n            continue\n\n        key = (code, market)\n        if key in seen:\n            continue\n        seen.add(key)\n        rows.append((code, name, market, std_code))\n\nrows.sort(key=lambda x: (x[1], x[0]))\n\nout = \"app/src/main/assets/stocks.csv\"\nwith open(out, \"w\", encoding=\"utf-8\", newline=\"\") as f:\n    w = csv.writer(f)\n    w.writerow([\"code\",\"name\",\"market\",\"std_code\"])\n    w.writerows(rows)\n\nprint(\"master rows:\", len(rows))\nPY\n\ncat > app/src/main/assets/chart.html <<'EOF'\n<!doctype html>\n<html>\n<head>\n  <meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes\">\n  <style>\n    html,body{margin:0;padding:0;background:#0c1830;color:#f4f7ff;font-family:Arial,sans-serif;height:100%;overflow:hidden}\n    #wrap{height:100%;display:flex;flex-direction:column}\n    #toolbar{display:flex;gap:5px;padding:6px;align-items:center;font-size:11px;color:#9aabc7;flex-wrap:wrap}\n    #toolbar button{background:#20385f;color:#f5f7ff;border:1px solid #46679e;border-radius:7px;padding:5px 8px}\n    #toolbar button.active{background:linear-gradient(90deg,#426ff4,#8b5cf6)}\n    #status{margin-left:auto}\n    #chart{flex:1;min-height:280px;touch-action:none}\n    #tip{position:absolute;left:8px;top:72px;z-index:12;background:rgba(8,16,30,.94);padding:8px 10px;border:1px solid #44536b;border-radius:6px;font-size:12px;pointer-events:none;max-width:92%;white-space:nowrap}\n    #analysisGrid{position:absolute;right:8px;top:8px;z-index:11;width:min(48%,620px);background:rgba(32,18,22,.86);border:1px solid #49505e;font-size:10px;color:#e7ebf4;pointer-events:auto;touch-action:none;user-select:none}\n    #analysisGrid table{width:100%;border-collapse:collapse;table-layout:fixed}\n    #analysisGrid th,#analysisGrid td{border:1px solid rgba(180,190,205,.22);padding:3px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n    #analysisGrid th:nth-child(1){background:#536f3e}\n    #analysisGrid th:nth-child(3){background:#4b59a6}\n    #analysisGrid th:nth-child(5){background:#b86b16}\n    #analysisGrid .k{background:rgba(105,91,101,.65);color:#f2eef1;font-weight:bold}\n    #analysisGrid .good{color:#50d98a;font-weight:bold}\n    #analysisGrid .warn{color:#ffbe4a;font-weight:bold}\n    #analysisGrid .bad{color:#ff6666;font-weight:bold}\n    #analysisGrid .cyan{color:#59dbe8;font-weight:bold}\n    @media(max-width:900px){#analysisGrid{width:52%;font-size:9px}#analysisGrid th,#analysisGrid td{padding:2px 3px}}\n  </style>\n</head>\n<body>\n<div id=\"wrap\">\n  <div id=\"toolbar\">\n    <button id=\"trend\">추세선</button>\n    <button id=\"horizontal\">수평선</button>\n    <button id=\"lineColor\">선색상</button>\n    <button id=\"clear\">그리기 삭제</button>\n    <span>핀치확대 · 좌우이동 · 십자선</span>\n    <span id=\"status\">차트 준비중...</span>\n  </div>\n  <div id=\"chart\" style=\"position:relative\">\n    <svg id=\"drawOverlay\" style=\"position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none\"></svg>\n    <div id=\"analysisGrid\">\n      <table>\n        <tr id=\"analysisDragHandle\"><th colspan=\"6\" style=\"background:#202a38;color:#d9e6ff;text-align:center;cursor:move\">↕ 분석표 이동</th></tr>\n        <tr><th colspan=\"2\">AI 판단</th><th colspan=\"2\">차트 상태</th><th colspan=\"2\">매도 전략</th></tr>\n        <tr><td class=\"k\">AI</td><td id=\"a_ai\">-</td><td class=\"k\">Discount</td><td id=\"a_discount\">-</td><td class=\"k\">보유</td><td id=\"a_hold\">-</td></tr>\n        <tr><td class=\"k\">행동</td><td id=\"a_action\">-</td><td class=\"k\">Weak Low</td><td id=\"a_weak\">-</td><td class=\"k\">시간</td><td id=\"a_time\">-</td></tr>\n        <tr><td class=\"k\">이유</td><td id=\"a_reason\">-</td><td class=\"k\">BOS</td><td id=\"a_bos\">-</td><td class=\"k\">손절</td><td id=\"a_stop\">-</td></tr>\n        <tr><td class=\"k\">품질</td><td id=\"a_quality\">-</td><td class=\"k\">구조</td><td id=\"a_structure\">-</td><td class=\"k\">1차 30%</td><td id=\"a_sell1\">-</td></tr>\n        <tr><td class=\"k\">타이밍</td><td id=\"a_timing\">-</td><td class=\"k\">추세</td><td id=\"a_trend\">-</td><td class=\"k\">2차 30%</td><td id=\"a_sell2\">-</td></tr>\n        <tr><td class=\"k\">판단</td><td id=\"a_judge\">-</td><td class=\"k\">눌림</td><td id=\"a_pullback\">-</td><td class=\"k\">3차 40%</td><td id=\"a_sell3\">-</td></tr>\n        <tr><td class=\"k\">관심</td><td id=\"a_interest\">-</td><td class=\"k\">거래량</td><td id=\"a_volume\">-</td><td class=\"k\">수익</td><td id=\"a_profit\">-</td></tr>\n        <tr><td class=\"k\">지지형</td><td id=\"a_support\">-</td><td class=\"k\">대금</td><td id=\"a_money\">-</td><td class=\"k\">매도 이유</td><td id=\"a_sellreason\">-</td></tr>\n        <tr><td class=\"k\">풀리버비</td><td id=\"a_pullriver\">-</td><td class=\"k\">유동성</td><td id=\"a_liquidity\">-</td><td class=\"k\">1차 매물</td><td id=\"a_zone1\">-</td></tr>\n        <tr><td class=\"k\">유형</td><td id=\"a_type\">-</td><td class=\"k\">BOS 거리</td><td id=\"a_bosdist\">-</td><td class=\"k\">2차 매물</td><td id=\"a_zone2\">-</td></tr>\n        <tr><td class=\"k\">사다 우회</td><td id=\"a_bypass\">-</td><td class=\"k\">압축</td><td id=\"a_compress\">-</td><td class=\"k\">3분 보호</td><td id=\"a_protect\">-</td></tr>\n        <tr><td class=\"k\">포착등급</td><td id=\"a_capture\">-</td><td class=\"k\">현재등급</td><td id=\"a_grade\">-</td><td class=\"k\">최고 수익</td><td id=\"a_best\">-</td></tr>\n        <tr><td class=\"k\">LEADER</td><td id=\"a_leader\">-</td><td class=\"k\">20고 이전</td><td id=\"a_prev20\">-</td><td class=\"k\">매수 전략</td><td id=\"a_buy\">-</td></tr>\n        <tr><td class=\"k\">대금가속</td><td id=\"a_accel\">-</td><td class=\"k\">5일강도</td><td id=\"a_strength5\">-</td><td class=\"k\">1차 매수</td><td id=\"a_buy1\">-</td></tr>\n        <tr><td class=\"k\">추세질</td><td id=\"a_trendq\">-</td><td class=\"k\">RVOL</td><td id=\"a_rvol\">-</td><td class=\"k\">2차 매수</td><td id=\"a_buy2\">-</td></tr>\n        <tr><td class=\"k\">A검증</td><td id=\"a_verify\">-</td><td class=\"k\">BOS/대금</td><td id=\"a_bosmoney\">-</td><td class=\"k\">추격금지</td><td id=\"a_nochase\">-</td></tr>\n        <tr><td class=\"k\">점화검증</td><td id=\"a_ignite\">-</td><td class=\"k\">상태</td><td id=\"a_state\">-</td><td class=\"k\">무효화</td><td id=\"a_invalid\">-</td></tr>\n      </table>\n    </div>\n  </div>\n</div>\n<div id=\"tip\">봉을 터치하면 시가/고가/저가/종가/거래량을 확인할 수 있습니다.</div>\n<script src=\"lightweight-charts.js\"></script>\n<script>\n  window.addEventListener('error',e=>{\n    const s=document.getElementById('status');\n    if(s)s.textContent='차트 오류: '+(e.message||'unknown');\n  });\n  const container=document.getElementById('chart');\n  const tip=document.getElementById('tip');\n  const status=document.getElementById('status');\n\n  function setCell(id,value,cls){\n    const el=document.getElementById(id);\n    if(!el)return;\n    el.textContent=(value===undefined||value===null||value==='')?'-':String(value);\n    el.className=cls||'';\n  }\n\n  function renderAnalysis(a){\n    a=a||{};\n    const score=Number(a.score||0);\n    setCell('a_ai',(a.score!==undefined?score+'/100 ':'')+(a.label||'-'),score>=80?'good':score>=65?'warn':'');\n    setCell('a_action',a.action||'-',a.action==='진입'?'good':a.action==='대기'?'warn':'');\n    setCell('a_reason',a.reason||'-'); setCell('a_quality',a.quality||'-');\n    setCell('a_timing',a.timing||'-'); setCell('a_judge',a.judge||'-');\n    setCell('a_interest',a.interest||'-'); setCell('a_support',a.support||'-');\n    setCell('a_pullriver',a.pullriver||'-'); setCell('a_type',a.type||'-');\n    setCell('a_bypass',a.bypass||'-'); setCell('a_capture',a.capture||'-','cyan');\n    setCell('a_leader',a.leader||'-',a.leader&&a.leader!=='-'?'good':'');\n    setCell('a_accel',a.accel||'-'); setCell('a_trendq',a.trendq||'-');\n    setCell('a_verify',a.verify||'-','cyan'); setCell('a_ignite',a.ignite||'-');\n    setCell('a_discount',a.discount||'-',a.discount==='진입'?'good':'');\n    setCell('a_weak',a.weak||'-',a.weak==='유지'?'good':'');\n    setCell('a_bos',a.bos||'-',a.bos==='돌파'?'good':'');\n    setCell('a_structure',a.structure||'-'); setCell('a_trend',a.trend||'-',a.trend==='회복'?'warn':'');\n    setCell('a_pullback',a.pullback||'-',a.pullback&&a.pullback!=='-'?'bad':'');\n    setCell('a_volume',a.volume||'-','good'); setCell('a_money',a.money||'-');\n    setCell('a_liquidity',a.liquidity||'-'); setCell('a_bosdist',a.bosdist||'-');\n    setCell('a_compress',a.compress||'-','warn'); setCell('a_grade',a.grade||'-','cyan');\n    setCell('a_prev20',a.prev20||'-'); setCell('a_strength5',a.strength5||'-');\n    setCell('a_rvol',a.rvol||'-','good'); setCell('a_bosmoney',a.bosmoney||'-','warn');\n    setCell('a_state',a.state||'-'); setCell('a_hold',a.hold||'-');\n    setCell('a_time',a.time||'-'); setCell('a_stop',a.stop||'-');\n    setCell('a_sell1',a.sell1||'-'); setCell('a_sell2',a.sell2||'-');\n    setCell('a_sell3',a.sell3||'-'); setCell('a_profit',a.profit||'-');\n    setCell('a_sellreason',a.sellreason||'-'); setCell('a_zone1',a.zone1||'-');\n    setCell('a_zone2',a.zone2||'-'); setCell('a_protect',a.protect||'-');\n    setCell('a_best',a.best||'-'); setCell('a_buy',a.buy||'-','good');\n    setCell('a_buy1',a.buy1||'-'); setCell('a_buy2',a.buy2||'-');\n    setCell('a_nochase',a.nochase||'-'); setCell('a_invalid',a.invalid||'-');\n  }\n\n  function enableAnalysisDrag(){\n    const box=document.getElementById('analysisGrid');\n    const handle=document.getElementById('analysisDragHandle');\n    if(!box || !handle)return;\n\n    let dragging=false,startX=0,startY=0,startLeft=0,startTop=0;\n    const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));\n\n    handle.addEventListener('pointerdown',e=>{\n      dragging=true;\n      handle.setPointerCapture(e.pointerId);\n\n      const r=box.getBoundingClientRect();\n      const cr=container.getBoundingClientRect();\n      box.style.right='auto';\n      box.style.left=(r.left-cr.left)+'px';\n      box.style.top=(r.top-cr.top)+'px';\n\n      startX=e.clientX;\n      startY=e.clientY;\n      startLeft=parseFloat(box.style.left)||0;\n      startTop=parseFloat(box.style.top)||0;\n\n      e.preventDefault();\n      e.stopPropagation();\n    });\n\n    handle.addEventListener('pointermove',e=>{\n      if(!dragging)return;\n      const maxLeft=Math.max(0,container.clientWidth-box.offsetWidth);\n      const maxTop=Math.max(0,container.clientHeight-box.offsetHeight);\n      box.style.left=clamp(startLeft+(e.clientX-startX),0,maxLeft)+'px';\n      box.style.top=clamp(startTop+(e.clientY-startY),0,maxTop)+'px';\n      e.preventDefault();\n      e.stopPropagation();\n    });\n\n    const stop=e=>{\n      if(!dragging)return;\n      dragging=false;\n      try{handle.releasePointerCapture(e.pointerId);}catch(_){}\n      e.preventDefault();\n      e.stopPropagation();\n    };\n    handle.addEventListener('pointerup',stop);\n    handle.addEventListener('pointercancel',stop);\n  }\n\n  function timeKey(t){\n    if(t===undefined||t===null)return '';\n    if(typeof t==='string' || typeof t==='number')return String(t);\n    if(typeof t==='object' && t.year!==undefined){\n      const mm=String(t.month).padStart(2,'0');\n      const dd=String(t.day).padStart(2,'0');\n      return String(t.year)+'-'+mm+'-'+dd;\n    }\n    return String(t);\n  }\n\n  function showCandleTip(time){\n    const d=byTime[timeKey(time)];\n    if(!d)return;\n    tip.style.display='block';\n    tip.textContent=\n      (d.label||d.time)+'  시 '+Number(d.open).toLocaleString()+'원  고 '+Number(d.high).toLocaleString()+\n      '원  저 '+Number(d.low).toLocaleString()+'원  종 '+Number(d.close).toLocaleString()+\n      '원  거래량 '+Number(d.volume||0).toLocaleString()+'주';\n  }\n\n  const chart=LightweightCharts.createChart(container,{\n    layout:{background:{type:'solid',color:'#0c1830'},textColor:'#dce6fa'},\n    grid:{vertLines:{color:'#1e3154'},horzLines:{color:'#1e3154'}},\n    rightPriceScale:{borderColor:'#2a3956'},\n    timeScale:{borderColor:'#2a3956',timeVisible:true,secondsVisible:false,rightOffset:10,barSpacing:7},\n    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},\n    handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:true},\n    handleScale:{axisPressedMouseMove:true,mouseWheel:true,pinch:true}\n  });\n\n  const candleSeries=chart.addSeries(LightweightCharts.CandlestickSeries,{\n    upColor:'#ef5350',downColor:'#3b82f6',\n    borderUpColor:'#ef5350',borderDownColor:'#3b82f6',\n    wickUpColor:'#ef5350',wickDownColor:'#3b82f6'\n  });\n  const ma5=chart.addSeries(LightweightCharts.LineSeries,{lineWidth:2,color:'#ffd54f'});\n  const ma10=chart.addSeries(LightweightCharts.LineSeries,{lineWidth:2,color:'#4dd0e1'});\n  const ma15=chart.addSeries(LightweightCharts.LineSeries,{lineWidth:2,color:'#b388ff'});\n  const ma20=chart.addSeries(LightweightCharts.LineSeries,{lineWidth:2,color:'#69f0ae'});\n  const volumeSeries=chart.addSeries(LightweightCharts.HistogramSeries,{\n    priceScaleId:'',\n    priceFormat:{type:'volume'}\n  });\n  volumeSeries.priceScale().applyOptions({\n    scaleMargins:{top:0.78,bottom:0}\n  });\n  candleSeries.priceScale().applyOptions({\n    scaleMargins:{top:0.05,bottom:0.23}\n  });\n  const markerApi=(typeof LightweightCharts.createSeriesMarkers==='function')\n    ? LightweightCharts.createSeriesMarkers(candleSeries,[])\n    : null;\n\n  let byTime={};\n  let drawMode=null;\n  let firstPoint=null;\n  let lineDrawings=[];\n  let priceDrawings=[];\n  const drawColors=['#ffd54f','#4dd0e1','#b388ff','#ff718f','#69f0ae','#ffffff'];\n  let drawColorIndex=0;\n  let drawColor=drawColors[0];\n\n  const trendBtn=document.getElementById('trend');\n  const horizontalBtn=document.getElementById('horizontal');\n\n  function setMode(mode){\n    drawMode=mode;\n    firstPoint=null;\n    trendBtn.classList.toggle('active',mode==='trend');\n    horizontalBtn.classList.toggle('active',mode==='horizontal');\n    tip.textContent=mode==='trend'\n      ? '추세선: 시작점과 끝점을 차례로 터치하세요.'\n      : mode==='horizontal'\n      ? '수평선: 원하는 가격 위치를 터치하세요.'\n      : '봉을 터치하면 시가/고가/저가/종가/거래량을 확인할 수 있습니다.';\n  }\n\n  trendBtn.addEventListener('click',()=>setMode(drawMode==='trend'?null:'trend'));\n  document.getElementById('lineColor').addEventListener('click',()=>{\n    drawColorIndex=(drawColorIndex+1)%drawColors.length;\n    drawColor=drawColors[drawColorIndex];\n    document.getElementById('lineColor').style.borderColor=drawColor;\n    tip.textContent='그리기 색상 변경됨';\n  });\n  horizontalBtn.addEventListener('click',()=>setMode(drawMode==='horizontal'?null:'horizontal'));\n  document.getElementById('clear').addEventListener('click',()=>{\n    lineDrawings=[];\n    document.getElementById('drawOverlay').innerHTML='';\n    priceDrawings.forEach(p=>candleSeries.removePriceLine(p));\n    priceDrawings=[];\n    setMode(null);\n  });\n\n  enableAnalysisDrag();\n\n  window.setStockData=function(payload){\n    const d=payload.candles||[];\n    byTime={};\n    d.forEach(x=>byTime[timeKey(x.time)]=x);\n    candleSeries.setData(d);\n    ma5.setData(payload.ma5||[]);\n    ma10.setData(payload.ma10||[]);\n    ma15.setData(payload.ma15||[]);\n    ma20.setData(payload.ma20||[]);\n    volumeSeries.setData(payload.volume||[]);\n    const cfg=payload.config||{};\n    ma5.applyOptions({visible:cfg.showMA5!==false});\n    ma10.applyOptions({visible:cfg.showMA10!==false});\n    ma15.applyOptions({visible:cfg.showMA15!==false});\n    ma20.applyOptions({visible:cfg.showMA20!==false});\n    volumeSeries.applyOptions({visible:cfg.showVolume!==false});\n\n    const markers=[];\n    const last=d.length?d[d.length-1]:null;\n\n    if(d.length && last){\n      let hi=d[0],lo=d[0];\n      d.forEach(x=>{\n        if(Number(x.high)>Number(hi.high))hi=x;\n        if(Number(x.low)<Number(lo.low))lo=x;\n      });\n      const hp=Number(hi.high)!==0?(Number(last.close)/Number(hi.high)-1)*100:0;\n      const lp=Number(lo.low)!==0?(Number(last.close)/Number(lo.low)-1)*100:0;\n      const shortLabel=x=>{\n        const q=String(x.label||x.time||'');\n        if(q.length>=10)return q.slice(5,10).replace('-','/');\n        if(q.length>=8)return q.slice(-4,-2)+'/'+q.slice(-2);\n        return q;\n      };\n      markers.push({\n        time:hi.time,position:'aboveBar',shape:'arrowDown',color:'#ef5350',\n        text:'최고 '+Number(hi.high).toLocaleString()+'('+hp.toFixed(2)+'%,'+shortLabel(hi)+')'\n      });\n      markers.push({\n        time:lo.time,position:'belowBar',shape:'arrowUp',color:'#3b82f6',\n        text:'최저 '+Number(lo.low).toLocaleString()+'('+(lp>=0?'+':'')+lp.toFixed(2)+'%,'+shortLabel(lo)+')'\n      });\n    }\n\n    if(last && payload.signal){\n      if(cfg.showBOS && payload.signal.bos){\n        markers.push({time:last.time,position:'belowBar',shape:'arrowUp',color:'#52e0aa',text:'BOS'});\n      }\n      if(cfg.showDiscount && payload.signal.discount){\n        markers.push({time:last.time,position:'belowBar',shape:'circle',color:'#ffd45c',text:'Discount'});\n      }\n      if(cfg.showExplosion && payload.signal.explosion){\n        markers.push({time:last.time,position:'aboveBar',shape:'arrowDown',color:'#ff718f',text:'Explosion'});\n      }\n    }\n    if(markerApi){ markerApi.setMarkers(markers); }\n\n    chart.timeScale().fitContent();\n    chart.timeScale().applyOptions({rightOffset:10});\n    let tags=[];\n    if(cfg.showBOS && payload.signal && payload.signal.bos) tags.push('BOS');\n    if(cfg.showDiscount && payload.signal && payload.signal.discount) tags.push('Discount');\n    if(cfg.showExplosion && payload.signal && payload.signal.explosion) tags.push('Explosion');\n    if(cfg.showRSI && payload.signal && payload.signal.rsi!==undefined) tags.push('RSI '+Number(payload.signal.rsi).toFixed(1));\n    status.textContent=(payload.period||'')+' '+(payload.name||'')+' '+(payload.code||'')+(tags.length?' · '+tags.join(' · '):'');\n    renderAnalysis(payload.analysis||{});\n  };\n\n  container.addEventListener('pointerup',e=>{\n    if(drawMode)return;\n    if(e.target && e.target.closest && e.target.closest('#analysisGrid'))return;\n    const r=container.getBoundingClientRect();\n    const x=e.clientX-r.left;\n    const tm=chart.timeScale().coordinateToTime(x);\n    if(tm!==null && tm!==undefined){\n      showCandleTip(tm);\n      tip.style.display='block';\n    }\n  },{passive:true});\n\n  chart.subscribeCrosshairMove(param=>{\n    if(!param || param.time===undefined || param.time===null)return;\n    showCandleTip(param.time);\n  });\n\n  chart.subscribeClick(param=>{\n    if(!param || param.time===undefined || param.time===null)return;\n    showCandleTip(param.time);\n    tip.style.display='block';\n    if(!drawMode || !param.point)return;\n    const price=candleSeries.coordinateToPrice(param.point.y);\n    if(price===null || price===undefined)return;\n\n    if(drawMode==='horizontal'){\n      const pl=candleSeries.createPriceLine({\n        price:price,lineWidth:2,lineStyle:0,color:drawColor,axisLabelVisible:true,title:'수평'\n      });\n      priceDrawings.push(pl);\n      setMode(null);\n      return;\n    }\n\n    const pt={time:param.time,value:price};\n    if(!firstPoint){\n      firstPoint=pt;\n      tip.textContent='추세선: 끝점을 터치하세요.';\n      return;\n    }\n\n    const points=[firstPoint,pt].sort((a,b)=>{\n      if(typeof a.time==='number' && typeof b.time==='number')return a.time-b.time;\n      return String(a.time).localeCompare(String(b.time));\n    });\n\n    lineDrawings.push({a:points[0],b:points[1],color:drawColor});\n    renderDrawings();\n    setMode(null);\n  });\n\n\n  const overlay=document.getElementById('drawOverlay');\n  let dragState=null;\n\n  function timeX(tm){ return chart.timeScale().timeToCoordinate(tm); }\n  function priceY(v){ return candleSeries.priceToCoordinate(v); }\n\n  function renderDrawings(){\n    overlay.innerHTML='';\n    lineDrawings.forEach((d,idx)=>{\n      const x1=timeX(d.a.time), y1=priceY(d.a.value);\n      const x2=timeX(d.b.time), y2=priceY(d.b.value);\n      if(x1==null||x2==null||y1==null||y2==null)return;\n\n      const line=document.createElementNS('http://www.w3.org/2000/svg','line');\n      line.setAttribute('x1',x1); line.setAttribute('y1',y1);\n      line.setAttribute('x2',x2); line.setAttribute('y2',y2);\n      line.setAttribute('stroke',d.color); line.setAttribute('stroke-width','3');\n      line.style.pointerEvents='stroke';\n      line.style.cursor='move';\n      line.addEventListener('pointerdown',e=>{\n        e.preventDefault(); dragState={idx:idx,part:'line',sx:e.clientX,sy:e.clientY,\n          a:{...d.a},b:{...d.b}};\n        e.currentTarget.setPointerCapture?.(e.pointerId);\n      });\n      overlay.appendChild(line);\n\n      [['a',x1,y1],['b',x2,y2]].forEach(h=>{\n        const c=document.createElementNS('http://www.w3.org/2000/svg','circle');\n        c.setAttribute('cx',h[1]); c.setAttribute('cy',h[2]); c.setAttribute('r','7');\n        c.setAttribute('fill',d.color); c.setAttribute('stroke','#ffffff'); c.setAttribute('stroke-width','2');\n        c.style.pointerEvents='all'; c.style.cursor='grab';\n        c.addEventListener('pointerdown',e=>{\n          e.preventDefault(); e.stopPropagation();\n          dragState={idx:idx,part:h[0]};\n          e.currentTarget.setPointerCapture?.(e.pointerId);\n        });\n        overlay.appendChild(c);\n      });\n    });\n  }\n\n  function pointerToPoint(e){\n    const r=container.getBoundingClientRect();\n    const x=e.clientX-r.left, y=e.clientY-r.top;\n    const tm=chart.timeScale().coordinateToTime(x);\n    const pr=candleSeries.coordinateToPrice(y);\n    if(tm==null||pr==null)return null;\n    return {time:tm,value:pr};\n  }\n\n  // IMPORTANT: do not let the full-screen SVG eat chart touch events.\n  // Only the actual drawing line/handles receive pointer events.\n  overlay.style.pointerEvents='none';\n\n  document.addEventListener('pointermove',e=>{\n    if(!dragState)return;\n    const d=lineDrawings[dragState.idx];\n    if(!d)return;\n\n    if(dragState.part==='a'||dragState.part==='b'){\n      const p=pointerToPoint(e);\n      if(p)d[dragState.part]=p;\n    }else{\n      const dx=e.clientX-dragState.sx, dy=e.clientY-dragState.sy;\n      const ax=timeX(dragState.a.time), ay=priceY(dragState.a.value);\n      const bx=timeX(dragState.b.time), by=priceY(dragState.b.value);\n      const naT=chart.timeScale().coordinateToTime(ax+dx);\n      const nbT=chart.timeScale().coordinateToTime(bx+dx);\n      const naP=candleSeries.coordinateToPrice(ay+dy);\n      const nbP=candleSeries.coordinateToPrice(by+dy);\n      if(naT!=null&&nbT!=null&&naP!=null&&nbP!=null){\n        d.a={time:naT,value:naP}; d.b={time:nbT,value:nbP};\n      }\n    }\n    renderDrawings();\n    e.preventDefault();\n  },{passive:false});\n\n  document.addEventListener('pointerup',()=>{ dragState=null; });\n  document.addEventListener('pointercancel',()=>{ dragState=null; });\n  chart.timeScale().subscribeVisibleTimeRangeChange(()=>renderDrawings());\n\n  new ResizeObserver(()=>{\n    chart.applyOptions({width:container.clientWidth,height:container.clientHeight});\n  }).observe(container);\n</script>\n</body>\n</html>\nEOF\n\ncat > settings.gradle <<'EOF'\npluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nrootProject.name = \"MarcusAISwing\"\ninclude(\":app\")\nEOF\n\ncat > build.gradle <<'EOF'\nplugins {\n    id 'com.android.application' version '8.2.2' apply false\n}\nEOF\n\ncat > app/build.gradle <<'EOF'\nplugins {\n    id 'com.android.application'\n}\n\nandroid {\n    namespace 'com.marcus.aiswing'\n    compileSdk 34\n\n    defaultConfig {\n        applicationId \"com.marcus.aiswing\"\n        minSdk 26\n        targetSdk 34\n        versionCode 80\n        versionName \"2.18.2\"\n    }\n\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n\n    dependencies {\n        implementation 'com.squareup.okhttp3:okhttp:4.12.0'\n    }\n}\nEOF\n\ncat > app/src/main/AndroidManifest.xml <<'EOF'\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.INTERNET\"/>\n\n    <application\n        android:label=\"Marcus AI SWING\"\n        android:icon=\"@drawable/ai_swing_icon\"\n        android:roundIcon=\"@drawable/ai_swing_icon\"\n        android:usesCleartextTraffic=\"false\"\n        android:networkSecurityConfig=\"@xml/network_security_config\"\n        android:theme=\"@style/AppTheme\">\n\n        <activity\n            android:name=\".MainActivity\"\n            android:exported=\"true\">\n\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"/>\n                <category android:name=\"android.intent.category.LAUNCHER\"/>\n            </intent-filter>\n\n        </activity>\n    </application>\n</manifest>\nEOF\n\n\nmkdir -p app/src/main/res/xml\ncat > app/src/main/res/xml/network_security_config.xml <<'EOF'\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<network-security-config>\n    <base-config cleartextTrafficPermitted=\"false\" />\n    <domain-config cleartextTrafficPermitted=\"true\">\n        <domain includeSubdomains=\"true\">ops.koreainvestment.com</domain>\n    </domain-config>\n</network-security-config>\nEOF\n\ncat > app/src/main/res/values/styles.xml <<'EOF'\n<resources>\n    <style name=\"AppTheme\" parent=\"@android:style/Theme.Material.NoActionBar\">\n        <item name=\"android:fontFamily\">sans</item>\n        <item name=\"android:windowLightStatusBar\">false</item>\n        <item name=\"android:statusBarColor\">#07101F</item>\n        <item name=\"android:navigationBarColor\">#07101F</item>\n        <item name=\"android:colorAccent\">#7EA7FF</item>\n    </style>\n</resources>\nEOF\n\n\nmkdir -p app/src/main/res/drawable\necho '' | base64 -d > app/src/main/res/drawable/ai_swing_icon.png\necho ''\
        \ | base64 -d > app/src/main/res/drawable/ai_swing_mascot.png\n\ncat > app/src/main/java/com/marcus/aiswing/MainActivity.java <<'JAVA'\npackage com.marcus.aiswing;\n\nimport android.app.Activity;\nimport android.app.Dialog;\nimport android.app.AlertDialog;\nimport android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Looper;\nimport android.content.Context;\nimport android.content.SharedPreferences;\nimport android.content.Intent;\nimport android.net.Uri;\nimport android.provider.OpenableColumns;\nimport android.database.Cursor;\nimport android.graphics.Color;\nimport android.graphics.Typeface;\nimport android.graphics.Canvas;\nimport android.graphics.Paint;\nimport android.graphics.Path;\nimport android.graphics.drawable.GradientDrawable;\nimport android.graphics.drawable.ColorDrawable;\nimport android.text.InputType;\nimport android.text.Editable;\nimport android.text.TextWatcher;\nimport android.text.Spannable;\nimport android.text.SpannableString;\nimport android.text.SpannableStringBuilder;\nimport android.text.style.ForegroundColorSpan;\nimport android.text.style.BackgroundColorSpan;\nimport android.text.style.StyleSpan;\nimport android.widget.ArrayAdapter;\nimport android.widget.ListPopupWindow;\nimport android.view.Gravity;\nimport android.view.View;\nimport android.view.ViewParent;\nimport android.view.Window;\nimport android.view.WindowManager;\nimport android.view.MotionEvent;\nimport android.view.ScaleGestureDetector;\nimport android.widget.*;\nimport android.os.Build;\nimport android.util.TypedValue;\nimport android.webkit.WebView;\nimport android.webkit.WebSettings;\nimport android.webkit.WebViewClient;\n\nimport okhttp3.OkHttpClient;\nimport okhttp3.Request;\nimport okhttp3.Response;\nimport okhttp3.WebSocket;\nimport okhttp3.WebSocketListener;\n\nimport org.json.JSONArray;\nimport org.json.JSONObject;\n\nimport java.io.BufferedReader;\nimport java.io.BufferedWriter;\nimport java.io.File;\nimport java.io.FileInputStream;\nimport java.io.FileOutputStream;\nimport java.io.InputStream;\nimport java.io.InputStreamReader;\nimport java.io.OutputStream;\nimport java.io.OutputStreamWriter;\nimport java.net.HttpURLConnection;\nimport java.net.URL;\nimport java.net.URLEncoder;\nimport java.nio.charset.StandardCharsets;\nimport java.text.SimpleDateFormat;\nimport java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.Date;\nimport java.util.HashMap;\nimport java.util.List;\nimport java.util.Locale;\nimport java.util.Map;\nimport java.util.LinkedHashMap;\nimport java.util.Calendar;\nimport java.util.WeakHashMap;\nimport java.util.concurrent.TimeUnit;\n\npublic class MainActivity extends Activity {\n\n    final int BG=Color.rgb(9,18,36);\n    final int PANEL=Color.rgb(22,35,64);\n    final int PANEL2=Color.rgb(31,50,86);\n    final int TEXT=Color.rgb(239,244,255);\n    final int MUTED=Color.rgb(172,187,216);\n    final int BLUE=Color.rgb(112,168,255);\n    final int GREEN=Color.rgb(83,226,168);\n    final int RED=Color.rgb(255,105,127);\n    final int YELLOW=Color.rgb(255,213,92);\n    final int PURPLE=Color.rgb(154,112,255);\n    final int CYAN=Color.rgb(67,218,235);\n    final int ORANGE=Color.rgb(255,164,86);\n\n    LinearLayout root;\n    LinearLayout content;\n    LinearLayout nav;\n    View stockMarketStrip;\n    SharedPreferences prefs;\n    final List<MasterStock> masterStocks=new ArrayList<>();\n    final Handler liveHandler=new Handler(Looper.getMainLooper());\n    boolean liveActive=false;\n    volatile boolean scanCancelRequested=false;\n    int liveCursor=0;\n    static final String LIVE_CODES=\"live_codes\";\n    static final String SCAN_INDEX=\"scan_index\";\n    static final String CUSTOM_SCRIPT=\"custom_script\";\n    static final String LAST_STOCK_CODE=\"last_stock_code\";\n    static final String LAST_STOCK_NAME=\"last_stock_name\";\n    static final String LAST_PERIOD=\"last_period\";\n    static final String FAVORITES=\"favorite_codes\";\n    static final String CHART_S