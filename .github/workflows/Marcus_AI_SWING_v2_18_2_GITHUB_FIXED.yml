ateLabel(sel.date),x1,y,textPaint);\n\n                textPaint.setTextSize(8.8f*getResources().getDisplayMetrics().scaledDensity);\n\n                // row helper is expanded manually because Android Canvas has no table widget.\n                y+=lineH;\n                textPaint.setColor(Color.rgb(34,37,44)); c.drawText(\"시가\",x1,y,textPaint);\n                textPaint.setColor(openPct>=0?Color.rgb(218,55,62):Color.rgb(38,100,205));\n                c.drawText(fmtValue0(sel.open)+String.format(Locale.KOREA,\" (%+.2f%%)\",openPct),x2,y,textPaint);\n\n                y+=lineH;\n                textPaint.setColor(Color.rgb(34,37,44)); c.drawText(\"고가\",x1,y,textPaint);\n                textPaint.setColor(Color.rgb(218,55,62));\n                c.drawText(fmtValue0(sel.high)+String.format(Locale.KOREA,\" (%+.2f%%)\",highPct),x2,y,textPaint);\n\n                y+=lineH;\n                textPaint.setColor(Color.rgb(34,37,44)); c.drawText(\"저가\",x1,y,textPaint);\n                textPaint.setColor(Color.rgb(38,100,205));\n                c.drawText(fmtValue0(sel.low)+String.format(Locale.KOREA,\" (%+.2f%%)\",lowPct),x2,y,textPaint);\n\n                y+=lineH;\n                textPaint.setColor(Color.rgb(34,37,44)); c.drawText(\"종가\",x1,y,textPaint);\n                textPaint.setColor(closePct>=0?Color.rgb(218,55,62):Color.rgb(38,100,205));\n                c.drawText(fmtValue0(sel.close)+String.format(Locale.KOREA,\" (%+.2f%%)\",closePct),x2,y,textPaint);\n\n                y+=lineH;\n                textPaint.setColor(Color.rgb(34,37,44)); c.drawText(\"거래량\",x1,y,textPaint);\n                textPaint.setColor(Color.rgb(50,55,65));\n                c.drawText(String.format(Locale.KOREA,\"%,.0f\",sel.volume),x2,y,textPaint);\n\n                y+=lineH;\n                textPaint.setColor(Color.rgb(34,37,44)); c.drawText(\"거래대금\",x1,y,textPaint);\n                textPaint.setColor(Color.rgb(50,55,65));\n                c.drawText(compactAmount(approxAmount)+\"