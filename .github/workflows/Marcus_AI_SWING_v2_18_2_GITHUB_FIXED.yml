gram\n                        );\n                    }\n\n                    if(!liveExpectPrice.isEmpty() && num(liveExpectPrice)>0){\n                        quoteExtra3.setText(\n                            \"③ 예상/가격범위\\n\"+\n                            \"예상 등락   │ \"+(liveExpectRate.isEmpty()?\"-\":liveExpectRate+\"%\")+\"\\n\"+\n                            \"예상 가격   │ \"+money(liveExpectPrice)+\"\\n\"+\n                            \"예상 수량   │ \"+(liveExpectQty.isEmpty()?\"-\":qty(liveExpectQty))+\"\\n\"+\n                            \"※ 예상체결 데이터는 예상체결 구간에만 값이 생깁니다.\"\n                        );\n                    }\n\n                    // Current minute candle moves on every execution.\n                    // 1/3/5/15/30/60 minute bars are created from live executions.\n                    if(\n                        \"DAY\".equals(activePeriod[0]) ||\n                        (activePeriod[0]!=null && activePeriod[0].endsWith(\"M\"))\n                    ){\n                        chart.updateRealtimeTick(lp,num(liveLastVolume));\n                    }else{\n                        chart.pulse();\n                    }\n                }\n\n                if(liveNxtAvailable){\n                    marketBadge.setText(\"NXT\");\n                    marketBadge.setTextColor(Color.WHITE);\n                    marketBadge.setBackground(bg(Color.rgb(164,45,54),5));\n                    stockMeta.setText(activeCode[0]+\" \"+masterMarket(activeCode[0])+\" · NXT 가능\");\n                }else{\n                    marketBadge.setText(marketBadgeText(activeCode[0]));\n                }\n\n                if(!liveOrderBook.isEmpty() && realtimeOrderBookSane()){\n                    setStyledOrderBook(orderBook,liveOrderBook,liveLastPrice);\n                    orderSummary.setText(\n                        \"총 매도 \"+qty(liveAskTotal)+\n                        \"   │   총 매수 \"+qty(liveBidTotal)\n                    );\n                    updateOrderBalance(\n                        askBalance,\n                        bidBalance,\n                        liveAskTotal,\n                        liveBidTotal\n                    );\n\n                    if(!liveLastPrice.isEmpty() && !liveLastPrice.equals(lastBlinkPrice[0])){\n                        lastBlinkPrice[0]=liveLastPrice;\n                        flashCurrentPriceRow(orderBook);\n                    }\n                }\n\n                result.setText(\n                    \"● KIS \"+liveWsStatus+\" · \"+\n                    periodLabel(activePeriod[0])+\n                    \" · 실시간 seq \"+appliedSeq[0]\n                );\n                result.setTextColor(\"연결\".equals(liveWsStatus)?GREEN:YELLOW);\n            }\n\n            // REST fallback / reconciliation.\n            // Also reconcile if the unified orderbook is far from current execution price.\n            if((!\"연결\".equals(liveWsStatus) || !realtimeOrderBookSane()) && tick[0]%15==1){\n                refreshSide.run();\n            }\n\n            // Investor flow refreshes independently.\n            if(activeCode[0]!=null && tick[0]%90==0){\n                refreshInvestorSlow.run();\n            }\n\n            // 350ms screen heartbeat: realtime feel with lower UI/API pressure.\n            stockLiveHandler.postDelayed(loop[0],350);\n        };\n        stockLiveHandler.postDelayed(loop[0],350);\n\n        if(refreshPeriodButtons[0]!=null)refreshPeriodButtons[0].run();\n        if(!restoredCode.isEmpty())chart.postDelayed(loadAll,300);\n    }\n\n\n    void renderAiText(TextView ai,AISignal sig){\n        String verdict=sig.score>=86?\"진입\":\n            (sig.score>=80?\"준비\":(sig.score>=66?\"뉴스\":\"대기\"));\n        String rebound=sig.ma5>sig.ma20?\"상승\":\"관찰\";\n        String reason=sig.explosion?\"거래량 증가\":\n            (sig.bos?\"BOS 확인\":(sig.discount?\"Discount 구간\":\"조건 대기\"));\n        String quality=sig.score>=80?\"강\":\n            (sig.score>=66?\"보통\":\"약\");\n        String timing=sig.bos?\"돌파\":\n            (sig.discount?\"눌림\":\"대기\");\n        String structure=sig.bos?\"BOS\":\"Weak Low\";\n        String trend=sig.ma5>sig.ma20?\"상승\":\"관찰\";\n        String volume=sig.explosion?\"증가\":\"보통\";\n\n        ai.setText(\n            \"┌ AI 판단 ─────────┬ 차트 상태 ────────┬ 매도 전략 ────────┐\\n\"+\n            \" AI     \"+sig.score+\"/100 \"+verdict+\"   │ Discount \"+(sig.discount?\"진입\":\"대기\")+\"       │ 보유       -\\n\"+\n            \" 반등   \"+rebound+\"          │ \"+structure+\"              │ 시간       -\\n\"+\n            \" 이유   \"+reason+\"   │ 구조      \"+trend+\"          │ 손절       -\\n\"+\n            \" 품질   \"+quality+\"            │ 추세      \"+trend+\"          │ 1차 30%    -\\n\"+\n            \" 타이밍 \"+timing+\"          │ 눌림      \"+(sig.discount?\"건강\":\"대기\")+\"          │ 2차 30%    -\\n\"+\n            \" 판단   \"+sig.label+\"   │ 거래량    \"+volume+\"          │ 3차 보호   -\\n\"+\n            \" RSI    \"+String.format(Locale.US,\"%.1f\",sig.rsi)+\"          │ BOS       \"+(sig.bos?\"확인\":\"대기\")+\"          │ 최고 수익  -\\n\"+\n            \" MA5    \"+fmt(sig.ma5)+\"       │ MA20      \"+fmt(sig.ma20)+\"       │\\n\"+\n            \"└─────────────────┴─────────────────┴─────────────────┘\"\n        );\n        ai.setTypeface(Typeface.MONOSPACE);\n        ai.setTextSize(12);\n        ai.setTextColor(sig.score>=80?GREEN:(sig.score>=66?YELLOW:MUTED));\n    }\n\n    void loadChartPeriod(\n        WebView chart,\n        TextView chartTitle,\n        TextView ai,\n        String code,\n        String name,\n        String period\n    ){\n        String env=activeEnv();\n        prefs.edit().putString(LAST_PERIOD,period).apply();\n\n        chartTitle.setText(name+\" · \"+period+\" 불러오는 중...\");\n\n        new Thread(()->{\n            try{\n                List<Candle> candles;\n                String label;\n\n                if(\"DAY\".equals(period)){\n                    // Fast first paint: one recent page first.\n                    candles=requestDailyChartInitial(env,code);\n                    label=\"일봉\";\n\n                    final List<Candle> quickCandles=new ArrayList<>(candles);\n                    final String quickLabel=label;\n                    final String quickName=name;\n                    final String quickCode=code;\n                    runOnUiThread(()->{\n                        if(!\"STOCK\".equals(screenMode) && !\"REALTIME_CHART\".equals(screenMode))return;\n                        chartTitle.setText(quickName+\" · \"+quickLabel+\" · \"+quickCandles.size()+\"봉\");\n                        sendChartData(chart,quickCandles,quickName,quickCode,quickLabel);\n                        renderAiText(ai,analyze(quickCandles));\n                    });\n\n                    // Full history is fetched after the chart is already visible.\n                    List<Candle> full=requestDailyChart(env,code);\n                    if(full!=null && full.size()>quickCandles.size()){\n                        candles=full;\n                    }\n                }else if(\"WEEK\".equals(period)||\"MONTH\".equals(period)||\"YEAR\".equals(period)){\n                    List<Candle> daily=requestDailyChart(env,code);\n                    candles=aggregateHigherTimeframe(daily,period);\n                    label=periodLabel(period);\n                }else{\n                    List<Candle> one=requestIntraday1m(env,code);\n                    int minutes=1;\n                    if(\"3M\".equals(period))minutes=3;\n                    else if(\"5M\".equals(period))minutes=5;\n                    else if(\"15M\".equals(period))minutes=15;\n                    else if(\"30M\".equals(period))minutes=30;\n                    else if(\"60M\".equals(period))minutes=60;\n\n                    candles=minutes==1?one:aggregateMinutes(one,minutes);\n                    label=minutes+\"분봉\";\n                }\n\n                AISignal sig=analyze(candles);\n\n                final List<Candle> finalCandles=new ArrayList<>(candles);\n                final String finalLabel=label;\n                final String finalName=name;\n                final String finalCode=code;\n                final AISignal finalSig=sig;\n\n                runOnUiThread(()->{\n                    if(!\"STOCK\".equals(screenMode) && !\"REALTIME_CHART\".equals(screenMode))return;\n                    chartTitle.setText(finalName+\" · \"+finalLabel+\" · \"+finalCandles.size()+\"봉\");\n                    sendChartData(chart,finalCandles,finalName,finalCode,finalLabel);\n                    renderAiText(ai,finalSig);\n                });\n\n            }catch(Exception ex){\n                runOnUiThread(()->{\n                    chartTitle.setText(\n                        name+\" · \"+period+\" 조회 오류: \"+safeError(ex)\n                    );\n                });\n            }\n        }).start();\n    }\n\n    boolean isChoseongChar(char c){\n        return (c>='\\u3131' && c<='\\u314E');\n    }\n\n    boolean isChoseongQuery(String raw){\n        if(raw==null)return false;\n        String q=raw.replaceAll(\"\\\\s+\",\"\");\n        if(q.isEmpty())return false;\n        for(int i=0;i<q.length();i++){\n            if(!isChoseongChar(q.charAt(i)))return false;\n        }\n        return true;\n    }\n\n    String hangulChoseong(String text){\n        final char[] CHO={\n            'ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ',\n            'ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'\n        };\n        StringBuilder sb=new StringBuilder();\n        if(text==null)return \"\";\n        for(int i=0;i<text.length();i++){\n            char c=text.charAt(i);\n            if(c>='\\uAC00' && c<='\\uD7A3'){\n                int idx=(c-'가')/(21*28);\n                if(idx>=0 && idx<CHO.length)sb.append(CHO[idx]);\n            }else if(isChoseongChar(c)){\n                sb.append(c);\n            }else if(Character.isLetterOrDigit(c)){\n                sb.append(Character.toLowerCase(c));\n            }\n        }\n        return sb.toString();\n    }\n\n    boolean looksLikeEtfName(String name){\n        if(name==null)return false;\n        String n=name.trim().toUpperCase(Locale.KOREA);\n        String[] brands={\n            \"KODEX\",\"TIGER\",\"RISE\",\"ACE\",\"SOL \",\"PLUS \",\"HANARO\",\n            \"KOSEF\",\"ARIRANG\",\"TIMEFOLIO\",\"WOORI\",\"1Q \",\"FOCUS\"\n        };\n        for(String b:brands)if(n.startsWith(b))return true;\n        return false;\n    }\n\n    String displayMarketLabel(MasterStock m){\n        if(m==null)return \"\";\n        String market=m.market==null?\"\":m.market.trim();\n        if(looksLikeEtfName(m.name))return \"ETF · \"+market;\n        return market;\n    }\n\n    boolean stockMatches(MasterStock m,String raw){\n        if(m==null||raw==null)return false;\n        String q=raw.trim();\n        if(q.isEmpty())return false;\n\n        String qCompact=q.replaceAll(\"\\\\s+\",\"\");\n        String nameCompact=m.name.replaceAll(\"\\\\s+\",\"\");\n\n        if(m.code.contains(qCompact))return true;\n        if(nameCompact.toLowerCase(Locale.KOREA)\n            .contains(qCompact.toLowerCase(Locale.KOREA)))return true;\n\n        if(isChoseongQuery(qCompact)){\n            String cho=hangulChoseong(nameCompact);\n            return cho.startsWith(qCompact) || cho.contains(qCompact);\n        }\n\n        // Mixed Hangul / abbreviation tolerance.\n        String normalizedName=nameCompact.toLowerCase(Locale.KOREA);\n        String normalizedQ=qCompact.toLowerCase(Locale.KOREA);\n        int pos=0;\n        for(int i=0;i<normalizedName.length() && pos<normalizedQ.length();i++){\n            if(normalizedName.charAt(i)==normalizedQ.charAt(pos))pos++;\n        }\n        return pos==normalizedQ.length();\n    }\n\n    String resolveStockCode(String raw){\n        String q=raw==null?\"\":raw.trim();\n        if(q.matches(\"\\\\d{6}\"))return q;\n        if(q.isEmpty())return null;\n\n        MasterStock exact=null;\n        MasterStock best=null;\n        int bestScore=Integer.MIN_VALUE;\n\n        String qc=q.replaceAll(\"\\s+\",\"\");\n        boolean choQ=isChoseongQuery(qc);\n\n        for(MasterStock m:masterStocks){\n            String nc=m.name.replaceAll(\"\\s+\",\"\");\n            if(nc.equalsIgnoreCase(qc)){\n                exact=m;\n                break;\n            }\n            if(!stockMatches(m,qc))continue;\n\n            int score=0;\n            if(m.code.startsWith(qc))score+=1000;\n            if(nc.toLowerCase(Locale.KOREA).startsWith(qc.toLowerCase(Locale.KOREA)))score+=900;\n            if(nc.toLowerCase(Locale.KOREA).contains(qc.toLowerCase(Locale.KOREA)))score+=700;\n\n            if(choQ){\n                String cho=hangulChoseong(nc);\n                if(cho.equals(qc))score+=1200;\n                else if(cho.startsWith(qc))score+=1050;\n                else if(cho.contains(qc))score+=800;\n            }\n\n            score-=Math.max(0,nc.length()-qc.length());\n\n            if(best==null || score>bestScore){\n                best=m;\n                bestScore=score;\n            }\n        }\n\n        if(exact!=null)return exact.code;\n        return best==null?null:best.code;\n    }\n\n    String displayName(String raw,String code){\n        for(MasterStock m:masterStocks){\n            if(m.code.equals(code))return m.name;\n        }\n        return raw.matches(\"\\\\d{6}\")?code:raw;\n    }\n\n    List<MasterStock> findMasterMatches(String raw,int limit){\n        List<MasterStock> matches=new ArrayList<>();\n        String q=raw==null?\"\":raw.trim();\n        if(q.isEmpty())return matches;\n\n        final String qc=q.replaceAll(\"\\s+\",\"\");\n        final boolean choQ=isChoseongQuery(qc);\n\n        for(MasterStock m:masterStocks){\n            if(stockMatches(m,qc))matches.add(m);\n        }\n\n        Collections.sort(matches,(a,b)->{\n            String an=a.name.replaceAll(\"\\s+\",\"\");\n            String bn=b.name.replaceAll(\"\\s+\",\"\");\n\n            int as=0,bs=0;\n            if(an.equalsIgnoreCase(qc))as+=2000;\n            if(bn.equalsIgnoreCase(qc))bs+=2000;\n            if(an.toLowerCase(Locale.KOREA).startsWith(qc.toLowerCase(Locale.KOREA)))as+=900;\n            if(bn.toLowerCase(Locale.KOREA).startsWith(qc.toLowerCase(Locale.KOREA)))bs+=900;\n\n            if(choQ){\n                String ac=hangulChoseong(an),bc=hangulChoseong(bn);\n                if(ac.equals(qc))as+=1500;\n                if(bc.equals(qc))bs+=1500;\n                if(ac.startsWith(qc))as+=1100;\n                if(bc.startsWith(qc))bs+=1100;\n            }\n\n            as-=an.length();\n            bs-=bn.length();\n            if(as!=bs)return Integer.compare(bs,as);\n            return an.compareTo(bn);\n        });\n\n        if(matches.size()>limit){\n            return new ArrayList<>(matches.subList(0,limit));\n        }\n        return matches;\n    }\n\n    void sendChartData(\n        WebView web,\n        List<Candle> candles,\n        String name,\n        String code,\n        String period\n    ){\n        try{\n            org.json.JSONObject payload=new org.json.JSONObject();\n            payload.put(\"name\",name);\n            payload.put(\"code\",code);\n            payload.put(\"period\",period);\n\n            org.json.JSONArray arr=new org.json.JSONArray();\n            org.json.JSONArray ma5=new org.json.JSONArray();\n            org.json.JSONArray ma10=new org.json.JSONArray();\n            org.json.JSONArray ma15=new org.json.JSONArray();\n            org.json.JSONArray ma20=new org.json.JSONArray();\n            org.json.JSONArray volume=new org.json.JSONArray();\n\n            SimpleDateFormat intradayParser=\n                new SimpleDateFormat(\"yyyyMMddHHmmss\",Locale.KOREA);\n\n            for(int i=0;i<candles.size();i++){\n                Candle c=candles.get(i);\n                Object timeValue;\n                String label;\n\n                if(c.date.length()==8){\n                    timeValue=\n                        c.date.substring(0,4)+\"-\"+\n                        c.date.substring(4,6)+\"-\"+\n                        c.date.substring(6,8);\n                    label=(String)timeValue;\n                }else{\n                    Date d=intradayParser.parse(c.date);\n                    timeValue=d.getTime()/1000L;\n                    label=\n                        c.date.substring(4,6)+\"/\"+\n                        c.date.substring(6,8)+\" \"+\n                        c.date.substring(8,10)+\":\"+\n                        c.date.substring(10,12);\n                }\n\n                org.json.JSONObject o=new org.json.JSONObject();\n                o.put(\"time\",timeValue);\n                o.put(\"label\",label);\n                o.put(\"open\",c.open);\n                o.put(\"high\",c.high);\n                o.put(\"low\",c.low);\n                o.put(\"close\",c.close);\n                o.put(\"volume\",c.volume);\n                arr.put(o);\n\n                org.json.JSONObject vo=new org.json.JSONObject();\n                vo.put(\"time\",timeValue);\n                vo.put(\"value\",c.volume);\n                vo.put(\n                    \"color\",\n                    c.close>=c.open\n                        ? \"rgba(255,105,127,0.48)\"\n                        : \"rgba(83,146,255,0.48)\"\n                );\n                volume.put(vo);\n\n                if(i>=4){\n                    double sum=0;\n                    for(int j=i-4;j<=i;j++)sum+=candles.get(j).close;\n                    org.json.JSONObject m=new org.json.JSONObject();\n                    m.put(\"time\",timeValue);\n                    m.put(\"value\",sum/5.0);\n                    ma5.put(m);\n                }\n\n                if(i>=9){\n                    double sum=0;\n                    for(int j=i-9;j<=i;j++)sum+=candles.get(j).close;\n                    org.json.JSONObject m=new org.json.JSONObject();\n                    m.put(\"time\",timeValue); m.put(\"value\",sum/10.0); ma10.put(m);\n                }\n                if(i>=14){\n                    double sum=0;\n                    for(int j=i-14;j<=i;j++)sum+=candles.get(j).close;\n                    org.json.JSONObject m=new org.json.JSONObject();\n                    m.put(\"time\",timeValue); m.put(\"value\",sum/15.0); ma15.put(m);\n                }\n\n                if(i>=19){\n                    double sum=0;\n                    for(int j=i-19;j<=i;j++)sum+=candles.get(j).close;\n                    org.json.JSONObject m=new org.json.JSONObject();\n                    m.put(\"time\",timeValue);\n                    m.put(\"value\",sum/20.0);\n                    ma20.put(m);\n                }\n            }\n\n            payload.put(\"candles\",arr);\n            payload.put(\"ma5\",ma5);\n            payload.put(\"ma10\",ma10);\n            payload.put(\"ma15\",ma15);\n            payload.put(\"ma20\",ma20);\n            payload.put(\"volume\",volume);\n\n            // v2.1: 저장된 차트 규칙을 실제 차트 렌더링에 연결\n            String chartRules=precisionChartScript();\n            Map<String,String> cc=parseRules(chartRules);\n            org.json.JSONObject cfg=new org.json.JSONObject();\n            cfg.put(\"showMA5\",ruleBool(cc,\"SHOW_MA5\",true));\n            cfg.put(\"showMA10\",ruleBool(cc,\"SHOW_MA10\",true));\n            cfg.put(\"showMA15\",ruleBool(cc,\"SHOW_MA15\",true));\n            cfg.put(\"showMA20\",ruleBool(cc,\"SHOW_MA20\",true));\n            cfg.put(\"showVolume\",ruleBool(cc,\"SHOW_VOLUME\",true));\n            cfg.put(\"showRSI\",ruleBool(cc,\"SHOW_RSI\",true));\n            cfg.put(\"showBOS\",ruleBool(cc,\"SHOW_BOS\",true));\n            cfg.put(\"showDiscount\",ruleBool(cc,\"SHOW_DISCOUNT\",true));\n            cfg.put(\"showExplosion\",ruleBool(cc,\"SHOW_EXPLOSION\",true));\n            payload.put(\"config\",cfg);\n\n            AISignal chartSig=analyze(candles);\n            org.json.JSONObject signal=new org.json.JSONObject();\n            signal.put(\"bos\",chartSig.bos);\n            signal.put(\"discount\",chartSig.discount);\n            signal.put(\"explosion\",chartSig.explosion);\n            signal.put(\"score\",chartSig.score);\n            signal.put(\"rsi\",chartSig.rsi);\n            payload.put(\"signal\",signal);\n\n            org.json.JSONObject analysis=new org.json.JSONObject();\n            Candle last=candles.isEmpty()?null:candles.get(candles.size()-1);\n            double avgVol20=0;\n            if(candles.size()>=20){\n                for(int vi=candles.size()-20;vi<candles.size();vi++)avgVol20+=candles.get(vi).volume;\n                avgVol20/=20.0;\n            }\n            double rvol=(last!=null && avgVol20>0)?last.volume/avgVol20:0;\n            double maGap=(chartSig.ma20!=0)?(chartSig.ma5/chartSig.ma20-1.0)*100.0:0;\n\n            analysis.put(\"score\",chartSig.score);\n            analysis.put(\"label\",chartSig.label);\n            analysis.put(\"action\",chartSig.score>=80?\"진입\":chartSig.score>=66?\"관망\":\"대기\");\n            analysis.put(\"reason\",chartSig.bos?\"BOS\":chartSig.discount?\"Discount\":chartSig.explosion?\"거래량\":\"추세 확인\");\n            analysis.put(\"quality\",chartSig.score+\"/100\");\n            analysis.put(\"timing\",chartSig.rsi>78?\"과열\":chartSig.rsi>=45?\"준비\":\"대기\");\n            analysis.put(\"judge\",chartSig.score>=80?\"조건 충족\":\"조건 확인\");\n            analysis.put(\"interest\",chartSig.score>=66?\"관심\":\"-\");\n            analysis.put(\"support\",chartSig.ma5>=chartSig.ma20?\"유지\":\"미확인\");\n            analysis.put(\"pullriver\",\"-\");\n            analysis.put(\"type\",chartSig.bos?\"돌파\":chartSig.discount?\"저점회복\":\"일반\");\n            analysis.put(\"bypass\",\"-\");\n            analysis.put(\"capture\",chartSig.score>=85?\"A후보\":chartSig.score>=75?\"B후보\":\"관찰\");\n            analysis.put(\"leader\",chartSig.score>=85?\"LEADER\":\"-\");\n            analysis.put(\"accel\",rvol>=1.5?String.format(Locale.KOREA,\"%.2f배\",rvol):\"-\");\n            analysis.put(\"trendq\",chartSig.ma5>=chartSig.ma20?\"양호\":\"약함\");\n            analysis.put(\"verify\",\"점수 \"+chartSig.score);\n            analysis.put(\"ignite\",chartSig.explosion?\"점화\":\"-\");\n            analysis.put(\"discount\",chartSig.discount?\"진입\":\"-\");\n            analysis.put(\"weak\",last!=null&&last.close>=chartSig.ma5?\"유지\":\"약화\");\n            analysis.put(\"bos\",chartSig.bos?\"돌파\":\"대기\");\n            analysis.put(\"structure\",chartSig.ma5>=chartSig.ma20?\"상승\":\"미확인\");\n            analysis.put(\"trend\",chartSig.ma5>=chartSig.ma20?\"회복\":\"약세\");\n            analysis.put(\"pullback\",chartSig.rsi<45?\"눌림\":\"-\");\n            analysis.put(\"volume\",String.format(Locale.KOREA,\"RVOL %.2f배\",rvol));\n            analysis.put(\"money\",\"-\"); analysis.put(\"liquidity\",\"-\"); analysis.put(\"bosdist\",\"-\");\n            analysis.put(\"compress\",Math.abs(maGap)<2.0?\"압축\":\"-\");\n            analysis.put(\"grade\",chartSig.score>=85?\"A\":chartSig.score>=75?\"B\":\"관찰\");\n            analysis.put(\"prev20\",\"-\");\n            analysis.put(\"strength5\",String.format(Locale.KOREA,\"MA %.2f%%\",maGap));\n            analysis.put(\"rvol\",String.format(Locale.KOREA,\"%.2f배\",rvol));\n            analysis.put(\"bosmoney\",chartSig.bos?\"BOS\":\"-\");\n            analysis.put(\"state\",chartSig.label);\n            analysis.put(\"hold\",chartSig.score>=80?\"보유/관찰\":\"-\");\n            analysis.put(\"time\",\"-\"); analysis.put(\"stop\",\"-\");\n            analysis.put(\"sell1\",\"-\"); analysis.put(\"sell2\",\"-\"); analysis.put(\"sell3\",\"-\");\n            analysis.put(\"profit\",\"-\"); analysis.put(\"sellreason\",\"-\");\n            analysis.put(\"zone1\",\"-\"); analysis.put(\"zone2\",\"-\"); analysis.put(\"protect\",\"-\"); analysis.put(\"best\",\"-\");\n            analysis.put(\"buy\",chartSig.score>=80?\"조건부 진입\":\"대기\");\n            analysis.put(\"buy1\",\"-\"); analysis.put(\"buy2\",\"-\");\n            analysis.put(\"nochase\",chartSig.rsi>75?\"추격 금지\":\"-\");\n            analysis.put(\"invalid\",\"-\");\n            payload.put(\"analysis\",analysis);\n\n            final String js=\"setStockData(\"+payload.toString()+\")\";\n            dispatchChartJs(web,js);\n\n        }catch(Exception ignored){}\n    }\n\n    static class Candle{\n        String date;\n        double open,high,low,close,volume;\n\n        Candle(String d,double o,double h,double l,double c,double v){\n            date=d; open=o; high=h; low=l; close=c; volume=v;\n        }\n    }\n\n    static class AISignal{\n        int score;\n        String label;\n        boolean bos,discount,explosion;\n        double ma5,ma20,rsi;\n    }\n\n    List<Candle> requestDailyChart(String env,String code)throws Exception{\n        SimpleDateFormat sdf=new SimpleDateFormat(\"yyyyMMdd\",Locale.US);\n        Calendar cal=Calendar.getInstance();\n        String finalEnd=sdf.format(cal.getTime());\n\n        cal.add(Calendar.YEAR,-3);\n        String finalStart=sdf.format(cal.getTime());\n\n        List<Candle> merged=new ArrayList<>();\n        String pageEnd=finalEnd;\n\n        for(int page=0;page<5;page++){\n            List<Candle> part=requestDailyPage(\n                env,code,finalStart,pageEnd\n            );\n\n            if(part.isEmpty())break;\n\n            merged.addAll(part);\n\n            String oldest=part.get(0).date;\n\n            Date oldestDate=sdf.parse(oldest);\n            Calendar prev=Calendar.getInstance();\n            prev.setTime(oldestDate);\n            prev.add(Calendar.DAY_OF_MONTH,-1);\n            pageEnd=sdf.format(prev.getTime());\n\n            if(pageEnd.compareTo(finalStart)<0)break;\n        }\n\n        Map<String,Candle> uniq=new LinkedHashMap<>();\n        for(Candle c:merged)uniq.put(c.date,c);\n\n        List<Candle> out=new ArrayList<>(uniq.values());\n        Collections.sort(out,(a,b)->a.date.compareTo(b.date));\n\n        return out;\n    }\n\n    List<Candle> requestDailyPage(\n        String env,\n        String code,\n        String start,\n        String end\n    )throws Exception{\n        refreshTokenIfNeeded(env);\n\n        String url=\n            baseUrl(env)+\n            \"/uapi/domestic-stock/v1/quotations/inquire-daily-itemchartprice\"+\n            \"?FID_COND_MRKT_DIV_CODE=J\"+\n            \"&FID_INPUT_ISCD=\"+URLEncoder.encode(code,StandardCharsets.UTF_8.name())+\n            \"&FID_INPUT_DATE_1=\"+start+\n            \"&FID_INPUT_DATE_2=\"+end+\n            \"&FID_PERIOD_DIV_CODE=D\"+\n            \"&FID_ORG_ADJ_PRC=0\";\n\n        waitForApiSlot();\n\n        HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();\n\n        try{\n            c.setRequestMethod(\"GET\");\n            c.setConnectTimeout(15000);\n            c.setReadTimeout(20000);\n            c.setRequestProperty(\"authorization\",\"Bearer \"+prefs.getString(tokenName(env),\"\"));\n            c.setRequestProperty(\"appkey\",prefs.getString(keyName(env),\"\"));\n            c.setRequestProperty(\"appsecret\",prefs.getString(secretName(env),\"\"));\n            c.setRequestProperty(\"tr_id\",\"FHKST03010100\");\n            c.setRequestProperty(\"Content-Type\",\"application/json; charset=utf-8\");\n\n            int http=c.getResponseCode();\n            InputStream is=(http>=200&&http<400)?c.getInputStream():c.getErrorStream();\n            String body=readAll(is);\n\n            if(body==null||body.trim().isEmpty()){\n                throw new Exception(\"일봉 응답 없음 HTTP \"+http);\n            }\n\n            JSONObject j=new JSONObject(body);\n\n            if(!\"0\".equals(j.optString(\"rt_cd\",\"\"))){\n                throw new Exception(j.optString(\"msg1\",\"일봉 조회 실패\"));\n            }\n\n            org.json.JSONArray arr=j.optJSONArray(\"output2\");\n            List<Candle> out=new ArrayList<>();\n\n            if(arr==null)return out;\n\n            for(int i=0;i<arr.length();i++){\n                JSONObject o=arr.optJSONObject(i);\n                if(o==null)continue;\n\n                String d=o.optString(\"stck_bsop_date\",\"\");\n                if(d.length()!=8)continue;\n\n                out.add(new Candle(\n                    d,\n                    num(o.optString(\"stck_oprc\",\"0\")),\n                    num(o.optString(\"stck_hgpr\",\"0\")),\n                    num(o.optString(\"stck_lwpr\",\"0\")),\n                    num(o.optString(\"stck_clpr\",\"0\")),\n                    num(o.optString(\"acml_vol\",\"0\"))\n                ));\n            }\n\n            Collections.reverse(out);\n            return out;\n\n        }finally{\n            c.disconnect();\n        }\n    }\n\n    File minuteCacheFile(String code){\n        return new File(getFilesDir(),\"minute_1m_\"+code+\".csv\");\n    }\n\n    List<Candle> loadMinuteCache(String code){\n        List<Candle> out=new ArrayList<>();\n        File f=minuteCacheFile(code);\n        if(!f.exists())return out;\n        try{\n            BufferedReader br=new BufferedReader(new InputStreamReader(new FileInputStream(f),StandardCharsets.UTF_8));\n            String line;\n            while((line=br.readLine())!=null){\n                String[] a=line.split(\",\");\n                if(a.length<6)continue;\n                out.add(new Candle(a[0],num(a[1]),num(a[2]),num(a[3]),num(a[4]),num(a[5])));\n            }\n            br.close();\n        }catch(Exception ignored){}\n        return out;\n    }\n\n    void saveMinuteCache(String code,List<Candle> rows){\n        try{\n            File f=minuteCacheFile(code);\n            BufferedWriter bw=new BufferedWriter(new OutputStreamWriter(new FileOutputStream(f,false),StandardCharsets.UTF_8));\n            int from=Math.max(0,rows.size()-26000); // roughly 2-3 months of 1m bars\n            for(int i=from;i<rows.size();i++){\n                Candle q=rows.get(i);\n                bw.write(q.date+\",\"+q.open+\",\"+q.high+\",\"+q.low+\",\"+q.close+\",\"+q.volume);\n                bw.newLine();\n            }\n            bw.close();\n        }catch(Exception ignored){}\n    }\n\n    void appendHistoricalMinuteDay(String env,String code,String date,Map<String,Candle> uniq)throws Exception{\n        String[] anchors={\"153000\",\"133000\",\"113000\",\"093000\"};\n        for(String hour:anchors){\n            String url=\n                baseUrl(env)+\n                \"/uapi/domestic-stock/v1/quotations/inquire-time-dailychartprice\"+\n                \"?FID_COND_MRKT_DIV_CODE=J\"+\n                \"&FID_INPUT_ISCD=\"+URLEncoder.encode(code,StandardCharsets.UTF_8.name())+\n                \"&FID_INPUT_HOUR_1=\"+hour+\n                \"&FID_INPUT_DATE_1=\"+date+\n                \"&FID_PW_DATA_INCU_YN=Y\"+\n                \"&FID_FAKE_TICK_INCU_YN=N\";\n\n            waitForApiSlot();\n            HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();\n            try{\n                c.setRequestMethod(\"GET\");\n                c.setConnectTimeout(12000);\n                c.setReadTimeout(16000);\n                c.setRequestProperty(\"authorization\",\"Bearer \"+prefs.getString(tokenName(env),\"\"));\n                c.setRequestProperty(\"appkey\",prefs.getString(keyName(env),\"\"));\n                c.setRequestProperty(\"appsecret\",prefs.getString(secretName(env),\"\"));\n                c.setRequestProperty(\"tr_id\",\"FHKST03010230\");\n                c.setRequestProperty(\"Content-Type\",\"application/json; charset=utf-8\");\n\n                int http=c.getResponseCode();\n                InputStream is=(http>=200&&http<400)?c.getInputStream():c.getErrorStream();\n                String body=readAll(is);\n                if(body==null||body.trim().isEmpty())continue;\n                JSONObject j=new JSONObject(body);\n                if(!\"0\".equals(j.optString(\"rt_cd\",\"\")))continue;\n                org.json.JSONArray\
        \ arr=j.optJSONArray(\"output2\");\n                if(arr==null)continue;\n\n                for(int i=0;i<arr.length();i++){\n                    JSONObject o=arr.optJSONObject(i);\n                    if(o==null)continue;\n                    String d=o.optString(\"stck_bsop_date\",date);\n                    String tm=o.optString(\"stck_cntg_hour\",\"\");\n                    if(d.length()!=8||tm.length()<6)continue;\n                    String key=d+tm.substring(0,6);\n                    uniq.put(key,new Candle(\n                        key,\n                        num(o.optString(\"stck_oprc\",\"0\")),\n                        num(o.optString(\"stck_hgpr\",\"0\")),\n                        num(o.optString(\"stck_lwpr\",\"0\")),\n                        num(o.optString(\"stck_prpr\",o.optString(\"stck_clpr\",\"0\"))),\n                        num(o.optString(\"cntg_vol\",\"0\"))\n                    ));\n                }\n            }finally{ c.disconnect(); }\n        }\n    }\n\n    List<Candle> requestIntraday1m(String env,String code)throws Exception{\n        refreshTokenIfNeeded(env);\n        Map<String,Candle> uniq=new LinkedHashMap<>();\n\n        // Cached history paints immediately on later visits.\n        for(Candle q:loadMinuteCache(code)){\n            if(q!=null && q.date!=null)uniq.put(q.date,q);\n        }\n\n        SimpleDateFormat timeFmt=new SimpleDateFormat(\"HHmmss\",Locale.KOREA);\n        SimpleDateFormat dayFmt=new SimpleDateFormat(\"yyyyMMdd\",Locale.KOREA);\n\n        Calendar base=Calendar.getInstance();\n\n        for(int page=0;page<4;page++){\n            Calendar cursor=(Calendar)base.clone();\n            cursor.add(Calendar.MINUTE,-30*page);\n\n            String hour=timeFmt.format(cursor.getTime());\n\n            String url=\n                baseUrl(env)+\n                \"/uapi/domestic-stock/v1/quotations/inquire-time-itemchartprice\"+\n                \"?FID_COND_MRKT_DIV_CODE=J\"+\n                \"&FID_INPUT_ISCD=\"+URLEncoder.encode(code,StandardCharsets.UTF_8.name())+\n                \"&FID_INPUT_HOUR_1=\"+hour+\n                \"&FID_PW_DATA_INCU_YN=Y\"+\n                \"&FID_ETC_CLS_CODE=\";\n\n            waitForApiSlot();\n\n            HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();\n\n            try{\n                c.setRequestMethod(\"GET\");\n                c.setConnectTimeout(15000);\n                c.setReadTimeout(20000);\n                c.setRequestProperty(\"authorization\",\"Bearer \"+prefs.getString(tokenName(env),\"\"));\n                c.setRequestProperty(\"appkey\",prefs.getString(keyName(env),\"\"));\n                c.setRequestProperty(\"appsecret\",prefs.getString(secretName(env),\"\"));\n                c.setRequestProperty(\"tr_id\",\"FHKST03010200\");\n                c.setRequestProperty(\"Content-Type\",\"application/json; charset=utf-8\");\n\n                int http=c.getResponseCode();\n                InputStream is=(http>=200&&http<400)?c.getInputStream():c.getErrorStream();\n                String body=readAll(is);\n\n                if(body==null||body.trim().isEmpty())continue;\n\n                JSONObject j=new JSONObject(body);\n\n                if(!\"0\".equals(j.optString(\"rt_cd\",\"\"))){\n                    throw new Exception(j.optString(\"msg1\",\"분봉 조회 실패\"));\n                }\n\n                org.json.JSONArray arr=j.optJSONArray(\"output2\");\n                if(arr==null)continue;\n\n                for(int i=0;i<arr.length();i++){\n                    JSONObject o=arr.optJSONObject(i);\n                    if(o==null)continue;\n\n                    String d=o.optString(\"stck_bsop_date\",\"\");\n                    if(d.length()!=8)d=dayFmt.format(new Date());\n\n                    String tm=o.optString(\"stck_cntg_hour\",\"\");\n                    if(tm.length()<6)continue;\n\n                    String key=d+tm.substring(0,6);\n\n                    uniq.put(key,new Candle(\n                        key,\n                        num(o.optString(\"stck_oprc\",\"0\")),\n                        num(o.optString(\"stck_hgpr\",\"0\")),\n                        num(o.optString(\"stck_lwpr\",\"0\")),\n                        num(o.optString(\"stck_prpr\",\"0\")),\n                        num(o.optString(\"cntg_vol\",\"0\"))\n                    ));\n                }\n\n            }finally{\n                c.disconnect();\n            }\n        }\n\n        // v2.18.2 FAST:\n        // Avoid dozens of historical REST calls before first paint.\n        // Existing local minute cache is reused; fresh recent bars return immediately.\n        // 1/3/5/15/30/60-minute candles can render first, then realtime ticks keep them alive.\n\n        List<Candle> out=new ArrayList<>(uniq.values());\n        Collections.sort(out,(a,b)->a.date.compareTo(b.date));\n        saveMinuteCache(code,out);\n        return out;\n    }\n\n    List<Candle> aggregateMinutes(List<Candle> one,int minutes){\n        List<Candle> out=new ArrayList<>();\n        if(one==null||one.isEmpty())return out;\n\n        Candle current=null;\n        String currentBucket=null;\n\n        for(Candle c:one){\n            try{\n                int hour=Integer.parseInt(c.date.substring(8,10));\n                int minute=Integer.parseInt(c.date.substring(10,12));\n                int bucketMinute=(minute/minutes)*minutes;\n\n                String bucket=\n                    c.date.substring(0,8)+\n                    String.format(Locale.US,\"%02d%02d00\",hour,bucketMinute);\n\n                if(!bucket.equals(currentBucket)){\n                    if(current!=null)out.add(current);\n\n                    current=new Candle(\n                        bucket,\n                        c.open,c.high,c.low,c.close,c.volume\n                    );\n                    currentBucket=bucket;\n\n                }else{\n                    current.high=Math.max(current.high,c.high);\n                    current.low=Math.min(current.low,c.low);\n                    current.close=c.close;\n                    current.volume+=c.volume;\n                }\n\n            }catch(Exception ignored){}\n        }\n\n        if(current!=null)out.add(current);\n        return out;\n    }\n\n    LinearLayout orderRow(\n        int level,\n        boolean ask,\n        TextView[] prices,\n        TextView[] qtys\n    ){\n        LinearLayout row=new LinearLayout(this);\n        row.setOrientation(LinearLayout.HORIZONTAL);\n        row.setGravity(Gravity.CENTER_VERTICAL);\n        row.setPadding(dp(10),dp(7),dp(10),dp(7));\n\n        GradientDrawable rg=new GradientDrawable();\n        rg.setColor(\n            ask\n                ? Color.argb(42,255,105,127)\n                : Color.argb(42,83,146,255)\n        );\n        rg.setCornerRadius(dp(9));\n        row.setBackground(rg);\n\n        TextView lv=text(\n            ask?\"매도 \"+level:\"매수 \"+level,\n            12,\n            ask?RED:BLUE,\n            true\n        );\n        TextView price=text(\"-\",15,TEXT,true);\n        TextView qty=text(\"-\",12,MUTED,false);\n\n        prices[level]=price;\n        qtys[level]=qty;\n\n        row.addView(lv,new LinearLayout.LayoutParams(0,-2,0.28f));\n        row.addView(price,new LinearLayout.LayoutParams(0,-2,0.38f));\n        row.addView(qty,new LinearLayout.LayoutParams(0,-2,0.34f));\n\n        LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);\n        lp.setMargins(0,0,0,dp(3));\n        row.setLayoutParams(lp);\n        return row;\n    }\n\n    void showOrderBook(String code,String name){\n        prefs.edit()\n            .putString(LAST_STOCK_CODE,code)\n            .putString(LAST_STOCK_NAME,name)\n            .apply();\n\n        screenMode=\"ORDERBOOK\";\n        clear(\"\U0001F4DA \"+name+\" 호가\",\"실시간형 10단 매도/매수 · \"+code);\n        screenMode=\"ORDERBOOK\";\n        orderBookActive=true;\n\n        LinearLayout top=card();\n        Button back=button(\"← 차트로\");\n        back.setOnClickListener(v->showStocks());\n        top.addView(back);\n        top.addView(text(name+\"  \"+code,21,TEXT,true));\n        top.addView(text(\n            \"매도는 붉은 계열 · 매수는 푸른 계열 · 약 2.5초 자동 갱신\",\n            12,CYAN,false\n        ));\n        content.addView(top);\n\n        LinearLayout board=card();\n        board.addView(text(\"매도 10단\",17,RED,true));\n\n        TextView[] askPrices=new TextView[11];\n        TextView[] askQtys=new TextView[11];\n        TextView[] bidPrices=new TextView[11];\n        TextView[] bidQtys=new TextView[11];\n\n        for(int i=10;i>=1;i--){\n            board.addView(orderRow(i,true,askPrices,askQtys));\n        }\n\n        TextView middle=text(\"현재 호가 갱신 대기...\",16,YELLOW,true);\n        middle.setGravity(Gravity.CENTER);\n        middle.setPadding(0,dp(12),0,dp(12));\n        board.addView(middle);\n\n        board.addView(text(\"매수 10단\",17,BLUE,true));\n        for(int i=1;i<=10;i++){\n            board.addView(orderRow(i,false,bidPrices,bidQtys));\n        }\n\n        content.addView(board);\n\n        Button refresh=button(\"지금 새로고침\");\n        content.addView(refresh);\n\n        final Runnable[] loader=new Runnable[1];\n        loader[0]=()->{\n            if(!orderBookActive || !\"ORDERBOOK\".equals(screenMode))return;\n\n            new Thread(()->{\n                try{\n                    JSONObject j=requestOrderBook(activeEnv(),code);\n                    JSONObject o=j.optJSONObject(\"output1\");\n\n                    if(!\"0\".equals(j.optString(\"rt_cd\",\"\")) || o==null){\n                        throw new Exception(j.optString(\"msg1\",\"호가 조회 실패\"));\n                    }\n\n                    runOnUiThread(()->{\n                        if(!orderBookActive || !\"ORDERBOOK\".equals(screenMode))return;\n\n                        for(int i=1;i<=10;i++){\n                            askPrices[i].setText(money(o.optString(\"askp\"+i,\"-\")));\n                            askQtys[i].setText(\"잔량 \"+qty(o.optString(\"askp_rsqn\"+i,\"-\")));\n                            bidPrices[i].setText(money(o.optString(\"bidp\"+i,\"-\")));\n                            bidQtys[i].setText(\"잔량 \"+qty(o.optString(\"bidp_rsqn\"+i,\"-\")));\n                        }\n\n                        middle.setText(\n                            \"총 매도잔량 \"+o.optString(\"total_askp_rsqn\",\"-\")+\n                            \"   ↕   총 매수잔량 \"+o.optString(\"total_bidp_rsqn\",\"-\")+\n                            \"\\n갱신 \"+new SimpleDateFormat(\"HH:mm:ss\",Locale.KOREA).format(new Date())\n                        );\n\n                        orderBookHandler.postDelayed(loader[0],2500);\n                    });\n\n                }catch(Exception ex){\n                    runOnUiThread(()->{\n                        if(orderBookActive){\n                            middle.setText(\"\U0001F534 \"+safeError(ex)+\"\\n잠시 후 다시 시도\");\n                            middle.setTextColor(RED);\n                            orderBookHandler.postDelayed(loader[0],3500);\n                        }\n                    });\n                }\n            }).start();\n        };\n\n        refresh.setOnClickListener(v->loader[0].run());\n        loader[0].run();\n    }\n\n    JSONObject requestInvestor(String env,String code)throws Exception{\n        String url=\n            baseUrl(env)+\n            \"/uapi/domestic-stock/v1/quotations/inquire-investor\"+\n            \"?FID_COND_MRKT_DIV_CODE=J\"+\n            \"&FID_INPUT_ISCD=\"+URLEncoder.encode(code,StandardCharsets.UTF_8.name());\n\n        waitForApiSlot();\n        HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();\n        try{\n            c.setRequestMethod(\"GET\");\n            c.setConnectTimeout(15000);\n            c.setReadTimeout(20000);\n            c.setRequestProperty(\"authorization\",\"Bearer \"+prefs.getString(tokenName(env),\"\"));\n            c.setRequestProperty(\"appkey\",prefs.getString(keyName(env),\"\"));\n            c.setRequestProperty(\"appsecret\",prefs.getString(secretName(env),\"\"));\n            c.setRequestProperty(\"tr_id\",\"FHKST01010900\");\n            c.setRequestProperty(\"Content-Type\",\"application/json; charset=utf-8\");\n\n            int http=c.getResponseCode();\n            InputStream is=(http>=200&&http<400)?c.getInputStream():c.getErrorStream();\n            String body=readAll(is);\n            if(body==null||body.trim().isEmpty())throw new Exception(\"투자자 응답 없음 HTTP \"+http);\n            return new JSONObject(body);\n        }finally{\n            c.disconnect();\n        }\n    }\n\n    JSONObject latestInvestorRow(JSONObject j){\n        org.json.JSONArray arr=j.optJSONArray(\"output\");\n        if(arr!=null && arr.length()>0)return arr.optJSONObject(0);\n        JSONObject obj=j.optJSONObject(\"output\");\n        return obj;\n    }\n\n    String investorVal(JSONObject o,String... keys){\n        if(o==null)return \"-\";\n        for(String k:keys){\n            String v=o.optString(k,\"\");\n            if(v!=null&&!v.isEmpty())return v;\n        }\n        return \"-\";\n    }\n\n    JSONObject requestOrderBook(String env,String code)throws Exception{\n        refreshTokenIfNeeded(env);\n        String url=\n            baseUrl(env)+\n            \"/uapi/domestic-stock/v1/quotations/inquire-asking-price-exp-ccn\"+\n            \"?FID_COND_MRKT_DIV_CODE=J\"+\n            \"&FID_INPUT_ISCD=\"+URLEncoder.encode(code,StandardCharsets.UTF_8.name());\n\n        waitForApiSlot();\n\n        HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();\n\n        try{\n            c.setRequestMethod(\"GET\");\n            c.setConnectTimeout(15000);\n            c.setReadTimeout(20000);\n            c.setRequestProperty(\"authorization\",\"Bearer \"+prefs.getString(tokenName(env),\"\"));\n            c.setRequestProperty(\"appkey\",prefs.getString(keyName(env),\"\"));\n            c.setRequestProperty(\"appsecret\",prefs.getString(secretName(env),\"\"));\n            c.setRequestProperty(\"tr_id\",\"FHKST01010200\");\n            c.setRequestProperty(\"Content-Type\",\"application/json; charset=utf-8\");\n\n            int http=c.getResponseCode();\n            InputStream is=(http>=200&&http<400)?c.getInputStream():c.getErrorStream();\n            String body=readAll(is);\n\n            if(body==null||body.trim().isEmpty()){\n                throw new Exception(\"호가 응답 없음 HTTP \"+http);\n            }\n\n            return new JSONObject(body);\n\n        }finally{\n            c.disconnect();\n        }\n    }\n\n    double num(String s){\n        try{\n            return Double.parseDouble((s==null?\"0\":s).replace(\",\",\"\"));\n        }catch(Exception e){\n            return 0;\n        }\n    }\n\n    AISignal analyze(List<Candle> c){\n        AISignal s=new AISignal();\n\n        if(c==null||c.size()<21){\n            s.score=0;\n            s.label=\"데이터 부족\";\n            return s;\n        }\n\n        int n=c.size();\n        s.ma5=avgClose(c,5);\n        s.ma20=avgClose(c,20);\n        s.rsi=rsi14(c);\n\n        Candle last=c.get(n-1);\n\n        double prev20High=0;\n        for(int i=Math.max(0,n-21);i<n-1;i++){\n            prev20High=Math.max(prev20High,c.get(i).high);\n        }\n\n        s.bos=last.close>prev20High && prev20High>0;\n\n        double low20=Double.MAX_VALUE;\n        double high20=0;\n        double avgVol=0;\n\n        for(int i=n-20;i<n;i++){\n            low20=Math.min(low20,c.get(i).low);\n            high20=Math.max(high20,c.get(i).high);\n            avgVol+=c.get(i).volume;\n        }\n\n        avgVol/=20.0;\n\n        double range=Math.max(1,high20-low20);\n        double pos=(last.close-low20)/range;\n\n        s.discount=pos<=0.38 && last.close>=s.ma5;\n        s.explosion=last.volume>=avgVol*1.8 && last.close>last.open;\n\n        int score=50;\n        if(last.close>s.ma5)score+=8;\n        if(s.ma5>s.ma20)score+=8;\n        if(s.rsi>=50&&s.rsi<=70)score+=6;\n        if(s.bos)score+=12;\n        if(s.discount)score+=8;\n        if(s.explosion)score+=10;\n        if(last.close<s.ma20)score-=10;\n        if(s.rsi>78)score-=8;\n\n        s.score=Math.max(0,Math.min(100,score));\n\n        if(s.score>=86)s.label=\"\U0001F680 돌파예비\";\n        else if(s.score>=80)s.label=\"\U0001F6E1️ 지지형\";\n        else if(s.score>=66)s.label=\"관찰\";\n        else s.label=\"대기\";\n\n        return s;\n    }\n\n    double avgClose(List<Candle> c,int p){\n        int start=Math.max(0,c.size()-p);\n        double sum=0;\n        int cnt=0;\n\n        for(int i=start;i<c.size();i++){\n            sum+=c.get(i).close;\n            cnt++;\n        }\n\n        return cnt==0?0:sum/cnt;\n    }\n\n    double rsi14(List<Candle> c){\n        if(c.size()<15)return 0;\n\n        double gain=0;\n        double loss=0;\n        int start=c.size()-14;\n\n        for(int i=start;i<c.size();i++){\n            double diff=c.get(i).close-c.get(i-1).close;\n            if(diff>=0)gain+=diff;\n            else loss-=diff;\n        }\n\n        if(loss==0)return 100;\n\n        double rs=(gain/14.0)/(loss/14.0);\n        return 100.0-(100.0/(1.0+rs));\n    }\n\n    String money(String raw){\n        try{\n            return String.format(Locale.KOREA,\"%,d원\",Math.round(num(raw)));\n        }catch(Exception e){ return raw+\"원\"; }\n    }\n\n    String qty(String raw){\n        try{\n            return String.format(Locale.KOREA,\"%,d주\",Math.round(num(raw)));\n        }catch(Exception e){ return raw+\"주\"; }\n    }\n\n    String moneySigned(String raw){\n        try{\n            long v=Math.round(num(raw));\n            return String.format(Locale.KOREA,\"%+d원\",v);\n        }catch(Exception e){ return raw+\"원\"; }\n    }\n\n    String amountWon(String raw){\n        try{\n            double v=num(raw);\n            if(Math.abs(v)>=100000000.0)\n                return String.format(Locale.KOREA,\"%.1f억원\",v/100000000.0);\n            if(Math.abs(v)>=10000.0)\n                return String.format(Locale.KOREA,\"%.1f만원\",v/10000.0);\n            return String.format(Locale.KOREA,\"%,.0f원\",v);\n        }catch(Exception e){ return raw+\"원\"; }\n    }\n\n    String fmt(double v){\n        return String.format(Locale.US,\"%.0f\",v);\n    }\n\n    class StockChartView extends View{\n        List<Candle> candles=new ArrayList<>();\n        AISignal signal=null;\n        Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);\n\n        StockChartView(Activity a){\n            super(a);\n            setBackgroundColor(Color.rgb(11,20,36));\n        }\n\n        void setCandles(List<Candle> c,AISignal s){\n            candles=new ArrayList<>(c);\n            signal=s;\n            invalidate();\n        }\n\n        @Override\n        protected void onDraw(Canvas canvas){\n            super.onDraw(canvas);\n\n            if(candles==null||candles.isEmpty()){\n                p.setColor(MUTED);\n                p.setTextSize(dp(14));\n                canvas.drawText(\n                    \"종목을 검색하면 실제 일봉 차트가 표시됩니다.\",\n                    dp(16),dp(36),p\n                );\n                return;\n            }\n\n            float w=getWidth();\n            float h=getHeight();\n            float left=dp(12);\n            float right=w-dp(12);\n            float top=dp(26);\n            float bottom=h-dp(44);\n\n            double min=Double.MAX_VALUE;\n            double max=0;\n\n            for(Candle c:candles){\n                min=Math.min(min,c.low);\n                max=Math.max(max,c.high);\n            }\n\n            if(max<=min)return;\n\n            float step=(right-left)/Math.max(1,candles.size());\n            float bodyW=Math.max(dp(2),step*0.55f);\n\n            p.setStrokeWidth(dp(1));\n\n            for(int i=0;i<candles.size();i++){\n                Candle c=candles.get(i);\n\n                float x=left+i*step+step/2f;\n                float yH=priceY(c.high,min,max,top,bottom);\n                float yL=priceY(c.low,min,max,top,bottom);\n                float yO=priceY(c.open,min,max,top,bottom);\n                float yC=priceY(c.close,min,max,top,bottom);\n\n                int color=c.close>=c.open\n                    ? Color.rgb(255,92,92)\n                    : Color.rgb(80,145,255);\n\n                p.setColor(color);\n                p.setStyle(Paint.Style.STROKE);\n                canvas.drawLine(x,yH,x,yL,p);\n\n                p.setStyle(Paint.Style.FILL);\n\n                float rt=Math.min(yO,yC);\n                float rb=Math.max(yO,yC);\n\n                if(Math.abs(rb-rt)<dp(1))rb=rt+dp(1);\n\n                canvas.drawRect(\n                    x-bodyW/2f,\n                    rt,\n                    x+bodyW/2f,\n                    rb,\n                    p\n                );\n            }\n\n            drawMA(canvas,5,Color.rgb(255,205,90),min,max,top,bottom,left,step);\n            drawMA(canvas,20,Color.rgb(116,230,171),min,max,top,bottom,left,step);\n\n            p.setColor(MUTED);\n            p.setTextSize(dp(11));\n            canvas.drawText(\n                \"5MA / 20MA · \"+candles.get(0).date+\" ~ \"+candles.get(candles.size()-1).date,\n                left,\n                h-dp(14),\n                p\n            );\n\n            if(signal!=null){\n                p.setTextSize(dp(12));\n                p.setColor(signal.score>=80?GREEN:(signal.score>=66?YELLOW:MUTED));\n                canvas.drawText(\n                    signal.label+\" \"+signal.score+\"점\",\n                    left,\n                    dp(16),\n                    p\n                );\n            }\n        }\n\n        float priceY(\n            double price,double min,double max,\n            float top,float bottom\n        ){\n            return (float)(\n                bottom-(price-min)/(max-min)*(bottom-top)\n            );\n        }\n\n        void drawMA(\n            Canvas canvas,\n            int period,\n            int color,\n            double min,double max,\n            float top,float bottom,\n            float left,float step\n        ){\n            if(candles.size()<period)return;\n\n            Path path=new Path();\n            boolean started=false;\n\n            p.setColor(color);\n            p.setStrokeWidth(dp(2));\n            p.setStyle(Paint.Style.STROKE);\n\n            for(int i=period-1;i<candles.size();i++){\n                double sum=0;\n\n                for(int j=i-period+1;j<=i;j++){\n                    sum+=candles.get(j).close;\n                }\n\n                double ma=sum/period;\n                float x=left+i*step+step/2f;\n                float y=priceY(ma,min,max,top,bottom);\n\n                if(!started){\n                    path.moveTo(x,y);\n                    started=true;\n                }else{\n                    path.lineTo(x,y);\n                }\n            }\n\n            canvas.drawPath(path,p);\n            p.setStyle(Paint.Style.FILL);\n        }\n    }\n\n    void waitForApiSlot(){\n        synchronized(apiRateLock){\n            long now=System.currentTimeMillis();\n            long wait=1200L-(now-lastApiCallAt);\n\n            if(wait>0){\n                try{\n                    Thread.sleep(wait);\n                }catch(Exception ignored){}\n            }\n\n            lastApiCallAt=System.currentTimeMillis();\n        }\n    }\n\n    JSONObject requestUsdKrw(String env)throws Exception{\n        refreshTokenIfNeeded(env);\n\n        SimpleDateFormat fmt=new SimpleDateFormat(\"yyyyMMdd\",Locale.KOREA);\n        String today=fmt.format(new Date());\n\n        String url=\n            baseUrl(env)+\n            \"/uapi/overseas-price/v1/quotations/inquire-daily-chartprice\"+\n            \"?FID_COND_MRKT_DIV_CODE=X\"+\n            \"&FID_INPUT_ISCD=\"+\n            URLEncoder.encode(\"FX@KRWKFTC\",StandardCharsets.UTF_8.name())+\n            \"&FID_INPUT_DATE_1=\"+today+\n            \"&FID_INPUT_DATE_2=\"+today+\n            \"&FID_PERIOD_DIV_CODE=D\";\n\n        waitForApiSlot();\n\n        HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();\n        try{\n            c.setRequestMethod(\"GET\");\n            c.setConnectTimeout(12000);\n            c.setReadTimeout(15000);\n            c.setRequestProperty(\n                \"authorization\",\n                \"Bearer \"+prefs.getString(tokenName(env),\"\")\n            );\n            c.setRequestProperty(\"appkey\",prefs.getString(keyName(env),\"\"));\n            c.setRequestProperty(\"appsecret\",prefs.getString(secretName(env),\"\"));\n            c.setRequestProperty(\"tr_id\",\"FHKST03030100\");\n            c.setRequestProperty(\"Content-Type\",\"application/json; charset=utf-8\");\n\n            int http=c.getResponseCode();\n            InputStream is=(http>=200&&http<400)?c.getInputStream():c.getErrorStream();\n            String body=readAll(is);\n            if(body==null||body.trim().isEmpty())\n                throw new Exception(\"환율 응답 없음 HTTP \"+http);\n            return new JSONObject(body);\n        }finally{\n            c.disconnect();\n        }\n    }\n\n    void applyUsdKrw(TextView v,JSONObject data){\n        if(v==null)return;\n        if(data==null){v.setText(\"원/달러  -\");return;}\n        JSONObject o=data.optJSONObject(\"output1\");\n        if(o==null){v.setText(\"원/달러  -\");return;}\n\n        String now=o.optString(\"ovrs_nmix_prpr\",\"-\");\n        double diff=num(o.optString(\"ovrs_nmix_prdy_vrss\",\"0\"));\n        String pct=o.optString(\"prdy_ctrt\",\"0\");\n        String arrow=diff>0?\"▲\":diff<0?\"▼\":\"-\";\n\n        String value;\n        try{\n            value=String.format(Locale.KOREA,\"%,.2f\",num(now))+\"  \"+arrow+\" \"+\n                String.format(Locale.KOREA,\"%,.2f\",Math.abs(diff))+\n                \" (\"+(diff>0?\"+\":\"\")+pct+\"%)\";\n        }catch(Exception e){value=now;}\n\n        int valueColor=diff>0?Color.rgb(255,88,88):\n            diff<0?Color.rgb(83,150,255):Color.rgb(225,232,244);\n        String label=\"원/달러\";\n        SpannableString sp=new SpannableString(label+\"  \"+value);\n        sp.setSpan(new ForegroundColorSpan(Color.rgb(180,126,255)),0,label.length(),Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n        sp.setSpan(new StyleSpan(Typeface.BOLD),0,label.length(),Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n        sp.setSpan(new ForegroundColorSpan(valueColor),label.length()+2,sp.length(),Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n        v.setText(sp);\n    }\n\n    JSONObject requestMarketIndex(String env,String indexCode)throws Exception{\n        refreshTokenIfNeeded(env);\n\n        String url=\n            baseUrl(env)+\n            \"/uapi/domestic-stock/v1/quotations/inquire-index-price\"+\n            \"?FID_COND_MRKT_DIV_CODE=U\"+\n            \"&FID_INPUT_ISCD=\"+\n            URLEncoder.encode(indexCode,StandardCharsets.UTF_8.name());\n\n        waitForApiSlot();\n\n        HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();\n        try{\n            c.setRequestMethod(\"GET\");\n            c.setConnectTimeout(12000);\n            c.setReadTimeout(15000);\n            c.setRequestProperty(\n                \"authorization\",\n                \"Bearer \"+prefs.getString(tokenName(env),\"\")\n            );\n            c.setRequestProperty(\"appkey\",prefs.getString(keyName(env),\"\"));\n            c.setRequestProperty(\"appsecret\",prefs.getString(secretName(env),\"\"));\n            c.setRequestProperty(\"tr_id\",\"FHPUP02100000\");\n            c.setRequestProperty(\"Content-Type\",\"application/json; charset=utf-8\");\n\n            int http=c.getResponseCode();\n            InputStream is=(http>=200&&http<400)?c.getInputStream():c.getErrorStream();\n            String body=readAll(is);\n            if(body==null||body.trim().isEmpty())\n                throw new Exception(\"지수 응답 없음 HTTP \"+http);\n            return new JSONObject(body);\n        }finally{\n            c.disconnect();\n        }\n    }\n\n    JSONObject marketIndexOutput(JSONObject j){\n        if(j==null)return null;\n        JSONObject o=j.optJSONObject(\"output\");\n        if(o!=null)return o;\n        org.json.JSONArray a=j.optJSONArray(\"output\");\n        if(a!=null&&a.length()>0)return a.optJSONObject(0);\n        return null;\n    }\n\n    String indexNumber(String raw){\n        try{\n            return String.format(Locale.KOREA,\"%,.2f\",num(raw));\n        }catch(Exception e){ return raw==null?\"-\":raw; }\n    }\n\n    void applyBottomIndex(TextView v,String label,JSONObject data){\n        JSONObject o=marketIndexOutput(data);\n        if(v==null)return;\n        if(o==null){ v.setText(label+\"  -\"); return; }\n\n        String pr=o.optString(\"bstp_nmix_prpr\",\"-\");\n        double diff=num(o.optString(\"bstp_nmix_prdy_vrss\",\"0\"));\n        String pct=o.optString(\"bstp_nmix_prdy_ctrt\",\"0\");\n        String arrow=diff>0?\"▲\":diff<0?\"▼\":\"-\";\n\n        int labelColor=\"KOSPI\".equals(label)\n            ? Color.rgb(255,194,90)\n            : Color.rgb(82,196,255);\n        int valueColor=diff>0\n            ? Color.rgb(255,88,88)\n            : diff<0?Color.rgb(83,150,255):Color.rgb(225,232,244);\n\n        String value=indexNumber(pr)+\"  \"+arrow+\" \"+indexNumber(Math.abs(diff)+\"\")+\" (\"+\n            (diff>0?\"+\":\"\")+pct+\"%)\";\n\n        SpannableString sp=new SpannableString(label+\"  \"+value);\n        sp.setSpan(new ForegroundColorSpan(labelColor),0,label.length(),Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n        sp.setSpan(new StyleSpan(Typeface.BOLD),0,label.length(),Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n        sp.setSpan(new ForegroundColorSpan(valueColor),label.length()+2,sp.length(),Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n        v.setText(sp);\n    }\n\n    JSONObject requestQuote(String env,String stockCode)throws Exception{\n        refreshTokenIfNeeded(env);\n        String url=\n            baseUrl(env)+\n            \"/uapi/domestic-stock/v1/quotations/inquire-price\"+\n            \"?FID_COND_MRKT_DIV_CODE=J\"+\n            \"&FID_INPUT_ISCD=\"+\n            URLEncoder.encode(stockCode,StandardCharsets.UTF_8.name());\n\n        HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();\n\n        try{\n            c.setRequestMethod(\"GET\");\n            c.setConnectTimeout(15000);\n            c.setReadTimeout(20000);\n\n            c.setRequestProperty(\n                \"authorization\",\n                \"Bearer \"+prefs.getString(tokenName(env),\"\")\n            );\n            c.setRequestProperty(\n                \"appkey\",\n                prefs.getString(keyName(env),\"\")\n            );\n            c.setRequestProperty(\n                \"appsecret\",\n                prefs.getString(secretName(env),\"\")\n            );\n            c.setRequestProperty(\n                \"tr_id\",\n                \"FHKST01010100\"\n            );\n            c.setRequestProperty(\n                \"Content-Type\",\n                \"application/json; charset=utf-8\"\n            );\n\n            int http=c.getResponseCode();\n\n            InputStream is=\n                (http>=200&&http<400)\n                ? c.getInputStream()\n                : c.getErrorStream();\n\n            String body=readAll(is);\n\n            if(body==null||body.trim().isEmpty()){\n                throw new Exception(\"시세 응답이 비어 있습니다. HTTP \"+http);\n            }\n\n            return new JSONObject(body);\n\n        }finally{\n            c.disconnect();\n        }\n    }\n\n    void showAI(){\n        screenMode=\"AI\";\n        clear(\"AI 검색기\",\"사용자 검색 스크립트 1~5 + 차트 적용 스크립트를 파일로 관리합니다.\");\n\n        LinearLayout guide=card();\n        guide.addView(text(\"사용자 커스텀 검색기\",19,TEXT,true));\n        guide.addView(text(\n            \"각 슬롯은 제목·조건을 직접 편집하고 앱에 저장하거나 .txt 파일로 내보내고 다시 불러올 수 있습니다.\\n\"+\n            \"검색 규칙은 S