 volatile String liveLastTradeVolume=\"\";\n    volatile String liveTradeTime=\"\";\n    volatile String liveProgramNet=\"\";\n    volatile String liveOrderBook=\"\";\n    volatile String liveAskTotal=\"\";\n    volatile String liveBidTotal=\"\";\n    volatile String liveBestAsk=\"\";\n    volatile String liveBestBid=\"\";\n    volatile String liveOpen=\"\";\n    volatile String liveHigh=\"\";\n    volatile String liveLow=\"\";\n    volatile String liveBidRate=\"\";\n    volatile String livePrevSameTimeRate=\"\";\n    volatile String liveExpectPrice=\"\";\n    volatile String liveExpectQty=\"\";\n    volatile String liveExpectRate=\"\";\n    volatile boolean liveNxtAvailable=false;\n    volatile String liveWsStatus=\"대기\";\n    volatile long liveSeq=0L;\n    final Map<String,List<Candle>> stockChartCache=new HashMap<>();\n    final Map<String,Long> stockChartCacheAt=new HashMap<>();\n    String screenMode=\"HOME\";\n\n    static final String PREFS=\"marcus_kis_v03\";\n    static final String ENV=\"kis_env\";\n    static final String REAL=\"실전투자\";\n    static final String MOCK=\"모의투자\";\n\n    static final String REAL_KEY=\"kis_real_key\";\n    static final String REAL_SECRET=\"kis_real_secret\";\n    static final String REAL_TOKEN=\"kis_real_token\";\n    static final String REAL_EXPIRES=\"kis_real_expires\";\n\n    static final String MOCK_KEY=\"kis_mock_key\";\n    static final String MOCK_SECRET=\"kis_mock_secret\";\n    static final String MOCK_TOKEN=\"kis_mock_token\";\n    static final String MOCK_EXPIRES=\"kis_mock_expires\";\n\n\n    static class RealtimeStockChartView extends View{\n        final Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);\n        final Paint grid=new Paint(Paint.ANTI_ALIAS_FLAG);\n        final Paint textPaint=new Paint(Paint.ANTI_ALIAS_FLAG);\n        final Paint maPaint=new Paint(Paint.ANTI_ALIAS_FLAG);\n        final List<Candle> data=new ArrayList<>();\n        final ScaleGestureDetector scaler;\n        float candleW=6.2f;\n        float panX=0f;\n        float lastX=0f;\n        boolean dragging=false;\n        int upColor=Color.rgb(235,78,78);\n        int downColor=Color.rgb(55,126,222);\n        int gridColor=Color.rgb(24,45,75);\n        int textColor=Color.rgb(211,220,236);\n        String title=\"\";\n        String period=\"\";\n        int flashFrames=0;\n        int toolMode=0; // 0=pan, 1=crosshair, 2=trend line\n        float crossX=-1f,crossY=-1f;\n        float lineX1=-1f,lineY1=-1f,lineX2=-1f,lineY2=-1f;\n        boolean drawingLine=false;\n\n        // Indicator customization\n        boolean showMA5=true,showMA10=true,showMA20=true,showMA60=true,showMA120=true;\n        boolean showBollinger=false;\n        boolean showEnvelope=false;\n        boolean showPSAR=false;\n        boolean showPriceChannel=false;\n        boolean showIchimoku=true;\n        boolean showVolumeProfile=true;\n        int lowerIndicator=0; // 0 RSI, 1 Stochastic, 2 MACD, 3 MFI, 4 Momentum, 5 ADX\n        int maFast=5,maMid=20,maSlow=60;\n\n        // Realtime candle state\n        double lastCumVolume=-1;\n        String lastLiveMinute=\"\";\n        int newCandleFrames=0;\n\n        // Drawing tools: 0 pan, 1 crosshair, 2 trend, 3 horizontal, 4 fibonacci\n        float hLineY=-1f;\n        boolean fibDrawing=false;\n\n        // Drawing objects are stored in chart coordinates (candle index + price),\n        // not screen pixels, so they survive zoom/pan and reopen per stock.\n        int drawIndex1=-1,drawIndex2=-1;\n        double drawPrice1=Double.NaN,drawPrice2=Double.NaN;\n        int editHandle=0; // 0 new/none, 1 first point, 2 second point, 3 move whole object\n        int lastEditIndex=-1;\n        double lastEditPrice=Double.NaN;\n\n        int currentStart=0,currentEnd=0;\n        double currentMin=0,currentMax=1;\n        float currentLeft=0,currentRight=0,currentTop=0,currentPriceBottom=0;\n        Runnable onChartChanged=null;\n\n        // Candle tap information\n        int selectedCandleIndex=-1;\n        float touchDownX=0f,touchDownY=0f;\n        boolean touchMoved=false;\n\n        int candleIndexAt(float x){\n            if(data.isEmpty() || getWidth()<=0)return -1;\n            final float den=getResources().getDisplayMetrics().density;\n            float left=8*den;\n            float right=getWidth()-62*den;\n            float futureGap=Math.max(42*den,Math.min(110*den,(right-left)*0.13f));\n            float candleRight=right-futureGap;\n            if(x<left || x>candleRight)return -1;\n\n            int visible=Math.max(12,(int)((candleRight-left)/candleW));\n            int shift=(int)(panX/candleW);\n            int end=Math.min(data.size()-1,data.size()-1-shift);\n            if(end<0)return -1;\n            int start=Math.max(0,end-visible+1);\n\n            int idx=end-Math.round((candleRight-x-candleW/2f)/candleW);\n            return Math.max(start,Math.min(end,idx));\n        }\n\n        String candleDateLabel(String raw){\n            if(raw==null)return \"\";\n            String d=raw.trim();\n\n            if(d.length()==8 && d.matches(\"\\\\d{8}\")){\n                return d.substring(0,4)+\".\"+d.substring(4,6)+\".\"+d.substring(6,8);\n            }\n            if(d.length()>=12 && d.substring(0,8).matches(\"\\\\d{8}\")){\n                String base=d.substring(0,4)+\".\"+d.substring(4,6)+\".\"+d.substring(6,8);\n                String hm=d.substring(8);\n                if(hm.length()>=4)base+=\" \"+hm.substring(0,2)+\":\"+hm.substring(2,4);\n                return base;\n            }\n            return d;\n        }\n\n        RealtimeStockChartView(Context c){\n            super(c);\n            setBackgroundColor(Color.rgb(5,17,31));\n            grid.setColor(gridColor);\n            grid.setStrokeWidth(1.1f*getResources().getDisplayMetrics().density);\n            textPaint.setColor(textColor);\n            textPaint.setTextSize(11f*getResources().getDisplayMetrics().scaledDensity);\n            maPaint.setStrokeWidth(1.45f*getResources().getDisplayMetrics().density);\n            maPaint.setStyle(Paint.Style.STROKE);\n            scaler=new ScaleGestureDetector(c,new ScaleGestureDetector.SimpleOnScaleGestureListener(){\n                @Override public boolean onScale(ScaleGestureDetector d){\n                    candleW*=d.getScaleFactor();\n                    candleW=Math.max(3.5f,Math.min(28f,candleW));\n                    invalidate();\n                    return true;\n                }\n            });\n        }\n\n        void setSeries(List<Candle> candles,String n,String per){\n            data.clear();\n            if(candles!=null)data.addAll(candles);\n            title=n;\n            period=per;\n            panX=0f;\n            lastLiveMinute=\"\";\n            lastCumVolume=-1;\n            newCandleFrames=0;\n            flashFrames=5;\n            invalidate();\n        }\n\n        void pulse(){\n            flashFrames=5;\n            invalidate();\n        }\n\n        JSONObject exportChartState(){\n            JSONObject j=new JSONObject();\n            try{\n                j.put(\"showMA5\",showMA5); j.put(\"showMA10\",showMA10);\n                j.put(\"showMA20\",showMA20); j.put(\"showMA60\",showMA60);\n                j.put(\"showBollinger\",showBollinger);\n                j.put(\"showEnvelope\",showEnvelope);\n                j.put(\"showPSAR\",showPSAR);\n                j.put(\"showPriceChannel\",showPriceChannel);\n                j.put(\"showIchimoku\",showIchimoku);\n                j.put(\"showVolumeProfile\",showVolumeProfile);\n                j.put(\"lowerIndicator\",lowerIndicator);\n                j.put(\"candleW\",candleW); j.put(\"panX\",panX);\n                j.put(\"hLineY\",hLineY);\n                j.put(\"lineX1\",lineX1); j.put(\"lineY1\",lineY1);\n                j.put(\"lineX2\",lineX2); j.put(\"lineY2\",lineY2);\n                j.put(\"fibDrawing\",fibDrawing);\n                j.put(\"drawIndex1\",drawIndex1); j.put(\"drawIndex2\",drawIndex2);\n                j.put(\"drawPrice1\",drawPrice1); j.put(\"drawPrice2\",drawPrice2);\n            }catch(Exception ignored){}\n            return j;\n        }\n\n        void importChartState(JSONObject j){\n            if(j==null)return;\n            try{\n                showMA5=j.optBoolean(\"showMA5\",true);\n                showMA10=j.optBoolean(\"showMA10\",true);\n                showMA20=j.optBoolean(\"showMA20\",true);\n                showMA60=j.optBoolean(\"showMA60\",true);\n                showMA120=j.optBoolean(\"showMA120\",true);\n                showBollinger=j.optBoolean(\"showBollinger\",false);\n                showEnvelope=j.optBoolean(\"showEnvelope\",false);\n                showPSAR=j.optBoolean(\"showPSAR\",false);\n                showPriceChannel=j.optBoolean(\"showPriceChannel\",false);\n                showIchimoku=j.optBoolean(\"showIchimoku\",true);\n                showVolumeProfile=j.optBoolean(\"showVolumeProfile\",true);\n                lowerIndicator=j.optInt(\"lowerIndicator\",0);\n                candleW=(float)j.optDouble(\"candleW\",6.2);\n                panX=(float)j.optDouble(\"panX\",0.0);\n                hLineY=(float)j.optDouble(\"hLineY\",-1.0);\n                lineX1=(float)j.optDouble(\"lineX1\",-1.0);\n                lineY1=(float)j.optDouble(\"lineY1\",-1.0);\n                lineX2=(float)j.optDouble(\"lineX2\",-1.0);\n                lineY2=(float)j.optDouble(\"lineY2\",-1.0);\n                fibDrawing=j.optBoolean(\"fibDrawing\",false);\n                drawIndex1=j.optInt(\"drawIndex1\",-1);\n                drawIndex2=j.optInt(\"drawIndex2\",-1);\n                drawPrice1=j.optDouble(\"drawPrice1\",Double.NaN);\n                drawPrice2=j.optDouble(\"drawPrice2\",Double.NaN);\n                invalidate();\n            }catch(Exception ignored){}\n        }\n\n        void setIndicatorConfig(\n            boolean ma5,boolean ma10,boolean ma20,boolean ma60,\n            boolean boll,boolean env,boolean psar,boolean channel,boolean ichimoku,\n            boolean vp,int lower\n        ){\n            showMA5=ma5; showMA10=ma10; showMA20=ma20; showMA60=ma60;\n            showBollinger=boll;\n            showEnvelope=env;\n            showPSAR=psar;\n            showPriceChannel=channel;\n            showIchimoku=ichimoku;\n            showVolumeProfile=vp;\n            lowerIndicator=lower;\n            invalidate();\n        }\n\n        int liveBucketMinutes(){\n            if(period==null)return 1;\n            if(period.contains(\"60분\"))return 60;\n            if(period.contains(\"30분\"))return 30;\n            if(period.contains(\"15분\"))return 15;\n            if(period.contains(\"5분\"))return 5;\n            if(period.contains(\"3분\"))return 3;\n            return 1;\n        }\n\n        String liveBucketKey(int mins){\n            Calendar cal=Calendar.getInstance();\n            String day=new SimpleDateFormat(\"yyyyMMdd\",Locale.US).format(cal.getTime());\n            if(period!=null && period.contains(\"일봉\"))return day;\n            int h=cal.get(Calendar.HOUR_OF_DAY);\n            int m=cal.get(Calendar.MINUTE);\n            int bucket=(m/Math.max(1,mins))*Math.max(1,mins);\n            return String.format(Locale.US,\"%s%02d%02d00\",day,h,bucket);\n        }\n\n        void updateRealtimeTick(double price,double cumulativeVolume){\n            if(price<=0)return;\n\n            int bucketMinutes=liveBucketMinutes();\n            String minute=liveBucketKey(bucketMinutes);\n            double delta=0;\n            if(cumulativeVolume>=0 && lastCumVolume>=0){\n                delta=Math.max(0,cumulativeVolume-lastCumVolume);\n            }\n            if(cumulativeVolume>=0)lastCumVolume=cumulativeVolume;\n\n            if(data.isEmpty()){\n                data.add(new Candle(minute,price,price,price,price,delta));\n                lastLiveMinute=minute;\n                newCandleFrames=7;\n            }else{\n                Candle q=data.get(data.size()-1);\n\n                if(!minute.equals(lastLiveMinute) && !lastLiveMinute.isEmpty()){\n                    data.add(new Candle(minute,price,price,price,price,delta));\n                    newCandleFrames=7;\n                }else{\n                    q.close=price;\n                    q.high=Math.max(q.high,price);\n                    q.low=Math.min(q.low,price);\n                    if(delta>0)q.volume+=delta;\n                }\n                lastLiveMinute=minute;\n            }\n\n            flashFrames=5;\n            invalidate();\n        }\n\n        double stddev(int idx,int len,double mean){\n            if(idx<len-1)return Double.NaN;\n            double sum=0;\n            for(int i=idx-len+1;i<=idx;i++){\n                double d=data.get(i).close-mean;\n                sum+=d*d;\n            }\n            return Math.sqrt(sum/len);\n        }\n\n        double highest(int idx,int len){\n            if(idx<len-1)return Double.NaN;\n            double hi=-Double.MAX_VALUE;\n            for(int i=idx-len+1;i<=idx;i++)hi=Math.max(hi,data.get(i).high);\n            return hi;\n        }\n\n        double lowest(int idx,int len){\n            if(idx<len-1)return Double.NaN;\n            double lo=Double.MAX_VALUE;\n            for(int i=idx-len+1;i<=idx;i++)lo=Math.min(lo,data.get(i).low);\n            return lo;\n        }\n\n        double momentum(int idx,int len){\n            if(idx<len)return 0;\n            return data.get(idx).close-data.get(idx-len).close;\n        }\n\n        double moneyFlowIndex(int idx,int len){\n            if(idx<len)return 50;\n            double pos=0,neg=0;\n            for(int i=idx-len+1;i<=idx;i++){\n                double tp=(data.get(i).high+data.get(i).low+data.get(i).close)/3.0;\n                double prev=(data.get(i-1).high+data.get(i-1).low+data.get(i-1).close)/3.0;\n                double mf=tp*Math.max(1,data.get(i).volume);\n                if(tp>=prev)pos+=mf; else neg+=mf;\n            }\n            if(neg<=0)return 100;\n            double r=pos/neg;\n            return 100.0-(100.0/(1.0+r));\n        }\n\n        double adxApprox(int idx,int len){\n            if(idx<len+1)return 20;\n            double trend=Math.abs(data.get(idx).close-data.get(idx-len).close);\n            double range=0;\n            for(int i=idx-len+1;i<=idx;i++)range+=Math.max(0.0001,data.get(i).high-data.get(i).low);\n            return Math.max(0,Math.min(100,trend/range*100.0*len));\n        }\n\n        double stochasticK(int idx,int len){\n            if(idx<len-1)return 50;\n            double hi=-Double.MAX_VALUE,lo=Double.MAX_VALUE;\n            for(int i=idx-len+1;i<=idx;i++){\n                hi=Math.max(hi,data.get(i).high);\n                lo=Math.min(lo,data.get(i).low);\n            }\n            if(hi<=lo)return 50;\n            return (data.get(idx).close-lo)/(hi-lo)*100.0;\n        }\n\n        double emaAt(int idx,int len){\n            if(idx<0||data.isEmpty())return 0;\n            double a=2.0/(len+1.0);\n            double e=data.get(0).close;\n            for(int i=1;i<=idx;i++) e=a*data.get(i).close+(1-a)*e;\n            return e;\n        }\n\n        int touchIndex(float x){\n            if(data.isEmpty() || currentRight<=currentLeft)return -1;\n            int idx=currentEnd-Math.round((currentRight-x-candleW/2f)/candleW);\n            return Math.max(currentStart,Math.min(currentEnd,idx));\n        }\n\n        double touchPrice(float y){\n            if(currentPriceBottom<=currentTop || currentMax<=currentMin)return Double.NaN;\n            double ratio=(currentPriceBottom-y)/(double)(currentPriceBottom-currentTop);\n            ratio=Math.max(0,Math.min(1,ratio));\n            return currentMin+(currentMax-currentMin)*ratio;\n        }\n\n        float drawX(int idx){\n            return currentRight-(currentEnd-idx)*candleW-candleW/2f;\n        }\n\n        float drawY(double price){\n            return yPrice(price,currentMin,currentMax,currentTop,currentPriceBottom);\n        }\n\n        boolean near(float x,float y,float tx,float ty,float radius){\n            float dx=x-tx,dy=y-ty;\n            return dx*dx+dy*dy<=radius*radius;\n        }\n\n        float distanceToSegment(float px,float py,float x1,float y1,float x2,float y2){\n            float dx=x2-x1,dy=y2-y1;\n            if(dx==0 && dy==0)return (float)Math.hypot(px-x1,py-y1);\n            float t=((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy);\n            t=Math.max(0,Math.min(1,t));\n            float qx=x1+t*dx,qy=y1+t*dy;\n            return (float)Math.hypot(px-qx,py-qy);\n        }\n\n        void setToolMode(int mode){\n            toolMode=mode;\n            crossX=crossY=-1f;\n            drawingLine=false;\n            invalidate();\n        }\n\n        void clearDrawings(){\n            crossX=crossY=-1f;\n            lineX1=lineY1=lineX2=lineY2=-1f;\n            hLineY=-1f;\n            drawingLine=false;\n            fibDrawing=false;\n            drawIndex1=drawIndex2=-1;\n            drawPrice1=drawPrice2=Double.NaN;\n            editHandle=0;\n            invalidate();\n        }\n\n        void resetViewport(){\n            candleW=6.2f;\n            panX=0f;\n            selectedCandleIndex=-1;\n            clearDrawings();\n        }\n\n        @Override public boolean onTouchEvent(MotionEvent e){\n            if(getParent()!=null){\n                boolean lock=e.getActionMasked()!=MotionEvent.ACTION_UP &&\n                             e.getActionMasked()!=MotionEvent.ACTION_CANCEL;\n                getParent().requestDisallowInterceptTouchEvent(lock);\n            }\n\n            scaler.onTouchEvent(e);\n\n            switch(e.getActionMasked()){\n                case MotionEvent.ACTION_DOWN:\n                    lastX=e.getX();\n                    dragging=true;\n                    touchDownX=e.getX();\n                    touchDownY=e.getY();\n                    touchMoved=false;\n\n                    if(toolMode==1){\n                        crossX=e.getX(); crossY=e.getY();\n                    }else if(toolMode==2 || toolMode==4){\n                        float r=14f*getResources().getDisplayMetrics().density;\n                        editHandle=0;\n\n                        if(drawIndex1>=0 && drawIndex2>=0 &&\n                           !Double.isNaN(drawPrice1) && !Double.isNaN(drawPrice2)){\n                            float ax=drawX(drawIndex1), ay=drawY(drawPrice1);\n                            float bx=drawX(drawIndex2), by=drawY(drawPrice2);\n\n                            if(near(e.getX(),e.getY(),ax,ay,r))editHandle=1;\n                            else if(near(e.getX(),e.getY(),bx,by,r))editHandle=2;\n                            else if(distanceToSegment(e.getX(),e.getY(),ax,ay,bx,by)<r)editHandle=3;\n                        }\n\n                        int ti=touchIndex(e.getX());\n                        double tp=touchPrice(e.getY());\n\n                        if(editHandle==0){\n                            drawIndex1=drawIndex2=ti;\n                            drawPrice1=drawPrice2=tp;\n                            editHandle=2;\n                        }\n\n                        lastEditIndex=ti;\n                        lastEditPrice=tp;\n                        drawingLine=true;\n                        fibDrawing=toolMode==4;\n                    }else if(toolMode==3){\n                        hLineY=e.getY();\n                    }\n                    invalidate();\n                    return true;\n\n                case MotionEvent.ACTION_MOVE:\n                    if(Math.abs(e.getX()-touchDownX)>8f*getResources().getDisplayMetrics().density ||\n                       Math.abs(e.getY()-touchDownY)>8f*getResources().getDisplayMetrics().density){\n                        touchMoved=true;\n                    }\n\n                    if(toolMode==0){\n                        if(!scaler.isInProgress()){\n                            float dx=e.getX()-lastX;\n                            panX+=dx;\n                            lastX=e.getX();\n                        }\n                    }else if(toolMode==1){\n                        crossX=e.getX(); crossY=e.getY();\n                    }else if((toolMode==2 || toolMode==4) && drawingLine){\n                        int ti=touchIndex(e.getX());\n                        double tp=touchPrice(e.getY());\n\n                        if(editHandle==1){\n                            drawIndex1=ti; drawPrice1=tp;\n                        }else if(editHandle==2){\n                            drawIndex2=ti; drawPrice2=tp;\n                        }else if(editHandle==3 && lastEditIndex>=0 && !Double.isNaN(lastEditPrice)){\n                            int di=ti-lastEditIndex;\n                            double dp=tp-lastEditPrice;\n                            drawIndex1+=di; drawIndex2+=di;\n                            drawIndex1=Math.max(0,Math.min(data.size()-1,drawIndex1));\n                            drawIndex2=Math.max(0,Math.min(data.size()-1,drawIndex2));\n                            drawPrice1+=dp; drawPrice2+=dp;\n                        }\n                        lastEditIndex=ti;\n                        lastEditPrice=tp;\n                    }else if(toolMode==3){\n                        hLineY=e.getY();\n                    }\n                    invalidate();\n                    return true;\n\n                case MotionEvent.ACTION_UP:\n                case MotionEvent.ACTION_CANCEL:\n                    if(e.getActionMasked()==MotionEvent.ACTION_UP &&\n                       toolMode==0 &&\n                       !touchMoved &&\n                       !scaler.isInProgress()){\n                        int hit=candleIndexAt(e.getX());\n                        if(hit>=0){\n                            selectedCandleIndex=hit;\n                        }else{\n                            selectedCandleIndex=-1;\n                        }\n                    }\n\n                    if(toolMode==1){\n                        crossX=e.getX(); crossY=e.getY();\n                    }else if((toolMode==2 || toolMode==4) && drawingLine){\n                        if(editHandle==1){\n                            drawIndex1=touchIndex(e.getX()); drawPrice1=touchPrice(e.getY());\n                        }else if(editHandle==2){\n                            drawIndex2=touchIndex(e.getX()); drawPrice2=touchPrice(e.getY());\n                        }\n                        drawingLine=false;\n                        editHandle=0;\n                    }else if(toolMode==3){\n                        hLineY=e.getY();\n                    }\n                    dragging=false;\n                    if(getParent()!=null)getParent().requestDisallowInterceptTouchEvent(false);\n                    invalidate();\n                    if(onChartChanged!=null)onChartChanged.run();\n                    return true;\n            }\n            return true;\n        }\n\n        String fmtValue(double v){\n            if(Double.isNaN(v) || Double.isInfinite(v))return \"-\";\n            return String.format(Locale.KOREA,\"%,.2f\",v);\n        }\n\n        String fmtValue0(double v){\n            if(Double.isNaN(v) || Double.isInfinite(v))return \"-\";\n            return String.format(Locale.KOREA,\"%,.0f\",v);\n        }\n\n        String pctFromClose(double value,double close){\n            if(Double.isNaN(value) || Double.isInfinite(value) || close==0)return \"\";\n            return String.format(Locale.KOREA,\" (%+.2f%%)\",(value-close)/close*100.0);\n        }\n\n        String compactAmount(double won){\n            double a=Math.abs(won);\n            if(a>=100000000.0)return String.format(Locale.KOREA,\"%.1f억\",won/100000000.0);\n            if(a>=10000.0)return String.format(Locale.KOREA,\"%.0f만\",won/10000.0);\n            return String.format(Locale.KOREA,\"%,.0f\",won);\n        }\n\n        double sma(int idx,int len){\n            if(idx<len-1)return Double.NaN;\n            double sum=0;\n            for(int j=idx-len+1;j<=idx;j++)sum+=data.get(j).close;\n            return sum/len;\n        }\n\n        double rsi(int idx,int len){\n            if(idx<len)return 50;\n            double gain=0,loss=0;\n            for(int i=idx-len+1;i<=idx;i++){\n                double d=data.get(i).close-data.get(i-1).close;\n                if(d>=0)gain+=d; else loss-=d;\n            }\n            if(loss==0)return 100;\n            double rs=(gain/len)/(loss/len);\n            return 100-(100/(1+rs));\n        }\n\n        void drawRightValueTag(\n            Canvas c,String value,float y,int color,float right,float den\n        ){\n            if(value==null)value=\"-\";\n            textPaint.setTextSize(10*getResources().getDisplayMetrics().scaledDensity);\n            textPaint.setFakeBoldText(true);\n            float x1=right+2*den;\n            float x2=getWidth()-2*den;\n            float hh=10*den;\n            p.setStyle(Paint.Style.FILL);\n            p.setColor(color);\n            c.drawRoundRect(x1,y-hh,x2,y+hh,3*den,3*den,p);\n            textPaint.setColor(Color.WHITE);\n            float tw=textPaint.measureText(value);\n            c.drawText(value,Math.max(x1+2*den,x2-tw-3*den),y+4*den,textPaint);\n            textPaint.setFakeBoldText(false);\n        }\n\n        float yPrice(double v,double min,double max,float top,float bottom){\n            if(max<=min)return (top+bottom)/2f;\n            return (float)(bottom-((v-min)/(max-min))*(bottom-top));\n        }\n\n        @Override protected void onDraw(Canvas c){\n            super.onDraw(c);\n            if(getWidth()<=0||getHeight()<=0)return;\n\n            final float den=getResources().getDisplayMetrics().density;\n            float left=8*den, right=getWidth()-62*den;\n            float futureGap=Math.max(42*den,Math.min(110*den,(right-left)*0.13f));\n            float candleRight=right-futureGap;\n            float top=28*den;\n            float priceBottom=getHeight()*0.585f;\n            float volTop=priceBottom+4*den;\n            float volBottom=getHeight()*0.705f;\n            float stochTop=volBottom+5*den;\n            float stochBottom=getHeight()*0.845f;\n            float rsiTop=stochBottom+5*den;\n            float rsiBottom=getHeight()-16*den;\n\n            p.setStyle(Paint.Style.FILL);\n            p.setColor(Color.rgb(5,17,31));\n            c.drawRect(0,0,getWidth(),getHeight(),p);\n\n            // Grid\n            for(int i=0;i<=5;i++){\n                float y=top+(priceBottom-top)*i/5f;\n                c.drawLine(left,y,right,y,grid);\n            }\n            for(int i=0;i<=6;i++){\n                float x=left+(right-left)*i/6f;\n                c.drawLine(x,top,x,rsiBottom,grid);\n            }\n            c.drawLine(left,volBottom,right,volBottom,grid);\n            c.drawLine(left,stochBottom,right,stochBottom,grid);\n\n            textPaint.setTextSize(11*getResources().getDisplayMetrics().scaledDensity);\n            textPaint.setColor(Color.rgb(221,230,247));\n            c.drawText(title+\"  ·  \"+period,left,16*den,textPaint);\n\n            if(data.isEmpty()){\n                textPaint.setTextSize(15*getResources().getDisplayMetrics().scaledDensity);\n                textPaint.setColor(Color.rgb(150,170,205));\n                c.drawText(\"차트 데이터를 불러오는 중...\",left,70*den,textPaint);\n                return;\n            }\n\n            int visible=Math.max(12,(int)((candleRight-left)/candleW));\n            int shift=(int)(panX/candleW);\n            int end=Math.min(data.size()-1,data.size()-1-shift);\n            if(end<0)end=0;\n            int start=Math.max(0,end-visible+1);\n\n            double min=Double.MAX_VALUE,max=-Double.MAX_VALUE,maxVol=1;\n            double rawLow=Double.MAX_VALUE,rawHigh=-Double.MAX_VALUE;\n            int rawLowIndex=start,rawHighIndex=start;\n            for(int i=start;i<=end;i++){\n                Candle q=data.get(i);\n                min=Math.min(min,q.low); max=Math.max(max,q.high);\n                if(q.low<rawLow){rawLow=q.low;rawLowIndex=i;}\n                if(q.high>rawHigh){rawHigh=q.high;rawHighIndex=i;}\n                maxVol=Math.max(maxVol,q.volume);\n            }\n            double pad=(max-min)*0.08;\n            if(pad<=0)pad=Math.max(1,max*0.01);\n            min-=pad; max+=pad;\n\n            currentStart=start; currentEnd=end;\n            currentMin=min; currentMax=max;\n            currentLeft=left; currentRight=candleRight;\n            currentTop=top; currentPriceBottom=priceBottom;\n\n            // price scale labels\n            textPaint.setTextSize(10*getResources().getDisplayMetrics().scaledDensity);\n            for(int i=0;i<=5;i++){\n                double pv=max-(max-min)*i/5.0;\n                float y=top+(priceBottom-top)*i/5f;\n                textPaint.setColor(Color.rgb(194,207,232));\n                c.drawText(String.format(Locale.KOREA,\"%,.0f\",pv),right+5*den,y+4*den,textPaint);\n            }\n\n            float body=Math.max(2*den,candleW*0.58f);\n            Path ma5=new Path(),ma10=new Path(),ma20=new Path(),ma60=new Path(),ma120=new Path();\n            boolean m5=false,m10=false,m20=false,m60=false,m120=false;\n\n            for(int i=start;i<=end;i++){\n                Candle q=data.get(i);\n                float x=candleRight-(end-i)*candleW-candleW/2f;\n                int col=q.close>=q.open?upColor:downColor;\n                p.setColor(col);\n                p.setStrokeWidth(1.2f*den);\n\n                float yh=yPrice(q.high,min,max,top,priceBottom);\n                float yl=yPrice(q.low,min,max,top,priceBottom);\n                float yo=yPrice(q.open,min,max,top,priceBottom);\n                float yc=yPrice(q.close,min,max,top,priceBottom);\n                c.drawLine(x,yh,x,yl,p);\n                float bt=Math.min(yo,yc),bb=Math.max(yo,yc);\n                if(bb-bt<1.5f*den)bb=bt+1.5f*den;\n                float liveBody=body;\n                if(i==end && newCandleFrames>0){\n                    float progress=(8f-newCandleFrames)/7f;\n                    progress=Math.max(0.18f,Math.min(1f,progress));\n                    liveBody=Math.max(2*den,body*(0.35f+0.65f*progress));\n                    p.setAlpha(145+(int)(110*progress));\n                }\n                c.drawRect(x-liveBody/2,bt,x+liveBody/2,bb,p);\n                p.setAlpha(255);\n                if(i==end && newCandleFrames>0){\n                    newCandleFrames--;\n                    postInvalidateDelayed(65);\n                }\n\n                // volume\n                float vh=(float)((q.volume/maxVol)*(volBottom-volTop));\n                p.setColor(Color.argb(175,Color.red(col),Color.green(col),Color.blue(col)));\n                c.drawRect(x-body/2,volBottom-vh,x+body/2,volBottom,p);\n\n                double[] mas={sma(i,5),sma(i,10),sma(i,20),sma(i,60),sma(i,120)};\n                Path[] paths={ma5,ma10,ma20,ma60,ma120};\n                boolean[] started={m5,m10,m20,m60,m120};\n                for(int k=0;k<5;k++){\n                    if(Double.isNaN(mas[k]))continue;\n                    float my=yPrice(mas[k],min,max,top,priceBottom);\n                    if(!started[k]){ paths[k].moveTo(x,my); started[k]=true; }\n                    else paths[k].lineTo(x,my);\n                }\n                m5=started[0];m10=started[1];m20=started[2];m60=started[3];m120=started[4];\n            }\n\n            int[] mac={\n                Color.rgb(255,202,65),\n                Color.rgb(74,203,228),\n                Color.rgb(89,218,174),\n                Color.rgb(166,112,226),\n                Color.rgb(205,211,220)\n            };\n            int mainIndicatorSave=c.save();\n            c.clipRect(left,top,right,priceBottom);\n            Path[] paths={ma5,ma10,ma20,ma60,ma120};\n            boolean[] showMas={showMA5,showMA10,showMA20,showMA60,showMA120};\n            for(int k=0;k<5;k++){\n                if(!showMas[k])continue;\n                maPaint.setColor(mac[k]);\n                c.drawPath(paths[k],maPaint);\n            }\n\n            // Visible highest / lowest labels.\n            Candle latest=data.get(end);\n            double latestClose=latest.close;\n\n            float highX=candleRight-(end-rawHighIndex)*candleW-candleW/2f;\n            float highY=yPrice(rawHigh,min,max,top,priceBottom);\n            float lowX=candleRight-(end-rawLowIndex)*candleW-candleW/2f;\n            float lowY=yPrice(rawLow,min,max,top,priceBottom);\n\n            String highDate=candleDateLabel(data.get(rawHighIndex).date);\n            String lowDate=candleDateLabel(data.get(rawLowIndex).date);\n            if(highDate.length()>=5)highDate=highDate.substring(Math.max(0,highDate.length()-5)).replace(\".\",\"/\");\n            if(lowDate.length()>=5)lowDate=lowDate.substring(Math.max(0,lowDate.length()-5)).replace(\".\",\"/\");\n\n            double visibleHighPct=rawHigh==0?0:(latestClose/rawHigh-1.0)*100.0;\n            double visibleLowPct=rawLow==0?0:(latestClose/rawLow-1.0)*100.0;\n\n            textPaint.setTextSize(10.5f*getResources().getDisplayMetrics().scaledDensity);\n            textPaint.setFakeBoldText(true);\n            String highLabel=String.format(Locale.KOREA,\"최고 %,.0f(%+.2f%%,%s)\",rawHigh,visibleHighPct,highDate);\n            String lowLabel=String.format(Locale.KOREA,\"최저 %,.0f(%+.2f%%,%s)\",rawLow,visibleLowPct,lowDate);\n\n            p.setStrokeWidth(1.2f*den);\n            p.setColor(Color.rgb(239,78,78));\n            textPaint.setColor(Color.rgb(239,78,78));\n            float highTextX=Math.max(left+4*den,Math.min(highX-18*den,candleRight-textPaint.measureText(highLabel)-4*den));\n            c.drawLine(highTextX,highY,highX,highY,p);\n            c.drawText(highLabel,highTextX,Math.max(top+12*den,highY-5*den),textPaint);\n\n            p.setColor(Color.rgb(63,133,235));\n            textPaint.setColor(Color.rgb(63,133,235));\n            float lowTextX=Math.max(left+4*den,Math.min(lowX-18*den,candleRight-textPaint.measureText(lowLabel)-4*den));\n            c.drawLine(lowTextX,lowY,lowX,lowY,p);\n            c.drawText(lowLabel,lowTextX,Math.min(priceBottom-5*den,lowY+14*den),textPaint);\n            textPaint.setFakeBoldText(false);\n\n            // Bollinger Bands (20,2)\n            if(showBollinger){\n                Path upper=new Path(),lower=new Path();\n                boolean us=false,ls=false;\n                for(int i=start;i<=end;i++){\n                    double mid=sma(i,20);\n                    if(Double.isNaN(mid))continue;\n                    double sd=stddev(i,20,mid);\n                    double up=mid+2.0*sd, dn=mid-2.0*sd;\n                    float x=candleRight-(end-i)*candleW-candleW/2f;\n                    float uy=yPrice(up,min,max,top,priceBottom);\n                    float ly=yPrice(dn,min,max,top,priceBottom);\n                    if(!us){upper.moveTo(x,uy);us=true;} else upper.lineTo(x,uy);\n                    if(!ls){lower.moveTo(x,ly);ls=true;} else lower.lineTo(x,ly);\n                }\n                maPaint.setColor(Color.rgb(255,160,210));\n                c.drawPath(upper,maPaint);\n                c.drawPath(lower,maPaint);\n            }\n\n            // Envelope (MA20 ±3%)\n            if(showEnvelope){\n                Path epU=new Path(),epL=new Path();\n                boolean eu=false,el=false;\n                for(int i=start;i<=end;i++){\n                    double mid=sma(i,20);\n                    if(Double.isNaN(mid))continue;\n                    float x=candleRight-(end-i)*candleW-candleW/2f;\n                    float uy=yPrice(mid*1.03,min,max,top,priceBottom);\n                    float ly=yPrice(mid*0.97,min,max,top,priceBottom);\n                    if(!eu){epU.moveTo(x,uy);eu=true;} else epU.lineTo(x,uy);\n                    if(!el){epL.moveTo(x,ly);el=true;} else epL.lineTo(x,ly);\n                }\n                maPaint.setColor(Color.rgb(120,200,255));\n                c.drawPath(epU,maPaint); c.drawPath(epL,maPaint);\n            }\n\n            // Price Channel (20)\n            if(showPriceChannel){\n                Path pcU=new Path(),pcL=new Path();\n                boolean pu=false,pl=false;\n                for(int i=start;i<=end;i++){\n                    double hi=highest(i,20),lo=lowest(i,20);\n                    if(Double.isNaN(hi)||Double.isNaN(lo))continue;\n                    float x=candleRight-(end-i)*candleW-candleW/2f;\n                    float uy=yPrice(hi,min,max,top,priceBottom);\n                    float ly=yPrice(lo,min,max,top,priceBottom);\n                    if(!pu){pcU.moveTo(x,uy);pu=true;} else pcU.lineTo(x,uy);\n                    if(!pl){pcL.moveTo(x,ly);pl=true;} else pcL.lineTo(x,ly);\n                }\n                maPaint.setColor(Color.rgb(120,255,170));\n                c.drawPath(pcU,maPaint); c.drawPath(pcL,maPaint);\n            }\n\n            // Approximate PSAR markers\n            if(showPSAR){\n                p.setColor(Color.rgb(255,210,90));\n                for(int i=Math.max(start,2);i<=end;i+=2){\n                    Candle q=data.get(i);\n                    boolean rising=q.close>=data.get(i-1).close;\n                    double yv=rising?q.low:q.high;\n                    float x=candleRight-(end-i)*candleW-candleW/2f;\n                    float y=yPrice(yv,min,max,top,priceBottom)+(rising?6*den:-6*den);\n                    c.drawCircle(x,y,1.7f*den,p);\n                }\n            }\n\n            // Ichimoku: conversion/base + 26-bar forward cloud + lagging span.\n            if(showIchimoku){\n                Path tenkan=new Path(),kijun=new Path(),lagging=new Path();\n                Path cloud=new Path();\n                boolean ts=false,ks=false,ls=false;\n                ArrayList<Float> ax=new ArrayList<>(), ay=new ArrayList<>();\n                ArrayList<Float> bx=new ArrayList<>(), by=new ArrayList<>();\n\n                float shift26=26f*candleW;\n\n                int ichimokuCalcStart=Math.max(0,start-52);\n                for(int i=ichimokuCalcStart;i<=end;i++){\n                    double h9=highest(i,9),l9=lowest(i,9);\n                    double h26=highest(i,26),l26=lowest(i,26);\n                    double h52=highest(i,52),l52=lowest(i,52);\n                    if(Double.isNaN(h9)||Double.isNaN(l9))continue;\n\n                    float x=candleRight-(end-i)*candleW-candleW/2f;\n                    double conv=(h9+l9)/2.0;\n                    float ty=yPrice(conv,min,max,top,priceBottom);\n                    if(x>=left && x<=right){\n                        if(!ts){tenkan.moveTo(x,ty);ts=true;}else tenkan.lineTo(x,ty);\n                    }\n\n                    if(!Double.isNaN(h26)&&!Double.isNaN(l26)){\n                        double base=(h26+l26)/2.0;\n                        float ky=yPrice(base,min,max,top,priceBottom);\n                        if(x>=left && x<=right){\n                            if(!ks){kijun.moveTo(x,ky);ks=true;}else kijun.lineTo(x,ky);\n                        }\n\n                        double spanA=(conv+base)/2.0;\n                        double spanB=(!Double.isNaN(h52)&&!Double.isNaN(l52))\n                            ? (h52+l52)/2.0 : base;\n\n                        float fx=x+shift26;\n                        if(fx<=right+shift26){\n                            ax.add(fx); ay.add(yPrice(spanA,min,max,top,priceBottom));\n                            bx.add(fx); by.add(yPrice(spanB,min,max,top,priceBottom));\n                        }\n                    }\n\n                    float lx=x-shift26;\n                    if(lx>=left){\n                        float ly=yPrice(data.get(i).close,min,max,top,priceBottom);\n                        if(!ls){lagging.moveTo(lx,ly);ls=true;}else lagging.lineTo(lx,ly);\n                    }\n                }\n\n                if(ax.size()>1){\n                    int cloudSave=c.save();\n                    c.clipRect(left,top,right,priceBottom);\n\n                    p.setStyle(Paint.Style.FILL);\n                    for(int ci=1;ci<ax.size();ci++){\n                        Path cell=new Path();\n                        cell.moveTo(ax.get(ci-1),ay.get(ci-1));\n                        cell.lineTo(ax.get(ci),ay.get(ci));\n                        cell.lineTo(bx.get(ci),by.get(ci));\n                        cell.lineTo(bx.get(ci-1),by.get(ci-1));\n                        cell.close();\n\n                        boolean bullish=((ay.get(ci-1)+ay.get(ci))*0.5f) <\n                                        ((by.get(ci-1)+by.get(ci))*0.5f);\n                        p.setColor(\n                            bullish\n                                ? Color.argb(82,225,68,78)\n                                : Color.argb(92,42,112,220)\n                        );\n                        c.drawPath(cell,p);\n                    }\n                    c.restoreToCount(cloudSave);\n                    p.setStyle(Paint.Style.STROKE);\n                }\n\n                maPaint.setStrokeWidth(1.25f*den);\n                maPaint.setColor(Color.rgb(239,83,122)); c.drawPath(tenkan,maPaint);\n                maPaint.setColor(Color.rgb(110,185,238)); c.drawPath(kijun,maPaint);\n                maPaint.setColor(Color.rgb(190,92,211)); c.drawPath(lagging,maPaint);\n                maPaint.setStrokeWidth(1.45f*den);\n            }\n            c.restoreToCount(mainIndicatorSave);\n\n            // Price-by-volume profile: wide translucent amber bars + volume/ratio labels.\n            if(showVolumeProfile && max>min){\n                int bins=10;\n                double[] vp=new double[bins];\n                double maxBin=1,totalVp=0;\n\n                for(int i=start;i<=end;i++){\n                    Candle q=data.get(i);\n                    int lowBin=(int)Math.floor((q.low-min)/(max-min)*bins);\n                    int highBin=(int)Math.floor((q.high-min)/(max-min)*bins);\n                    lowBin=Math.max(0,Math.min(bins-1,lowBin));\n                    highBin=Math.max(0,Math.min(bins-1,highBin));\n                    if(highBin<lowBin){\n                        int tmp=lowBin; lowBin=highBin; highBin=tmp;\n                    }\n\n                    int touched=Math.max(1,highBin-lowBin+1);\n                    double share=Math.max(1,q.volume)/(double)touched;\n\n                    for(int b=lowBin;b<=highBin;b++){\n                        vp[b]+=share;\n                    }\n                    totalVp+=Math.max(1,q.volume);\n                }\n\n                for(int b=0;b<bins;b++){\n                    maxBin=Math.max(maxBin,vp[b]);\n                }\n\n                for(int b=0;b<bins;b++){\n                    if(vp[b]<=0)continue;\n                    double pv=min+(max-min)*(b+0.5)/bins;\n                    float y=yPrice(pv,min,max,top,priceBottom);\n                    float w=(float)(vp[b]/maxBin)*(right-left)*0.82f;\n\n                    p.setStyle(Paint.Style.FILL);\n                    p.setColor(Color.argb(72,183,145,61));\n                    c.drawRect(left,y-8*den,left+w,y+8*den,p);\n\n                    p.setStyle(Paint.Style.STROKE);\n                    p.setStrokeWidth(1f*den);\n                    p.setColor(Color.argb(125,210,172,84));\n                    c.drawRect(left,y-8*den,left+w,y+8*den,p);\n\n                    if(w>95*den && totalVp>0){\n                        double pct=vp[b]/totalVp*100.0;\n                        textPaint.setTextSize(8.5f*getResources().getDisplayMetrics().scaledDensity);\n                        textPaint.setColor(Color.rgb(225,202,150));\n                        String lab=String.format(Locale.KOREA,\"%,.0f(%.2f%%)\",vp[b],pct);\n                        c.drawText(lab,left+w*0.50f,y+3*den,textPaint);\n                    }\n                }\n                p.setStyle(Paint.Style.FILL);\n            }\n\n            // separators + labels\n            p.setColor(Color.rgb(50,72,108)); p.setStrokeWidth(1f);\n            c.drawLine(left,priceBottom,right,priceBottom,p);\n            c.drawLine(left,volBottom,right,volBottom,p);\n            c.drawLine(left,stochBottom,right,stochBottom,p);\n\n            textPaint.setTextSize(10*getResources().getDisplayMetrics().scaledDensity);\n            float lx=left;\n            textPaint.setColor(Color.rgb(74,219,229));\n            c.drawText(\"거래량 \",lx,volTop+10*den,textPaint);\n            lx+=textPaint.measureText(\"거래량 \");\n            textPaint.setColor(Color.rgb(255,105,127));\n            c.drawText(\"단순 \",lx,volTop+10*den,textPaint);\n            lx+=textPaint.measureText(\"단순 \");\n            int[] vc={Color.rgb(255,202,65),Color.rgb(89,218,174),Color.rgb(166,112,226),Color.rgb(205,211,220)};\n            String[] vt={\"5 \",\"20 \",\"60 \",\"120\"};\n            for(int vi=0;vi<vt.length;vi++){\n                textPaint.setColor(vc[vi]);\n                c.drawText(vt[vi],lx,volTop+10*den,textPaint);\n                lx+=textPaint.measureText(vt[vi]);\n            }\n\n            // Latest volume / average-volume tags.\n            Candle latestIndicatorCandle=data.get(end);\n            double latestVol=latestIndicatorCandle.volume;\n            double volAvg5=0; int volN5=0;\n            for(int vi=Math.max(start,end-4);vi<=end;vi++){\n                volAvg5+=data.get(vi).volume; volN5++;\n            }\n            if(volN5>0)volAvg5/=volN5;\n            float latestVolH=(float)((latestVol/maxVol)*(volBottom-volTop));\n            float avgVolH=(float)((volAvg5/maxVol)*(volBottom-volTop));\n\n            drawRightValueTag(\n                c,\n                latestVol>=1000?String.format(Locale.KOREA,\"%.0fK\",latestVol/1000.0):String.format(Locale.KOREA,\"%.0f\",latestVol),\n                Math.max(volTop+12*den,volBottom-latestVolH),\n                Color.rgb(44,139,148),right,den\n        