el.close),x2,y,textPaint);\n\n                y+=lineH;\n                textPaint.setColor(Color.rgb(38,137,207)); c.drawText(\"기준선\",x1+8*den,y,textPaint);\n                textPaint.setColor(Color.rgb(50,55,65)); c.drawText(fmtValue(base)+pctFromClose(base,sel.close),x2,y,textPaint);\n\n                y+=lineH;\n                textPaint.setColor(Color.rgb(170,68,191)); c.drawText(\"후행스팬\",x1+8*den,y,textPaint);\n                textPaint.setColor(Color.rgb(50,55,65)); c.drawText(fmtValue(lagging)+pctFromClose(lagging,sel.close),x2,y,textPaint);\n\n                y+=lineH;\n                textPaint.setColor(Color.rgb(218,125,35)); c.drawText(\"선행스팬1\",x1+8*den,y,textPaint);\n                textPaint.setColor(Color.rgb(50,55,65)); c.drawText(fmtValue(span1)+pctFromClose(span1,sel.close),x2,y,textPaint);\n\n                y+=lineH;\n                textPaint.setColor(Color.rgb(46,110,205)); c.drawText(\"선행스팬2\",x1+8*den,y,textPaint);\n                textPaint.setColor(Color.rgb(50,55,65)); c.drawText(fmtValue(span2)+pctFromClose(span2,sel.close),x2,y,textPaint);\n\n                textPaint.setTypeface(Typeface.DEFAULT);\n            }\n\n            // last price tag, flash effect\n            Candle last=data.get(end);\n            float lastY=yPrice(last.close,min,max,top,priceBottom);\n            int lastCol=last.close>=last.open?upColor:downColor;\n            p.setColor(lastCol);\n            if(flashFrames>0){\n                p.setAlpha((flashFrames%2==0)?120:255);\n                flashFrames--;\n                postInvalidateDelayed(90);\n            }\n            c.drawRect(right,lastY-15*den,getWidth(),lastY+15*den,p);\n            p.setAlpha(255);\n            textPaint.setColor(Color.WHITE);\n            textPaint.setTypeface(Typeface.DEFAULT_BOLD);\n            textPaint.setTextSize(10.5f*getResources().getDisplayMetrics().scaledDensity);\n            c.drawText(String.format(Locale.KOREA,\"%,.0f\",last.close),right+5*den,lastY-1*den,textPaint);\n\n            double prevClose=(end>0)?data.get(end-1).close:last.close;\n            double pct=prevClose==0?0:(last.close-prevClose)/prevClose*100.0;\n            textPaint.setTextSize(8.2f*getResources().getDisplayMetrics().scaledDensity);\n            c.drawText(String.format(Locale.KOREA,\"%+.2f%%\",pct),right+5*den,lastY+11*den,textPaint);\n            textPaint.setTypeface(Typeface.DEFAULT);\n        }\n    }\n\n    static class MasterStock{\n        String code,name,market;\n        MasterStock(String c,String n,String m){\n            code=c; name=n; market=m;\n        }\n    }\n\n    void loadMasterStocks(){\n        masterStocks.clear();\n        try{\n            BufferedReader br=new BufferedReader(\n                new InputStreamReader(\n                    getAssets().open(\"stocks.csv\"),\n                    StandardCharsets.UTF_8\n                )\n            );\n\n            String line;\n            boolean first=true;\n\n            while((line=br.readLine())!=null){\n                if(first){\n                    first=false;\n                    continue;\n                }\n\n                List<String> parts=parseCsv(line);\n                if(parts.size()<3)continue;\n\n                String code=parts.get(0).trim();\n                String name=parts.get(1).trim();\n                String market=parts.get(2).trim();\n\n                if(code.matches(\"\\\\d{6}\")&&!name.isEmpty()){\n                    masterStocks.add(new MasterStock(code,name,market));\n                }\n            }\n            br.close();\n        }catch(Exception e){\n            // Search will fall back to direct 6-digit code if master asset fails.\n        }\n    }\n\n    List<String> parseCsv(String line){\n        List<String> out=new ArrayList<>();\n        StringBuilder cur=new StringBuilder();\n        boolean quoted=false;\n\n        for(int i=0;i<line.length();i++){\n            char ch=line.charAt(i);\n\n            if(ch=='\"'){\n                if(quoted && i+1<line.length() && line.charAt(i+1)=='\"'){\n                    cur.append('\"');\n                    i++;\n                }else{\n                    quoted=!quoted;\n                }\n            }else if(ch==',' && !quoted){\n                out.add(cur.toString());\n                cur.setLength(0);\n            }else{\n                cur.append(ch);\n            }\n        }\n\n        out.add(cur.toString());\n        return out;\n    }\n\n    int dp(int v){\n        return (int)(v*getResources().getDisplayMetrics().density+0.5f);\n    }\n\n    void autoFitText(TextView v,int minSp,int maxSp,int maxLines){\n        if(v==null)return;\n        v.setMaxLines(Math.max(1,maxLines));\n        v.setIncludeFontPadding(false);\n\n        if(Build.VERSION.SDK_INT>=26){\n            try{\n                v.setAutoSizeTextTypeUniformWithConfiguration(\n                    Math.max(6,minSp),\n                    Math.max(minSp,maxSp),\n                    1,\n                    TypedValue.COMPLEX_UNIT_SP\n                );\n            }catch(Exception ignored){}\n        }else{\n            v.setTextSize(Math.max(minSp,Math.min(maxSp,11)));\n        }\n    }\n\n    TextView text(String s,int size,int color,boolean bold){\n        TextView t=new TextView(this);\n        t.setText(s);\n        t.setTextSize(size);\n        t.setTextColor(color);\n        t.setPadding(0,dp(5),0,dp(5));\n        if(bold)t.setTypeface(Typeface.DEFAULT,Typeface.BOLD);\n        autoFitText(t,Math.max(7,size-5),size,2);\n        return t;\n    }\n\n    GradientDrawable bg(int color,int radius){\n        GradientDrawable g=new GradientDrawable();\n        g.setColor(color);\n        g.setCornerRadius(dp(radius));\n        return g;\n    }\n\n    GradientDrawable panelBg(int fill,int stroke){\n        GradientDrawable g=new GradientDrawable();\n        g.setColor(fill);\n        g.setCornerRadius(dp(5));\n        g.setStroke(dp(1),stroke);\n        return g;\n    }\n\n    void setSignedColor(TextView v,String raw){\n        double n=num(raw);\n        v.setTextColor(n>0?RED:(n<0?BLUE:Color.rgb(225,232,244)));\n    }\n\n    String investorPeriodSum(JSONObject root,int limit,String... keys){\n        if(root==null)return \"-\";\n        try{\n            org.json.JSONArray arr=root.optJSONArray(\"output\");\n            if(arr==null || arr.length()==0){\n                JSONObject one=root.optJSONObject(\"output\");\n                return investorVal(one,keys);\n            }\n            double sum=0;\n            int used=0;\n            for(int i=0;i<arr.length() && used<limit;i++){\n                JSONObject row=arr.optJSONObject(i);\n                if(row==null)continue;\n                String v=investorVal(row,keys);\n                if(v==null || v.isEmpty() || \"-\".equals(v))continue;\n                sum+=num(v);\n                used++;\n            }\n            if(used==0)return \"-\";\n            return String.format(Locale.KOREA,\"%.0f\",sum);\n        }catch(Exception e){\n            return \"-\";\n        }\n    }\n\n    LinearLayout card(){\n        LinearLayout c=new LinearLayout(this);\n        c.setOrientation(LinearLayout.VERTICAL);\n        c.setPadding(dp(16),dp(14),dp(16),dp(14));\n        GradientDrawable cg=new GradientDrawable(\n            GradientDrawable.Orientation.TL_BR,\n            new int[]{PANEL,Color.rgb(29,47,83)}\n        );\n        cg.setCornerRadius(dp(18));\n        cg.setStroke(dp(1),Color.rgb(55,77,119));\n        c.setBackground(cg);\n        LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);\n        lp.setMargins(0,0,0,dp(12));\n        c.setLayoutParams(lp);\n        return c;\n    }\n\n    EditText input(String hint){\n        EditText e=new EditText(this);\n        e.setHint(hint);\n        e.setHintTextColor(MUTED);\n        e.setTextColor(TEXT);\n        e.setSingleLine(true);\n        e.setPadding(dp(14),dp(11),dp(14),dp(11));\n        autoFitText(e,8,13,1);\n        e.setBackground(bg(PANEL2,12));\n        e.setInputType(\n            InputType.TYPE_CLASS_TEXT |\n            InputType.TYPE_TEXT_VARIATION_PASSWORD\n        );\n        return e;\n    }\n\n    Button button(String s){\n        Button b=new Button(this);\n        b.setText(s);\n        b.setAllCaps(false);\n        b.setTextColor(TEXT);\n        b.setTextSize(13);\n        b.setTypeface(Typeface.DEFAULT,Typeface.BOLD);\n        autoFitText(b,8,13,2);\n        b.setPadding(dp(10),dp(9),dp(10),dp(9));\n        GradientDrawable g=new GradientDrawable(\n            GradientDrawable.Orientation.LEFT_RIGHT,\n            new int[]{Color.rgb(69,118,255),Color.rgb(139,91,255)}\n        );\n        g.setCornerRadius(dp(12));\n        g.setStroke(dp(1),Color.rgb(137,169,255));\n        b.setBackground(g);\n        return b;\n    }\n\n    @Override\n    protected void onCreate(Bundle b){\n        super.onCreate(b);\n\n        prefs=getSharedPreferences(PREFS,MODE_PRIVATE);\n        loadMasterStocks();\n\n        root=new LinearLayout(this);\n        root.setOrientation(LinearLayout.VERTICAL);\n        root.setBackgroundColor(BG);\n\n        ScrollView scroll=new ScrollView(this);\n        content=new LinearLayout(this);\n        content.setOrientation(LinearLayout.VERTICAL);\n        content.setPadding(dp(18),dp(18),dp(18),dp(24));\n        scroll.addView(content);\n        root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));\n\n        nav=new LinearLayout(this);\n        nav.setOrientation(LinearLayout.HORIZONTAL);\n        nav.setGravity(Gravity.CENTER);\n        nav.setBackgroundColor(Color.rgb(15,27,52));\n        root.addView(nav,new LinearLayout.LayoutParams(-1,dp(66)));\n\n        setContentView(root);\n\n        addNav(\"\U0001F3E0\\n홈\",v->showHome());\n        addNav(\"\U0001F4CA\\n종목\",v->showStocks());\n        addNav(\"\U0001F916\\nAI검사\",v->showAI());\n        addNav(\"⚡\\n실시간\",v->showRealtime());\n        addNav(\"\U0001F4F0\\n뉴스\",v->showNews());\n        addNav(\"⭐\\n관심\",v->showFavorites());\n        addNav(\"⚙\\n설정\",v->showSettings());\n\n        showHome();\n    }\n\n    void addNav(String s,View.OnClickListener l){\n        Button b=new Button(this);\n        b.setText(s);\n        b.setTextSize(10);\n        autoFitText(b,7,10,2);\n        b.setGravity(Gravity.CENTER);\n        b.setTextColor(TEXT);\n        b.setAllCaps(false);\n        b.setBackgroundColor(Color.TRANSPARENT);\n        b.setOnClickListener(l);\n        nav.addView(b,new LinearLayout.LayoutParams(0,-1,1));\n    }\n\n    void clear(String title,String sub){\n        liveActive=false;\n        orderBookActive=false;\n        stockLiveActive=false;\n        stockLiveHandler.removeCallbacksAndMessages(null);\n        bottomConnView=null;\n        try{\n            if(kisRealtime!=null){\n                kisRealtime.stop();\n                kisRealtime=null;\n            }\n        }catch(Exception ignored){}\n        content.removeAllViews();\n        if(stockMarketStrip!=null && stockMarketStrip.getParent() instanceof ViewGroup){\n            ((ViewGroup)stockMarketStrip.getParent()).removeView(stockMarketStrip);\n        }\n        stockMarketStrip=null;\n\n        LinearLayout titleRow=new LinearLayout(this);\n        titleRow.setOrientation(LinearLayout.HORIZONTAL);\n        titleRow.setGravity(Gravity.CENTER_VERTICAL);\n\n        boolean stockCompact=\"STOCK\".equals(screenMode);\n        if(!\"HOME\".equals(screenMode) && !stockCompact){\n            Button back=button(\"← 뒤로\");\n            back.setOnClickListener(v->handleBackNavigation());\n            LinearLayout.LayoutParams blp=new LinearLayout.LayoutParams(dp(110),-2);\n            blp.setMargins(0,0,dp(12),0);\n            titleRow.addView(back,blp);\n        }\n\n        if(stockCompact){\n            TextView titleView=text(\"실시간 통합창\",20,TEXT,true);\n            titleView.setPadding(dp(4),0,0,0);\n            titleRow.addView(titleView,new LinearLayout.LayoutParams(0,dp(38),1));\n            content.addView(titleRow);\n        }else{\n            TextView titleView=text(title,26,TEXT,true);\n            titleRow.addView(titleView,new LinearLayout.LayoutParams(0,-2,1));\n            content.addView(titleRow);\n            if(sub!=null)content.addView(text(sub,13,MUTED,false));\n            Space sp=new Space(this);\n            content.addView(sp,new LinearLayout.LayoutParams(1,dp(10)));\n        }\n    }\n\n    void handleBackNavigation(){\n        if(\"ORDERBOOK\".equals(screenMode) || \"REALTIME_CHART\".equals(screenMode)){\n            showStocks();\n        }else if(\"SCANNER\".equals(screenMode)){\n            showAI();\n        }else{\n            showHome();\n        }\n    }\n\n    String activeEnv(){\n        return prefs.getString(ENV,REAL);\n    }\n\n    boolean isReal(String env){\n        return REAL.equals(env);\n    }\n\n    String baseUrl(String env){\n        return isReal(env)\n            ? \"https://openapi.koreainvestment.com:9443\"\n            : \"https://openapivts.koreainvestment.com:29443\";\n    }\n\n    String keyName(String env){ return isReal(env)?REAL_KEY:MOCK_KEY; }\n    String secretName(String env){ return isReal(env)?REAL_SECRET:MOCK_SECRET; }\n    String tokenName(String env){ return isReal(env)?REAL_TOKEN:MOCK_TOKEN; }\n    String expiresName(String env){ return isReal(env)?REAL_EXPIRES:MOCK_EXPIRES; }\n\n    boolean credentialsReady(String env){\n        return !prefs.getString(keyName(env),\"\").isEmpty()\n            && !prefs.getString(secretName(env),\"\").isEmpty();\n    }\n\n    boolean tokenReady(String env){\n        return !prefs.getString(tokenName(env),\"\").isEmpty();\n    }\n\n    long parseExpiryMillis(String raw){\n        if(raw==null||raw.trim().isEmpty())return 0L;\n        String s=raw.trim();\n\n        String[] formats={\n            \"yyyy-MM-dd HH:mm:ss\",\n            \"yyyy-MM-dd'T'HH:mm:ss\",\n            \"yyyyMMddHHmmss\"\n        };\n\n        for(String f:formats){\n            try{\n                SimpleDateFormat sdf=new SimpleDateFormat(f,Locale.KOREA);\n                sdf.setLenient(false);\n                Date d=sdf.parse(s);\n                if(d!=null)return d.getTime();\n            }catch(Exception ignored){}\n        }\n\n        return 0L;\n    }\n\n    boolean tokenExpired(String env){\n        String raw=prefs.getString(expiresName(env),\"\");\n        long exp=parseExpiryMillis(raw);\n\n        // If the server did not provide a parseable expiry string,\n        // keep the token until an API response says it is invalid.\n        if(exp<=0L)return false;\n\n        // Refresh one minute early.\n        return System.currentTimeMillis()>=exp-60000L;\n    }\n\n    synchronized void refreshTokenIfNeeded(String env)throws Exception{\n        if(tokenReady(env)&&!tokenExpired(env))return;\n\n        String k=prefs.getString(keyName(env),\"\");\n        String s=prefs.getString(secretName(env),\"\");\n\n        if(k.isEmpty()||s.isEmpty()){\n            throw new Exception(\"App Key / Secret이 저장되어 있지 않습니다.\");\n        }\n\n        JSONObject r=requestToken(env,k,s);\n\n        String token=r.optString(\"access_token\",\"\");\n        String expires=r.optString(\"access_token_token_expired\",\"\");\n\n        if(token.isEmpty()){\n            String msg=r.optString(\n                \"error_description\",\n                r.optString(\"msg1\",\"OAuth 토큰 재발급 실패\")\n            );\n            throw new Exception(msg);\n        }\n\n        prefs.edit()\n            .putString(tokenName(env),token)\n            .putString(expiresName(env),expires)\n            .apply();\n    }\n\n    void showHome(){\n        screenMode=\"HOME\";\n        clear(\"\U0001F981 Marcus AI SWING\",\"AI 기반 스윙투자 올인원 · v2.5 Integrated Workspace\");\n\n        LinearLayout hero=card();\n        hero.addView(text(\"안녕하세요! 오늘도 중요한 것만 빠르게 볼게요 \U0001F981\",18,TEXT,true));\n        hero.addView(text(\n            \"AI 포착 → 차트 검증 → 실시간 종목 → 뉴스/공시 → 관심/보유 관리\",\n            13,BLUE,false\n        ));\n        content.addView(hero);\n\n        LinearLayout api=card();\n        api.addView(text(\"\U0001F50C 한국투자 API\",17,TEXT,true));\n        addStatus(api,REAL);\n        addStatus(api,MOCK);\n        content.addView(api);\n\n        LinearLayout quick=card();\n        quick.addView(text(\"⚡ 빠른 실행\",18,TEXT,true));\n\n        Button aiBtn=button(\"\U0001F916 AI 검색 시작\");\n        Button liveBtn=button(\"⚡ 실시간 종목\");\n        Button newsBtn=button(\"\U0001F4F0 뉴스 / 공시\");\n        Button stockBtn=button(\"\U0001F4CA 종목 / 차트\");\n\n        aiBtn.setOnClickListener(v->showAI());\n        liveBtn.setOnClickListener(v->showRealtime());\n        newsBtn.setOnClickListener(v->showNews());\n        stockBtn.setOnClickListener(v->showStocks());\n\n        quick.addView(aiBtn);\n        quick.addView(liveBtn);\n        quick.addView(stockBtn);\n        quick.addView(newsBtn);\n        content.addView(quick);\n\n        LinearLayout guide=card();\n        guide.addView(text(\"✨ v2.6 실전 운용\",17,TEXT,true));\n        guide.addView(text(\"• 일반 증권앱처럼 익숙한 차트/호가 구조\",14,TEXT,false));\n        guide.addView(text(\"• TradingView 느낌의 터치/드로잉 도구\",14,TEXT,false));\n        guide.addView(text(\"• AI 신호는 필요할 때만 ON/OFF\",14,TEXT,false));\n        guide.addView(text(\"• 화면 이동/호가 확인 후에도 선택 종목·봉주기 유지\",14,GREEN,true));\n        guide.addView(text(\"• AI검사 결과 → 차트 → 호가 → 실시간4를 바로 연결\",14,GREEN,true));\n        content.addView(guide);\n    }\n\n    void addStatus(LinearLayout c,String env){\n        String state;\n        if(tokenReady(env))state=\"\U0001F7E2 연결 완료\";\n        else if(credentialsReady(env))state=\"\U0001F7E1 키 저장됨 / 인증 전\";\n        else state=\"⚪ 미설정\";\n\n        c.addView(text(\n            env+\" · \"+state+(env.equals(activeEnv())?\" · ⭐ 사용중\":\"\"),\n            14,\n            tokenReady(env)?GREEN:(credentialsReady(env)?YELLOW:MUTED),\n            true\n        ));\n    }\n\n    void showSettings(){\n        screenMode=\"SETTINGS\";\n        clear(\"계좌\",\"한국투자증권 KIS Developers\");\n\n        content.addView(buildAccountCard(REAL));\n        content.addView(buildAccountCard(MOCK));\n\n        LinearLayout info=card();\n        info.addView(text(\"연결 서버\",17,TEXT,true));\n        info.addView(text(\"실전: https://openapi.koreainvestment.com:9443\",12,BLUE,false));\n        info.addView(text(\"모의: https://openapivts.koreainvestment.com:29443\",12,BLUE,false));\n        info.addView(text(\n            \"한투에서 받은 실전 키와 모의 키를 각각 해당 카드에만 입력하세요.\",\n            13,YELLOW,false\n        ));\n        info.addView(text(\n            \"\U0001F510 업데이트 설치 시 Key/Secret·관심종목·실시간4·마지막 종목/주기는 그대로 유지됩니다.\\n\"+\n            \"OAuth 토큰은 만료 시 저장된 Key/Secret으로 자동 재발급을 시도합니다.\",\n            13,GREEN,true\n        ));\n        content.addView(info);\n    }\n\n    LinearLayout buildAccountCard(String env){\n        LinearLayout c=card();\n\n        c.addView(text((isReal(env)?\"\U0001F534 \":\"\U0001F535 \")+env,20,TEXT,true));\n        c.addView(text(\"서버: \"+baseUrl(env),12,BLUE,false));\n\n        EditText key=input(env+\" App Key\");\n        EditText secret=input(env+\" App Secret\");\n\n        if(!prefs.getString(keyName(env),\"\").isEmpty()){\n            key.setHint(\"저장됨 · 새 값 입력 시 교체\");\n        }\n        if(!prefs.getString(secretName(env),\"\").isEmpty()){\n            secret.setHint(\"저장됨 · 새 값 입력 시 교체\");\n        }\n\n        c.addView(text(\"App Key\",13,MUTED,true));\n        c.addView(key);\n        c.addView(text(\"App Secret\",13,MUTED,true));\n        c.addView(secret);\n\n        Button save=button(env+\" 키 저장\");\n        Button test=button(env+\" OAuth 연결 테스트\");\n        Button use=button(env+\"을 데이터 환경으로 사용\");\n        Button delete=button(env+\" 저장정보 삭제\");\n\n        ProgressBar pb=new ProgressBar(this);\n        pb.setVisibility(View.GONE);\n        TextView status=text(\"\",14,MUTED,true);\n\n        c.addView(save);\n        c.addView(test);\n        c.addView(use);\n        c.addView(delete);\n        c.addView(pb);\n        c.addView(status);\n\n        Runnable refresh=()->{\n            String k=prefs.getString(keyName(env),\"\");\n            String s=prefs.getString(secretName(env),\"\");\n\n            StringBuilder sb=new StringBuilder();\n\n            if(!k.isEmpty()&&!s.isEmpty()){\n                sb.append(\"\U0001F7E2 Key/Secret 저장됨\\n\");\n                sb.append(\"App Key: \").append(mask(k)).append(\"\\n\");\n                sb.append(\"Secret: \").append(mask(s)).append(\"\\n\");\n            }else{\n                sb.append(\"⚪ Key/Secret 미설정\\n\");\n            }\n\n            if(tokenReady(env)){\n                sb.append(\"\U0001F7E2 OAuth 토큰 있음\\n\");\n                sb.append(\"만료: \").append(prefs.getString(expiresName(env),\"-\"));\n                status.setTextColor(GREEN);\n            }else{\n                status.setTextColor(credentialsReady(env)?YELLOW:MUTED);\n            }\n\n            if(env.equals(activeEnv())){\n                sb.append(\"\\n⭐ 현재 데이터 환경\");\n            }\n\n            status.setText(sb.toString());\n        };\n\n        save.setOnClickListener(v->{\n            String k=key.getText().toString().trim();\n            String s=secret.getText().toString().trim();\n\n            SharedPreferences.Editor ed=prefs.edit();\n\n            if(!k.isEmpty())ed.putString(keyName(env),k);\n            if(!s.isEmpty())ed.putString(secretName(env),s);\n\n            if(!k.isEmpty()||!s.isEmpty()){\n                ed.remove(tokenName(env));\n                ed.remove(expiresName(env));\n            }\n\n            ed.apply();\n\n            key.setText(\"\");\n            secret.setText(\"\");\n\n            Toast.makeText(this,env+\" 키 저장 완료\",Toast.LENGTH_SHORT).show();\n            refresh.run();\n        });\n\n        test.setOnClickListener(v->{\n            String k=prefs.getString(keyName(env),\"\");\n            String s=prefs.getString(secretName(env),\"\");\n\n            if(k.isEmpty()||s.isEmpty()){\n                status.setText(\"\U0001F534 App Key / Secret을 먼저 저장하세요.\");\n                status.setTextColor(RED);\n                return;\n            }\n\n            pb.setVisibility(View.VISIBLE);\n            test.setEnabled(false);\n            status.setText(env+\" OAuth 토큰 요청 중...\");\n            status.setTextColor(BLUE);\n\n            new Thread(()->{\n                try{\n                    JSONObject r=requestToken(env,k,s);\n\n                    String token=r.optString(\"access_token\",\"\");\n                    String expires=r.optString(\"access_token_token_expired\",\"\");\n\n                    if(!token.isEmpty()){\n                        prefs.edit()\n                            .putString(tokenName(env),token)\n                            .putString(expiresName(env),expires)\n                            .putString(ENV,env)\n                            .apply();\n\n                        runOnUiThread(()->{\n                            pb.setVisibility(View.GONE);\n                            test.setEnabled(true);\n                            status.setText(\n                                \"\U0001F7E2 \"+env+\" OAuth 연결 성공\\n\"+\n                                \"접근토큰 발급 완료\\n\"+\n                                \"만료: \"+expires+\n                                \"\\n⭐ 현재 데이터 환경으로 자동 선택됨\"\n                            );\n                            status.setTextColor(GREEN);\n                        });\n\n                    }else{\n                        String msg=r.optString(\n                            \"error_description\",\n                            r.optString(\"msg1\",r.toString())\n                        );\n\n                        runOnUiThread(()->{\n                            pb.setVisibility(View.GONE);\n                            test.setEnabled(true);\n                            status.setText(\"\U0001F534 \"+env+\" 인증 실패\\n\"+msg);\n                            status.setTextColor(RED);\n                        });\n                    }\n\n                }catch(Exception e){\n                    runOnUiThread(()->{\n                        pb.setVisibility(View.GONE);\n                        test.setEnabled(true);\n                        status.setText(\"\U0001F534 \"+env+\" 연결 실패\\n\"+safeError(e));\n                        status.setTextColor(RED);\n                    });\n                }\n            }).start();\n        });\n\n        use.setOnClickListener(v->{\n            if(!tokenReady(env)){\n                Toast.makeText(\n                    this,\n                    env+\" OAuth 연결 테스트를 먼저 성공시켜주세요.\",\n                    Toast.LENGTH_SHORT\n                ).show();\n                return;\n            }\n\n            prefs.edit().putString(ENV,env).apply();\n            Toast.makeText(this,env+\"을 데이터 환경으로 선택했습니다.\",Toast.LENGTH_SHORT).show();\n            refresh.run();\n        });\n\n        delete.setOnClickListener(v->{\n            prefs.edit()\n                .remove(keyName(env))\n                .remove(secretName(env))\n                .remove(tokenName(env))\n                .remove(expiresName(env))\n                .apply();\n\n            key.setText(\"\");\n            secret.setText(\"\");\n\n            Toast.makeText(this,env+\" 저장정보 삭제 완료\",Toast.LENGTH_SHORT).show();\n            refresh.run();\n        });\n\n        refresh.run();\n        return c;\n    }\n\n    JSONObject requestToken(String env,String appKey,String appSecret)throws Exception{\n        JSONObject body=new JSONObject();\n        body.put(\"grant_type\",\"client_credentials\");\n        body.put(\"appkey\",appKey);\n        body.put(\"appsecret\",appSecret);\n\n        HttpResult result=postJson(\n            baseUrl(env)+\"/oauth2/tokenP\",\n            body.toString()\n        );\n\n        if(result.body==null||result.body.trim().isEmpty()){\n            throw new Exception(\"토큰 응답이 비어 있습니다. HTTP \"+result.code);\n        }\n\n        return new JSONObject(result.body);\n    }\n\n    void initChartWebView(WebView chart){\n        chart.setBackgroundColor(Color.rgb(12,24,48));\n\n        WebSettings ws=chart.getSettings();\n        ws.setJavaScriptEnabled(true);\n        ws.setDomStorageEnabled(true);\n        ws.setSupportZoom(false);\n        ws.setBuiltInZoomControls(false);\n        ws.setUseWideViewPort(true);\n        ws.setLoadWithOverviewMode(false);\n        ws.setDisplayZoomControls(false);\n\n        chart.setClickable(true);\n        chart.setFocusable(true);\n        chart.setFocusableInTouchMode(true);\n        chart.setOnTouchListener((v,e)->{\n            ViewParent p=v.getParent();\n            if(p!=null){\n                if(e.getAction()==MotionEvent.ACTION_DOWN ||\n                   e.getAction()==MotionEvent.ACTION_MOVE ||\n                   e.getPointerCount()>1){\n                    p.requestDisallowInterceptTouchEvent(true);\n                }else if(e.getAction()==MotionEvent.ACTION_UP ||\n                         e.getAction()==MotionEvent.ACTION_CANCEL){\n                    p.requestDisallowInterceptTouchEvent(false);\n                }\n            }\n            return false;\n        });\n\n        chartReady.put(chart,false);\n\n        chart.setWebViewClient(new WebViewClient(){\n            @Override\n            public void onPageFinished(WebView view,String url){\n                super.onPageFinished(view,url);\n                chartReady.put(view,true);\n\n                String js=pendingChartJs.remove(view);\n                if(js!=null&&!js.isEmpty()){\n                    view.evaluateJavascript(js,null);\n                }\n            }\n        });\n\n        chart.loadUrl(\"file:///android_asset/chart.html\");\n    }\n\n    void dispatchChartJs(WebView web,String js){\n        pendingChartJs.put(web,js);\n\n        if(Boolean.TRUE.equals(chartReady.get(web))){\n            pendingChartJs.remove(web);\n            web.evaluateJavascript(js,null);\n\
        \            return;\n        }\n\n        // Fallback retries for slow Android WebView initialization.\n        web.postDelayed(()->{\n            if(Boolean.TRUE.equals(chartReady.get(web))){\n                String pending=pendingChartJs.remove(web);\n                if(pending!=null)web.evaluateJavascript(pending,null);\n            }\n        },700);\n\n        web.postDelayed(()->{\n            if(Boolean.TRUE.equals(chartReady.get(web))){\n                String pending=pendingChartJs.remove(web);\n                if(pending!=null)web.evaluateJavascript(pending,null);\n            }\n        },1600);\n    }\n\n    List<Candle> requestDailyChartInitial(String env,String code)throws Exception{\n        SimpleDateFormat sdf=new SimpleDateFormat(\"yyyyMMdd\",Locale.US);\n        Calendar cal=Calendar.getInstance();\n        String end=sdf.format(cal.getTime());\n        cal.add(Calendar.MONTH,-8);\n        String start=sdf.format(cal.getTime());\n        return requestDailyPage(env,code,start,end);\n    }\n\n    String activeChartRuleSummary(){\n        String rules=normalChartScript();\n        Map<String,String> cfg=parseRules(rules);\n        List<String> on=new ArrayList<>();\n\n        if(ruleBool(cfg,\"SHOW_MA5\",true))on.add(\"MA5\");\n        if(ruleBool(cfg,\"SHOW_MA10\",true))on.add(\"MA10\");\n        if(ruleBool(cfg,\"SHOW_MA15\",true))on.add(\"MA15\");\n        if(ruleBool(cfg,\"SHOW_MA20\",true))on.add(\"MA20\");\n        if(ruleBool(cfg,\"SHOW_VOLUME\",true))on.add(\"거래량\");\n        if(ruleBool(cfg,\"SHOW_BOS\",true))on.add(\"BOS\");\n        if(ruleBool(cfg,\"SHOW_DISCOUNT\",true))on.add(\"Discount\");\n        if(ruleBool(cfg,\"SHOW_EXPLOSION\",true))on.add(\"Explosion\");\n        if(ruleBool(cfg,\"SHOW_RSI\",true))on.add(\"RSI\");\n\n        return String.join(\" · \",on);\n    }\n\n\n    String periodLabel(String p){\n        if(\"DAY\".equals(p))return \"일봉\";\n        if(\"1M\".equals(p))return \"1분\";\n        if(\"3M\".equals(p))return \"3분\";\n        if(\"5M\".equals(p))return \"5분\";\n        if(\"15M\".equals(p))return \"15분\";\n        if(\"30M\".equals(p))return \"30분\";\n        if(\"60M\".equals(p))return \"60분\";\n        if(\"WEEK\".equals(p))return \"주봉\";\n        if(\"MONTH\".equals(p))return \"월봉\";\n        if(\"YEAR\".equals(p))return \"연봉\";\n        return p;\n    }\n\n    int periodMinutes(String p){\n        if(\"1M\".equals(p))return 1;\n        if(\"3M\".equals(p))return 3;\n        if(\"5M\".equals(p))return 5;\n        if(\"15M\".equals(p))return 15;\n        if(\"30M\".equals(p))return 30;\n        if(\"60M\".equals(p))return 60;\n        return 1;\n    }\n\n\n    List<Candle> aggregateHigherTimeframe(List<Candle> daily,String mode){\n        List<Candle> out=new ArrayList<>();\n        if(daily==null||daily.isEmpty())return out;\n\n        Calendar cal=Calendar.getInstance();\n        String currentKey=null;\n        Candle acc=null;\n\n        for(Candle q:daily){\n            String raw=q.date==null?\"\":q.date.replace(\"-\",\"\");\n            if(raw.length()<8)continue;\n\n            try{\n                int y=Integer.parseInt(raw.substring(0,4));\n                int m=Integer.parseInt(raw.substring(4,6));\n                int d=Integer.parseInt(raw.substring(6,8));\n                cal.clear();\n                cal.setFirstDayOfWeek(Calendar.MONDAY);\n                cal.setMinimalDaysInFirstWeek(4);\n                cal.set(y,m-1,d);\n\n                String key;\n                if(\"WEEK\".equals(mode)){\n                    key=cal.getWeekYear()+\"-\"+cal.get(Calendar.WEEK_OF_YEAR);\n                }else if(\"MONTH\".equals(mode)){\n                    key=y+\"-\"+String.format(Locale.US,\"%02d\",m);\n                }else{\n                    key=String.valueOf(y);\n                }\n\n                if(!key.equals(currentKey)){\n                    if(acc!=null)out.add(acc);\n                    acc=new Candle(\n                        q.date,\n                        q.open,\n                        q.high,\n                        q.low,\n                        q.close,\n                        q.volume\n                    );\n                    currentKey=key;\n                }else if(acc!=null){\n                    acc.high=Math.max(acc.high,q.high);\n                    acc.low=Math.min(acc.low,q.low);\n                    acc.close=q.close;\n                    acc.volume+=q.volume;\n                    acc.date=q.date;\n                }\n            }catch(Exception ignored){}\n        }\n\n        if(acc!=null)out.add(acc);\n        return out;\n    }\n\n    void showAnalysisPopup(String code,String name){\n        if(code==null||code.isEmpty()){\n            Toast.makeText(this,\"먼저 종목을 선택해주세요.\",Toast.LENGTH_SHORT).show();\n            return;\n        }\n\n        final Dialog dlg=new Dialog(this);\n        dlg.requestWindowFeature(Window.FEATURE_NO_TITLE);\n\n        LinearLayout root=new LinearLayout(this);\n        root.setOrientation(LinearLayout.VERTICAL);\n        root.setBackgroundColor(Color.rgb(5,7,11));\n        root.setPadding(dp(6),dp(5),dp(6),dp(5));\n\n        LinearLayout bar=new LinearLayout(this);\n        bar.setOrientation(LinearLayout.HORIZONTAL);\n        bar.setGravity(Gravity.CENTER_VERTICAL);\n        bar.setBackground(bg(Color.rgb(36,38,44),1));\n\n        TextView brand=text(\"Trading Analysis\",18,Color.WHITE,true);\n        TextView meta=text(name+\" · \"+code+\" · KRX\",12,Color.rgb(190,196,208),true);\n        Button close=button(\"✕\");\n\n        LinearLayout titleBox=new LinearLayout(this);\n        titleBox.setOrientation(LinearLayout.VERTICAL);\n        titleBox.setPadding(dp(8),dp(4),dp(8),dp(4));\n        titleBox.addView(brand);\n        titleBox.addView(meta);\n\n        bar.addView(titleBox,new LinearLayout.LayoutParams(0,-2,1));\n        bar.addView(close,new LinearLayout.LayoutParams(dp(58),-2));\n        root.addView(bar);\n\n        TextView limitation=text(\n            \"TradingView형 분석 화면 · Pine Script 자체는 앱 위젯에 직접 삽입되지 않으며 동일 로직을 앱 계산엔진으로 재현합니다.\",\n            10,Color.rgb(230,176,88),true\n        );\n        limitation.setPadding(dp(8),dp(4),dp(8),dp(4));\n        limitation.setBackground(bg(Color.rgb(31,26,17),1));\n        root.addView(limitation);\n\n        LinearLayout tools=new LinearLayout(this);\n        tools.setOrientation(LinearLayout.HORIZONTAL);\n\n        Button pDay=button(\"1일\");\n        Button pWeek=button(\"1주\");\n        Button pMonth=button(\"1달\");\n        Button pYear=button(\"1년\");\n\n        tools.addView(pDay,new LinearLayout.LayoutParams(dp(72),-2));\n        tools.addView(pWeek,new LinearLayout.LayoutParams(dp(72),-2));\n        tools.addView(pMonth,new LinearLayout.LayoutParams(dp(72),-2));\n        tools.addView(pYear,new LinearLayout.LayoutParams(dp(72),-2));\n\n        TextView applied=text(\n            \"사용자 차트 스크립트 적용\",\n            11,Color.rgb(90,215,135),true\n        );\n        applied.setGravity(Gravity.CENTER_VERTICAL|Gravity.RIGHT);\n        tools.addView(applied,new LinearLayout.LayoutParams(0,-2,1));\n        root.addView(tools);\n\n        TextView chartTitle=text(name+\" · 분석 차트\",12,Color.WHITE,true);\n        chartTitle.setPadding(dp(6),dp(3),dp(6),dp(3));\n        root.addView(chartTitle);\n\n        WebView detailChart=new WebView(this);\n        initChartWebView(detailChart);\n        detailChart.setBackgroundColor(Color.BLACK);\n        root.addView(detailChart,new LinearLayout.LayoutParams(-1,0,1));\n\n        TextView strategy=text(\"\",1,Color.TRANSPARENT,false);\n        strategy.setVisibility(View.GONE);\n\n        dlg.setContentView(root);\n\n        final String[] per={\"DAY\"};\n        Runnable load=()->loadChartPeriod(\n            detailChart,chartTitle,strategy,code,name,per[0]\n        );\n\n        pDay.setOnClickListener(v->{per[0]=\"DAY\";load.run();});\n        pWeek.setOnClickListener(v->{per[0]=\"WEEK\";load.run();});\n        pMonth.setOnClickListener(v->{per[0]=\"MONTH\";load.run();});\n        pYear.setOnClickListener(v->{per[0]=\"YEAR\";load.run();});\n        close.setOnClickListener(v->dlg.dismiss());\n\n        dlg.setOnShowListener(x->{\n            Window ww=dlg.getWindow();\n            if(ww!=null){\n                ww.setBackgroundDrawable(new ColorDrawable(Color.BLACK));\n                ww.setLayout(\n                    WindowManager.LayoutParams.MATCH_PARENT,\n                    WindowManager.LayoutParams.MATCH_PARENT\n                );\n            }\n            detailChart.postDelayed(load,180);\n        });\n\n        dlg.show();\n    }\n\n    void showIndicatorDialogForStock(\n        RealtimeStockChartView chart, TextView indicatorLine,\n        String[] activeCode, String[] activePeriod\n    ){\n        final String[] items={\n            \"MA 5\",\"MA 10\",\"MA 20\",\"MA 60 / 120\",\n            \"Bollinger Bands\",\"Envelope\",\"PSAR\",\"Price Channel\",\"일목균형표\",\n            \"매물대\",\"RSI\",\"Slow Stochastic\",\"MACD\",\"MFI\",\"Momentum\",\"ADX\"\n        };\n        final boolean[] checked={\n            chart.showMA5,chart.showMA10,chart.showMA20,chart.showMA60,\n            chart.showBollinger,chart.showEnvelope,chart.showPSAR,\n            chart.showPriceChannel,chart.showIchimoku,chart.showVolumeProfile,\n            chart.lowerIndicator==0,chart.lowerIndicator==1,chart.lowerIndicator==2,\n            chart.lowerIndicator==3,chart.lowerIndicator==4,chart.lowerIndicator==5\n        };\n        new AlertDialog.Builder(this)\n            .setTitle(\"지표 설정\")\n            .setMultiChoiceItems(items,checked,(d,which,isChecked)->{\n                checked[which]=isChecked;\n                if(which>=10 && isChecked){\n                    for(int k=10;k<=15;k++)checked[k]=k==which;\n                }\n            })\n            .setPositiveButton(\"적용\",(d,w)->{\n                int lower=checked[11]?1:checked[12]?2:checked[13]?3:checked[14]?4:checked[15]?5:0;\n                chart.setIndicatorConfig(\n                    checked[0],checked[1],checked[2],checked[3],\n                    checked[4],checked[5],checked[6],checked[7],checked[8],\n                    checked[9],lower\n                );\n                applyIndicatorLegend(indicatorLine);\n                saveChartState(activeCode[0],chart,activePeriod[0]);\n            })\n            .setNegativeButton(\"취소\",null)\n            .show();\n    }\n\n    void showDrawingToolsForStock(\n        RealtimeStockChartView chart,String[] activeCode,String[] activePeriod\n    ){\n        String[] names={\"십자선\",\"추세선\",\"수평선\",\"피보나치\",\"작도 전체삭제\"};\n        new AlertDialog.Builder(this)\n            .setTitle(\"도구 모음\")\n            .setItems(names,(d,which)->{\n                if(which==0)chart.setToolMode(1);\n                else if(which==1)chart.setToolMode(2);\n                else if(which==2)chart.setToolMode(3);\n                else if(which==3)chart.setToolMode(4);\n                else if(which==4){\n                    chart.clearDrawings();\n                    saveChartState(activeCode[0],chart,activePeriod[0]);\n                }\n            })\n            .show();\n    }\n\n    void applyIndicatorLegend(TextView v){\n        SpannableStringBuilder sp=new SpannableStringBuilder();\n\n        int start;\n\n        start=sp.length(); sp.append(\"종가 단순 \");\n        sp.setSpan(new ForegroundColorSpan(Color.rgb(255,105,127)),start,sp.length(),Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n\n        String[] maText={\"5 \",\"10 \",\"20 \",\"60 \",\"120   \"};\n        int[] maColors={\n            Color.rgb(255,202,65),\n            Color.rgb(74,203,228),\n            Color.rgb(89,218,174),\n            Color.rgb(166,112,226),\n            Color.rgb(205,211,220)\n        };\n        for(int i=0;i<maText.length;i++){\n            start=sp.length(); sp.append(maText[i]);\n            sp.setSpan(new ForegroundColorSpan(maColors[i]),start,sp.length(),Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n            sp.setSpan(new StyleSpan(Typeface.BOLD),start,sp.length(),Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n        }\n\n        start=sp.length(); sp.append(\"매물대(10)   \");\n        sp.setSpan(new ForegroundColorSpan(Color.rgb(226,190,111)),start,sp.length(),Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n\n        start=sp.length(); sp.append(\"전환선9   \");\n        sp.setSpan(new ForegroundColorSpan(Color.rgb(239,83,122)),start,sp.length(),Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n\n        start=sp.length(); sp.append(\"기준선26   \");\n        sp.setSpan(new ForegroundColorSpan(Color.rgb(110,185,238)),start,sp.length(),Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n\n        start=sp.length(); sp.append(\"후행스팬26   \");\n        sp.setSpan(new ForegroundColorSpan(Color.rgb(190,92,211)),start,sp.length(),Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n\n        start=sp.length(); sp.append(\"선행스팬1·2\");\n        sp.setSpan(new ForegroundColorSpan(Color.rgb(80,160,255)),start,sp.length(),Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n\n        v.setText(sp);\n    }\n\n    void setStyledOrderBook(TextView view,String raw,String currentPrice){\n        if(raw==null)raw=\"\";\n        SpannableStringBuilder sp=new SpannableStringBuilder();\n        String[] lines=raw.split(\"\\\\n\");\n        boolean bid=false;\n\n        final int ASK_TEXT=Color.rgb(104,172,255);\n        final int ASK_BG=Color.rgb(17,48,82);\n        final int BID_TEXT=Color.rgb(255,105,105);\n        final int BID_BG=Color.rgb(79,28,34);\n        final int CUR_BG=Color.rgb(54,94,148);\n\n        for(String line:lines){\n            if(line==null)line=\"\";\n            String shown=line;\n\n            if(line.contains(\"현재가\")){\n                shown=String.format(Locale.KOREA,\"%8s │ %12s │ %8s\",\"\",\"현재가 \"+money(currentPrice),\"\");\n            }\n\n            int st=sp.length();\n            sp.append(shown).append(\"\\n\");\n            int en=sp.length();\n\n            if(line.contains(\"현재가\")){\n                sp.setSpan(new ForegroundColorSpan(Color.WHITE),\n                    st,en,Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n                sp.setSpan(new BackgroundColorSpan(CUR_BG),\n                    st,en,Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n                sp.setSpan(new StyleSpan(Typeface.BOLD),\n                    st,en,Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n                bid=true;\n            }else if(!bid){\n                // 매도 ASK = 파랑\n                sp.setSpan(new ForegroundColorSpan(ASK_TEXT),\n                    st,en,Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n                sp.setSpan(new BackgroundColorSpan(ASK_BG),\n                    st,en,Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n            }else{\n                // 매수 BID = 빨강\n                sp.setSpan(new ForegroundColorSpan(BID_TEXT),\n                    st,en,Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n                sp.setSpan(new BackgroundColorSpan(BID_BG),\n                    st,en,Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n            }\n        }\n        view.setText(sp);\n    }\n\n    void flashCurrentPriceRow(TextView orderBook){\n        orderBook.animate().cancel();\n        orderBook.setAlpha(.50f);\n        orderBook.animate().alpha(1f).setDuration(170).start();\n    }\n\n    void updateOrderBalance(\n        TextView askView,TextView bidView,String askRaw,String bidRaw\n    ){\n        double ask=Math.max(0,num(askRaw));\n        double bid=Math.max(0,num(bidRaw));\n        double total=ask+bid;\n\n        double askPct=total>0?ask/total*100.0:50.0;\n        double bidPct=100.0-askPct;\n\n        askView.setText(String.format(Locale.KOREA,\"매도 %.1f%%\",askPct));\n        bidView.setText(String.format(Locale.KOREA,\"매수 %.1f%%\",bidPct));\n\n        float aw=(float)Math.max(0.15,askPct/100.0);\n        float bw=(float)Math.max(0.15,bidPct/100.0);\n\n        askView.setLayoutParams(\n            new LinearLayout.LayoutParams(0,dp(28),aw)\n        );\n        bidView.setLayoutParams(\n            new LinearLayout.LayoutParams(0,dp(28),bw)\n        );\n    }\n\n    String chartStateKey(String code){\n        return \"chart_state_\"+(code==null?\"\":code);\n    }\n\n    void saveChartState(String code,RealtimeStockChartView chart,String period){\n        if(code==null||code.isEmpty()||chart==null)return;\n        try{\n            JSONObject root=chart.exportChartState();\n            root.put(\"period\",period==null?\"DAY\":period);\n            prefs.edit().putString(chartStateKey(code),root.toString()).apply();\n        }catch(Exception ignored){}\n    }\n\n    String restoreChartState(String code,RealtimeStockChartView chart,String fallbackPeriod){\n        if(code==null||code.isEmpty()||chart==null)return fallbackPeriod;\n        try{\n            String raw=prefs.getString(chartStateKey(code),\"\");\n            if(raw==null||raw.isEmpty())return fallbackPeriod;\n            JSONObject root=new JSONObject(raw);\n            chart.importChartState(root);\n            return root.optString(\"period\",fallbackPeriod);\n        }catch(Exception ignored){ return fallbackPeriod; }\n    }\n\n    void clearSavedChartState(String code){\n        if(code==null||code.isEmpty())return;\n        prefs.edit().remove(chartStateKey(code)).apply();\n    }\n\n    void showStocks(){\n        screenMode=\"STOCK\";\n        clear(\"실시간 통합창\",null);\n        stockLiveActive=true;\n\n        String env=activeEnv();\n        String restoredCode=prefs.getString(LAST_STOCK_CODE,\"\");\n        String restoredName=prefs.getString(LAST_STOCK_NAME,\"\");\n        final String[] activeCode={restoredCode.isEmpty()?null:restoredCode};\n        final String[] activeName={restoredName.isEmpty()?null:restoredName};\n        final String[] activePeriod={prefs.getString(LAST_PERIOD,\"DAY\")};\n        final boolean[] loading={false};\n        final int[] chartRequestSeq={0};\n\n        // ===== 초압축 상단 헤더 =====\n        LinearLayout header=card();\n        header.setPadding(dp(8),dp(3),dp(8),dp(3));\n        header.setBackground(bg(Color.rgb(5,17,31),1));\n\n        LinearLayout top=new LinearLayout(this);\n        top.setOrientation(LinearLayout.HORIZONTAL);\n        top.setGravity(Gravity.CENTER_VERTICAL);\n\n        TextView companyBadge=text(\n            activeName[0]==null||activeName[0].isEmpty()?\"종\":activeName[0].substring(0,1),\n            17,Color.WHITE,true\n        );\n        companyBadge.setGravity(Gravity.CENTER);\n        companyBadge.setBackground(bg(Color.rgb(31,75,135),22));\n        TextView stockName=text(\n            activeName[0]==null?\"종목 검색\":activeName[0],\n            18,TEXT,true\n        );\n        TextView marketBadge=text(\"\",9,Color.WHITE,true);\n        marketBadge.setGravity(Gravity.CENTER);\n        marketBadge.setPadding(dp(5),0,dp(5),0);\n        marketBadge.setBackground(bg(Color.rgb(42,76,128),5));\n\n        LinearLayout nameLine=new LinearLayout(this);\n        nameLine.setOrientation(LinearLayout.HORIZONTAL);\n        nameLine.setGravity(Gravity.CENTER_VERTICAL);\n        nameLine.addView(stockName,new LinearLayout.LayoutParams(0,-2,1));\n        nameLine.addView(marketBadge,new LinearLayout.LayoutParams(dp(58),dp(24)));\n\n        TextView stockMeta=text(\n            activeCode[0]==null?\"\":activeCode[0]+\" \"+masterMarket(activeCode[0]),\n            11,MUTED,false\n        );\n\n        LinearLayout identity=new LinearLayout(this);\n        identity.setOrientation(LinearLayout.VERTICAL);\n        identity.addView(nameLine);\n        identity.addView(stockMeta);\n\n        marketBadge.setText(marketBadgeText(activeCode[0]));\n        TextView priceView=text(\"-\",30,RED,true);\n        priceView.setGravity(Gravity.CENTER);\n        TextView changeView=text(\"대비 -  -%\",13,MUTED,true);\n        changeView.setGravity(Gravity.CENTER);\n\n        LinearLayout stats=new LinearLayout(this);\n        stats.setOrientation(LinearLayout.VERTICAL);\n        TextView volumeView=text(\"거래량 -\",12,TEXT,true);\n        TextView amountView=text(\"거래대금 -\",12,TEXT,true);\n        TextView strengthView=text(\"체결강도 -\",12,TEXT,true);\n        stats.addView(volumeView);\n        stats.addView(amountView);\n        stats.addView(strengthView);\n\n        Button analysis=button(\"분석창\");\n\n        top.addView(companyBadge,new LinearLayout.LayoutParams(dp(42),dp(42)));\n        top.addView(identity,new LinearLayout.LayoutParams(0,-2,0.28f));\n        top.addView(priceView,new LinearLayout.LayoutParams(0,-2,0.23f));\n        top.addView(changeView,new LinearLayout.LayoutParams(0,-2,0.18f));\n        top.addView(stats,new LinearLayout.LayoutParams(0,-2,0.23f));\n        top.addView(analysis,new LinearLayout.LayoutParams(dp(88),-2));\n        header.addView(top);\n\n        LinearLayout search=new LinearLayout(this);\n        search.setOrientation(LinearLayout.HORIZONTAL);\n        search.setGravity(Gravity.CENTER_VERTICAL);\n        EditText query=new EditText(this);\n        query.setHint(\"종목명 · 초성 · 코드\");\n        query.setSingleLine(true);\n        query.setTextColor(TEXT);\n        query.setHintTextColor(MUTED);\n        query.setTextSize(13);\n        autoFitText(query,8,13,1);\n        query.setBackground(bg(Color.rgb(13,35,61),2));\n        query.setPadding(dp(8),dp(4),dp(8),dp(4));\n        if(!restoredCode.isEmpty())query.setText(restoredCode);\n        Button searchBtn=button(\"검색\");\n        Button addFavorite=button(\"★ 관심\");\n        Button addLive=button(\"⚡ 실시간\");\n        search.addView(query,new LinearLayout.LayoutParams(0,-2,1));\n        search.addView(searchBtn,new LinearLayout.LayoutParams(dp(72),-2));\n        search.addView(addFavorite,new LinearLayout.LayoutParams(dp(78),-2));\n        search.addView(addLive,new LinearLayout.LayoutParams(dp(86),-2));\n        header.addView(search);\n\n        // Broker-style instant stock search suggestions.\n        final ListPopupWindow stockSuggest=new ListPopupWindow(this);\n        stockSuggest.setAnchorView(query);\n        stockSuggest.setModal(false);\n        stockSuggest.setWidth(\n            Math.min(dp(560),getResources().getDisplayMetrics().widthPixels-dp(24))\n        );\n        stockSuggest.setHeight(dp(360));\n\n        final List<MasterStock> suggestionStocks=new ArrayList<>();\n        final List<String> suggestionLabels=new ArrayList<>();\n        final ArrayAdapter<String> suggestionAdapter=\n            new ArrayAdapter<String>(\n                this,\n                android.R.layout.simple_list_item_1,\n                suggestionLabels\n            ){\n                @Override\n                public View getView(int position,View convertView,android.view.ViewGroup parent){\n                    View row=super.getView(position,convertView,parent);\n                    if(row instanceof TextView){\n                        TextView tv=(TextView)row;\n                        tv.setTextColor(TEXT);\n                        tv.setBackgroundColor(Color.rgb(42,42,42));\n                        tv.setPadding(dp(12),dp(7),dp(12),dp(7));\n                        tv.setSingleLine(false);\n                        autoFitText(tv,8,13,2);\n                    }\n                    return row;\n                }\n            };\n        stockSuggest.setAdapter(suggestionAdapter);\n\n        stockSuggest.setOnItemClickListener((parent,view,position,id)->{\n            if(position<0 || position>=suggestionStocks.size())return;\n            MasterStock picked=suggestionStocks.get(position);\n            query.setText(picked.name);\n            query.setSelection(query.length());\n            stockSuggest.dismiss();\n            query.setTag(picked.code);\n            searchBtn.performClick();\n        });\n\n        query.addTextChangedListener(new TextWatcher(){\n            @Override public void beforeTextChanged(CharSequence cs,int st,int count,int after){}\n            @Override public void onTextChanged(CharSequence cs,int st,int before,int count){}\n            @Override public void afterTextChanged(Editable e){\n                query.setTag(null);\n                String q=e==null?\"\":e.toString().trim();\n                suggestionStocks.clear();\n                suggestionLabels.clear();\n\n                if(q.isEmpty()){\n                    stockSuggest.dismiss();\n                    suggestionAdapter.notifyDataSetChanged();\n                    return;\n                }\n\n                List<MasterStock> found=findMasterMatches(q,12);\n                suggestionStocks.addAll(found);\n                for(MasterStock m:found){\n                    suggestionLabels.add(\n                        m.name+\"   \"+m.code+\"   \"+displayMarketLabel(m)\n                    );\n                }\n                suggestionAdapter.notifyDataSetChanged();\n\n                if(!found.isEmpty() && query.hasFocus()){\n                    stockSuggest.show();\n                }else{\n                    stockSuggest.dismiss();\n                }\n            }\n        });\n\n        ProgressBar pb=new ProgressBar(this);\n        pb.setVisibility(View.GONE);\n        TextView result=text(\"● 장중 대기\",10,GREEN,true);\n        header.addView(pb);\n        header.addView(result);\n        content.addView(header);\n\n        // ===== v2.16.4: 차트를 조금 줄이고 우측 호가/종목정보 공간 확대 =====\n        LinearLayout terminal=card();\n        terminal.setOrientation(LinearLayout.HORIZONTAL);\n        terminal.setPadding(dp(3),dp(3),dp(3),dp(3));\n        terminal.setBackground(bg(Color.rgb(5,15,29),2));\n\n        LinearLayout left=new LinearLayout(this);\n        left.setOrientation(LinearLayout.VERTICAL);\n\n        LinearLayout tool=new LinearLayout(this);\n        tool.setOrientation(LinearLayout.HORIZONTAL);\n        tool.setGravity(Gravity.CENTER_VERTICAL);\n        tool.setPadding(0,dp(1),0,dp(1));\n        tool.setBackground(bg(Color.rgb(5,17,31),1));\n\n        Button indicator=button(\"지표\");\n        Button dayBtn=button(\"일\");\n    