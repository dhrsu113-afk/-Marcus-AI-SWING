                  );
                  progress.setMax(Math.max(1,masterStocks.size()));
                  progress.setProgress(prefs.getInt(SCAN_INDEX,0));
                  c.addView(progress);

                  TextView state=text(
                      prefs.getInt(SCAN_INDEX,0)>0
                      ? "✅ 이전 검사 기록 있음 · 다음 위치부터 계속 가능"
                      : "검사 대기",
                      14,MUTED,true
                  );
                  LinearLayout results=new LinearLayout(this);
                  results.setOrientation(LinearLayout.VERTICAL);

                  Button run=button("검사");
                  Button reset=button("처음부터 다시 검사");
                  TextView liveProgress=text("",13,BLUE,true);

                  c.addView(run);
                  c.addView(reset);
                  c.addView(liveProgress);
                  c.addView(state);
                  content.addView(c);

                  LinearLayout rc=card();
                  rc.addView(text("이번 배치 포착 종목",18,TEXT,true));
                  rc.addView(results);
                  content.addView(rc);

                  reset.setOnClickListener(v->{
                      prefs.edit()
                          .putInt(SCAN_INDEX,0)
                          .putInt(SCAN_HITS,0)
                          .remove(SCAN_LAST_NAME)
                          .remove(SCAN_LAST_CODE)
                          .apply();
                      progress.setProgress(0);
                      liveProgress.setText("0 / "+masterStocks.size()+" (0.0%)");
                      state.setText("검사 위치를 0으로 초기화했습니다.");
                  });

                  run.setOnClickListener(v->{
                      if(!tokenReady(env)){
                          state.setText("🔴 설정에서 OAuth 연결부터 확인해주세요.");
                          state.setTextColor(RED);
                          return;
                      }

                      int start=prefs.getInt(SCAN_INDEX,0);

                      if(start>=masterStocks.size()){
                          state.setText("✅ 전종목 1회 검사가 완료되었습니다. 처음부터 다시 검사를 누르세요.");
                          state.setTextColor(GREEN);
                          return;
                      }

                      int end=Math.min(start+20,masterStocks.size());

                      run.setEnabled(false);
                      results.removeAllViews();
                      progress.setProgress(0);
                      state.setText(
                          "검사 중... "+start+" ~ "+(end-1)+
                          " / "+masterStocks.size()
                      );
                      state.setTextColor(BLUE);

                      new Thread(()->{
                          int passed=0;
                          int success=0;
                          int errors=0;
                          String lastError="";

                          for(int i=start;i<end;i++){
                              MasterStock m=masterStocks.get(i);

                              try{
                                  List<Candle> candles=requestDailyChart(env,m.code);
                                  success++;
                                  AISignal sig=analyze(candles);

                                  boolean ok=matchesScript(rules,candles,sig);

                                  if(ok){
                                      passed++;
                                      final String label=
                                          m.name+" ("+m.code+") · "+
                                          sig.score+"점 · "+sig.label;

                                      runOnUiThread(()->{
                                          Button b=button(label);
                                          b.setOnClickListener(itemView->openStockFromScanner(m.code));
                                          results.addView(b);
                                      });
                                  }

                              }catch(Exception ex){
                                  errors++;
                                  lastError=safeError(ex);
                              }

                              final int done=i-start+1;
                              final int absoluteDone=i+1;
                              final String currentName=m.name;
                              final String currentCode=m.code;

                              prefs.edit()
                                  .putString(SCAN_LAST_NAME,currentName)
                                  .putString(SCAN_LAST_CODE,currentCode)
                                  .apply();

                              runOnUiThread(()->{
                                  progress.setProgress(absoluteDone);
                                  double p=masterStocks.isEmpty()
                                      ? 0.0
                                      : absoluteDone*100.0/masterStocks.size();

                                  liveProgress.setText(
                                      "검사중: "+currentName+" ("+currentCode+")\n"+
                                      absoluteDone+" / "+masterStocks.size()+
                                      " · "+String.format(Locale.US,"%.1f",p)+"%"
                                  );
                              });

                              try{
                                  Thread.sleep(200);
                              }catch(Exception ignored){}
                          }

                          final int next=end;
                          final int hit=passed;
                          final int okCount=success;
                          final int errorCount=errors;
                          final String finalLastError=lastError;
                          final int previousHits=prefs.getInt(SCAN_HITS,0);
                          final int totalHits=previousHits+hit;

                          prefs.edit()
                              .putInt(SCAN_INDEX,next)
                              .putInt(SCAN_HITS,totalHits)
                              .apply();

                          runOnUiThread(()->{
                              run.setEnabled(true);
                              state.setText(
                                  "✅ 검사 완료 · 대상 "+(end-start)+"종목"+
                                  "\nAPI 성공: "+okCount+" / 오류: "+errorCount+
                                  "\n이번 포착: "+hit+"종목"+
                                  (errorCount>0?"\n마지막 오류: "+finalLastError:"")+
                                  "\n누적 포착: "+totalHits+"종목\n"+
                                  "전체 진행: "+next+" / "+masterStocks.size()+
                                  " ("+String.format(Locale.US,"%.1f",(next*100.0/Math.max(1,masterStocks.size())))+"%)\n"+
                                  "다음 시작 위치: "+next
                              );
                              state.setTextColor(GREEN);
                          });
                      }).start();
                  });
              }

              boolean matchesScript(String rules,List<Candle> candles,AISignal sig){
                  Map<String,String> cfg=new HashMap<>();

                  for(String line:rules.split("\\n")){
                      String s=line.trim();
                      if(s.isEmpty()||s.startsWith("#")||!s.contains("="))continue;

                      String[] p=s.split("=",2);
                      cfg.put(
                          p[0].trim().toUpperCase(Locale.US),
                          p[1].trim().toLowerCase(Locale.US)
                      );
                  }

                  Candle last=candles.get(candles.size()-1);

                  if(cfg.containsKey("SCORE_MIN") &&
                      sig.score<num(cfg.get("SCORE_MIN")))return false;

                  if(boolRequired(cfg,"BOS") && !sig.bos)return false;
                  if(boolRequired(cfg,"DISCOUNT") && !sig.discount)return false;
                  if(boolRequired(cfg,"EXPLOSION") && !sig.explosion)return false;

                  if(boolRequired(cfg,"MA5_GT_MA20") && !(sig.ma5>sig.ma20))return false;
                  if(boolRequired(cfg,"PRICE_ABOVE_MA5") && !(last.close>sig.ma5))return false;

                  if(cfg.containsKey("RSI_MIN") &&
                      sig.rsi<num(cfg.get("RSI_MIN")))return false;

                  if(cfg.containsKey("RSI_MAX") &&
                      sig.rsi>num(cfg.get("RSI_MAX")))return false;

                  return true;
              }

              boolean boolRequired(Map<String,String> cfg,String key){
                  return cfg.containsKey(key) &&
                      ("true".equals(cfg.get(key)) ||
                       "1".equals(cfg.get(key)) ||
                       "yes".equals(cfg.get(key)));
              }

