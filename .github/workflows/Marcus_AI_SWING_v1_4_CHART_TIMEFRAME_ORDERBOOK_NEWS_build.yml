              static class HttpResult{
                  int code;
                  String body;

                  HttpResult(int c,String b){
                      code=c;
                      body=b;
                  }
              }

              HttpResult postJson(String url,String body)throws Exception{
                  HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();

                  try{
                      c.setRequestMethod("POST");
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(20000);
                      c.setDoOutput(true);
                      c.setRequestProperty(
                          "Content-Type",
                          "application/json; charset=utf-8"
                      );

                      byte[] bytes=body.getBytes(StandardCharsets.UTF_8);

                      try(OutputStream os=c.getOutputStream()){
                          os.write(bytes);
                      }

                      int http=c.getResponseCode();

                      InputStream is=
                          (http>=200&&http<400)
                          ? c.getInputStream()
                          : c.getErrorStream();

                      return new HttpResult(http,readAll(is));

                  }finally{
                      c.disconnect();
                  }
              }

              String readAll(InputStream is)throws Exception{
                  if(is==null)return "";

                  BufferedReader br=
                      new BufferedReader(
                          new InputStreamReader(
                              is,
                              StandardCharsets.UTF_8
                          )
                      );

                  StringBuilder sb=new StringBuilder();
                  String line;

                  while((line=br.readLine())!=null){
                      sb.append(line);
                  }

                  br.close();
                  return sb.toString();
              }

              String safeError(Exception e){
                  String m=e.getMessage();
                  return (m==null||m.isEmpty())
                      ? e.getClass().getSimpleName()
                      : m;
              }

              String mask(String v){
                  if(v==null||v.isEmpty())return "미설정";
                  if(v.length()<=8)return "••••••••";
                  return v.substring(0,4)+"••••••"+v.substring(v.length()-4);
              }
          }
