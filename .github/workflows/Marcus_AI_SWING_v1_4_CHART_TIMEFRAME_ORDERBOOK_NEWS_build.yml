              void pollLiveNext(List<String> codes,List<TextView> views){
                  if(!liveActive||codes.isEmpty())return;

                  int idx=liveCursor%codes.size();
                  String code=codes.get(idx);
                  String env=activeEnv();

                  new Thread(()->{
                      try{
                          JSONObject j=requestQuote(env,code);

                          if("0".equals(j.optString("rt_cd",""))){
                              JSONObject o=j.optJSONObject("output");

                              if(o!=null){
                                  String price=o.optString("stck_prpr","-");
                                  String rate=o.optString("prdy_ctrt","-");
                                  String vol=o.optString("acml_vol","-");
                                  String high=o.optString("stck_hgpr","-");
                                  String low=o.optString("stck_lwpr","-");

                                  runOnUiThread(()->{
                                      if(liveActive && idx<views.size()){
                                          views.get(idx).setText(
                                              "현재가 "+price+"원 · "+
                                              rate+"%\n"+
                                              "거래량 "+vol+
                                              " · 고가 "+high+
                                              " · 저가 "+low+
                                              "\n갱신: "+new SimpleDateFormat(
                                                  "HH:mm:ss",Locale.KOREA
                                              ).format(new Date())
                                          );
                                          views.get(idx).setTextColor(GREEN);
                                      }
                                  });
                              }
                          }
                      }catch(Exception e){
                          runOnUiThread(()->{
                              if(liveActive && idx<views.size()){
                                  views.get(idx).setText(
                                      "조회 오류 · "+safeError(e)
                                  );
                                  views.get(idx).setTextColor(RED);
                              }
                          });
                      }

                      runOnUiThread(()->{
                          if(!liveActive)return;
                          liveCursor=(idx+1)%codes.size();
                          liveHandler.postDelayed(
                              ()->pollLiveNext(codes,views),
                              2000
                          );
                      });
                  }).start();
              }

