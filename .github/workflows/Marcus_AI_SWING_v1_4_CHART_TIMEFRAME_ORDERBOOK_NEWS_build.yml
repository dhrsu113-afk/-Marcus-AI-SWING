              JSONObject requestToken(String env,String appKey,String appSecret)throws Exception{
                  JSONObject body=new JSONObject();
                  body.put("grant_type","client_credentials");
                  body.put("appkey",appKey);
                  body.put("appsecret",appSecret);

                  HttpResult result=postJson(
                      baseUrl(env)+"/oauth2/tokenP",
                      body.toString()
                  );

                  if(result.body==null||result.body.trim().isEmpty()){
                      throw new Exception("토큰 응답이 비어 있습니다. HTTP "+result.code);
                  }

                  return new JSONObject(result.body);
              }

