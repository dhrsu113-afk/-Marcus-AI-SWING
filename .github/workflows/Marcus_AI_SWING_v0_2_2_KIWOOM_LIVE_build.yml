name: Marcus AI SWING v0.2.2 Kiwoom Live Connect

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/marcus/aiswing
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MarcusAISwing"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.marcus.aiswing'
              compileSdk 34

              defaultConfig {
                  applicationId "com.marcus.aiswing"
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName "0.2.2"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Marcus AI SWING"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="unspecified"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#07101F</item>
                  <item name="android:navigationBarColor">#07101F</item>
                  <item name="android:colorAccent">#7EA7FF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/marcus/aiswing/MainActivity.java <<'JAVA'
          package com.marcus.aiswing;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.text.Editable;
          import android.text.InputType;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              final int BG=Color.rgb(7,16,31), PANEL=Color.rgb(17,28,48),
                  PANEL2=Color.rgb(24,38,63), TEXT=Color.rgb(239,244,255),
                  MUTED=Color.rgb(151,166,195), BLUE=Color.rgb(126,167,255),
                  GREEN=Color.rgb(103,220,157), RED=Color.rgb(255,116,116),
                  YELLOW=Color.rgb(255,211,105);

              LinearLayout content, nav;
              SharedPreferences prefs;
              final List<Stock> stockList = new ArrayList<>();

              static final String PREFS="marcus_api_settings";
              static final String KEY_ENV="kiwoom_env";
              static final String KEY_APPKEY="kiwoom_app_key";
              static final String KEY_SECRET="kiwoom_app_secret";
              static final String KEY_TOKEN="kiwoom_access_token";
              static final String KEY_TOKEN_EXPIRES="kiwoom_token_expires";

              static class Stock {
                  String code,name,marketName,state,auditInfo,nxtEnable;
                  Stock(String c,String n,String m,String s,String a,String x){
                      code=c; name=n; marketName=m; state=s; auditInfo=a; nxtEnable=x;
                  }
              }

              int dp(int v){return (int)(v*getResources().getDisplayMetrics().density+0.5f);}

              TextView text(String s,int size,int color,boolean bold){
                  TextView t=new TextView(this);
                  t.setText(s); t.setTextSize(size); t.setTextColor(color);
                  t.setPadding(0,dp(5),0,dp(5));
                  if(bold)t.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                  return t;
              }

              GradientDrawable bg(int color,int radius){
                  GradientDrawable g=new GradientDrawable();
                  g.setColor(color); g.setCornerRadius(dp(radius)); return g;
              }

              LinearLayout card(){
                  LinearLayout c=new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(dp(16),dp(14),dp(16),dp(14));
                  c.setBackground(bg(PANEL,16));
                  LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);
                  lp.setMargins(0,0,0,dp(12)); c.setLayoutParams(lp); return c;
              }

              EditText secretInput(String hint){
                  EditText e=new EditText(this);
                  e.setHint(hint); e.setHintTextColor(MUTED); e.setTextColor(TEXT);
                  e.setSingleLine(true); e.setPadding(dp(14),dp(11),dp(14),dp(11));
                  e.setBackground(bg(PANEL2,12));
                  e.setInputType(InputType.TYPE_CLASS_TEXT|InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  return e;
              }

              Button button(String s){Button b=new Button(this);b.setText(s);b.setAllCaps(false);return b;}

              @Override public void onCreate(Bundle b){
                  super.onCreate(b);
                  prefs=getSharedPreferences(PREFS,MODE_PRIVATE);

                  LinearLayout root=new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL); root.setBackgroundColor(BG);

                  ScrollView scroll=new ScrollView(this);
                  content=new LinearLayout(this); content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(dp(18),dp(18),dp(18),dp(24)); scroll.addView(content);
                  root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));

                  nav=new LinearLayout(this); nav.setOrientation(LinearLayout.HORIZONTAL);
                  nav.setGravity(Gravity.CENTER); nav.setBackgroundColor(Color.rgb(11,20,36));
                  root.addView(nav,new LinearLayout.LayoutParams(-1,dp(66)));
                  setContentView(root); buildNav(); showHome();
              }

              void buildNav(){
                  addNav("홈",v->showHome()); addNav("종목",v->showStocks());
                  addNav("AI검색",v->showAI()); addNav("관심",v->showFavorites());
                  addNav("설정",v->showSettings());
              }

              void addNav(String s,View.OnClickListener l){
                  Button b=new Button(this); b.setText(s); b.setTextSize(12); b.setTextColor(TEXT);
                  b.setAllCaps(false); b.setBackgroundColor(Color.TRANSPARENT); b.setOnClickListener(l);
                  nav.addView(b,new LinearLayout.LayoutParams(0,-1,1));
              }

              void clear(String title,String sub){
                  content.removeAllViews(); content.addView(text(title,26,TEXT,true));
                  if(sub!=null)content.addView(text(sub,13,MUTED,false));
                  Space sp=new Space(this);content.addView(sp,new LinearLayout.LayoutParams(1,dp(10)));
              }

              String baseUrl(){
                  return "실전투자".equals(prefs.getString(KEY_ENV,"모의투자"))
                      ? "https://api.kiwoom.com" : "https://mockapi.kiwoom.com";
              }

              void showHome(){
                  clear("Marcus AI SWING","키움 REST API 실제 연결 검증 · v0.2.2");
                  LinearLayout c=card();
                  if(tokenReady()){
                      c.addView(text("🟢 OAuth 토큰 발급 완료",17,GREEN,true));
                      c.addView(text("만료: "+prefs.getString(KEY_TOKEN_EXPIRES,"-"),13,MUTED,false));
                  } else {
                      c.addView(text("🟡 아직 키움 인증 전",17,YELLOW,true));
                      c.addView(text("설정 → 키움 연결 테스트를 실행하세요.",13,MUTED,false));
                  }
                  content.addView(c);
              }

              void showSettings(){
                  clear("설정","키움 REST API");
                  LinearLayout c=card();
                  c.addView(text("키움 REST API",20,TEXT,true));

                  Spinner env=new Spinner(this);
                  env.setAdapter(new ArrayAdapter<String>(this,
                      android.R.layout.simple_spinner_dropdown_item,
                      new String[]{"모의투자","실전투자"}));
                  env.setSelection("실전투자".equals(prefs.getString(KEY_ENV,"모의투자"))?1:0);
                  c.addView(text("환경",13,MUTED,true)); c.addView(env);

                  EditText key=secretInput("App Key 입력");
                  EditText sec=secretInput("App Secret 입력");
                  if(!prefs.getString(KEY_APPKEY,"").isEmpty())key.setHint("저장됨 · 새 값 입력 시 교체");
                  if(!prefs.getString(KEY_SECRET,"").isEmpty())sec.setHint("저장됨 · 새 값 입력 시 교체");
                  c.addView(text("App Key",13,MUTED,true)); c.addView(key);
                  c.addView(text("App Secret",13,MUTED,true)); c.addView(sec);

                  Button save=button("키 저장");
                  Button test=button("키움 연결 테스트");
                  Button del=button("저장정보 삭제");
                  ProgressBar pb=new ProgressBar(this); pb.setVisibility(View.GONE);
                  TextView status=text("",14,MUTED,true);
                  c.addView(save); c.addView(test); c.addView(del); c.addView(pb); c.addView(status);

                  Runnable refresh=()->{
                      String k=prefs.getString(KEY_APPKEY,""), s=prefs.getString(KEY_SECRET,"");
                      if(!k.isEmpty()&&!s.isEmpty()){
                          status.setText("🟢 키 저장됨 · "+prefs.getString(KEY_ENV,"모의투자")+
                              "\nApp Key: "+mask(k)+"\nSecret: "+mask(s)+
                              (tokenReady()?"\n🟢 OAuth 토큰 있음":""));
                          status.setTextColor(GREEN);
                      }else{
                          status.setText("🟡 App Key / Secret을 저장하세요."); status.setTextColor(YELLOW);
                      }
                  };

                  save.setOnClickListener(v->{
                      SharedPreferences.Editor ed=prefs.edit()
                          .putString(KEY_ENV,env.getSelectedItem().toString())
                          .remove(KEY_TOKEN).remove(KEY_TOKEN_EXPIRES);
                      if(!key.getText().toString().trim().isEmpty())
                          ed.putString(KEY_APPKEY,key.getText().toString().trim());
                      if(!sec.getText().toString().trim().isEmpty())
                          ed.putString(KEY_SECRET,sec.getText().toString().trim());
                      ed.apply(); key.setText("");sec.setText("");refresh.run();
                      Toast.makeText(this,"저장 완료",Toast.LENGTH_SHORT).show();
                  });

                  test.setOnClickListener(v->{
                      prefs.edit().putString(KEY_ENV,env.getSelectedItem().toString()).apply();
                      String k=prefs.getString(KEY_APPKEY,""),s=prefs.getString(KEY_SECRET,"");
                      if(k.isEmpty()||s.isEmpty()){status.setText("🔴 키를 먼저 저장하세요.");status.setTextColor(RED);return;}
                      pb.setVisibility(View.VISIBLE);test.setEnabled(false);
                      status.setText("OAuth 인증 요청 중...");status.setTextColor(BLUE);

                      new Thread(()->{
                          try{
                              JSONObject r=requestToken(k,s);
                              int rc=r.optInt("return_code",-999);
                              String msg=r.optString("return_msg","응답 메시지 없음");
                              if(rc==0&&!r.optString("token","").isEmpty()){
                                  prefs.edit().putString(KEY_TOKEN,r.optString("token"))
                                      .putString(KEY_TOKEN_EXPIRES,r.optString("expires_dt","")).apply();
                                  runOnUiThread(()->{
                                      pb.setVisibility(View.GONE);test.setEnabled(true);
                                      status.setText("🟢 키움 REST API 연결 성공\nOAuth 토큰 발급 완료\n만료: "+
                                          prefs.getString(KEY_TOKEN_EXPIRES,"-"));
                                      status.setTextColor(GREEN);
                                  });
                              }else{
                                  runOnUiThread(()->{
                                      pb.setVisibility(View.GONE);test.setEnabled(true);
                                      status.setText("🔴 인증 실패\nreturn_code: "+rc+"\n"+msg);status.setTextColor(RED);
                                  });
                              }
                          }catch(Exception e){
                              runOnUiThread(()->{
                                  pb.setVisibility(View.GONE);test.setEnabled(true);
                                  status.setText("🔴 연결 실패\n"+safeError(e));status.setTextColor(RED);
                              });
                          }
                      }).start();
                  });

                  del.setOnClickListener(v->{prefs.edit().clear().apply();stockList.clear();refresh.run();});
                  refresh.run(); content.addView(c);

                  LinearLayout w=card();
                  w.addView(text("중요",17,TEXT,true));
                  w.addView(text("휴대폰 공인 IP를 등록했다면 연결 테스트 때 Wi-Fi를 끄고 LTE/5G로 실행하세요.",
                      13,YELLOW,false));
                  content.addView(w);
              }

              JSONObject requestToken(String appKey,String secret)throws Exception{
                  JSONObject b=new JSONObject();
                  b.put("grant_type","client_credentials");b.put("appkey",appKey);b.put("secretkey",secret);
                  HttpResult r=postJson(baseUrl()+"/oauth2/token",b.toString(),null,null);
                  return new JSONObject(r.body);
              }

              void showStocks(){
                  clear("전체 종목","키움 ka10099 실제 종목 리스트");
                  LinearLayout ctl=card();

                  Spinner market=new Spinner(this);
                  market.setAdapter(new ArrayAdapter<String>(this,
                      android.R.layout.simple_spinner_dropdown_item,new String[]{"KOSPI","KOSDAQ"}));
                  Button load=button("키움에서 전체 종목 불러오기");
                  ProgressBar pb=new ProgressBar(this);pb.setVisibility(View.GONE);
                  TextView stat=text(tokenReady()?"🟢 토큰 준비됨":"🟡 설정에서 연결 테스트를 먼저 실행하세요.",
                      13,tokenReady()?GREEN:YELLOW,true);
                  ctl.addView(market);ctl.addView(load);ctl.addView(pb);ctl.addView(stat);content.addView(ctl);

                  EditText search=new EditText(this);
                  search.setHint("종목명 또는 종목코드 검색");search.setHintTextColor(MUTED);
                  search.setTextColor(TEXT);search.setSingleLine(true);search.setBackground(bg(PANEL2,14));
                  search.setPadding(dp(14),dp(12),dp(14),dp(12));content.addView(search);

                  LinearLayout list=new LinearLayout(this);list.setOrientation(LinearLayout.VERTICAL);content.addView(list);

                  search.addTextChangedListener(new TextWatcher(){
                      public void beforeTextChanged(CharSequence s,int st,int c,int a){}
                      public void onTextChanged(CharSequence s,int st,int b,int c){renderStocks(list,s.toString());}
                      public void afterTextChanged(Editable e){}
                  });

                  load.setOnClickListener(v->{
                      if(!tokenReady()){stat.setText("🔴 설정 → 키움 연결 테스트를 먼저 성공시켜주세요.");stat.setTextColor(RED);return;}
                      String tp=market.getSelectedItemPosition()==0?"0":"10";
                      pb.setVisibility(View.VISIBLE);load.setEnabled(false);stat.setText("종목 리스트 요청 중...");stat.setTextColor(BLUE);
                      new Thread(()->{
                          try{
                              List<Stock> got=fetchStockList(tp);
                              synchronized(stockList){stockList.clear();stockList.addAll(got);}
                              runOnUiThread(()->{
                                  pb.setVisibility(View.GONE);load.setEnabled(true);
                                  stat.setText("🟢 "+market.getSelectedItem()+" "+got.size()+"개 종목 수신");stat.setTextColor(GREEN);
                                  renderStocks(list,search.getText().toString());
                              });
                          }catch(Exception e){
                              runOnUiThread(()->{
                                  pb.setVisibility(View.GONE);load.setEnabled(true);
                                  stat.setText("🔴 종목조회 실패\n"+safeError(e));stat.setTextColor(RED);
                              });
                          }
                      }).start();
                  });
              }

              List<Stock> fetchStockList(String tp)throws Exception{
                  JSONObject b=new JSONObject();b.put("mrkt_tp",tp);
                  HttpResult r=postJson(baseUrl()+"/api/dostk/stkinfo",b.toString(),
                      "Bearer "+prefs.getString(KEY_TOKEN,""),"ka10099");
                  JSONObject j=new JSONObject(r.body);
                  if(j.optInt("return_code",-999)!=0)
                      throw new Exception("return_code "+j.optInt("return_code")+" · "+j.optString("return_msg","오류"));
                  JSONArray a=j.optJSONArray("list");
                  if(a==null)throw new Exception("응답에 list 배열이 없습니다.");
                  List<Stock> out=new ArrayList<>();
                  for(int i=0;i<a.length();i++){
                      JSONObject o=a.optJSONObject(i); if(o==null)continue;
                      out.add(new Stock(o.optString("code"),o.optString("name"),o.optString("marketName"),
                          o.optString("state"),o.optString("auditInfo"),o.optString("nxtEnable")));
                  }
                  return out;
              }

              void renderStocks(LinearLayout list,String q){
                  list.removeAllViews();q=q==null?"":q.trim().toLowerCase();int shown=0;
                  synchronized(stockList){
                      for(Stock s:stockList){
                          if(q.isEmpty()||s.name.toLowerCase().contains(q)||s.code.contains(q)){
                              LinearLayout c=card();
                              c.addView(text(s.name+"   "+s.code,17,TEXT,true));
                              c.addView(text(empty(s.marketName)+" · 상태 "+empty(s.state)+" · NXT "+empty(s.nxtEnable),12,MUTED,false));
                              c.setOnClickListener(v->showDetail(s));list.addView(c);shown++;
                              if(q.isEmpty()&&shown>=200){
                                  list.addView(text("전체 "+stockList.size()+"개 중 200개 표시 · 검색창을 이용하세요.",13,BLUE,true));
                                  break;
                              }
                          }
                      }
                  }
                  if(shown==0&&!stockList.isEmpty())list.addView(text("검색 결과가 없습니다.",15,MUTED,false));
              }

              void showDetail(Stock s){
                  clear(s.name,s.code+" · "+empty(s.marketName));
                  LinearLayout c=card();
                  c.addView(text("종목정보",18,TEXT,true));
                  c.addView(text("상태       "+empty(s.state),14,TEXT,false));
                  c.addView(text("감사정보   "+empty(s.auditInfo),14,TEXT,false));
                  c.addView(text("NXT 가능   "+empty(s.nxtEnable),14,TEXT,false));
                  content.addView(c);
                  LinearLayout n=card();n.addView(text("다음 단계",18,TEXT,true));
                  n.addView(text("현재가 · 거래량 · 일봉차트 · AI SWING 점수 연결",14,BLUE,false));content.addView(n);
              }

              void showAI(){
                  clear("AI 검색","AI SWING Scanner");
                  LinearLayout c=card();
                  if(stockList.isEmpty())c.addView(text("먼저 종목 탭에서 실제 종목 리스트를 불러오세요.",14,YELLOW,false));
                  else c.addView(text("실제 종목 "+stockList.size()+"개 준비됨 · 다음은 일봉 OHLCV 연결",14,GREEN,true));
                  content.addView(c);
              }

              void showFavorites(){
                  clear("관심종목","다음 단계에서 실제 종목 영구 저장/편집 연결");
                  LinearLayout c=card();c.addView(text("관심종목 기능은 다음 버전에서 연결합니다.",14,MUTED,false));content.addView(c);
              }

              boolean tokenReady(){return !prefs.getString(KEY_TOKEN,"").isEmpty();}

              static class HttpResult{int code;String body;HttpResult(int c,String b){code=c;body=b;}}

              HttpResult postJson(String u,String body,String auth,String apiId)throws Exception{
                  HttpURLConnection c=(HttpURLConnection)new URL(u).openConnection();
                  try{
                      c.setRequestMethod("POST");c.setConnectTimeout(15000);c.setReadTimeout(20000);c.setDoOutput(true);
                      c.setRequestProperty("Content-Type","application/json;charset=UTF-8");
                      if(auth!=null)c.setRequestProperty("authorization",auth);
                      if(apiId!=null)c.setRequestProperty("api-id",apiId);
                      byte[] bytes=body.getBytes(StandardCharsets.UTF_8);
                      try(OutputStream os=c.getOutputStream()){os.write(bytes);}
                      int code=c.getResponseCode();
                      InputStream is=(code>=200&&code<400)?c.getInputStream():c.getErrorStream();
                      return new HttpResult(code,readAll(is));
                  }finally{c.disconnect();}
              }

              String readAll(InputStream is)throws Exception{
                  if(is==null)return "";
                  BufferedReader br=new BufferedReader(new InputStreamReader(is,StandardCharsets.UTF_8));
                  StringBuilder sb=new StringBuilder();String line;
                  while((line=br.readLine())!=null)sb.append(line);
                  br.close();return sb.toString();
              }

              String safeError(Exception e){
                  String m=e.getMessage();return (m==null||m.isEmpty())?e.getClass().getSimpleName():m;
              }

              String empty(String s){return s==null||s.trim().isEmpty()?"-":s;}

              String mask(String v){
                  if(v==null||v.isEmpty())return "미설정";
                  if(v.length()<=8)return "••••••••";
                  return v.substring(0,4)+"••••••"+v.substring(v.length()-4);
              }
          }
          JAVA

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marcus-AI-SWING-v0.2.2-KIWOOM-LIVE
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
