              class StockChartView extends View{
                  List<Candle> candles=new ArrayList<>();
                  AISignal signal=null;
                  Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);

                  StockChartView(Activity a){
                      super(a);
                      setBackgroundColor(Color.rgb(11,20,36));
                  }

                  void setCandles(List<Candle> c,AISignal s){
                      candles=new ArrayList<>(c);
                      signal=s;
                      invalidate();
                  }

                  @Override
                  protected void onDraw(Canvas canvas){
                      super.onDraw(canvas);

                      if(candles==null||candles.isEmpty()){
                          p.setColor(MUTED);
                          p.setTextSize(dp(14));
                          canvas.drawText(
                              "종목을 검색하면 실제 일봉 차트가 표시됩니다.",
                              dp(16),dp(36),p
                          );
                          return;
                      }

                      float w=getWidth();
                      float h=getHeight();
                      float left=dp(12);
                      float right=w-dp(12);
                      float top=dp(26);
                      float bottom=h-dp(44);

                      double min=Double.MAX_VALUE;
                      double max=0;

                      for(Candle c:candles){
                          min=Math.min(min,c.low);
                          max=Math.max(max,c.high);
                      }

                      if(max<=min)return;

                      float step=(right-left)/Math.max(1,candles.size());
                      float bodyW=Math.max(dp(2),step*0.55f);

                      p.setStrokeWidth(dp(1));

                      for(int i=0;i<candles.size();i++){
                          Candle c=candles.get(i);

                          float x=left+i*step+step/2f;
                          float yH=priceY(c.high,min,max,top,bottom);
                          float yL=priceY(c.low,min,max,top,bottom);
                          float yO=priceY(c.open,min,max,top,bottom);
                          float yC=priceY(c.close,min,max,top,bottom);

                          int color=c.close>=c.open
                              ? Color.rgb(255,92,92)
                              : Color.rgb(80,145,255);

                          p.setColor(color);
                          p.setStyle(Paint.Style.STROKE);
                          canvas.drawLine(x,yH,x,yL,p);

                          p.setStyle(Paint.Style.FILL);

                          float rt=Math.min(yO,yC);
                          float rb=Math.max(yO,yC);

                          if(Math.abs(rb-rt)<dp(1))rb=rt+dp(1);

                          canvas.drawRect(
                              x-bodyW/2f,
                              rt,
                              x+bodyW/2f,
                              rb,
                              p
                          );
                      }

                      drawMA(canvas,5,Color.rgb(255,205,90),min,max,top,bottom,left,step);
                      drawMA(canvas,20,Color.rgb(116,230,171),min,max,top,bottom,left,step);

                      p.setColor(MUTED);
                      p.setTextSize(dp(11));
                      canvas.drawText(
                          "5MA / 20MA · "+candles.get(0).date+" ~ "+candles.get(candles.size()-1).date,
                          left,
                          h-dp(14),
                          p
                      );

                      if(signal!=null){
                          p.setTextSize(dp(12));
                          p.setColor(signal.score>=80?GREEN:(signal.score>=66?YELLOW:MUTED));
                          canvas.drawText(
                              signal.label+" "+signal.score+"점",
                              left,
                              dp(16),
                              p
                          );
                      }
                  }

                  float priceY(
                      double price,double min,double max,
                      float top,float bottom
                  ){
                      return (float)(
                          bottom-(price-min)/(max-min)*(bottom-top)
                      );
                  }

                  void drawMA(
                      Canvas canvas,
                      int period,
                      int color,
                      double min,double max,
                      float top,float bottom,
                      float left,float step
                  ){
                      if(candles.size()<period)return;

                      Path path=new Path();
                      boolean started=false;

                      p.setColor(color);
                      p.setStrokeWidth(dp(2));
                      p.setStyle(Paint.Style.STROKE);

                      for(int i=period-1;i<candles.size();i++){
                          double sum=0;

                          for(int j=i-period+1;j<=i;j++){
                              sum+=candles.get(j).close;
                          }

                          double ma=sum/period;
                          float x=left+i*step+step/2f;
                          float y=priceY(ma,min,max,top,bottom);

                          if(!started){
                              path.moveTo(x,y);
                              started=true;
                          }else{
                              path.lineTo(x,y);
                          }
                      }

                      canvas.drawPath(path,p);
                      p.setStyle(Paint.Style.FILL);
                  }
              }

              void waitForApiSlot(){
                  synchronized(apiRateLock){
                      long now=System.currentTimeMillis();
                      long wait=1200L-(now-lastApiCallAt);

                      if(wait>0){
                          try{
                              Thread.sleep(wait);
                          }catch(Exception ignored){}
                      }

                      lastApiCallAt=System.currentTimeMillis();
                  }
              }

