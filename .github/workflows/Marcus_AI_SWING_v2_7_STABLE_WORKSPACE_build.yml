              List<String> getSavedScanResults(){
                  List<String> out=new ArrayList<>();
                  String raw=prefs.getString(SCAN_RESULTS,"");
                  if(raw.trim().isEmpty())return out;
                  for(String line:raw.split("\n")) if(!line.trim().isEmpty()) out.add(line.trim());
                  return out;
              }

              void saveScanResult(String code,String name,AISignal sig){
                  List<String> rows=getSavedScanResults();
                  String prefix=code+"|";
                  for(String r:rows) if(r.startsWith(prefix)) return;
                  rows.add(code+"|"+name+"|"+sig.score+"|"+sig.label);
                  StringBuilder sb=new StringBuilder();
                  for(String r:rows){ if(sb.length()>0)sb.append("\n"); sb.append(r); }
                  prefs.edit().putString(SCAN_RESULTS,sb.toString()).apply();
              }

              void renderSavedScanResults(LinearLayout results){
                  results.removeAllViews();
                  List<String> rows=getSavedScanResults();
                  if(rows.isEmpty()){
                      results.addView(text("아직 포착된 종목이 없습니다.",13,MUTED,false));
                      return;
                  }
                  for(String r:rows){
                      String[] p=r.split("\\|",4);
                      if(p.length<4)continue;
                      String code=p[0],name=p[1],score=p[2],label=p[3];
                      Button b=button(name+" ("+code+") · "+score+"점 · "+label);
                      b.setOnClickListener(v->openStockFromScanner(code));
                      results.addView(b);
                  }
              }

