                      "SHOW_MA5=true\nSHOW_MA10=true\nSHOW_MA15=true\nSHOW_MA20=true\nSHOW_VOLUME=true\n"+
                      "SHOW_BOS=true\nSHOW_DISCOUNT=true\nSHOW_EXPLOSION=true\nSHOW_RSI=true"
                  );
                  Map<String,String> cfg=parseRules(rules);
                  List<String> on=new ArrayList<>();

                  if(ruleBool(cfg,"SHOW_MA5",true))on.add("MA5");
                  if(ruleBool(cfg,"SHOW_MA10",true))on.add("MA10");
                  if(ruleBool(cfg,"SHOW_MA15",true))on.add("MA15");
                  if(ruleBool(cfg,"SHOW_MA20",true))on.add("MA20");
                  if(ruleBool(cfg,"SHOW_VOLUME",true))on.add("거래량");
                  if(ruleBool(cfg,"SHOW_BOS",true))on.add("BOS");
                  if(ruleBool(cfg,"SHOW_DISCOUNT",true))on.add("Discount");
                  if(ruleBool(cfg,"SHOW_EXPLOSION",true))on.add("Explosion");
                  if(ruleBool(cfg,"SHOW_RSI",true))on.add("RSI");

                  return String.join(" · ",on);
              }

