              String resolveStockCode(String raw){
                  String s=raw.trim();
                  if(s.matches("\\d{6}"))return s;

                  MasterStock exact=null;
                  MasterStock best=null;

                  for(MasterStock m:masterStocks){
                      if(m.name.equalsIgnoreCase(s)){
                          exact=m;
                          break;
                      }
                      if(m.name.toLowerCase(Locale.KOREA).contains(s.toLowerCase(Locale.KOREA))){
                          if(best==null || m.name.length()<best.name.length()){
                              best=m;
                          }
                      }
                  }

                  if(exact!=null)return exact.code;
                  if(best!=null)return best.code;
                  return null;
              }

              String displayName(String raw,String code){
                  for(MasterStock m:masterStocks){
                      if(m.code.equals(code))return m.name;
                  }
                  return raw.matches("\\d{6}")?code:raw;
              }

              List<MasterStock> findMasterMatches(String raw,int limit){
                  List<MasterStock> out=new ArrayList<>();
                  String q=raw.trim().toLowerCase(Locale.KOREA);

                  if(q.isEmpty())return out;

                  for(MasterStock m:masterStocks){
                      if(m.code.contains(q) || m.name.toLowerCase(Locale.KOREA).contains(q)){
                          out.add(m);
                          if(out.size()>=limit)break;
                      }
                  }

                  return out;
              }

              void sendChartData(
                  WebView web,
                  List<Candle> candles,
                  String name,
                  String code,
                  String period
              ){
                  try{
                      org.json.JSONObject payload=new org.json.JSONObject();
                      payload.put("name",name);
                      payload.put("code",code);
                      payload.put("period",period);

                      org.json.JSONArray arr=new org.json.JSONArray();
                      org.json.JSONArray ma5=new org.json.JSONArray();
                      org.json.JSONArray ma10=new org.json.JSONArray();
                      org.json.JSONArray ma15=new org.json.JSONArray();
                      org.json.JSONArray ma20=new org.json.JSONArray();
                      org.json.JSONArray volume=new org.json.JSONArray();

                      SimpleDateFormat intradayParser=
                          new SimpleDateFormat("yyyyMMddHHmmss",Locale.KOREA);

                      for(int i=0;i<candles.size();i++){
                          Candle c=candles.get(i);
                          Object timeValue;
                          String label;

                          if(c.date.length()==8){
                              timeValue=
                                  c.date.substring(0,4)+"-"+
                                  c.date.substring(4,6)+"-"+
                                  c.date.substring(6,8);
                              label=(String)timeValue;
                          }else{
                              Date d=intradayParser.parse(c.date);
                              timeValue=d.getTime()/1000L;
                              label=
                                  c.date.substring(4,6)+"/"+
                                  c.date.substring(6,8)+" "+
                                  c.date.substring(8,10)+":"+
                                  c.date.substring(10,12);
                          }

                          org.json.JSONObject o=new org.json.JSONObject();
                          o.put("time",timeValue);
                          o.put("label",label);
                          o.put("open",c.open);
                          o.put("high",c.high);
                          o.put("low",c.low);
                          o.put("close",c.close);
                          o.put("volume",c.volume);
                          arr.put(o);

                          org.json.JSONObject vo=new org.json.JSONObject();
                          vo.put("time",timeValue);
                          vo.put("value",c.volume);
                          vo.put(
                              "color",
                              c.close>=c.open
                                  ? "rgba(255,105,127,0.48)"
                                  : "rgba(83,146,255,0.48)"
                          );
                          volume.put(vo);

                          if(i>=4){
                              double sum=0;
                              for(int j=i-4;j<=i;j++)sum+=candles.get(j).close;
                              org.json.JSONObject m=new org.json.JSONObject();
                              m.put("time",timeValue);
                              m.put("value",sum/5.0);
                              ma5.put(m);
                          }

                          if(i>=9){
                              double sum=0;
                              for(int j=i-9;j<=i;j++)sum+=candles.get(j).close;
                              org.json.JSONObject m=new org.json.JSONObject();
                              m.put("time",timeValue); m.put("value",sum/10.0); ma10.put(m);
                          }
                          if(i>=14){
                              double sum=0;
                              for(int j=i-14;j<=i;j++)sum+=candles.get(j).close;
                              org.json.JSONObject m=new org.json.JSONObject();
                              m.put("time",timeValue); m.put("value",sum/15.0); ma15.put(m);
                          }

                          if(i>=19){
                              double sum=0;
                              for(int j=i-19;j<=i;j++)sum+=candles.get(j).close;
                              org.json.JSONObject m=new org.json.JSONObject();
                              m.put("time",timeValue);
                              m.put("value",sum/20.0);
                              ma20.put(m);
                          }
                      }

                      payload.put("candles",arr);
                      payload.put("ma5",ma5);
                      payload.put("ma10",ma10);
                      payload.put("ma15",ma15);
                      payload.put("ma20",ma20);
                      payload.put("volume",volume);

                      // v2.1: 저장된 차트 규칙을 실제 차트 렌더링에 연결
                      String chartRules=prefs.getString("chart_script",
                          "SHOW_MA5=true\nSHOW_MA10=true\nSHOW_MA15=true\nSHOW_MA20=true\nSHOW_VOLUME=true\nSHOW_BOS=true\nSHOW_DISCOUNT=true\nSHOW_EXPLOSION=true\nSHOW_RSI=true");
                      Map<String,String> cc=parseRules(chartRules);
                      org.json.JSONObject cfg=new org.json.JSONObject();
                      cfg.put("showMA5",ruleBool(cc,"SHOW_MA5",true));
                      cfg.put("showMA10",ruleBool(cc,"SHOW_MA10",true));
                      cfg.put("showMA15",ruleBool(cc,"SHOW_MA15",true));
                      cfg.put("showMA20",ruleBool(cc,"SHOW_MA20",true));
                      cfg.put("showVolume",ruleBool(cc,"SHOW_VOLUME",true));
                      cfg.put("showRSI",ruleBool(cc,"SHOW_RSI",true));
                      cfg.put("showBOS",ruleBool(cc,"SHOW_BOS",true));
                      cfg.put("showDiscount",ruleBool(cc,"SHOW_DISCOUNT",true));
                      cfg.put("showExplosion",ruleBool(cc,"SHOW_EXPLOSION",true));
                      payload.put("config",cfg);

                      AISignal chartSig=analyze(candles);
                      org.json.JSONObject signal=new org.json.JSONObject();
                      signal.put("bos",chartSig.bos);
                      signal.put("discount",chartSig.discount);
                      signal.put("explosion",chartSig.explosion);
                      signal.put("score",chartSig.score);
                      signal.put("rsi",chartSig.rsi);
                      payload.put("signal",signal);

                      final String js="setStockData("+payload.toString()+")";
                      dispatchChartJs(web,js);

                  }catch(Exception ignored){}
              }

              static class Candle{
                  String date;
                  double open,high,low,close,volume;

                  Candle(String d,double o,double h,double l,double c,double v){
                      date=d; open=o; high=h; low=l; close=c; volume=v;
                  }
              }

              static class AISignal{
                  int score;
                  String label;
                  boolean bos,discount,explosion;
                  double ma5,ma20,rsi;
              }

              List<Candle> requestDailyChart(String env,String code)throws Exception{
                  String cacheKey=env+"_"+code;
                  List<Candle> cached=dailyChartCache.get(cacheKey);
                  if(cached!=null&&!cached.isEmpty())return new ArrayList<>(cached);
                  SimpleDateFormat sdf=new SimpleDateFormat("yyyyMMdd",Locale.US);
                  Calendar cal=Calendar.getInstance();
                  String finalEnd=sdf.format(cal.getTime());

                  cal.add(Calendar.YEAR,-3);
                  String finalStart=sdf.format(cal.getTime());

                  List<Candle> merged=new ArrayList<>();
                  String pageEnd=finalEnd;

                  for(int page=0;page<5;page++){
                      List<Candle> part=requestDailyPage(
                          env,code,finalStart,pageEnd
                      );

                      if(part.isEmpty())break;

                      merged.addAll(part);

                      String oldest=part.get(0).date;

                      Date oldestDate=sdf.parse(oldest);
                      Calendar prev=Calendar.getInstance();
                      prev.setTime(oldestDate);
                      prev.add(Calendar.DAY_OF_MONTH,-1);
                      pageEnd=sdf.format(prev.getTime());

                      if(pageEnd.compareTo(finalStart)<0)break;
                  }

                  Map<String,Candle> uniq=new LinkedHashMap<>();
                  for(Candle c:merged)uniq.put(c.date,c);

                  List<Candle> out=new ArrayList<>(uniq.values());
                  Collections.sort(out,(a,b)->a.date.compareTo(b.date));

                  if(!out.isEmpty())dailyChartCache.put(cacheKey,new ArrayList<>(out));
                  return out;
              }

              List<Candle> requestDailyPage(
                  String env,
                  String code,
                  String start,
                  String end
              )throws Exception{
                  refreshTokenIfNeeded(env);

                  String url=
                      baseUrl(env)+
                      "/uapi/domestic-stock/v1/quotations/inquire-daily-itemchartprice"+
                      "?FID_COND_MRKT_DIV_CODE=J"+
                      "&FID_INPUT_ISCD="+URLEncoder.encode(code,StandardCharsets.UTF_8.name())+
                      "&FID_INPUT_DATE_1="+start+
                      "&FID_INPUT_DATE_2="+end+
                      "&FID_PERIOD_DIV_CODE=D"+
                      "&FID_ORG_ADJ_PRC=0";

                  waitForApiSlot();

                  HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();

                  try{
                      c.setRequestMethod("GET");
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(20000);
                      c.setRequestProperty("authorization","Bearer "+prefs.getString(tokenName(env),""));
                      c.setRequestProperty("appkey",prefs.getString(keyName(env),""));
                      c.setRequestProperty("appsecret",prefs.getString(secretName(env),""));
                      c.setRequestProperty("tr_id","FHKST03010100");
                      c.setRequestProperty("Content-Type","application/json; charset=utf-8");

                      int http=c.getResponseCode();
                      InputStream is=(http>=200&&http<400)?c.getInputStream():c.getErrorStream();
                      String body=readAll(is);

                      if(body==null||body.trim().isEmpty()){
                          throw new Exception("일봉 응답 없음 HTTP "+http);
                      }

                      JSONObject j=new JSONObject(body);

                      if(!"0".equals(j.optString("rt_cd",""))){
                          throw new Exception(j.optString("msg1","일봉 조회 실패"));
                      }

                      org.json.JSONArray arr=j.optJSONArray("output2");
                      List<Candle> out=new ArrayList<>();

                      if(arr==null)return out;

                      for(int i=0;i<arr.length();i++){
                          JSONObject o=arr.optJSONObject(i);
                          if(o==null)continue;

                          String d=o.optString("stck_bsop_date","");
                          if(d.length()!=8)continue;

                          out.add(new Candle(
                              d,
                              num(o.optString("stck_oprc","0")),
                              num(o.optString("stck_hgpr","0")),
                              num(o.optString("stck_lwpr","0")),
                              num(o.optString("stck_clpr","0")),
                              num(o.optString("acml_vol","0"))
                          ));
                      }

                      Collections.reverse(out);
                      return out;

                  }finally{
                      c.disconnect();
                  }
              }

              List<Candle> requestIntraday1m(String env,String code)throws Exception{
                  refreshTokenIfNeeded(env);
                  Map<String,Candle> uniq=new LinkedHashMap<>();
                  SimpleDateFormat timeFmt=new SimpleDateFormat("HHmmss",Locale.KOREA);
                  SimpleDateFormat dayFmt=new SimpleDateFormat("yyyyMMdd",Locale.KOREA);

                  Calendar base=Calendar.getInstance();

                  for(int page=0;page<4;page++){
                      Calendar cursor=(Calendar)base.clone();
