              AISignal analyze(List<Candle> c){
                  AISignal s=new AISignal();

                  if(c==null||c.size()<21){
                      s.score=0;
                      s.label="데이터 부족";
                      return s;
                  }

                  int n=c.size();
                  s.ma5=avgClose(c,5);
                  s.ma20=avgClose(c,20);
                  s.rsi=rsi14(c);

                  Candle last=c.get(n-1);

                  double prev20High=0;
                  for(int i=Math.max(0,n-21);i<n-1;i++){
                      prev20High=Math.max(prev20High,c.get(i).high);
                  }

                  s.bos=last.close>prev20High && prev20High>0;

                  double low20=Double.MAX_VALUE;
                  double high20=0;
                  double avgVol=0;

                  for(int i=n-20;i<n;i++){
                      low20=Math.min(low20,c.get(i).low);
                      high20=Math.max(high20,c.get(i).high);
                      avgVol+=c.get(i).volume;
                  }

                  avgVol/=20.0;

                  double range=Math.max(1,high20-low20);
                  double pos=(last.close-low20)/range;

                  s.discount=pos<=0.38 && last.close>=s.ma5;
                  s.explosion=last.volume>=avgVol*1.8 && last.close>last.open;

                  int score=50;
                  if(last.close>s.ma5)score+=8;
                  if(s.ma5>s.ma20)score+=8;
                  if(s.rsi>=50&&s.rsi<=70)score+=6;
                  if(s.bos)score+=12;
                  if(s.discount)score+=8;
                  if(s.explosion)score+=10;
                  if(last.close<s.ma20)score-=10;
                  if(s.rsi>78)score-=8;

                  s.score=Math.max(0,Math.min(100,score));

                  if(s.score>=86)s.label="🚀 돌파예비";
                  else if(s.score>=80)s.label="🛡️ 지지형";
                  else if(s.score>=66)s.label="관찰";
                  else s.label="대기";

                  return s;
              }

              double avgClose(List<Candle> c,int p){
                  int start=Math.max(0,c.size()-p);
                  double sum=0;
                  int cnt=0;

                  for(int i=start;i<c.size();i++){
                      sum+=c.get(i).close;
                      cnt++;
                  }

                  return cnt==0?0:sum/cnt;
              }

              double rsi14(List<Candle> c){
                  if(c.size()<15)return 0;

                  double gain=0;
                  double loss=0;
                  int start=c.size()-14;

                  for(int i=start;i<c.size();i++){
                      double diff=c.get(i).close-c.get(i-1).close;
                      if(diff>=0)gain+=diff;
                      else loss-=diff;
                  }

                  if(loss==0)return 100;

                  double rs=(gain/14.0)/(loss/14.0);
                  return 100.0-(100.0/(1.0+rs));
              }

