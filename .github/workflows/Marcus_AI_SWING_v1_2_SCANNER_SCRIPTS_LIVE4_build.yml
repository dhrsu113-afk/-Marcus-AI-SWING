name: Marcus AI SWING v1.2 Scanner Scripts Live4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/marcus/aiswing
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          python3 - <<'PY'
          import csv, io, os, urllib.request, zipfile

          sources = [
              ("KOSPI", "https://new.real.download.dws.co.kr/common/master/kospi_code.mst.zip", "kospi_code.mst", 228),
              ("KOSDAQ", "https://new.real.download.dws.co.kr/common/master/kosdaq_code.mst.zip", "kosdaq_code.mst", 222),
          ]

          rows = []
          seen = set()

          for market, url, mst_name, tail_len in sources:
              print("download", market, url)
              data = urllib.request.urlopen(url, timeout=30).read()

              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  raw = z.read(mst_name)

              text = raw.decode("cp949", errors="ignore")

              for line in text.splitlines():
                  if len(line) <= tail_len:
                      continue

                  head = line[:-tail_len]
                  short_code = head[0:9].strip()
                  std_code = head[9:21].strip()
                  name = head[21:].strip()

                  # KIS master short code is normally 6 digits; normalize safely.
                  digits = "".join(ch for ch in short_code if ch.isdigit())
                  code = digits[-6:] if len(digits) >= 6 else short_code[-6:]

                  if len(code) != 6 or not code.isdigit() or not name:
                      continue

                  key = (code, market)
                  if key in seen:
                      continue
                  seen.add(key)
                  rows.append((code, name, market, std_code))

          rows.sort(key=lambda x: (x[1], x[0]))

          out = "app/src/main/assets/stocks.csv"
          with open(out, "w", encoding="utf-8", newline="") as f:
              w = csv.writer(f)
              w.writerow(["code","name","market","std_code"])
              w.writerows(rows)

          print("master rows:", len(rows))
          PY

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MarcusAISwing"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.marcus.aiswing'
              compileSdk 34

              defaultConfig {
                  applicationId "com.marcus.aiswing"
                  minSdk 26
                  targetSdk 34
                  versionCode 12
                  versionName "1.2"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="Marcus AI SWING"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#07101F</item>
                  <item name="android:navigationBarColor">#07101F</item>
                  <item name="android:colorAccent">#7EA7FF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/marcus/aiswing/MainActivity.java <<'JAVA'
          package com.marcus.aiswing;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.drawable.GradientDrawable;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.io.InputStreamReader;

          public class MainActivity extends Activity {

              final int BG=Color.rgb(7,16,31);
              final int PANEL=Color.rgb(17,28,48);
              final int PANEL2=Color.rgb(24,38,63);
              final int TEXT=Color.rgb(239,244,255);
              final int MUTED=Color.rgb(151,166,195);
              final int BLUE=Color.rgb(126,167,255);
              final int GREEN=Color.rgb(103,220,157);
              final int RED=Color.rgb(255,116,116);
              final int YELLOW=Color.rgb(255,211,105);

              LinearLayout content;
              LinearLayout nav;
              SharedPreferences prefs;
              final List<MasterStock> masterStocks=new ArrayList<>();
              final Handler liveHandler=new Handler(Looper.getMainLooper());
              boolean liveActive=false;
              int liveCursor=0;
              static final String LIVE_CODES="live_codes";
              static final String SCAN_INDEX="scan_index";
              static final String CUSTOM_SCRIPT="custom_script";

              static final String PREFS="marcus_kis_v03";
              static final String ENV="kis_env";
              static final String REAL="실전투자";
              static final String MOCK="모의투자";

              static final String REAL_KEY="kis_real_key";
              static final String REAL_SECRET="kis_real_secret";
              static final String REAL_TOKEN="kis_real_token";
              static final String REAL_EXPIRES="kis_real_expires";

              static final String MOCK_KEY="kis_mock_key";
              static final String MOCK_SECRET="kis_mock_secret";
              static final String MOCK_TOKEN="kis_mock_token";
              static final String MOCK_EXPIRES="kis_mock_expires";

              static class MasterStock{
                  String code,name,market;
                  MasterStock(String c,String n,String m){
                      code=c; name=n; market=m;
                  }
              }

              void loadMasterStocks(){
                  masterStocks.clear();
                  try{
                      BufferedReader br=new BufferedReader(
                          new InputStreamReader(
                              getAssets().open("stocks.csv"),
                              StandardCharsets.UTF_8
                          )
                      );

                      String line;
                      boolean first=true;

                      while((line=br.readLine())!=null){
                          if(first){
                              first=false;
                              continue;
                          }

                          List<String> parts=parseCsv(line);
                          if(parts.size()<3)continue;

                          String code=parts.get(0).trim();
                          String name=parts.get(1).trim();
                          String market=parts.get(2).trim();

                          if(code.matches("\\d{6}")&&!name.isEmpty()){
                              masterStocks.add(new MasterStock(code,name,market));
                          }
                      }
                      br.close();
                  }catch(Exception e){
                      // Search will fall back to direct 6-digit code if master asset fails.
                  }
              }

              List<String> parseCsv(String line){
                  List<String> out=new ArrayList<>();
                  StringBuilder cur=new StringBuilder();
                  boolean quoted=false;

                  for(int i=0;i<line.length();i++){
                      char ch=line.charAt(i);

                      if(ch=='"'){
                          if(quoted && i+1<line.length() && line.charAt(i+1)=='"'){
                              cur.append('"');
                              i++;
                          }else{
                              quoted=!quoted;
                          }
                      }else if(ch==',' && !quoted){
                          out.add(cur.toString());
                          cur.setLength(0);
                      }else{
                          cur.append(ch);
                      }
                  }

                  out.add(cur.toString());
                  return out;
              }

              int dp(int v){
                  return (int)(v*getResources().getDisplayMetrics().density+0.5f);
              }

              TextView text(String s,int size,int color,boolean bold){
                  TextView t=new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setPadding(0,dp(5),0,dp(5));
                  if(bold)t.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                  return t;
              }

              GradientDrawable bg(int color,int radius){
                  GradientDrawable g=new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radius));
                  return g;
              }

              LinearLayout card(){
                  LinearLayout c=new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(dp(16),dp(14),dp(16),dp(14));
                  c.setBackground(bg(PANEL,16));
                  LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);
                  lp.setMargins(0,0,0,dp(12));
                  c.setLayoutParams(lp);
                  return c;
              }

              EditText input(String hint){
                  EditText e=new EditText(this);
                  e.setHint(hint);
                  e.setHintTextColor(MUTED);
                  e.setTextColor(TEXT);
                  e.setSingleLine(true);
                  e.setPadding(dp(14),dp(11),dp(14),dp(11));
                  e.setBackground(bg(PANEL2,12));
                  e.setInputType(
                      InputType.TYPE_CLASS_TEXT |
                      InputType.TYPE_TEXT_VARIATION_PASSWORD
                  );
                  return e;
              }

              Button button(String s){
                  Button b=new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  return b;
              }

              @Override
              protected void onCreate(Bundle b){
                  super.onCreate(b);

                  prefs=getSharedPreferences(PREFS,MODE_PRIVATE);
                  loadMasterStocks();

                  LinearLayout root=new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);

                  ScrollView scroll=new ScrollView(this);
                  content=new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(dp(18),dp(18),dp(18),dp(24));
                  scroll.addView(content);
                  root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));

                  nav=new LinearLayout(this);
                  nav.setOrientation(LinearLayout.HORIZONTAL);
                  nav.setGravity(Gravity.CENTER);
                  nav.setBackgroundColor(Color.rgb(11,20,36));
                  root.addView(nav,new LinearLayout.LayoutParams(-1,dp(66)));

                  setContentView(root);

                  addNav("홈",v->showHome());
                  addNav("종목",v->showStocks());
                  addNav("AI검색",v->showAI());
                  addNav("실시간",v->showRealtime());
                  addNav("관심",v->showFavorites());
                  addNav("설정",v->showSettings());

                  showHome();
              }

              void addNav(String s,View.OnClickListener l){
                  Button b=new Button(this);
                  b.setText(s);
                  b.setTextSize(12);
                  b.setTextColor(TEXT);
                  b.setAllCaps(false);
                  b.setBackgroundColor(Color.TRANSPARENT);
                  b.setOnClickListener(l);
                  nav.addView(b,new LinearLayout.LayoutParams(0,-1,1));
              }

              void clear(String title,String sub){
                  liveActive=false;
                  content.removeAllViews();
                  content.addView(text(title,26,TEXT,true));
                  if(sub!=null)content.addView(text(sub,13,MUTED,false));
                  Space sp=new Space(this);
                  content.addView(sp,new LinearLayout.LayoutParams(1,dp(10)));
              }

              String activeEnv(){
                  return prefs.getString(ENV,REAL);
              }

              boolean isReal(String env){
                  return REAL.equals(env);
              }

              String baseUrl(String env){
                  return isReal(env)
                      ? "https://openapi.koreainvestment.com:9443"
                      : "https://openapivts.koreainvestment.com:29443";
              }

              String keyName(String env){ return isReal(env)?REAL_KEY:MOCK_KEY; }
              String secretName(String env){ return isReal(env)?REAL_SECRET:MOCK_SECRET; }
              String tokenName(String env){ return isReal(env)?REAL_TOKEN:MOCK_TOKEN; }
              String expiresName(String env){ return isReal(env)?REAL_EXPIRES:MOCK_EXPIRES; }

              boolean credentialsReady(String env){
                  return !prefs.getString(keyName(env),"").isEmpty()
                      && !prefs.getString(secretName(env),"").isEmpty();
              }

              boolean tokenReady(String env){
                  return !prefs.getString(tokenName(env),"").isEmpty();
              }

              void showHome(){
                  clear("Marcus AI SWING","한국투자증권 · 전종목 검색 + Script Scanner + Live4 · v1.2");

                  LinearLayout c=card();
                  c.addView(text("한국투자 API 상태",18,TEXT,true));
                  addStatus(c,REAL);
                  addStatus(c,MOCK);
                  content.addView(c);

                  LinearLayout n=card();
                  n.addView(text("이번 검증 목표",18,TEXT,true));
                  n.addView(text("① App Key / Secret 저장",14,TEXT,false));
                  n.addView(text("② OAuth 접근토큰 발급",14,TEXT,false));
                  n.addView(text("③ 삼성전자(005930) 실제 현재가 조회",14,TEXT,false));
                  n.addView(text("④ AI검색기 → 차트 → 관심종목 흐름 연결",14,BLUE,true));
                  n.addView(text("⑤ 동일 앱 ID/버전 상승 방식으로 업데이트",14,GREEN,true));
                  n.addView(text("⑥ 전종목 로컬 마스터 + 차트 최대 120봉 / ⑦ Script Scanner + 실시간 4종목",14,GREEN,true));
                  content.addView(n);
              }

              void addStatus(LinearLayout c,String env){
                  String state;
                  if(tokenReady(env))state="🟢 연결 완료";
                  else if(credentialsReady(env))state="🟡 키 저장됨 / 인증 전";
                  else state="⚪ 미설정";

                  c.addView(text(
                      env+" · "+state+(env.equals(activeEnv())?" · ⭐ 사용중":""),
                      14,
                      tokenReady(env)?GREEN:(credentialsReady(env)?YELLOW:MUTED),
                      true
                  ));
              }

              void showSettings(){
                  clear("설정","한국투자증권 KIS Developers");

                  content.addView(buildAccountCard(REAL));
                  content.addView(buildAccountCard(MOCK));

                  LinearLayout info=card();
                  info.addView(text("연결 서버",17,TEXT,true));
                  info.addView(text("실전: https://openapi.koreainvestment.com:9443",12,BLUE,false));
                  info.addView(text("모의: https://openapivts.koreainvestment.com:29443",12,BLUE,false));
                  info.addView(text(
                      "한투에서 받은 실전 키와 모의 키를 각각 해당 카드에만 입력하세요.",
                      13,YELLOW,false
                  ));
                  content.addView(info);
              }

              LinearLayout buildAccountCard(String env){
                  LinearLayout c=card();

                  c.addView(text((isReal(env)?"🔴 ":"🔵 ")+env,20,TEXT,true));
                  c.addView(text("서버: "+baseUrl(env),12,BLUE,false));

                  EditText key=input(env+" App Key");
                  EditText secret=input(env+" App Secret");

                  if(!prefs.getString(keyName(env),"").isEmpty()){
                      key.setHint("저장됨 · 새 값 입력 시 교체");
                  }
                  if(!prefs.getString(secretName(env),"").isEmpty()){
                      secret.setHint("저장됨 · 새 값 입력 시 교체");
                  }

                  c.addView(text("App Key",13,MUTED,true));
                  c.addView(key);
                  c.addView(text("App Secret",13,MUTED,true));
                  c.addView(secret);

                  Button save=button(env+" 키 저장");
                  Button test=button(env+" OAuth 연결 테스트");
                  Button use=button(env+"을 데이터 환경으로 사용");
                  Button delete=button(env+" 저장정보 삭제");

                  ProgressBar pb=new ProgressBar(this);
                  pb.setVisibility(View.GONE);
                  TextView status=text("",14,MUTED,true);

                  c.addView(save);
                  c.addView(test);
                  c.addView(use);
                  c.addView(delete);
                  c.addView(pb);
                  c.addView(status);

                  Runnable refresh=()->{
                      String k=prefs.getString(keyName(env),"");
                      String s=prefs.getString(secretName(env),"");

                      StringBuilder sb=new StringBuilder();

                      if(!k.isEmpty()&&!s.isEmpty()){
                          sb.append("🟢 Key/Secret 저장됨\n");
                          sb.append("App Key: ").append(mask(k)).append("\n");
                          sb.append("Secret: ").append(mask(s)).append("\n");
                      }else{
                          sb.append("⚪ Key/Secret 미설정\n");
                      }

                      if(tokenReady(env)){
                          sb.append("🟢 OAuth 토큰 있음\n");
                          sb.append("만료: ").append(prefs.getString(expiresName(env),"-"));
                          status.setTextColor(GREEN);
                      }else{
                          status.setTextColor(credentialsReady(env)?YELLOW:MUTED);
                      }

                      if(env.equals(activeEnv())){
                          sb.append("\n⭐ 현재 데이터 환경");
                      }

                      status.setText(sb.toString());
                  };

                  save.setOnClickListener(v->{
                      String k=key.getText().toString().trim();
                      String s=secret.getText().toString().trim();

                      SharedPreferences.Editor ed=prefs.edit();

                      if(!k.isEmpty())ed.putString(keyName(env),k);
                      if(!s.isEmpty())ed.putString(secretName(env),s);

                      if(!k.isEmpty()||!s.isEmpty()){
                          ed.remove(tokenName(env));
                          ed.remove(expiresName(env));
                      }

                      ed.apply();

                      key.setText("");
                      secret.setText("");

                      Toast.makeText(this,env+" 키 저장 완료",Toast.LENGTH_SHORT).show();
                      refresh.run();
                  });

                  test.setOnClickListener(v->{
                      String k=prefs.getString(keyName(env),"");
                      String s=prefs.getString(secretName(env),"");

                      if(k.isEmpty()||s.isEmpty()){
                          status.setText("🔴 App Key / Secret을 먼저 저장하세요.");
                          status.setTextColor(RED);
                          return;
                      }

                      pb.setVisibility(View.VISIBLE);
                      test.setEnabled(false);
                      status.setText(env+" OAuth 토큰 요청 중...");
                      status.setTextColor(BLUE);

                      new Thread(()->{
                          try{
                              JSONObject r=requestToken(env,k,s);

                              String token=r.optString("access_token","");
                              String expires=r.optString("access_token_token_expired","");

                              if(!token.isEmpty()){
                                  prefs.edit()
                                      .putString(tokenName(env),token)
                                      .putString(expiresName(env),expires)
                                      .putString(ENV,env)
                                      .apply();

                                  runOnUiThread(()->{
                                      pb.setVisibility(View.GONE);
                                      test.setEnabled(true);
                                      status.setText(
                                          "🟢 "+env+" OAuth 연결 성공\n"+
                                          "접근토큰 발급 완료\n"+
                                          "만료: "+expires+
                                          "\n⭐ 현재 데이터 환경으로 자동 선택됨"
                                      );
                                      status.setTextColor(GREEN);
                                  });

                              }else{
                                  String msg=r.optString(
                                      "error_description",
                                      r.optString("msg1",r.toString())
                                  );

                                  runOnUiThread(()->{
                                      pb.setVisibility(View.GONE);
                                      test.setEnabled(true);
                                      status.setText("🔴 "+env+" 인증 실패\n"+msg);
                                      status.setTextColor(RED);
                                  });
                              }

                          }catch(Exception e){
                              runOnUiThread(()->{
                                  pb.setVisibility(View.GONE);
                                  test.setEnabled(true);
                                  status.setText("🔴 "+env+" 연결 실패\n"+safeError(e));
                                  status.setTextColor(RED);
                              });
                          }
                      }).start();
                  });

                  use.setOnClickListener(v->{
                      if(!tokenReady(env)){
                          Toast.makeText(
                              this,
                              env+" OAuth 연결 테스트를 먼저 성공시켜주세요.",
                              Toast.LENGTH_SHORT
                          ).show();
                          return;
                      }

                      prefs.edit().putString(ENV,env).apply();
                      Toast.makeText(this,env+"을 데이터 환경으로 선택했습니다.",Toast.LENGTH_SHORT).show();
                      refresh.run();
                  });

                  delete.setOnClickListener(v->{
                      prefs.edit()
                          .remove(keyName(env))
                          .remove(secretName(env))
                          .remove(tokenName(env))
                          .remove(expiresName(env))
                          .apply();

                      key.setText("");
                      secret.setText("");

                      Toast.makeText(this,env+" 저장정보 삭제 완료",Toast.LENGTH_SHORT).show();
                      refresh.run();
                  });

                  refresh.run();
                  return c;
              }

              JSONObject requestToken(String env,String appKey,String appSecret)throws Exception{
                  JSONObject body=new JSONObject();
                  body.put("grant_type","client_credentials");
                  body.put("appkey",appKey);
                  body.put("appsecret",appSecret);

                  HttpResult result=postJson(
                      baseUrl(env)+"/oauth2/tokenP",
                      body.toString()
                  );

                  if(result.body==null||result.body.trim().isEmpty()){
                      throw new Exception("토큰 응답이 비어 있습니다. HTTP "+result.code);
                  }

                  return new JSONObject(result.body);
              }

              void showStocks(){
                  clear("종목","KOSPI/KOSDAQ 로컬 마스터 검색 · 실제 현재가 · 일봉차트");

                  String env=activeEnv();

                  LinearLayout top=card();
                  top.addView(text("현재 환경: "+env,17,BLUE,true));
                  top.addView(text("로컬 종목 마스터: "+masterStocks.size()+"개 · 검색 자체는 API 호출 없음",12,GREEN,true));

                  EditText query=new EditText(this);
                  query.setHint("예: 삼성전자 / 삼성 / 005930");
                  query.setSingleLine(true);
                  query.setTextColor(TEXT);
                  query.setHintTextColor(MUTED);
                  query.setBackground(bg(PANEL2,12));
                  query.setPadding(dp(14),dp(11),dp(14),dp(11));

                  Button searchBtn=button("종목 검색");
                  ProgressBar pb=new ProgressBar(this);
                  pb.setVisibility(View.GONE);
