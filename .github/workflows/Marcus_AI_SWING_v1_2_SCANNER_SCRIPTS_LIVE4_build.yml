                  c.addView(text(rules.replace("\n"," · "),12,BLUE,false));

                  Button run=button("이 검색기 실행");
                  c.addView(run);
                  run.setOnClickListener(v->showScannerRun(name,rules));

                  content.addView(c);
              }

              void showScannerRun(String scanner,String rules){
                  clear(scanner,"실제 Scanner Queue · 20종목 단위 검사");

                  String env=activeEnv();

                  LinearLayout c=card();
                  c.addView(text("현재 검사 규칙",17,TEXT,true));
                  c.addView(text(rules,13,BLUE,false));
                  c.addView(text(
                      "현재 환경: "+env+
                      " · 시작 위치: "+prefs.getInt(SCAN_INDEX,0)+
                      " / "+masterStocks.size(),
                      13,MUTED,false
                  ));

                  ProgressBar progress=new ProgressBar(
                      this,null,android.R.attr.progressBarStyleHorizontal
                  );
                  progress.setMax(20);
                  progress.setProgress(0);
                  c.addView(progress);

                  TextView state=text("검사 대기",14,MUTED,true);
                  LinearLayout results=new LinearLayout(this);
                  results.setOrientation(LinearLayout.VERTICAL);

                  Button run=button("다음 20종목 검사");
                  Button reset=button("처음부터 다시 검사");

                  c.addView(run);
                  c.addView(reset);
                  c.addView(state);
                  content.addView(c);

                  LinearLayout rc=card();
                  rc.addView(text("이번 배치 포착 종목",18,TEXT,true));
                  rc.addView(results);
                  content.addView(rc);

                  reset.setOnClickListener(v->{
                      prefs.edit().putInt(SCAN_INDEX,0).apply();
                      state.setText("검사 위치를 0으로 초기화했습니다.");
                  });

                  run.setOnClickListener(v->{
                      if(!tokenReady(env)){
                          state.setText("🔴 설정에서 OAuth 연결부터 확인해주세요.");
                          state.setTextColor(RED);
                          return;
                      }

                      int start=prefs.getInt(SCAN_INDEX,0);

                      if(start>=masterStocks.size()){
                          state.setText("✅ 전종목 1회 검사가 완료되었습니다. 처음부터 다시 검사를 누르세요.");
                          state.setTextColor(GREEN);
                          return;
                      }

                      int end=Math.min(start+20,masterStocks.size());

                      run.setEnabled(false);
                      results.removeAllViews();
                      progress.setProgress(0);
                      state.setText(
                          "검사 중... "+start+" ~ "+(end-1)+
                          " / "+masterStocks.size()
                      );
                      state.setTextColor(BLUE);

                      new Thread(()->{
                          int passed=0;

                          for(int i=start;i<end;i++){
                              MasterStock m=masterStocks.get(i);

                              try{
                                  List<Candle> candles=requestDailyChart(env,m.code);
                                  AISignal sig=analyze(candles);

                                  boolean ok=matchesScript(rules,candles,sig);

                                  if(ok){
                                      passed++;
                                      final String label=
                                          m.name+" ("+m.code+") · "+
                                          sig.score+"점 · "+sig.label;

                                      runOnUiThread(()->{
                                          Button b=button(label);
                                          b.setOnClickListener(v->openStockFromScanner(m.code));
                                          results.addView(b);
                                      });
                                  }

                              }catch(Exception ignored){
                                  // Skip a failed symbol and continue the queue.
                              }

                              final int done=i-start+1;
                              runOnUiThread(()->progress.setProgress(done));

                              try{
                                  Thread.sleep(900);
                              }catch(Exception ignored){}
                          }

                          final int next=end;
                          final int hit=passed;

                          prefs.edit().putInt(SCAN_INDEX,next).apply();

                          runOnUiThread(()->{
                              run.setEnabled(true);
                              state.setText(
                                  "✅ 배치 완료 · "+(end-start)+"종목 검사 / "+
                                  hit+"종목 포착\n"+
                                  "다음 시작 위치: "+next
                              );
                              state.setTextColor(GREEN);
                          });
                      }).start();
                  });
              }

              boolean matchesScript(String rules,List<Candle> candles,AISignal sig){
                  Map<String,String> cfg=new HashMap<>();

                  for(String line:rules.split("\\n")){
                      String s=line.trim();
                      if(s.isEmpty()||s.startsWith("#")||!s.contains("="))continue;

                      String[] p=s.split("=",2);
                      cfg.put(
                          p[0].trim().toUpperCase(Locale.US),
                          p[1].trim().toLowerCase(Locale.US)
                      );
                  }

                  Candle last=candles.get(candles.size()-1);

                  if(cfg.containsKey("SCORE_MIN") &&
                      sig.score<num(cfg.get("SCORE_MIN")))return false;

                  if(boolRequired(cfg,"BOS") && !sig.bos)return false;
                  if(boolRequired(cfg,"DISCOUNT") && !sig.discount)return false;
                  if(boolRequired(cfg,"EXPLOSION") && !sig.explosion)return false;

                  if(boolRequired(cfg,"MA5_GT_MA20") && !(sig.ma5>sig.ma20))return false;
                  if(boolRequired(cfg,"PRICE_ABOVE_MA5") && !(last.close>sig.ma5))return false;

                  if(cfg.containsKey("RSI_MIN") &&
                      sig.rsi<num(cfg.get("RSI_MIN")))return false;

                  if(cfg.containsKey("RSI_MAX") &&
                      sig.rsi>num(cfg.get("RSI_MAX")))return false;

                  return true;
              }

              boolean boolRequired(Map<String,String> cfg,String key){
                  return cfg.containsKey(key) &&
                      ("true".equals(cfg.get(key)) ||
                       "1".equals(cfg.get(key)) ||
                       "yes".equals(cfg.get(key)));
              }

              void openStockFromScanner(String code){
                  showStocks();
                  Toast.makeText(
                      this,
                      "종목코드 "+code+"를 종목 검색창에 입력해 차트를 확인해주세요.",
                      Toast.LENGTH_LONG
                  ).show();
              }

              void addLiveCode(String code){
                  List<String> codes=getLiveCodes();

                  if(codes.contains(code))return;

                  if(codes.size()>=4){
                      codes.remove(0);
                  }

                  codes.add(code);
                  saveLiveCodes(codes);
              }

              List<String> getLiveCodes(){
                  List<String> out=new ArrayList<>();
                  String raw=prefs.getString(LIVE_CODES,"");

                  if(raw.trim().isEmpty())return out;

                  for(String s:raw.split(",")){
                      String c=s.trim();
                      if(c.matches("\\d{6}"))out.add(c);
                  }

                  return out;
              }

              void saveLiveCodes(List<String> codes){
                  StringBuilder sb=new StringBuilder();

                  for(String c:codes){
                      if(sb.length()>0)sb.append(",");
                      sb.append(c);
                  }

                  prefs.edit().putString(LIVE_CODES,sb.toString()).apply();
              }

              String masterName(String code){
                  for(MasterStock m:masterStocks){
                      if(m.code.equals(code))return m.name;
                  }
                  return code;
              }

              void showRealtime(){
                  clear("실시간 4종목","선택한 최대 4종목을 순환 조회합니다.");

                  List<String> codes=getLiveCodes();

