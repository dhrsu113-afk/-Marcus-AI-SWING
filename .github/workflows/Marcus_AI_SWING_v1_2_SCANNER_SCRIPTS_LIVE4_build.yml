                      LinearLayout empty=card();
                      empty.addView(text(
                          "종목 화면에서 '이 종목을 실시간 4종목에 추가'를 눌러주세요.",
                          14,YELLOW,false
                      ));
                      content.addView(empty);
                      return;
                  }

                  final List<TextView> statusViews=new ArrayList<>();

                  for(String code:codes){
