                      "한국투자 공식 실시간 WebSocket은 다음 단계에서 연결할 수 있습니다.",
                      13,MUTED,false
                  ));

                  Button clearBtn=button("실시간 목록 전체 삭제");
                  clearBtn.setOnClickListener(v->{
                      saveLiveCodes(new ArrayList<>());
                      showRealtime();
                  });
                  info.addView(clearBtn);
