                      c.setReadTimeout(20000);

                      c.setRequestProperty(
                          "authorization",
                          "Bearer "+prefs.getString(tokenName(env),"")
                      );
                      c.setRequestProperty(
                          "appkey",
                          prefs.getString(keyName(env),"")
                      );
                      c.setRequestProperty(
                          "appsecret",
                          prefs.getString(secretName(env),"")
                      );
                      c.setRequestProperty(
                          "tr_id",
                          "FHKST01010100"
                      );
                      c.setRequestProperty(
                          "Content-Type",
                          "application/json; charset=utf-8"
                      );

                      int http=c.getResponseCode();

                      InputStream is=
                          (http>=200&&http<400)
                          ? c.getInputStream()
