name: Marcus AI SWING v2.7.6 Target UI Mascot
# IMPORTANT:
# Android preserves Key/Secret and other app data across updates only when
# applicationId AND APK signing certificate remain the same.
# GitHub-hosted runners may create a fresh debug.keystore, so permanent
# update installs require a stable signing key in the next signing setup step.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/marcus/aiswing
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js -o app/src/main/assets/lightweight-charts.js

          python3 - <<'PY'
          import csv, io, os, urllib.request, zipfile

          sources = [
              ("KOSPI", "https://new.real.download.dws.co.kr/common/master/kospi_code.mst.zip", "kospi_code.mst", 228),
              ("KOSDAQ", "https://new.real.download.dws.co.kr/common/master/kosdaq_code.mst.zip", "kosdaq_code.mst", 222),
          ]

          rows = []
          seen = set()

          for market, url, mst_name, tail_len in sources:
              print("download", market, url)
              data = urllib.request.urlopen(url, timeout=30).read()

              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  raw = z.read(mst_name)

              text = raw.decode("cp949", errors="ignore")

              for line in text.splitlines():
                  if len(line) <= tail_len:
                      continue

                  head = line[:-tail_len]
                  short_code = head[0:9].strip()
                  std_code = head[9:21].strip()
                  name = head[21:].strip()

                  # KIS master short code is normally 6 digits; normalize safely.
                  digits = "".join(ch for ch in short_code if ch.isdigit())
                  code = digits[-6:] if len(digits) >= 6 else short_code[-6:]

                  if len(code) != 6 or not code.isdigit() or not name:
                      continue

                  key = (code, market)
                  if key in seen:
                      continue
                  seen.add(key)
                  rows.append((code, name, market, std_code))

          rows.sort(key=lambda x: (x[1], x[0]))

          out = "app/src/main/assets/stocks.csv"
          with open(out, "w", encoding="utf-8", newline="") as f:
              w = csv.writer(f)
              w.writerow(["code","name","market","std_code"])
              w.writerows(rows)

          print("master rows:", len(rows))
          PY

          cat > app/src/main/assets/chart.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
            <style>
              html,body{margin:0;padding:0;background:#0c1830;color:#f4f7ff;font-family:Arial,sans-serif;height:100%;overflow:hidden}
              #wrap{height:100%;display:flex;flex-direction:column}
              #toolbar{display:flex;gap:5px;padding:6px;align-items:center;font-size:11px;color:#9aabc7;flex-wrap:wrap}
              #toolbar button{background:#20385f;color:#f5f7ff;border:1px solid #46679e;border-radius:7px;padding:5px 8px}
              #toolbar button.active{background:linear-gradient(90deg,#426ff4,#8b5cf6)}
              #status{margin-left:auto}
              #chart{flex:1;min-height:280px}
              #tip{position:absolute;left:8px;top:72px;z-index:10;background:rgba(8,16,30,.90);padding:7px 9px;border-radius:8px;font-size:11px;pointer-events:none;max-width:92%}
            </style>
          </head>
          <body>
          <div id="wrap">
            <div id="toolbar">
              <button id="trend">추세선</button>
              <button id="horizontal">수평선</button>
              <button id="lineColor">선색상</button>
              <button id="clear">그리기 삭제</button>
              <span>핀치확대 · 좌우이동 · 십자선</span>
              <span id="status">차트 준비중...</span>
            </div>
            <div id="chart" style="position:relative">
              <svg id="drawOverlay" style="position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none"></svg>
            </div>
          </div>
          <div id="tip">봉을 터치하면 시가/고가/저가/종가/거래량을 확인할 수 있습니다.</div>
          <script src="lightweight-charts.js"></script>
          <script>
            window.addEventListener('error',e=>{
              const s=document.getElementById('status');
              if(s)s.textContent='차트 오류: '+(e.message||'unknown');
            });
            const container=document.getElementById('chart');
            const tip=document.getElementById('tip');
            const status=document.getElementById('status');

            const chart=LightweightCharts.createChart(container,{
              layout:{background:{type:'solid',color:'#0c1830'},textColor:'#dce6fa'},
              grid:{vertLines:{color:'#1e3154'},horzLines:{color:'#1e3154'}},
              rightPriceScale:{borderColor:'#2a3956'},
              timeScale:{borderColor:'#2a3956',timeVisible:true,secondsVisible:false},
              crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
              handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false},
              handleScale:{axisPressedMouseMove:true,mouseWheel:true,pinch:true}
            });

            const candleSeries=chart.addSeries(LightweightCharts.CandlestickSeries,{
              upColor:'#ef5350',downColor:'#3b82f6',
              borderUpColor:'#ef5350',borderDownColor:'#3b82f6',
              wickUpColor:'#ef5350',wickDownColor:'#3b82f6'
            });
            const ma5=chart.addSeries(LightweightCharts.LineSeries,{lineWidth:2,color:'#ffd54f'});
            const ma10=chart.addSeries(LightweightCharts.LineSeries,{lineWidth:2,color:'#4dd0e1'});
            const ma15=chart.addSeries(LightweightCharts.LineSeries,{lineWidth:2,color:'#b388ff'});
            const ma20=chart.addSeries(LightweightCharts.LineSeries,{lineWidth:2,color:'#69f0ae'});
            const volumeSeries=chart.addSeries(LightweightCharts.HistogramSeries,{
              priceScaleId:'',
              priceFormat:{type:'volume'}
            });
            volumeSeries.priceScale().applyOptions({
              scaleMargins:{top:0.78,bottom:0}
            });
            candleSeries.priceScale().applyOptions({
              scaleMargins:{top:0.05,bottom:0.23}
            });
            const markerApi=(typeof LightweightCharts.createSeriesMarkers==='function')
              ? LightweightCharts.createSeriesMarkers(candleSeries,[])
              : null;

            let byTime={};
            let drawMode=null;
            let firstPoint=null;
            let lineDrawings=[];
            let priceDrawings=[];
            const drawColors=['#ffd54f','#4dd0e1','#b388ff','#ff718f','#69f0ae','#ffffff'];
            let drawColorIndex=0;
            let drawColor=drawColors[0];

            const trendBtn=document.getElementById('trend');
            const horizontalBtn=document.getElementById('horizontal');

            function setMode(mode){
              drawMode=mode;
              firstPoint=null;
              trendBtn.classList.toggle('active',mode==='trend');
              horizontalBtn.classList.toggle('active',mode==='horizontal');
              tip.textContent=mode==='trend'
                ? '추세선: 시작점과 끝점을 차례로 터치하세요.'
                : mode==='horizontal'
                ? '수평선: 원하는 가격 위치를 터치하세요.'
                : '봉을 터치하면 시가/고가/저가/종가/거래량을 확인할 수 있습니다.';
            }

            trendBtn.addEventListener('click',()=>setMode(drawMode==='trend'?null:'trend'));
            document.getElementById('lineColor').addEventListener('click',()=>{
              drawColorIndex=(drawColorIndex+1)%drawColors.length;
              drawColor=drawColors[drawColorIndex];
              document.getElementById('lineColor').style.borderColor=drawColor;
              tip.textContent='그리기 색상 변경됨';
            });
            horizontalBtn.addEventListener('click',()=>setMode(drawMode==='horizontal'?null:'horizontal'));
            document.getElementById('clear').addEventListener('click',()=>{
              lineDrawings=[];
              document.getElementById('drawOverlay').innerHTML='';
              priceDrawings.forEach(p=>candleSeries.removePriceLine(p));
              priceDrawings=[];
              setMode(null);
            });

            window.setStockData=function(payload){
              const d=payload.candles||[];
              byTime={};
              d.forEach(x=>byTime[String(x.time)]=x);
              candleSeries.setData(d);
              ma5.setData(payload.ma5||[]);
              ma10.setData(payload.ma10||[]);
              ma15.setData(payload.ma15||[]);
              ma20.setData(payload.ma20||[]);
              volumeSeries.setData(payload.volume||[]);
              const cfg=payload.config||{};
              ma5.applyOptions({visible:cfg.showMA5!==false});
              ma10.applyOptions({visible:cfg.showMA10!==false});
              ma15.applyOptions({visible:cfg.showMA15!==false});
              ma20.applyOptions({visible:cfg.showMA20!==false});
              volumeSeries.applyOptions({visible:cfg.showVolume!==false});

              const markers=[];
              const last=d.length?d[d.length-1]:null;
              if(last && payload.signal){
                if(cfg.showBOS && payload.signal.bos){
                  markers.push({time:last.time,position:'belowBar',shape:'arrowUp',color:'#52e0aa',text:'BOS'});
                }
                if(cfg.showDiscount && payload.signal.discount){
                  markers.push({time:last.time,position:'belowBar',shape:'circle',color:'#ffd45c',text:'Discount'});
                }
                if(cfg.showExplosion && payload.signal.explosion){
                  markers.push({time:last.time,position:'aboveBar',shape:'arrowDown',color:'#ff718f',text:'Explosion'});
                }
              }
              if(markerApi){ markerApi.setMarkers(markers); }

              chart.timeScale().fitContent();
              let tags=[];
              if(cfg.showBOS && payload.signal && payload.signal.bos) tags.push('BOS');
              if(cfg.showDiscount && payload.signal && payload.signal.discount) tags.push('Discount');
              if(cfg.showExplosion && payload.signal && payload.signal.explosion) tags.push('Explosion');
              if(cfg.showRSI && payload.signal && payload.signal.rsi!==undefined) tags.push('RSI '+Number(payload.signal.rsi).toFixed(1));
              status.textContent=(payload.period||'')+' '+(payload.name||'')+' '+(payload.code||'')+(tags.length?' · '+tags.join(' · '):'');
            };

            chart.subscribeCrosshairMove(param=>{
              if(!param || param.time===undefined || param.time===null)return;
              const d=byTime[String(param.time)];
              if(!d)return;
              tip.textContent=
                (d.label||d.time)+'  시 '+Number(d.open).toLocaleString()+'원  고 '+Number(d.high).toLocaleString()+
                '원  저 '+Number(d.low).toLocaleString()+'원  종 '+Number(d.close).toLocaleString()+
                '원  거래량 '+Number(d.volume||0).toLocaleString()+'주';
            });

            chart.subscribeClick(param=>{
              if(!drawMode || !param || !param.point || param.time===undefined || param.time===null)return;
              const price=candleSeries.coordinateToPrice(param.point.y);
              if(price===null || price===undefined)return;

              if(drawMode==='horizontal'){
                const pl=candleSeries.createPriceLine({
                  price:price,lineWidth:2,lineStyle:0,color:drawColor,axisLabelVisible:true,title:'수평'
                });
                priceDrawings.push(pl);
                setMode(null);
                return;
              }

              const pt={time:param.time,value:price};
              if(!firstPoint){
                firstPoint=pt;
                tip.textContent='추세선: 끝점을 터치하세요.';
                return;
              }

              const points=[firstPoint,pt].sort((a,b)=>{
                if(typeof a.time==='number' && typeof b.time==='number')return a.time-b.time;
                return String(a.time).localeCompare(String(b.time));
              });

              lineDrawings.push({a:points[0],b:points[1],color:drawColor});
              renderDrawings();
              setMode(null);
            });


            const overlay=document.getElementById('drawOverlay');
            let dragState=null;

            function timeX(tm){ return chart.timeScale().timeToCoordinate(tm); }
            function priceY(v){ return candleSeries.priceToCoordinate(v); }

            function renderDrawings(){
              overlay.innerHTML='';
              lineDrawings.forEach((d,idx)=>{
                const x1=timeX(d.a.time), y1=priceY(d.a.value);
                const x2=timeX(d.b.time), y2=priceY(d.b.value);
                if(x1==null||x2==null||y1==null||y2==null)return;

                const line=document.createElementNS('http://www.w3.org/2000/svg','line');
                line.setAttribute('x1',x1); line.setAttribute('y1',y1);
                line.setAttribute('x2',x2); line.setAttribute('y2',y2);
                line.setAttribute('stroke',d.color); line.setAttribute('stroke-width','3');
                line.style.pointerEvents='stroke';
                line.style.cursor='move';
                line.addEventListener('pointerdown',e=>{
                  e.preventDefault(); dragState={idx:idx,part:'line',sx:e.clientX,sy:e.clientY,
                    a:{...d.a},b:{...d.b}};
                  overlay.setPointerCapture?.(e.pointerId);
                });
                overlay.appendChild(line);

                [['a',x1,y1],['b',x2,y2]].forEach(h=>{
                  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
                  c.setAttribute('cx',h[1]); c.setAttribute('cy',h[2]); c.setAttribute('r','7');
                  c.setAttribute('fill',d.color); c.setAttribute('stroke','#ffffff'); c.setAttribute('stroke-width','2');
                  c.style.pointerEvents='all'; c.style.cursor='grab';
                  c.addEventListener('pointerdown',e=>{
                    e.preventDefault(); e.stopPropagation();
                    dragState={idx:idx,part:h[0]};
                    overlay.setPointerCapture?.(e.pointerId);
                  });
                  overlay.appendChild(c);
                });
              });
            }

            function pointerToPoint(e){
              const r=container.getBoundingClientRect();
              const x=e.clientX-r.left, y=e.clientY-r.top;
              const tm=chart.timeScale().coordinateToTime(x);
              const pr=candleSeries.coordinateToPrice(y);
              if(tm==null||pr==null)return null;
              return {time:tm,value:pr};
            }

            overlay.style.pointerEvents='auto';
            overlay.addEventListener('pointermove',e=>{
              if(!dragState)return;
              const d=lineDrawings[dragState.idx];
              if(!d)return;

              if(dragState.part==='a'||dragState.part==='b'){
                const p=pointerToPoint(e);
                if(p)d[dragState.part]=p;
              }else{
                const r=container.getBoundingClientRect();
                const dx=e.clientX-dragState.sx, dy=e.clientY-dragState.sy;
                const ax=timeX(dragState.a.time), ay=priceY(dragState.a.value);
                const bx=timeX(dragState.b.time), by=priceY(dragState.b.value);
                const naT=chart.timeScale().coordinateToTime(ax+dx);
                const nbT=chart.timeScale().coordinateToTime(bx+dx);
                const naP=candleSeries.coordinateToPrice(ay+dy);
                const nbP=candleSeries.coordinateToPrice(by+dy);
                if(naT!=null&&nbT!=null&&naP!=null&&nbP!=null){
                  d.a={time:naT,value:naP}; d.b={time:nbT,value:nbP};
                }
              }
              renderDrawings();
            });
            overlay.addEventListener('pointerup',e=>{ dragState=null; });
            overlay.addEventListener('pointercancel',e=>{ dragState=null; });
            chart.timeScale().subscribeVisibleTimeRangeChange(()=>renderDrawings());

            new ResizeObserver(()=>{
              chart.applyOptions({width:container.clientWidth,height:container.clientHeight});
            }).observe(container);
          </script>
          </body>
          </html>
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MarcusAISwing"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.marcus.aiswing'
              compileSdk 34

              defaultConfig {
                  applicationId "com.marcus.aiswing"
                  minSdk 26
                  targetSdk 34
                  versionCode 35
                  versionName "2.7.6"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="Marcus AI SWING"
                  android:icon="@drawable/ai_swing_icon"
                  android:roundIcon="@drawable/ai_swing_icon"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#07101F</item>
                  <item name="android:navigationBarColor">#07101F</item>
                  <item name="android:colorAccent">#7EA7FF</item>
              </style>
          </resources>
          EOF


          mkdir -p app/src/main/res/drawable
          echo '' | base64 -d > app/src/main/res/drawable/ai_swing_icon.png
          echo '' | base64 -d > app/src/main/res/drawable/ai_swing_mascot.png

          cat > app/src/main/java/com/marcus/aiswing/MainActivity.java <<'JAVA'
          package com.marcus.aiswing;

          import android.app.Activity;
          import android.app.Dialog;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.OpenableColumns;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.ColorDrawable;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.view.MotionEvent;
          import android.view.ScaleGestureDetector;
          import android.widget.*;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.LinkedHashMap;
          import java.util.Calendar;
          import java.util.WeakHashMap;
          import java.io.InputStreamReader;

          public class MainActivity extends Activity {

              final int BG=Color.rgb(9,18,36);
              final int PANEL=Color.rgb(22,35,64);
              final int PANEL2=Color.rgb(31,50,86);
              final int TEXT=Color.rgb(239,244,255);
              final int MUTED=Color.rgb(172,187,216);
              final int BLUE=Color.rgb(112,168,255);
              final int GREEN=Color.rgb(83,226,168);
              final int RED=Color.rgb(255,105,127);
              final int YELLOW=Color.rgb(255,213,92);
              final int PURPLE=Color.rgb(154,112,255);
              final int CYAN=Color.rgb(67,218,235);
              final int ORANGE=Color.rgb(255,164,86);

              LinearLayout content;
              LinearLayout nav;
              SharedPreferences prefs;
              final List<MasterStock> masterStocks=new ArrayList<>();
              final Handler liveHandler=new Handler(Looper.getMainLooper());
              boolean liveActive=false;
              volatile boolean scanCancelRequested=false;
              int liveCursor=0;
              static final String LIVE_CODES="live_codes";
              static final String SCAN_INDEX="scan_index";
              static final String CUSTOM_SCRIPT="custom_script";
              static final String LAST_STOCK_CODE="last_stock_code";
              static final String LAST_STOCK_NAME="last_stock_name";
              static final String LAST_PERIOD="last_period";
              static final String FAVORITES="favorite_codes";
              static final String CHART_SCRIPT_FILE_NAME="chart_script_file_name";
              static final int REQ_CHART_SCRIPT=5205;
              static final String SCAN_HITS="scan_hits";
              static final String SCAN_LAST_NAME="scan_last_name";
              static final String SCAN_LAST_CODE="scan_last_code";
              long lastApiCallAt=0L;
              final Object apiRateLock=new Object();
              final Map<WebView,Boolean> chartReady=
                  Collections.synchronizedMap(new WeakHashMap<>());
              final Map<WebView,String> pendingChartJs=
                  Collections.synchronizedMap(new WeakHashMap<>());
              final Handler orderBookHandler=new Handler(Looper.getMainLooper());
              boolean orderBookActive=false;
              final Handler stockLiveHandler=new Handler(Looper.getMainLooper());
              boolean stockLiveActive=false;
              String screenMode="HOME";

              static final String PREFS="marcus_kis_v03";
              static final String ENV="kis_env";
              static final String REAL="실전투자";
              static final String MOCK="모의투자";

              static final String REAL_KEY="kis_real_key";
              static final String REAL_SECRET="kis_real_secret";
              static final String REAL_TOKEN="kis_real_token";
              static final String REAL_EXPIRES="kis_real_expires";

              static final String MOCK_KEY="kis_mock_key";
              static final String MOCK_SECRET="kis_mock_secret";
              static final String MOCK_TOKEN="kis_mock_token";
              static final String MOCK_EXPIRES="kis_mock_expires";


              static class RealtimeStockChartView extends View{
                  final Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);
                  final Paint grid=new Paint(Paint.ANTI_ALIAS_FLAG);
                  final Paint textPaint=new Paint(Paint.ANTI_ALIAS_FLAG);
                  final Paint maPaint=new Paint(Paint.ANTI_ALIAS_FLAG);
                  final List<Candle> data=new ArrayList<>();
                  final ScaleGestureDetector scaler;
                  float candleW=8f;
                  float panX=0f;
                  float lastX=0f;
                  boolean dragging=false;
                  int upColor=Color.rgb(239,83,80);
                  int downColor=Color.rgb(59,130,246);
                  int gridColor=Color.rgb(28,48,82);
                  int textColor=Color.rgb(208,220,244);
                  String title="";
                  String period="";
                  int flashFrames=0;

                  RealtimeStockChartView(Context c){
                      super(c);
                      setBackgroundColor(Color.rgb(8,20,38));
                      grid.setColor(gridColor);
                      grid.setStrokeWidth(1f);
                      textPaint.setColor(textColor);
                      textPaint.setTextSize(11f*getResources().getDisplayMetrics().scaledDensity);
                      maPaint.setStrokeWidth(1.7f*getResources().getDisplayMetrics().density);
                      maPaint.setStyle(Paint.Style.STROKE);
                      scaler=new ScaleGestureDetector(c,new ScaleGestureDetector.SimpleOnScaleGestureListener(){
                          @Override public boolean onScale(ScaleGestureDetector d){
                              candleW*=d.getScaleFactor();
                              candleW=Math.max(3.5f,Math.min(28f,candleW));
                              invalidate();
                              return true;
                          }
                      });
                  }

                  void setSeries(List<Candle> candles,String n,String per){
                      data.clear();
                      if(candles!=null)data.addAll(candles);
                      title=n;
                      period=per;
                      panX=0f;
                      flashFrames=5;
                      invalidate();
                  }

                  void pulse(){
                      flashFrames=5;
                      invalidate();
                  }

                  @Override public boolean onTouchEvent(MotionEvent e){
                      if(getParent()!=null){
                          boolean lock=e.getActionMasked()!=MotionEvent.ACTION_UP &&
                                       e.getActionMasked()!=MotionEvent.ACTION_CANCEL;
                          getParent().requestDisallowInterceptTouchEvent(lock);
                      }

                      scaler.onTouchEvent(e);

                      switch(e.getActionMasked()){
                          case MotionEvent.ACTION_DOWN:
                              lastX=e.getX();
                              dragging=true;
                              return true;

                          case MotionEvent.ACTION_MOVE:
                              if(!scaler.isInProgress()){
                                  float dx=e.getX()-lastX;
                                  panX+=dx;
                                  lastX=e.getX();
                                  invalidate();
                              }
                              return true;

                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              dragging=false;
                              if(getParent()!=null){
                                  getParent().requestDisallowInterceptTouchEvent(false);
                              }
                              return true;
                      }
                      return true;
                  }

                  double sma(int idx,int len){
                      if(idx<len-1)return Double.NaN;
                      double sum=0;
                      for(int j=idx-len+1;j<=idx;j++)sum+=data.get(j).close;
                      return sum/len;
                  }

                  double rsi(int idx,int len){
                      if(idx<len)return 50;
                      double gain=0,loss=0;
                      for(int i=idx-len+1;i<=idx;i++){
                          double d=data.get(i).close-data.get(i-1).close;
                          if(d>=0)gain+=d; else loss-=d;
                      }
                      if(loss==0)return 100;
                      double rs=(gain/len)/(loss/len);
                      return 100-(100/(1+rs));
                  }

                  float yPrice(double v,double min,double max,float top,float bottom){
                      if(max<=min)return (top+bottom)/2f;
                      return (float)(bottom-((v-min)/(max-min))*(bottom-top));
                  }

                  @Override protected void onDraw(Canvas c){
                      super.onDraw(c);
                      if(getWidth()<=0||getHeight()<=0)return;

                      final float den=getResources().getDisplayMetrics().density;
                      float left=8*den, right=getWidth()-56*den;
                      float top=22*den;
                      float priceBottom=getHeight()*0.66f;
                      float volTop=priceBottom+8*den;
                      float volBottom=getHeight()*0.79f;
                      float rsiTop=volBottom+10*den;
                      float rsiBottom=getHeight()-20*den;

                      p.setStyle(Paint.Style.FILL);
                      p.setColor(Color.rgb(8,20,38));
                      c.drawRect(0,0,getWidth(),getHeight(),p);

                      // Grid
                      for(int i=0;i<=5;i++){
                          float y=top+(priceBottom-top)*i/5f;
                          c.drawLine(left,y,right,y,grid);
                      }
                      for(int i=0;i<=6;i++){
                          float x=left+(right-left)*i/6f;
                          c.drawLine(x,top,x,rsiBottom,grid);
                      }

                      textPaint.setTextSize(11*getResources().getDisplayMetrics().scaledDensity);
                      textPaint.setColor(Color.rgb(221,230,247));
                      c.drawText(title+"  ·  "+period,left,16*den,textPaint);

                      if(data.isEmpty()){
                          textPaint.setTextSize(15*getResources().getDisplayMetrics().scaledDensity);
                          textPaint.setColor(Color.rgb(150,170,205));
                          c.drawText("차트 데이터를 불러오는 중...",left,70*den,textPaint);
                          return;
                      }

                      int visible=Math.max(12,(int)((right-left)/candleW));
                      int shift=(int)(panX/candleW);
                      int end=Math.min(data.size()-1,data.size()-1-shift);
                      if(end<0)end=0;
                      int start=Math.max(0,end-visible+1);

                      double min=Double.MAX_VALUE,max=-Double.MAX_VALUE,maxVol=1;
                      for(int i=start;i<=end;i++){
                          Candle q=data.get(i);
                          min=Math.min(min,q.low); max=Math.max(max,q.high);
                          maxVol=Math.max(maxVol,q.volume);
                      }
                      double pad=(max-min)*0.08;
                      if(pad<=0)pad=Math.max(1,max*0.01);
                      min-=pad; max+=pad;

                      // price scale labels
                      textPaint.setTextSize(10*getResources().getDisplayMetrics().scaledDensity);
                      for(int i=0;i<=5;i++){
                          double pv=max-(max-min)*i/5.0;
                          float y=top+(priceBottom-top)*i/5f;
                          textPaint.setColor(Color.rgb(194,207,232));
                          c.drawText(String.format(Locale.KOREA,"%,.0f",pv),right+5*den,y+4*den,textPaint);
                      }

                      float body=Math.max(2*den,candleW*0.58f);
                      Path ma5=new Path(),ma10=new Path(),ma20=new Path(),ma60=new Path();
                      boolean m5=false,m10=false,m20=false,m60=false;

                      for(int i=start;i<=end;i++){
                          Candle q=data.get(i);
                          float x=right-(end-i)*candleW-candleW/2f;
                          int col=q.close>=q.open?upColor:downColor;
                          p.setColor(col);
                          p.setStrokeWidth(1.2f*den);

                          float yh=yPrice(q.high,min,max,top,priceBottom);
                          float yl=yPrice(q.low,min,max,top,priceBottom);
                          float yo=yPrice(q.open,min,max,top,priceBottom);
                          float yc=yPrice(q.close,min,max,top,priceBottom);
                          c.drawLine(x,yh,x,yl,p);
                          float bt=Math.min(yo,yc),bb=Math.max(yo,yc);
                          if(bb-bt<1.5f*den)bb=bt+1.5f*den;
                          c.drawRect(x-body/2,bt,x+body/2,bb,p);

                          // volume
                          float vh=(float)((q.volume/maxVol)*(volBottom-volTop));
                          p.setColor(Color.argb(175,Color.red(col),Color.green(col),Color.blue(col)));
                          c.drawRect(x-body/2,volBottom-vh,x+body/2,volBottom,p);

                          double[] mas={sma(i,5),sma(i,10),sma(i,20),sma(i,60)};
                          Path[] paths={ma5,ma10,ma20,ma60};
                          boolean[] started={m5,m10,m20,m60};
                          for(int k=0;k<4;k++){
                              if(Double.isNaN(mas[k]))continue;
                              float my=yPrice(mas[k],min,max,top,priceBottom);
                              if(!started[k]){ paths[k].moveTo(x,my); started[k]=true; }
                              else paths[k].lineTo(x,my);
                          }
                          m5=started[0];m10=started[1];m20=started[2];m60=started[3];
                      }

                      int[] mac={Color.rgb(255,213,79),Color.rgb(77,208,225),Color.rgb(105,240,174),Color.rgb(187,134,252)};
                      Path[] paths={ma5,ma10,ma20,ma60};
                      for(int k=0;k<4;k++){
                          maPaint.setColor(mac[k]); c.drawPath(paths[k],maPaint);
                      }

                      // separators + labels
                      p.setColor(Color.rgb(50,72,108)); p.setStrokeWidth(1f);
                      c.drawLine(left,priceBottom,right,priceBottom,p);
                      c.drawLine(left,volBottom,right,volBottom,p);
                      textPaint.setTextSize(10*getResources().getDisplayMetrics().scaledDensity);
                      textPaint.setColor(Color.rgb(74,219,229));
                      c.drawText("거래량",left,volTop+10*den,textPaint);
                      textPaint.setColor(Color.rgb(255,164,86));
                      c.drawText("RSI 14",left,rsiTop+10*den,textPaint);

                      // RSI line
                      Path rp=new Path(); boolean rs=false;
                      for(int i=start;i<=end;i++){
                          float x=right-(end-i)*candleW-candleW/2f;
                          double rv=rsi(i,14);
                          float y=(float)(rsiBottom-(rv/100.0)*(rsiBottom-rsiTop));
                          if(!rs){rp.moveTo(x,y);rs=true;} else rp.lineTo(x,y);
                      }
                      maPaint.setColor(Color.rgb(255,164,86));
                      c.drawPath(rp,maPaint);
                      p.setColor(Color.rgb(67,88,122)); p.setStrokeWidth(1f);
                      float y70=(float)(rsiBottom-0.70*(rsiBottom-rsiTop));
                      float y30=(float)(rsiBottom-0.30*(rsiBottom-rsiTop));
                      c.drawLine(left,y70,right,y70,p);
                      c.drawLine(left,y30,right,y30,p);

                      // last price tag, flash effect
                      Candle last=data.get(end);
                      float lastY=yPrice(last.close,min,max,top,priceBottom);
                      int lastCol=last.close>=last.open?upColor:downColor;
                      p.setColor(lastCol);
                      if(flashFrames>0){
                          p.setAlpha((flashFrames%2==0)?120:255);
                          flashFrames--;
                          postInvalidateDelayed(90);
                      }
                      c.drawRect(right,lastY-12*den,getWidth(),lastY+12*den,p);
                      p.setAlpha(255);
                      textPaint.setColor(Color.WHITE);
                      textPaint.setTypeface(Typeface.DEFAULT_BOLD);
                      textPaint.setTextSize(11*getResources().getDisplayMetrics().scaledDensity);
                      c.drawText(String.format(Locale.KOREA,"%,.0f",last.close),right+5*den,lastY+4*den,textPaint);
                      textPaint.setTypeface(Typeface.DEFAULT);
                  }
              }

              static class MasterStock{
                  String code,name,market;
                  MasterStock(String c,String n,String m){
                      code=c; name=n; market=m;
                  }
              }

              void loadMasterStocks(){
                  masterStocks.clear();
                  try{
                      BufferedReader br=new BufferedReader(
                          new InputStreamReader(
                              getAssets().open("stocks.csv"),
                              StandardCharsets.UTF_8
                          )
                      );

                      String line;
                      boolean first=true;

                      while((line=br.readLine())!=null){
                          if(first){
                              first=false;
                              continue;
                          }

                          List<String> parts=parseCsv(line);
                          if(parts.size()<3)continue;

                          String code=parts.get(0).trim();
                          String name=parts.get(1).trim();
                          String market=parts.get(2).trim();

                          if(code.matches("\\d{6}")&&!name.isEmpty()){
                              masterStocks.add(new MasterStock(code,name,market));
                          }
                      }
                      br.close();
                  }catch(Exception e){
                      // Search will fall back to direct 6-digit code if master asset fails.
                  }
              }

              List<String> parseCsv(String line){
                  List<String> out=new ArrayList<>();
                  StringBuilder cur=new StringBuilder();
                  boolean quoted=false;

                  for(int i=0;i<line.length();i++){
                      char ch=line.charAt(i);

                      if(ch=='"'){
                          if(quoted && i+1<line.length() && line.charAt(i+1)=='"'){
                              cur.append('"');
                              i++;
                          }else{
                              quoted=!quoted;
                          }
                      }else if(ch==',' && !quoted){
                          out.add(cur.toString());
                          cur.setLength(0);
                      }else{
                          cur.append(ch);
                      }
                  }

                  out.add(cur.toString());
                  return out;
              }

