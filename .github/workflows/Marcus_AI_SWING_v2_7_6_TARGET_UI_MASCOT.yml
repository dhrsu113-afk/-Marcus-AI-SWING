              static class HttpResult{
                  int code;
                  String body;

                  HttpResult(int c,String b){
                      code=c;
                      body=b;
                  }
              }

              HttpResult postJson(String url,String body)throws Exception{
                  HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();

                  try{
                      c.setRequestMethod("POST");
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(20000);
                      c.setDoOutput(true);
                      c.setRequestProperty(
                          "Content-Type",
                          "application/json; charset=utf-8"
                      );

                      byte[] bytes=body.getBytes(StandardCharsets.UTF_8);

                      try(OutputStream os=c.getOutputStream()){
                          os.write(bytes);
                      }

                      int http=c.getResponseCode();

                      InputStream is=
                          (http>=200&&http<400)
                          ? c.getInputStream()
                          : c.getErrorStream();

                      return new HttpResult(http,readAll(is));

                  }finally{
                      c.disconnect();
                  }
              }

              String readAll(InputStream is)throws Exception{
                  if(is==null)return "";

                  BufferedReader br=
                      new BufferedReader(
                          new InputStreamReader(
                              is,
                              StandardCharsets.UTF_8
                          )
                      );

                  StringBuilder sb=new StringBuilder();
                  String line;

                  while((line=br.readLine())!=null){
                      sb.append(line);
                  }

                  br.close();
                  return sb.toString();
              }

              String safeError(Exception e){
                  String m=e.getMessage();
                  return (m==null||m.isEmpty())
                      ? e.getClass().getSimpleName()
                      : m;
              }

              @Override
              protected void onActivityResult(int requestCode,int resultCode,Intent data){
                  super.onActivityResult(requestCode,resultCode,data);
                  if(requestCode!=REQ_CHART_SCRIPT || resultCode!=RESULT_OK || data==null)return;
                  Uri uri=data.getData();
                  if(uri==null)return;
                  try{
                      StringBuilder sb=new StringBuilder();
                      BufferedReader br=new BufferedReader(new InputStreamReader(
                          getContentResolver().openInputStream(uri),StandardCharsets.UTF_8));
                      String line;
                      while((line=br.readLine())!=null)sb.append(line).append("\n");
                      br.close();

                      String fileName="선택한 파일";
                      Cursor cursor=getContentResolver().query(uri,null,null,null,null);
                      if(cursor!=null){
                          int idx=cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if(idx>=0 && cursor.moveToFirst())fileName=cursor.getString(idx);
                          cursor.close();
                      }
                      prefs.edit()
                          .putString("chart_script",sb.toString())
                          .putString(CHART_SCRIPT_FILE_NAME,fileName)
                          .apply();
                      Toast.makeText(this,"차트 스크립트 파일 적용 완료: "+fileName,Toast.LENGTH_LONG).show();
                      showAI();
                  }catch(Exception e){
                      Toast.makeText(this,"파일 적용 실패: "+safeError(e),Toast.LENGTH_LONG).show();
                  }
              }

