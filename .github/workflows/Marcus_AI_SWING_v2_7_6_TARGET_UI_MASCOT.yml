              void renderAiText(TextView ai,AISignal sig){
                  String verdict=sig.score>=86?"진입":
                      (sig.score>=80?"준비":(sig.score>=66?"관심":"대기"));
                  String rebound=sig.ma5>sig.ma20?"상승":"관찰";
                  String reason=sig.explosion?"거래량 증가":
                      (sig.bos?"BOS 확인":(sig.discount?"Discount 구간":"조건 대기"));
                  String quality=sig.score>=80?"강":
                      (sig.score>=66?"보통":"약");
                  String timing=sig.bos?"돌파":
                      (sig.discount?"눌림":"대기");
                  String structure=sig.bos?"BOS":"Weak Low";
                  String trend=sig.ma5>sig.ma20?"상승":"관찰";
                  String volume=sig.explosion?"증가":"보통";

                  ai.setText(
                      "┌ AI 판단 ─────────┬ 차트 상태 ────────┬ 매도 전략 ────────┐\n"+
                      " AI     "+sig.score+"/100 "+verdict+"   │ Discount "+(sig.discount?"진입":"대기")+"       │ 보유       -\n"+
                      " 반등   "+rebound+"          │ "+structure+"              │ 시간       -\n"+
                      " 이유   "+reason+"   │ 구조      "+trend+"          │ 손절       -\n"+
                      " 품질   "+quality+"            │ 추세      "+trend+"          │ 1차 30%    -\n"+
                      " 타이밍 "+timing+"          │ 눌림      "+(sig.discount?"건강":"대기")+"          │ 2차 30%    -\n"+
                      " 판단   "+sig.label+"   │ 거래량    "+volume+"          │ 3차 보호   -\n"+
                      " RSI    "+String.format(Locale.US,"%.1f",sig.rsi)+"          │ BOS       "+(sig.bos?"확인":"대기")+"          │ 최고 수익  -\n"+
                      " MA5    "+fmt(sig.ma5)+"       │ MA20      "+fmt(sig.ma20)+"       │\n"+
                      "└─────────────────┴─────────────────┴─────────────────┘"
                  );
                  ai.setTypeface(Typeface.MONOSPACE);
                  ai.setTextSize(12);
                  ai.setTextColor(sig.score>=80?GREEN:(sig.score>=66?YELLOW:MUTED));
              }

              void loadChartPeriod(
                  WebView chart,
                  TextView chartTitle,
                  TextView ai,
                  String code,
                  String name,
                  String period
              ){
                  String env=activeEnv();
                  prefs.edit().putString(LAST_PERIOD,period).apply();

                  chartTitle.setText(name+" · "+period+" 불러오는 중...");

                  new Thread(()->{
                      try{
                          List<Candle> candles;
                          String label;

                          if("DAY".equals(period)){
                              candles=requestDailyChart(env,code);
                              label="일봉";
                          }else if("WEEK".equals(period)||"MONTH".equals(period)||"YEAR".equals(period)){
                              List<Candle> daily=requestDailyChart(env,code);
                              candles=aggregateHigherTimeframe(daily,period);
                              label=periodLabel(period);
                          }else{
                              List<Candle> one=requestIntraday1m(env,code);
                              int minutes=1;
                              if("3M".equals(period))minutes=3;
                              else if("5M".equals(period))minutes=5;
                              else if("15M".equals(period))minutes=15;
                              else if("30M".equals(period))minutes=30;
                              else if("60M".equals(period))minutes=60;

                              candles=minutes==1?one:aggregateMinutes(one,minutes);
                              label=minutes+"분봉";
                          }

                          AISignal sig=analyze(candles);

                          runOnUiThread(()->{
                              if(!"STOCK".equals(screenMode) && !"REALTIME_CHART".equals(screenMode))return;
                              chartTitle.setText(name+" · "+label+" · "+candles.size()+"봉");
                              sendChartData(chart,candles,name,code,label);
                              renderAiText(ai,sig);
                          });

                      }catch(Exception ex){
                          runOnUiThread(()->{
                              chartTitle.setText(
                                  name+" · "+period+" 조회 오류: "+safeError(ex)
                              );
                          });
                      }
                  }).start();
              }

              String resolveStockCode(String raw){
                  String s=raw.trim();
                  if(s.matches("\\d{6}"))return s;

                  MasterStock exact=null;
                  MasterStock best=null;

                  for(MasterStock m:masterStocks){
                      if(m.name.equalsIgnoreCase(s)){
                          exact=m;
                          break;
                      }
                      if(m.name.toLowerCase(Locale.KOREA).contains(s.toLowerCase(Locale.KOREA))){
                          if(best==null || m.name.length()<best.name.length()){
                              best=m;
                          }
                      }
                  }

                  if(exact!=null)return exact.code;
                  if(best!=null)return best.code;
                  return null;
              }

              String displayName(String raw,String code){
                  for(MasterStock m:masterStocks){
                      if(m.code.equals(code))return m.name;
                  }
                  return raw.matches("\\d{6}")?code:raw;
              }

              List<MasterStock> findMasterMatches(String raw,int limit){
                  List<MasterStock> out=new ArrayList<>();
                  String q=raw.trim().toLowerCase(Locale.KOREA);

                  if(q.isEmpty())return out;

                  for(MasterStock m:masterStocks){
                      if(m.code.contains(q) || m.name.toLowerCase(Locale.KOREA).contains(q)){
                          out.add(m);
                          if(out.size()>=limit)break;
                      }
                  }

                  return out;
              }

              void sendChartData(
                  WebView web,
                  List<Candle> candles,
                  String name,
                  String code,
                  String period
              ){
                  try{
                      org.json.JSONObject payload=new org.json.JSONObject();
                      payload.put("name",name);
                      payload.put("code",code);
                      payload.put("period",period);

                      org.json.JSONArray arr=new org.json.JSONArray();
                      org.json.JSONArray ma5=new org.json.JSONArray();
                      org.json.JSONArray ma10=new org.json.JSONArray();
                      org.json.JSONArray ma15=new org.json.JSONArray();
                      org.json.JSONArray ma20=new org.json.JSONArray();
                      org.json.JSONArray volume=new org.json.JSONArray();

                      SimpleDateFormat intradayParser=
                          new SimpleDateFormat("yyyyMMddHHmmss",Locale.KOREA);

                      for(int i=0;i<candles.size();i++){
                          Candle c=candles.get(i);
                          Object timeValue;
                          String label;

                          if(c.date.length()==8){
                              timeValue=
                                  c.date.substring(0,4)+"-"+
                                  c.date.substring(4,6)+"-"+
                                  c.date.substring(6,8);
                              label=(String)timeValue;
                          }else{
                              Date d=intradayParser.parse(c.date);
                              timeValue=d.getTime()/1000L;
                              label=
                                  c.date.substring(4,6)+"/"+
                                  c.date.substring(6,8)+" "+
                                  c.date.substring(8,10)+":"+
                                  c.date.substring(10,12);
                          }

                          org.json.JSONObject o=new org.json.JSONObject();
                          o.put("time",timeValue);
                          o.put("label",label);
                          o.put("open",c.open);
                          o.put("high",c.high);
                          o.put("low",c.low);
                          o.put("close",c.close);
                          o.put("volume",c.volume);
                          arr.put(o);

                          org.json.JSONObject vo=new org.json.JSONObject();
                          vo.put("time",timeValue);
                          vo.put("value",c.volume);
                          vo.put(
                              "color",
                              c.close>=c.open
                                  ? "rgba(255,105,127,0.48)"
                                  : "rgba(83,146,255,0.48)"
                          );
                          volume.put(vo);

                          if(i>=4){
                              double sum=0;
                              for(int j=i-4;j<=i;j++)sum+=candles.get(j).close;
