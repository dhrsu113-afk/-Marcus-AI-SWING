              String periodLabel(String p){
                  if("DAY".equals(p))return "일봉";
                  if("1M".equals(p))return "1분";
                  if("3M".equals(p))return "3분";
                  if("5M".equals(p))return "5분";
                  if("15M".equals(p))return "15분";
                  if("30M".equals(p))return "30분";
                  if("60M".equals(p))return "60분";
                  if("WEEK".equals(p))return "주봉";
                  if("MONTH".equals(p))return "월봉";
                  if("YEAR".equals(p))return "연봉";
