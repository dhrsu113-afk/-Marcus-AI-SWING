              List<String> getFavoriteCodes(){
                  List<String> out=new ArrayList<>();
                  String raw=prefs.getString(FAVORITES,"");
                  if(raw.trim().isEmpty())return out;
                  for(String s:raw.split(",")){
                      String c=s.trim();
                      if(c.matches("\\d{6}")&&!out.contains(c))out.add(c);
                  }
                  return out;
