              String amountWon(String raw){
                  try{
                      double v=num(raw);
                      if(Math.abs(v)>=100000000.0)
                          return String.format(Locale.KOREA,"%.1f억원",v/100000000.0);
                      if(Math.abs(v)>=10000.0)
                          return String.format(Locale.KOREA,"%.1f만원",v/10000.0);
                      return String.format(Locale.KOREA,"%,.0f원",v);
                  }catch(Exception e){ return raw+"원"; }
              }

