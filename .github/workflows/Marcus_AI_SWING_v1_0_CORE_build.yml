              List<Candle> requestDailyChart(String env,String code)throws Exception{
                  SimpleDateFormat sdf=new SimpleDateFormat("yyyyMMdd",Locale.US);
                  String end=sdf.format(new Date());
                  String start=sdf.format(
                      new Date(System.currentTimeMillis()-120L*24L*60L*60L*1000L)
                  );

                  String url=
                      baseUrl(env)+
                      "/uapi/domestic-stock/v1/quotations/inquire-daily-itemchartprice"+
                      "?FID_COND_MRKT_DIV_CODE=J"+
                      "&FID_INPUT_ISCD="+URLEncoder.encode(code,StandardCharsets.UTF_8.name())+
                      "&FID_INPUT_DATE_1="+start+
                      "&FID_INPUT_DATE_2="+end+
                      "&FID_PERIOD_DIV_CODE=D"+
                      "&FID_ORG_ADJ_PRC=0";

                  HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();

                  try{
                      c.setRequestMethod("GET");
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(20000);

                      c.setRequestProperty(
                          "authorization",
                          "Bearer "+prefs.getString(tokenName(env),"")
                      );
                      c.setRequestProperty("appkey",prefs.getString(keyName(env),""));
                      c.setRequestProperty("appsecret",prefs.getString(secretName(env),""));
                      c.setRequestProperty("tr_id","FHKST03010100");
                      c.setRequestProperty("Content-Type","application/json; charset=utf-8");

                      int http=c.getResponseCode();
                      InputStream is=(http>=200&&http<400)?c.getInputStream():c.getErrorStream();
                      String body=readAll(is);

                      if(body==null||body.trim().isEmpty()){
                          throw new Exception("일봉 응답이 비어 있습니다. HTTP "+http);
                      }

                      JSONObject j=new JSONObject(body);

                      if(!"0".equals(j.optString("rt_cd",""))){
                          throw new Exception(j.optString("msg1","일봉 조회 실패"));
                      }

                      org.json.JSONArray arr=j.optJSONArray("output2");
                      if(arr==null||arr.length()==0){
                          throw new Exception("일봉 데이터가 없습니다.");
                      }

                      List<Candle> out=new ArrayList<>();

                      for(int i=0;i<arr.length();i++){
                          JSONObject o=arr.optJSONObject(i);
                          if(o==null)continue;

                          out.add(new Candle(
                              o.optString("stck_bsop_date",""),
                              num(o.optString("stck_oprc","0")),
                              num(o.optString("stck_hgpr","0")),
                              num(o.optString("stck_lwpr","0")),
                              num(o.optString("stck_clpr","0")),
                              num(o.optString("acml_vol","0"))
                          ));
                      }

                      Collections.reverse(out);

                      if(out.size()>120){
                          out=new ArrayList<>(out.subList(out.size()-120,out.size()));
                      }

                      return out;

                  }finally{
                      c.disconnect();
                  }
              }

              double num(String s){
                  try{
                      return Double.parseDouble((s==null?"0":s).replace(",",""));
                  }catch(Exception e){
                      return 0;
                  }
              }

              AISignal analyze(List<Candle> c){
                  AISignal s=new AISignal();

                  if(c==null||c.size()<21){
                      s.score=0;
                      s.label="데이터 부족";
                      return s;
                  }

                  int n=c.size();
                  s.ma5=avgClose(c,5);
                  s.ma20=avgClose(c,20);
                  s.rsi=rsi14(c);

                  Candle last=c.get(n-1);

                  double prev20High=0;
                  for(int i=Math.max(0,n-21);i<n-1;i++){
                      prev20High=Math.max(prev20High,c.get(i).high);
                  }

                  s.bos=last.close>prev20High && prev20High>0;

                  double low20=Double.MAX_VALUE;
                  double high20=0;
                  double avgVol=0;

                  for(int i=n-20;i<n;i++){
                      low20=Math.min(low20,c.get(i).low);
                      high20=Math.max(high20,c.get(i).high);
                      avgVol+=c.get(i).volume;
                  }

                  avgVol/=20.0;

                  double range=Math.max(1,high20-low20);
                  double pos=(last.close-low20)/range;

                  s.discount=pos<=0.38 && last.close>=s.ma5;
                  s.explosion=last.volume>=avgVol*1.8 && last.close>last.open;

                  int score=50;
                  if(last.close>s.ma5)score+=8;
                  if(s.ma5>s.ma20)score+=8;
                  if(s.rsi>=50&&s.rsi<=70)score+=6;
                  if(s.bos)score+=12;
                  if(s.discount)score+=8;
                  if(s.explosion)score+=10;
                  if(last.close<s.ma20)score-=10;
                  if(s.rsi>78)score-=8;

                  s.score=Math.max(0,Math.min(100,score));

                  if(s.score>=86)s.label="🚀 돌파예비";
                  else if(s.score>=80)s.label="🛡️ 지지형";
                  else if(s.score>=66)s.label="관찰";
                  else s.label="대기";

                  return s;
              }

              double avgClose(List<Candle> c,int p){
                  int start=Math.max(0,c.size()-p);
                  double sum=0;
                  int cnt=0;

                  for(int i=start;i<c.size();i++){
                      sum+=c.get(i).close;
                      cnt++;
                  }

                  return cnt==0?0:sum/cnt;
              }

              double rsi14(List<Candle> c){
                  if(c.size()<15)return 0;

                  double gain=0;
                  double loss=0;
                  int start=c.size()-14;

                  for(int i=start;i<c.size();i++){
                      double diff=c.get(i).close-c.get(i-1).close;
                      if(diff>=0)gain+=diff;
                      else loss-=diff;
                  }

                  if(loss==0)return 100;

                  double rs=(gain/14.0)/(loss/14.0);
                  return 100.0-(100.0/(1.0+rs));
              }

              String fmt(double v){
                  return String.format(Locale.US,"%.0f",v);
              }

              class StockChartView extends View{
                  List<Candle> candles=new ArrayList<>();
                  AISignal signal=null;
                  Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);

                  StockChartView(Activity a){
                      super(a);
                      setBackgroundColor(Color.rgb(11,20,36));
                  }

                  void setCandles(List<Candle> c,AISignal s){
                      candles=new ArrayList<>(c);
                      signal=s;
                      invalidate();
                  }

                  @Override
                  protected void onDraw(Canvas canvas){
                      super.onDraw(canvas);

                      if(candles==null||candles.isEmpty()){
                          p.setColor(MUTED);
                          p.setTextSize(dp(14));
                          canvas.drawText(
                              "종목을 검색하면 실제 일봉 차트가 표시됩니다.",
                              dp(16),dp(36),p
                          );
                          return;
                      }

                      float w=getWidth();
                      float h=getHeight();
                      float left=dp(12);
                      float right=w-dp(12);
                      float top=dp(26);
                      float bottom=h-dp(44);

                      double min=Double.MAX_VALUE;
                      double max=0;

                      for(Candle c:candles){
                          min=Math.min(min,c.low);
                          max=Math.max(max,c.high);
                      }

                      if(max<=min)return;

                      float step=(right-left)/Math.max(1,candles.size());
                      float bodyW=Math.max(dp(2),step*0.55f);

                      p.setStrokeWidth(dp(1));

                      for(int i=0;i<candles.size();i++){
                          Candle c=candles.get(i);

                          float x=left+i*step+step/2f;
                          float yH=priceY(c.high,min,max,top,bottom);
                          float yL=priceY(c.low,min,max,top,bottom);
                          float yO=priceY(c.open,min,max,top,bottom);
                          float yC=priceY(c.close,min,max,top,bottom);

                          int color=c.close>=c.open
                              ? Color.rgb(255,92,92)
                              : Color.rgb(80,145,255);

                          p.setColor(color);
                          p.setStyle(Paint.Style.STROKE);
                          canvas.drawLine(x,yH,x,yL,p);

                          p.setStyle(Paint.Style.FILL);

                          float rt=Math.min(yO,yC);
                          float rb=Math.max(yO,yC);

                          if(Math.abs(rb-rt)<dp(1))rb=rt+dp(1);

                          canvas.drawRect(
                              x-bodyW/2f,
                              rt,
                              x+bodyW/2f,
                              rb,
                              p
                          );
                      }

                      drawMA(canvas,5,Color.rgb(255,205,90),min,max,top,bottom,left,step);
                      drawMA(canvas,20,Color.rgb(116,230,171),min,max,top,bottom,left,step);

                      p.setColor(MUTED);
                      p.setTextSize(dp(11));
                      canvas.drawText(
                          "5MA / 20MA · "+candles.get(0).date+" ~ "+candles.get(candles.size()-1).date,
                          left,
                          h-dp(14),
                          p
                      );

                      if(signal!=null){
                          p.setTextSize(dp(12));
                          p.setColor(signal.score>=80?GREEN:(signal.score>=66?YELLOW:MUTED));
                          canvas.drawText(
                              signal.label+" "+signal.score+"점",
                              left,
                              dp(16),
                              p
                          );
                      }
                  }

                  float priceY(
                      double price,double min,double max,
                      float top,float bottom
                  ){
                      return (float)(
                          bottom-(price-min)/(max-min)*(bottom-top)
                      );
                  }

                  void drawMA(
                      Canvas canvas,
                      int period,
                      int color,
                      double min,double max,
                      float top,float bottom,
                      float left,float step
                  ){
                      if(candles.size()<period)return;

                      Path path=new Path();
                      boolean started=false;

                      p.setColor(color);
                      p.setStrokeWidth(dp(2));
                      p.setStyle(Paint.Style.STROKE);

                      for(int i=period-1;i<candles.size();i++){
                          double sum=0;

                          for(int j=i-period+1;j<=i;j++){
                              sum+=candles.get(j).close;
                          }

                          double ma=sum/period;
                          float x=left+i*step+step/2f;
                          float y=priceY(ma,min,max,top,bottom);

                          if(!started){
                              path.moveTo(x,y);
                              started=true;
                          }else{
                              path.lineTo(x,y);
                          }
                      }

                      canvas.drawPath(path,p);
                      p.setStyle(Paint.Style.FILL);
                  }
              }

