name: Marcus AI SWING v0.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/marcus/aiswing
          mkdir -p app/src/main/res/values

          printf '%s\n' \
          'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' \
          'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' \
          'rootProject.name = "MarcusAISwing"' \
          'include(":app")' \
          > settings.gradle

          printf '%s\n' \
          'plugins {' \
          '    id "com.android.application" version "8.2.2" apply false' \
          '}' \
          > build.gradle

          printf '%s\n' \
          'plugins {' \
          '    id "com.android.application"' \
          '}' \
          '' \
          'android {' \
          '    namespace "com.marcus.aiswing"' \
          '    compileSdk 34' \
          '' \
          '    defaultConfig {' \
          '        applicationId "com.marcus.aiswing"' \
          '        minSdk 26' \
          '        targetSdk 34' \
          '        versionCode 2' \
          '        versionName "0.2"' \
          '    }' \
          '}' \
          > app/build.gradle

          printf '%s\n' \
          '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
          '    <application' \
          '        android:label="Marcus AI SWING"' \
          '        android:theme="@style/AppTheme">' \
          '        <activity' \
          '            android:name=".MainActivity"' \
          '            android:screenOrientation="unspecified"' \
          '            android:exported="true">' \
          '            <intent-filter>' \
          '                <action android:name="android.intent.action.MAIN"/>' \
          '                <category android:name="android.intent.category.LAUNCHER"/>' \
          '            </intent-filter>' \
          '        </activity>' \
          '    </application>' \
          '</manifest>' \
          > app/src/main/AndroidManifest.xml

          printf '%s\n' \
          '<resources>' \
          '    <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">' \
          '        <item name="android:fontFamily">sans</item>' \
          '        <item name="android:windowLightStatusBar">false</item>' \
          '        <item name="android:statusBarColor">#07101F</item>' \
          '        <item name="android:navigationBarColor">#07101F</item>' \
          '        <item name="android:colorAccent">#7EA7FF</item>' \
          '    </style>' \
          '</resources>' \
          > app/src/main/res/values/styles.xml

          cat > app/src/main/java/com/marcus/aiswing/MainActivity.java <<'JAVA'
          package com.marcus.aiswing;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import java.util.*;

          public class MainActivity extends Activity {

              final int BG = Color.rgb(7,16,31);
              final int PANEL = Color.rgb(17,28,48);
              final int PANEL2 = Color.rgb(24,38,63);
              final int TEXT = Color.rgb(239,244,255);
              final int MUTED = Color.rgb(151,166,195);
              final int BLUE = Color.rgb(126,167,255);
              final int GREEN = Color.rgb(103,220,157);
              final int RED = Color.rgb(255,116,116);

              LinearLayout content;
              LinearLayout nav;
              final Set<String> favorites = new HashSet<>();

              final String[][] stocks = {
                  {"삼성전자","005930","KOSPI","72,500","+1.2%","78"},
                  {"SK하이닉스","000660","KOSPI","188,500","+2.4%","84"},
                  {"넷마블","251270","KOSPI","59,000","+6.1%","87"},
                  {"GS리테일","007070","KOSPI","26,600","+3.5%","81"},
                  {"빙그레","005180","KOSPI","84,100","+2.2%","83"},
                  {"BGF","027410","KOSPI","4,290","+8.4%","76"},
                  {"한진칼","180640","KOSPI","59,000","+6.1%","86"},
                  {"컴투스","078340","KOSDAQ","31,750","-1.1%","81"},
                  {"동원시스템즈","014820","KOSPI","21,350","+1.0%","63"},
                  {"유한양행","000100","KOSPI","121,500","+1.7%","82"},
                  {"팬오션","028670","KOSPI","4,210","+0.4%","71"},
                  {"SFA반도체","036540","KOSDAQ","6,820","+2.8%","79"}
              };

              int dp(int v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }

              TextView text(String s, int size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setPadding(0,dp(5),0,dp(5));
                  if (bold) t.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  return t;
              }

              GradientDrawable bg(int color, int radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radius));
                  return g;
              }

              LinearLayout card() {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(dp(16),dp(14),dp(16),dp(14));
                  c.setBackground(bg(PANEL,16));

                  LinearLayout.LayoutParams lp =
                      new LinearLayout.LayoutParams(-1,-2);

                  lp.setMargins(0,0,0,dp(12));
                  c.setLayoutParams(lp);
                  return c;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);

                  FrameLayout body = new FrameLayout(this);

                  LinearLayout.LayoutParams bodyLP =
                      new LinearLayout.LayoutParams(-1,0,1);

                  root.addView(body,bodyLP);

                  ScrollView scroll = new ScrollView(this);

                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(dp(18),dp(18),dp(18),dp(24));

                  scroll.addView(content);
                  body.addView(scroll);

                  nav = new LinearLayout(this);
                  nav.setOrientation(LinearLayout.HORIZONTAL);
                  nav.setGravity(Gravity.CENTER);
                  nav.setPadding(dp(4),dp(5),dp(4),dp(5));
                  nav.setBackgroundColor(Color.rgb(11,20,36));

                  root.addView(nav,new LinearLayout.LayoutParams(-1,dp(66)));

                  setContentView(root);

                  buildNav();
                  showHome();
              }

              void buildNav() {
                  nav.removeAllViews();

                  addNav("홈", v -> showHome());
                  addNav("종목", v -> showStocks());
                  addNav("AI검색", v -> showAI());
                  addNav("관심", v -> showFavorites());
                  addNav("설정", v -> showSettings());
              }

              void addNav(String label, View.OnClickListener click) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(12);
                  b.setTextColor(TEXT);
                  b.setAllCaps(false);
                  b.setBackgroundColor(Color.TRANSPARENT);
                  b.setOnClickListener(click);

                  nav.addView(
                      b,
                      new LinearLayout.LayoutParams(0,-1,1)
                  );
              }

              void clear(String title, String subtitle) {
                  content.removeAllViews();

                  content.addView(
                      text(title,26,TEXT,true)
                  );

                  if (subtitle != null) {
                      content.addView(
                          text(subtitle,13,MUTED,false)
                      );
                  }

                  Space s = new Space(this);
                  content.addView(s,new LinearLayout.LayoutParams(1,dp(10)));
              }

              void showHome() {
                  clear(
                      "Marcus AI SWING",
                      "주문 기능 없는 AI 증권 분석 앱 · v0.2"
                  );

                  LinearLayout market = card();
                  market.addView(text("시장",15,MUTED,false));
                  market.addView(text("KOSPI · KOSDAQ",20,TEXT,true));
                  market.addView(text("실제 데이터 API 연결 대기",13,BLUE,false));
                  content.addView(market);

                  content.addView(text("🔥 오늘의 AI 후보",19,TEXT,true));

                  addHomeCandidate(stocks[2],"🚀 돌파예비");
                  addHomeCandidate(stocks[4],"🛡 지지형");
                  addHomeCandidate(stocks[3],"⚡ Explosion");

                  content.addView(text("상태 개선",19,TEXT,true));

                  LinearLayout improved = card();
                  improved.addView(text("기존 포착 종목 재평가",16,TEXT,true));
                  improved.addView(
                      text(
                          "한번 포착된 종목을 버리지 않고 상태 변화 추적",
                          13,
                          MUTED,
                          false
                      )
                  );
                  content.addView(improved);
              }

              void addHomeCandidate(String[] s, String signal) {
                  LinearLayout c = card();

                  c.addView(text(signal,13,BLUE,true));
                  c.addView(text(s[0],18,TEXT,true));
                  c.addView(
                      text(
                          s[3] + "   " + s[4] + "   AI " + s[5] + "점",
                          14,
                          s[4].startsWith("-") ? RED : GREEN,
                          false
                      )
                  );

                  c.setOnClickListener(v -> showDetail(s));
                  content.addView(c);
              }

              void showStocks() {
                  clear(
                      "전체 종목",
                      "KOSPI · KOSDAQ 통합검색"
                  );

                  EditText search = new EditText(this);
                  search.setHint("종목명 또는 종목코드 검색");
                  search.setHintTextColor(MUTED);
                  search.setTextColor(TEXT);
                  search.setSingleLine(true);
                  search.setPadding(dp(14),dp(12),dp(14),dp(12));
                  search.setBackground(bg(PANEL2,14));

                  content.addView(
                      search,
                      new LinearLayout.LayoutParams(-1,dp(54))
                  );

                  LinearLayout list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);

                  LinearLayout.LayoutParams listLP =
                      new LinearLayout.LayoutParams(-1,-2);

                  listLP.setMargins(0,dp(14),0,0);
                  content.addView(list,listLP);

                  renderStocks(list,"");

                  search.addTextChangedListener(new TextWatcher() {
                      public void beforeTextChanged(
                          CharSequence s,
                          int start,
                          int count,
                          int after
                      ) {}

                      public void onTextChanged(
                          CharSequence s,
                          int start,
                          int before,
                          int count
                      ) {
                          renderStocks(list,s.toString());
                      }

                      public void afterTextChanged(Editable e) {}
                  });
              }

              void renderStocks(LinearLayout list, String query) {
                  list.removeAllViews();

                  String q = query.trim().toLowerCase();

                  for (String[] s : stocks) {
                      if (
                          q.length() == 0 ||
                          s[0].toLowerCase().contains(q) ||
                          s[1].contains(q)
                      ) {
                          LinearLayout c = card();

                          LinearLayout row = new LinearLayout(this);
                          row.setOrientation(LinearLayout.HORIZONTAL);

                          LinearLayout left = new LinearLayout(this);
                          left.setOrientation(LinearLayout.VERTICAL);

                          left.addView(text(s[0],17,TEXT,true));
                          left.addView(
                              text(s[1] + " · " + s[2],12,MUTED,false)
                          );

                          LinearLayout right = new LinearLayout(this);
                          right.setGravity(Gravity.RIGHT);
                          right.setOrientation(LinearLayout.VERTICAL);

                          TextView p = text(s[3],16,TEXT,true);
                          p.setGravity(Gravity.RIGHT);

                          TextView ch =
                              text(
                                  s[4],
                                  13,
                                  s[4].startsWith("-") ? RED : GREEN,
                                  false
                              );

                          ch.setGravity(Gravity.RIGHT);

                          right.addView(p);
                          right.addView(ch);

                          row.addView(
                              left,
                              new LinearLayout.LayoutParams(0,-2,1)
                          );

                          row.addView(
                              right,
                              new LinearLayout.LayoutParams(dp(120),-2)
                          );

                          c.addView(row);
                          c.setOnClickListener(v -> showDetail(s));
                          list.addView(c);
                      }
                  }
              }

              void showDetail(String[] s) {
                  clear(s[0],s[1] + " · " + s[2]);

                  LinearLayout price = card();

                  price.addView(text(s[3],29,TEXT,true));
                  price.addView(
                      text(
                          s[4],
                          17,
                          s[4].startsWith("-") ? RED : GREEN,
                          true
                      )
                  );

                  content.addView(price);

                  Button fav = new Button(this);
                  updateFavButton(fav,s);

                  fav.setOnClickListener(v -> {
                      if (favorites.contains(s[1])) {
                          favorites.remove(s[1]);
                      } else {
                          favorites.add(s[1]);
                      }

                      updateFavButton(fav,s);
                  });

                  content.addView(fav);

                  Space space = new Space(this);
                  content.addView(space,new LinearLayout.LayoutParams(1,dp(12)));

                  LinearLayout chart = card();
                  chart.setMinimumHeight(dp(250));

                  chart.addView(text("차트",18,TEXT,true));

                  TextView placeholder =
                      text(
                          "📈 캔들차트 영역\n\n" +
                          "다음 단계에서\n" +
                          "일봉 · 거래량 · MA5/10/20/60\n" +
                          "BOS · Discount · 지지/저항\n" +
                          "사다/팔다 신호를 표시합니다.",
                          15,
                          MUTED,
                          false
                      );

                  placeholder.setGravity(Gravity.CENTER);
                  chart.addView(
                      placeholder,
                      new LinearLayout.LayoutParams(-1,dp(190))
                  );

                  content.addView(chart);

                  LinearLayout ai = card();
                  ai.addView(text("AI SWING",18,TEXT,true));
                  ai.addView(text("종합 점수    " + s[5],15,BLUE,true));
                  ai.addView(text("Explosion     85",14,TEXT,false));
                  ai.addView(text("BOS           근접",14,TEXT,false));
                  ai.addView(text("Discount      관찰",14,TEXT,false));
                  ai.addView(text("구조          정상",14,TEXT,false));

                  content.addView(ai);
              }

              void updateFavButton(Button b, String[] s) {
                  boolean on = favorites.contains(s[1]);

                  b.setText(
                      on
                      ? "★ 관심종목 해제"
                      : "☆ 관심종목 추가"
                  );

                  b.setAllCaps(false);
              }

              void showAI() {
                  clear(
                      "AI 검색",
                      "AI SWING Scanner"
                  );

                  LinearLayout top = card();
                  top.addView(text("검색 상태",14,MUTED,false));
                  top.addView(text("샘플 데이터 분석 완료",18,GREEN,true));
                  top.addView(
                      text(
                          "실제 전종목 스캔은 데이터 API 연결 후 활성화",
                          13,
                          MUTED,
                          false
                      )
                  );
                  content.addView(top);

                  String[][] picks = {
                      {"1","넷마블","87","🚀 돌파예비"},
                      {"2","한진칼","86","⚡ Explosion"},
                      {"3","빙그레","83","🛡 지지형"},
                      {"4","GS리테일","81","BOS 근접"},
                      {"5","컴투스","81","Discount"}
                  };

                  for (String[] p : picks) {
                      LinearLayout c = card();

                      c.addView(
                          text(
                              p[0] + ". " + p[1],
                              17,
                              TEXT,
                              true
                          )
                      );

                      c.addView(
                          text(
                              p[3] + "   AI " + p[2] + "점",
                              13,
                              BLUE,
                              false
                          )
                      );

                      content.addView(c);
                  }
              }

              void showFavorites() {
                  clear(
                      "관심종목",
                      "등록한 종목을 계속 추적합니다"
                  );

                  if (favorites.size() == 0) {
                      LinearLayout empty = card();

                      empty.addView(
                          text(
                              "아직 관심종목이 없습니다.",
                              17,
                              TEXT,
                              true
                          )
                      );

                      empty.addView(
                          text(
                              "종목 화면에서 ☆ 버튼으로 추가하세요.",
                              13,
                              MUTED,
                              false
                          )
                      );

                      content.addView(empty);
                      return;
                  }

                  for (String[] s : stocks) {
                      if (favorites.contains(s[1])) {
                          LinearLayout c = card();

                          c.addView(text("★ " + s[0],17,TEXT,true));

                          c.addView(
                              text(
                                  s[3] + "   " +
                                  s[4] + "   AI " +
                                  s[5] + "점",
                                  13,
                                  BLUE,
                                  false
                              )
                          );

                          c.setOnClickListener(v -> showDetail(s));
                          content.addView(c);
                      }
                  }
              }

              void showSettings() {
                  clear(
                      "설정",
                      "Marcus AI SWING v0.2"
                  );

                  LinearLayout data = card();
                  data.addView(text("데이터 연결",17,TEXT,true));
                  data.addView(text("KRX API   ○ 대기",14,MUTED,false));
                  data.addView(text("키움 REST API   ○ 대기",14,MUTED,false));
                  data.addView(text("샘플 데이터   ● 사용중",14,GREEN,false));
                  content.addView(data);

                  LinearLayout scanner = card();
                  scanner.addView(text("AI SWING 엔진",17,TEXT,true));
                  scanner.addView(text("Explosion",14,TEXT,false));
                  scanner.addView(text("BOS",14,TEXT,false));
                  scanner.addView(text("Discount",14,TEXT,false));
                  scanner.addView(text("Fake BOS",14,TEXT,false));
                  scanner.addView(text("Time Efficiency",14,TEXT,false));
                  scanner.addView(text("상태 개선 추적",14,TEXT,false));
                  content.addView(scanner);

                  LinearLayout version = card();
                  version.addView(text("버전",17,TEXT,true));
                  version.addView(text("Android v0.2 Blueprint",14,BLUE,false));
                  content.addView(version);
              }
          }
          JAVA

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marcus-AI-SWING-v0.2
          path: app/build/outputs/apk/debug/app-debug.apk
